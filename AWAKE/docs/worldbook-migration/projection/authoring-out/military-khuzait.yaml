summary:
  zh-CN: 库赛特军力：以弓骑兵为攻击主力的游牧战争机器——怯薛精锐骑射手、枪骑兵撕口、达尔罕重步兵；牧民征召兵与「杂牌军」为数量底座；帝国视之为最危险的敌人。

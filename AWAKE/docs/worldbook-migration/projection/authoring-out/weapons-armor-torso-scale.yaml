assertions:
- id: assertion.weapon-armor-torso-scale-1
  revision: 1
  kind: fact
  text:
    zh-CN: 鳞甲把一片片小铁鳞像鱼鳞那样叠着缀在皮底或布底上，一片压一片，护值十六到五十七。它与札甲的区别在片形与穿法：札甲是长条片用绳穿，鳞甲是圆鳞用钉或线缀，缀得更密，也更重。重型鳞甲衬链铠护值五十七，是卡拉迪亚分量最重的一件甲。
  sources:

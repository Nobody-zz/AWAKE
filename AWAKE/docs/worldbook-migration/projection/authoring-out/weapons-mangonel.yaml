  quote: 综合评估，投石车是目前围城战中拆墙清障的最优解，没有之一
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.PKzUUVKC
  quote_hash: D236959291CB42BA4158F84354E14DF7A29E6252171185544BE75B52939C71E6
  quote: 所以继续问啊，问问我投石车的承重柱要多粗才经得住抛射一颗五伊什塔重的石弹所需的扭力。问问我和整个攻城槌的重量相比，槌头得多重才不会从城门上弹回击中推槌的人。我从未料想到自己会知道这些事，我还梦想着伸张正义，让人们的生活变得更好呢。
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.qFLZGWHj
  quote_hash: B9702D0780F54E7E43E07481E73EE61440F94DED2A4DFC747A6F566226762FD5
  quote: 我父亲是个修车匠，但这年头，造投石车可比造马车赚钱。我曾经帮人修理过故乡城墙上的投石车，所以我觉得自己造一个也没什么难的。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_投石车__投石车.json#/Variants/2/Content
  quote_hash: 4377AC3B0E5BFA268C420E99690400F76E24AB9D04C87DAB4125AD6520F02A9F
  quote: 就是攻城的时候用的那种大甩臂，木头架子比房子还高
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_投石车__投石车.json#/Variants/2/Content
  quote_hash: CA4EDCCC558489AB005F4C0D8EADF4982AC3BE7B540409F3115B2A22BB6C89C8
  quote: 尤其是晚上看不见石头飞哪儿，只听见轰隆一声，墙在抖，心也在抖

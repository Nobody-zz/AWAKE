summary:
  zh-CN: 攻城槌：围城战里最踏实的器械——槌头包铁的实心硬木悬于框架顶梁之下，以铁链或麻绳悬挂，操作手在顶棚遮蔽下推槌撞击城门，用于突破城门、让部队进入内庭。顶棚是生存性的关键：湿牛皮-木板-泥浆复合顶能抵御沸水擂石与火油。它不需要准头，但赌的是城门后头没有填实——赌输了，槌手全搭进去。

  - id: expr.battania-warrior-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我的弓是我爹传给我的，紫杉木，弓弦换了好几根，弓身还是原来那把。我们从小在林子里跟着长辈打猎，射鹿、射山鸡、射一切在林子里跑的东西。帝国人的弩也能射远，但他们装一支箭的功夫我们射了三支。长镰兵是我们中间最猛的——他们用的战镰比帝国的重剑还沉，挥起来能把人从肩膀劈到腰。冲锋前我们往脸上抹战纹，蓝的，用湖边的泥调出来的。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913

    text:
      zh-CN: 可汗卫士是我们在草原上最不想遇到的敌人。我们的方旗骑士在平地上能碾碎任何骑兵，但前提是能追上他们——他们根本不跟你正面冲，在你面前像烟雾一样散开，一边跑一边回头射箭。我们的骑士追不上，弩手的射速也没他们快。我们目前找到的唯一破绽是：他们的弓在雨天和潮湿天气里会受影响，弓弦松了之后准头就差一些。

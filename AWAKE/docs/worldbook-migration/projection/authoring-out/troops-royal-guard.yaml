  revision: 1
  kind: fact
  text:
    zh-CN: 皇家侍卫是北方最精锐的步兵：装备重甲、坚固大圆盾，主武器为长剑或侍卫矛，腰别投掷飞斧；纪律严明、武艺高强，既能结成坚不可摧的盾墙，也能近战用剑；开战前一轮飞斧常砸乱敌阵；自幼在海浪中长大，海战能力远超内陆士兵。

      zh-CN: 攻城槌是围城里最踏实的器械：一根包铁的硬木大桩，吊在架子上，顶上搭个棚子，人躲在棚子里抱着它撞城门——撞够次数，门迟早开。它不需要准头，也不需要运气，难的是推它的人在城头的滚水、擂石和火油底下硬撑着。

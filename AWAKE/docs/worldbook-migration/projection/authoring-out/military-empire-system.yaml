  expressions:
  - id: expr.empire-system-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 帝国人的军事改革在我们瓦兰迪亚人看来就是自废武功。他们曾经拥有卡拉迪亚最可怕的常备军团，现在却变成了跟我们差不多的贵族私兵体系。区别在于，我们瓦兰迪亚的男爵们几百年来都是这么打仗的，我们早就习惯了这套规矩，有继承规则，有国王和男爵之间写进誓言的效忠关系。帝国人突然这么一改，什么都没有。阿雷尼科斯活着的时候，他的威望可以代替制度；他一死，威望没了，制度又没有，军队就变成了各个私兵头子的私人武装。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913

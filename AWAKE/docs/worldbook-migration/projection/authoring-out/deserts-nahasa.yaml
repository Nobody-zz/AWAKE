    revision: 1
    layer: detail
    text:
      zh-CN: 沙漠里的规矩都系在水上：谁攥着绿洲和井，谁就有说话的份。各家支的族谱背得比经文熟，对外都称巴努·阿塞拉——阿塞拉的子孙。贾瓦勒那些黑帐篷的还在沙漠里游荡，商队过境得给他们交钱。

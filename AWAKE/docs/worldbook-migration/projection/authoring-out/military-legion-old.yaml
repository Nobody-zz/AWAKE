  kind: fact
  text:
    zh-CN: 旧式军团是帝国常备军时代的职业军队：由国家财政统一供养，穿制式盔甲、举统一盾牌，在鹰旗下组成阵线。一个满编军团是台精密的战争机器——重步兵组成盾墙向前推进，弩手在后方轮番射击，具装骑兵在两翼伺机冲锋；军团里有专门负责修路的工兵、负责架桥的工程队、随军的医生和铁匠，那不是一支军队，是一座移动的城市。士兵本人也以此为傲：帝国指挥官曾因他们手持大盾而称其为「重盾步兵」，但这个名字没有被采用，他们更喜欢自称军团步兵，以向旧时的军团致敬。潘德拉克战役中，旧式军团流干了最后一滴血；阿雷尼科斯皇帝上位后，废除了这支他再也养不起的军队。军团消失了，但他们留下的标准——纪律、战术、荣誉——至今仍然是帝国每一个士兵的标尺。
  sources:

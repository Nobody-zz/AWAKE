assertions:
- id: assertion.weapon-armor-torso-civil-1
  revision: 1
  kind: fact
  text:
    zh-CN: 平民便服是卡拉迪亚最普遍的穿着：束腰衣、长衫、连衣裙、外套、围裙，护值位于零到十四之间，材质多为布，少数为皮。它谈不上防护，作用是遮体、耐磨、经洗——束腰衣用腰带束紧便于弯腰干活，长衫垂到膝下，围裙护住前襟。南北款式不同：阿塞莱的宽袍袖长而松，斯特吉亚的束腰衣厚而紧，巴旦尼亚的格纹布料染得最艳。

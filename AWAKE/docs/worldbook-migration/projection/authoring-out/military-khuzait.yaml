  quote: 男人是骑射手，他的马就是他的命，弓是他爷爷传下来的
- source_id: source.calradia.chronicle.animusforge.war1
  source_version: animusforge-20260913
  source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
  locator: rules/rule_库赛特军事力量__库赛特军事力量.json#/Variants/9/Content
  quote_hash: 14587C50A2C73E5105796D71F4AB4E84C54E2CBC0B6C7CB0094032848891073E
  quote: 怯薛为核心的精锐骑射手是大陆上最优秀的弓骑兵，这一点毋庸置疑
- source_id: source.calradia.game.lore.war1
  source_version: bannerlord-1.3.15.110062
  source_content_hash: f6ee4a2afa309b794f12fddbb3c185c94500071365f74cd7655aede539ed3b56
  locator: bannerlord.db#localization.r88TwVdE
  quote_hash: 4EA3FADDC2706AF85889394E60397420F821A46F02D7A17DFFFDA20CEF60507E
  quote: 弓骑兵是库赛特部落的主要攻击力量。当可汗发动战争时，部落联盟各部都要召集最好的士兵。他们的战斗方式集速度、耐心和狡猾于一体，他们会用弓箭蜇刺敌军，直到后者被削弱到只能任由他们宰杀。
- source_id: source.calradia.chronicle.animusforge.war1
  source_version: animusforge-20260913
  source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
  locator: rules/rule_库赛特军事力量__库赛特军事力量.json#/Variants/1/Content
  quote_hash: 9A68F0B8D6A8AE0033929D5DFD1A709E5EC8601ADF2F45D21973275032001401
  quote: 这头是怯薛和可汗亲卫，那头是牧民征召兵，中间是达尔罕和枪骑兵在平衡
- source_id: source.calradia.game.lore.war1
  source_version: bannerlord-1.3.15.110062
  source_content_hash: f6ee4a2afa309b794f12fddbb3c185c94500071365f74cd7655aede539ed3b56
  locator: bannerlord.db#localization.iDzjO25n
  quote_hash: D97D18C429DCC392DDDB40DFDDD1B60F6AD19FE06B5D99B4D737186ECF3102C6
  quote: 许多并未正式归属库赛特部落联盟的城镇和村庄都被要求为可汗的军队提供兵员。这些被称为“杂牌军”的人们通常装备简陋、缺乏训练，唯有寄希望于汗国的精锐骑兵赶来解救他们，在这之前要尽量保住性命。
- source_id: source.calradia.chronicle.animusforge.war1
  source_version: animusforge-20260913
  source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
  locator: rules/rule_库赛特军事力量__库赛特军事力量.json#/Variants/5/Content
  quote_hash: BD8B06C60B1194796D4B8D465BEDBC8A866271DDDC22999895D5F22B097E7ED1
  quote: 打仗不是什么荣耀，是义务。那颜征召，我就带上我的马和弓去，不去不行。
- source_id: source.calradia.chronicle.animusforge.war1
  source_version: animusforge-20260913
  source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
  locator: rules/rule_库赛特军事力量__库赛特军事力量.json#/Variants/2/Content
  quote_hash: 3E7677AA058F4BFC826E6F11218D02D249F15AA45874D0AC7BD8163BC2708DF9
  quote: 他们的骑兵从不靠近，绕着你的方阵射一整天，你追击他们就散，你停下他们就回来
- source_id: source.calradia.chronicle.animusforge.war1
  source_version: animusforge-20260913
  source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
  locator: rules/rule_库赛特军事力量__库赛特军事力量.json#/Variants/10/Content
  quote_hash: DAC696CB6D914FC0993029C4FF52591690873C3413289C59195C2AC97EDC792A
  quote: 听说他们打仗跟苍蝇一样，光射箭不接战，耗到你没力气了他们再冲

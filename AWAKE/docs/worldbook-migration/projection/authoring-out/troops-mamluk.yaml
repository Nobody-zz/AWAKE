  quote: 马穆鲁克这个词的本义是“财产”。阿塞莱贵族想要没有家庭羁绊，潜心磨练自身的战斗技巧，精通马术、枪术、弓术与剑术的专业士兵。马穆鲁克是阿塞莱身覆铁甲的制胜之军。根据需要，他们能轻松承担正面碾压，弓骑骚扰或侧翼突袭的任务。

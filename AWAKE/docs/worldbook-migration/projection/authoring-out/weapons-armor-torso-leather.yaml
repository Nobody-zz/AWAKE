    revision: 1
    layer: detail
    text:
      zh-CN: 草原上铁贵、皮贱。我们的做法是皮打底、铁补心——护心镜那块圆铁正好护住心口，其余地方靠皮。护心镜皮甲十五，最厚的做到三十四，穿上骑马也不碍事。

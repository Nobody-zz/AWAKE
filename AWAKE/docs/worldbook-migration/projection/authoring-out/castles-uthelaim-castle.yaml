    text:
      zh-CN: 乌瑟莱姆堡据巴旦尼亚东部边境山脊，下辖林农村与粮村各一；橡、杉、松循弥戎河支流下运，崖下农场按亩纳粮以充堡中守备，东面警报由堡里放烽、派族人巡边。

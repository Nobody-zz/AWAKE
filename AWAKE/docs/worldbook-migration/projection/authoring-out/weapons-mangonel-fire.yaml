  - id: expr.mangonel-fire-artisan-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 火油的比例是死的：七成火油，两成松脂，一成硫磺粉，冬天多加半成酒精。但比例对了没用，得煮——火油煮到冒蓝烟的时候就下松脂，边下边搅，搅到能拉丝，这锅油才算活了。制弹壳更不是人干的活：陶罐要薄，薄到从房顶摔下去能碎成八瓣，但不能薄到在投石车弹兜里加速的时候就裂。装填的时候罐口封蜡，蜡不能有气泡，气泡就是死。每批罐子出窑，我挑一个试炸——好罐子烧到火油沸了，罐壁会发出哭声，然后炸。战场上他们管火球叫大杀器，我说大杀器是我两只手从泥里捏出来的。
    sources:

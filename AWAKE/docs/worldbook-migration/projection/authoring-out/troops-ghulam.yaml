summary:
  zh-CN: 古拉姆：卡拉迪亚南部的雇佣骑兵，出身是亡国的达西武士。达西的君主称「帕提沙」，被兀儿浑可汗西征夺去与帝国接壤的领土后向东退却。流散的武士组成古拉姆，契约是「自我卖身、共同拥有」；以鲜衣怒马闻名，靠黄金而战，但记得自己来自哪里。

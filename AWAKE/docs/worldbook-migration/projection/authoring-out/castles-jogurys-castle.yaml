    text:
      zh-CN: 约格律斯堡据塔奈西斯湖西岸，下辖丝村与亚麻村各一；蚕丝与亚麻在堡中分级、打包外运，新垦桑田与麻田按亩登记，引水灌田的沟渠由堡里分派疏浚。

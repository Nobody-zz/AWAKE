  - id: expr.weapon-armor-torso-brigandine-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 布面铁甲的价钱看铁片的块数与铆工：片越大越省工、也越硬；片小则软一点、穿着活络。护值十五到五十三，跨度全在铁的分量上。市上的成衣多半分大中小三号，不合身再自己改。

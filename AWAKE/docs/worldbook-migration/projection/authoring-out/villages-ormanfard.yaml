summary:
  zh-CN: 奥曼法德位于一条湍急小河旁——那河自莱恩诺山脉奔流而下，汇入奥克斯湖；山坡开成梯田种葡萄，酿出的酒醇厚浓郁。富人会加蜂蜜与丁香调饮，平民则兑水喝。

  - id: expr.castle-sahel-castle-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 萨赫勒堡据阿沙卜山脉向海一侧，下辖粮村与椰枣村各一；小麦、栗子与椰枣在堡中入库中转，雨水浇出的田亩按水口分摊税，边地商队过山口须报堡验货。

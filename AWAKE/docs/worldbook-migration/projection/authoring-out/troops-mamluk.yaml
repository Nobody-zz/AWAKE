  expressions:
  - id: expr.troop-mamluk-def-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 马穆鲁克，词本义是「被拥有的人」。阿塞莱自幼买进外族少年——草原的、高加索的、黑海北岸的都有——在宫廷军营里教骑术弓箭刀术，练成精锐。这些人从小离开爹娘，除了主人和军队谁也不认，所以掌权者拿他们当最可靠的核心武力。成年后给自由身、领军饷，可「马穆鲁克」这个出身的记号跟一辈子。
    sources:

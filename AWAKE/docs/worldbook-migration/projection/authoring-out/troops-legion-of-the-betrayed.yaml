  text:
    zh-CN: 被弃者军团是皇帝阿雷尼科斯在潘德拉克战役惨败之后、废除最后一支帝国常备军的局势下成立的雇佣军团，由厌恶这场变化的人组成：他们偏爱昔日的军团，及其规矩、历史与军营生活，指责新制度正在摧毁帝国。但无饷不成军——他们会同时与帝国领主和外国领主签订契约。

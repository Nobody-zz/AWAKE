  revision: 1
  kind: fact
  text:
    zh-CN: 弥戎河（River Miron，巴旦尼亚语称「米尔」/Myr）源出乌卡利翁高原东部，穿行于库耳西翁峭壁与德律亚山脉之间，最终经伽尔喀斯大瀑布注入拉科尼斯湖；支流有伽尔喀斯河、加尔察河、瓦斯特拉河。

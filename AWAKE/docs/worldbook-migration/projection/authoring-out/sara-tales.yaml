assertions:
  - id: assertion.sara-tales-1
    revision: 1
    kind: interpretation
    text: {zh-CN: "帝国历史传统把沙拉斯湾解释为卡拉德先祖登陆的摇篮。"}
    sources:
      - {source_id: source.calradia.chronicle.shalas-bay, source_version: download-20260903, source_content_hash: 94cfdb418327b295dbd00bd4a97b937e329265c3c1c67ef25c75500a7e80b99b, locator: chronicle-shalas-bay.txt#/Variants/1/Content, quote_hash: 74F16884C38BA32EC0EA9F57A6459B6ED5ADF2E82C0ADC9FED6156DF747DF82F, quote: "这句话在帝国的史书里写着，在元老院的颂词里念着"}
    expressions:
      - id: expr.sara-tales-1
        revision: 1
        layer: detail
        text: {zh-CN: "帝国的史书里，这片湾被唤作帝国的摇篮：按史书的说法，卡拉德人的先祖正是从南部群岛渡水而来，头一回在北岸的沙拉斯踏上这片大陆。史书、颂词、老贵族的家训都这么讲。"}
        sources:
          - {source_id: source.calradia.chronicle.shalas-bay, source_version: download-20260903, source_content_hash: 94cfdb418327b295dbd00bd4a97b937e329265c3c1c67ef25c75500a7e80b99b, locator: chronicle-shalas-bay.txt#/Variants/1/Content, quote_hash: 74F16884C38BA32EC0EA9F57A6459B6ED5ADF2E82C0ADC9FED6156DF747DF82F, quote: "这句话在帝国的史书里写着，在元老院的颂词里念着"}
        grants: [{profile_id: profile.notable, scope: regional, min_detail: detail}]
        denies: []
  - id: assertion.sara-tales-2
    revision: 1
    kind: rumor
    text: {zh-CN: "先祖从群岛登陆的故事被标记为尚未得到考古与移民史确证的传说。"}
    sources:
      - {source_id: source.calradia.chronicle.shalas-bay, source_version: download-20260903, source_content_hash: 94cfdb418327b295dbd00bd4a97b937e329265c3c1c67ef25c75500a7e80b99b, locator: chronicle-shalas-bay.txt#/Variants/2/Content, quote_hash: 10831E62B382FEB5DEF2A43CB8D882C7AC4E92DAF46CB7D79A0D5ADDD990FDE0, quote: "关于卡拉德人经由这些岛屿渡海登陆的传说，在考古学和移民史领域尚未得到确证"}
    expressions:
      - id: expr.sara-tales-2
        revision: 1
        layer: rumor
        text: {zh-CN: "登陆的故事本身无从查考：没有掘出的旧物作证，也没有可靠的迁徙记闻，帝国学士自己也只当传说记着。"}
        sources:
          - {source_id: source.calradia.chronicle.shalas-bay, source_version: download-20260903, source_content_hash: 94cfdb418327b295dbd00bd4a97b937e329265c3c1c67ef25c75500a7e80b99b, locator: chronicle-shalas-bay.txt#/Variants/2/Content, quote_hash: 10831E62B382FEB5DEF2A43CB8D882C7AC4E92DAF46CB7D79A0D5ADDD990FDE0, quote: "关于卡拉德人经由这些岛屿渡海登陆的传说，在考古学和移民史领域尚未得到确证"}
        grants: [{profile_id: profile.notable, scope: regional, min_detail: summary}]
        denies: []
  - id: assertion.sara-tales-3
    revision: 1
    kind: rumor
    text: {zh-CN: "群岛的雾、罗盘和石刻故事属于船员传闻。"}
    sources:
      - {source_id: source.calradia.chronicle.shalas-bay, source_version: download-20260903, source_content_hash: 94cfdb418327b295dbd00bd4a97b937e329265c3c1c67ef25c75500a7e80b99b, locator: chronicle-shalas-bay.txt#/Variants/0/Content, quote_hash: CBFEB839BA93471B2F9BA696C4F3F2E9511F10E7A4A0AFFE639E4B49B5CE2ADC, quote: "老一辈跑船的说那些岛有古怪——雾天的时候岛的形状会变，罗盘靠近某些礁石会乱转"}
    expressions:
      - id: expr.sara-tales-3
        revision: 1
        layer: rumor
        text: {zh-CN: "跑船人另有闲谈：起雾的天，群岛的轮廓会变样；罗盘挨着某些礁石转个不停；石头上刻着没人认得的符号，说不清是帝国人凿的还是更早年间的手笔。港里人只当怪谈讲讲，航道平安要紧。"}
        sources:
          - {source_id: source.calradia.chronicle.shalas-bay, source_version: download-20260903, source_content_hash: 94cfdb418327b295dbd00bd4a97b937e329265c3c1c67ef25c75500a7e80b99b, locator: chronicle-shalas-bay.txt#/Variants/0/Content, quote_hash: CBFEB839BA93471B2F9BA696C4F3F2E9511F10E7A4A0AFFE639E4B49B5CE2ADC, quote: "老一辈跑船的说那些岛有古怪——雾天的时候岛的形状会变，罗盘靠近某些礁石会乱转"}
        grants: [{profile_id: profile.villager, scope: local, min_detail: summary}]
        denies: []
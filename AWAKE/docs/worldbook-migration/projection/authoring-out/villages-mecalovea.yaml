summary:
  zh-CN: 墨卡罗维亚俯瞰伽尔喀斯大瀑布，村庄筑于峭壁之上以免受强盗侵扰；飞流直下的瀑布拍过峭壁，将许多矿石暴露出来，村民以此为生。

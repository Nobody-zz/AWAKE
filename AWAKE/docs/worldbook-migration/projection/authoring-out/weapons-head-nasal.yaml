  - id: expr.weapon-head-nasal-empire-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 军团盔是帝国军械的定式：圆顶、后沿遮颈、前额一根铁条，护头三十六，重量不到两公斤，步卒列阵时整队都戴它。它不是最厚的，胜在制式统一——同一套模具打出来的壳子，坏了换一顶就是，不必量身改。

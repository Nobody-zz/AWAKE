      zh-CN: 臂铠分带不带指：带指的能护住手背，可射箭、拿筷子都不方便；不带指的是一块板绑在小臂上，干别的不用摘。数着重——链甲连指手套二十四，扎板臂铠二十三，最轻的缠布护腕只有三。

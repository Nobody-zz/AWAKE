    grants:
    - profile_id: profile.villager
      scope: local
      min_detail: rumor
      culture_ids:
      - entity.culture.khuzait
    denies: []
  - id: expr.lake-tanaesis-imperial-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 湖对岸就是库赛特人的地界。听跑船的说，从前帝国商船能沿湖一路北上到柴坎，如今到马凯布瀑布就得停下来交钱了。

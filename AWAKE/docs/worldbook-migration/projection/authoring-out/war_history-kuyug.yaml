sources:
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.CCfjl9eU
  quote_hash: 41F7E9A3DB9A2ED95E999D41D16A8C895A58E33C4BD60C9308D896B248BD1CFC
  quote: 库由格是库赛特的阿契特部的大那颜。
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.yqn4Wtwr
  quote_hash: D7360A27C12E167FE6C946F0938C0B8087173AD09E3B0E629D1211C938CD6A34
  quote: 阿契特部是诞下库赛特诸部的伟大母狼的长子后代。确切地说，兀儿浑本该让我们领导伟大的征服战争。但没关系，那个年代已经过去了。我们尊重汗位，我们也尊重可汗的旗帜。我们曾向兀儿浑宣誓，只要他的继承人也守信，我们就会信守自己的誓言。
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.Dxnj5JQE
  quote_hash: F4D5B530DA6476CBF4ACEEF5BF6E1A8A324AF1229C2ABE8376848B9307854E90
  quote: 奥通加德坐落于干燥的德夫赛格高原中央，当地常年干旱，但在春天十分适合放牧。此城由讲达西语的商人建立，商人们从周边的牧民村庄购置马匹、绵羊、牛，并在防备草原掠袭队的护卫陪同下，将其成群结队地赶到西边的帝国市场贩卖，以此获取大量财富。然而，无论是城墙还是雇佣军都没能抵挡住兀儿浑汗的大军，后者将此城授予库吉特部族，以表彰他们的英勇作战。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_库由格__库由格.json#/Variants/0/Content
  quote_hash: 98345315C4E398B19128966B5B08D9A828E608B789BD2E198DD68BD28ED3E173
  quote: 他带着族人在西迁中试图另立汗国，却没能守住；转而趁库吉特部落在潘德拉克战役中元气大伤，夺了他们的奥通加德
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.i5OOargr
  quote_hash: 5E773D15C5C71B35643FDD449B08865B6AC178FB5D3CC408DD9A37B60FC7780A
  quote: 这就是战争。但是之后，当周围的部族——尤其是阿契特人——听说了我们男丁的遭遇，他们就知道我们孱弱可欺。我们的牲畜被抢了，任何敢反抗的人都被杀了，而蒙楚格几乎无动于衷。这告诉我们一个道理：勇者受死，叛徒发财。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_库由格__库由格.json#/Variants/2/Content
  quote_hash: EC65608F0163E5C85D36425AE210DE5BD20332E179F644BA45DEF02C000182F0
  quote: 从一个汗国的失败者变成抢死人地盘的投机者——这就是库由格的一生
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_库由格__库由格.json#/Variants/7/Content
  quote_hash: BDBCDD01FC27F42484C8BC363F44F8ED727E1555A6E5CC6BB1B3F0599BBACE33
  quote: 他对我们说，阿契特人哪怕没了汗国的名号，骨头也不会弯
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_库由格__库由格.json#/Variants/14/Content
  quote_hash: BAE8D283039BE17343028481E02A2F4E51655582EDAB6FAA574450CBF6E4D385
  quote: 库吉特人提起他就啐口水，说他们给帝国当佣兵，男人都死在了潘德拉克，库由格却趁他们家里没人抢了地盘，不是好汉
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_库由格__库由格.json#/Variants/8/Content
  quote_hash: CCE3B4FB0F9BFA97F749A60AA08130BDFF976A915DB8BB4DD389B2902E9827F2
  quote: 他趁我们最虚弱的时候从背后捅刀子，也好意思自称长子部落后裔
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_库由格__库由格.json#/Variants/11/Content
  quote_hash: 167A4AB8967D322F6F3769EA6DAEB19976C24D3424E86281B0E68208843245B7
  quote: 是个投机了一辈子最后死于非命的人
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_库由格__库由格.json#/Variants/13/Content
  quote_hash: C98ABAE6C048AF2ED979A9A44E25CA98ABF630AECBA8C4A4E052EB6BA50A2A62
  quote: 他的发家史就是一连串的赌博——有赢有输

  - id: expr.village-dalmengus-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 达尔门格斯以湖畔麦作为业——平土肥、雨水匀；小麦与大麦分仓，粮走湖岸与山路外销，湖雾重则麦易倒，须勤看田。

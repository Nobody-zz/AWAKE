      zh-CN: 我们的兵分三路：法里斯是老爷们，骑高头大马、披铜甲，他们那些标枪跟我们没关系，那是贵族自家练的；马穆鲁克是买来的兵，从小养大就为杀人，看着挺吓人，但没仗打的时候他们也蹲在营里没事干；真正跟我们一样的，是步兵和弓手——出身平民，但仍不可小觑。整体战术是骑兵两翼包抄，标枪先发、骑枪随后，步兵在正面牵制。

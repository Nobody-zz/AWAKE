summary:
  zh-CN: 西帝国的军事实力：帝国三分后军力最强的一支——根基在产粮区，粮食充沛、兵源充足、马匹供应稳定。真正的优势在将领的统兵能力与分工配合：加里俄斯统御全局，萨拉提斯守城，得斯里波翁机动策应，阿喀俄斯管骑兵，维彭管指挥与后勤，克洛托耳年迈但经验丰富。短板是多数将领长于统兵而短于个人武艺，以及多线作战的持续压力。

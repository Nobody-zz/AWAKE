- id: assertion.mangonel-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 逃难的村民记住的是投石车的声音和抖动：甩臂抡起来的时候整个架子都在嘎嘎响，像老树要断；一块比人头还大的石球砸在垛口上，碎石崩一脸。晚上看不见石头飞哪儿，只听见轰隆一声，墙在抖，心也在抖。不过它再吓人也就那么回事——打完一发，对面得捣鼓半天，绞盘嘎吱嘎吱往上拉。
  sources:

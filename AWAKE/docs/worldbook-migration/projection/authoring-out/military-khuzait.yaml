    grants:
    - profile_id: profile.noble
      scope: elite
      min_detail: detail
    denies: []
- id: assertion.military-khuzait-2
  revision: 1
  kind: fact
  text:
    zh-CN: 库赛特的征召体系一杆秤：一头是怯薛与可汗卫士，一头是牧民征召兵；未正式归属的城镇村庄被要求提供兵员，称「杂牌军」——装备简陋、缺乏训练，只能指望汗国精锐骑兵赶来解救；草原上不受汗权节制的部落仍为可汗作战，但只为报酬。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war1

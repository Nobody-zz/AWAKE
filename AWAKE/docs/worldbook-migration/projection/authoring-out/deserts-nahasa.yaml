  text:
    zh-CN: 纳哈撒沙漠（the Nahasa，即「青铜沙漠」）是卡拉迪亚南方的浩瀚沙海：砾石平原与火山岩层间绵延沙丘，外人视作绝地；地下水源汇集于洼地与干涸河道之下，形成绿洲；达玛尔河自沙漠发源，穿杰尔贾赖峭壁的「枯焦之门」而出；沙尘暴恶名昭著，迷路者多渴毙沙丘。

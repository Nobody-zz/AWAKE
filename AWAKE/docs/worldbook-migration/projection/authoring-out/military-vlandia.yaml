    grants:
    - profile_id: profile.villager
      scope: local
      min_detail: rumor
      culture_ids:
      - entity.culture.vlandia
    denies: []
  - id: expr.military-vlandia-battania-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 瓦兰迪亚就是悬在咱们头顶的那把剑。他们的骑士所向披靡——西边的人，少惹。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1

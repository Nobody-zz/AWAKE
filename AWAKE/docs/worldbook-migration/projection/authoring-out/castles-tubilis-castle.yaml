    text:
      zh-CN: 突比力斯堡临沙瑞兹海湾，下辖渔村与橄榄村各一；金枪鱼、沙丁鱼腌渍后由堡中集散，橄榄油装罐走海路外销，渔船出入与晒场用料都在堡里挂账。

assertions:
- id: assertion.weapon-head-fur-cap-1
  revision: 1
  kind: fact
  text:
    zh-CN: 毛皮帽是北方与草原的头等防寒物：以整张兽皮或厚呢包缝而成，护头值位于七到十三之间，材质多为皮，少数为布。它挡不住刀锋，用处是在风雪里保住耳朵与后脑——斯特吉亚的款式在两侧垂下耳片（遮耳毛皮帽、毛边帽、翻边毛皮帽），库赛特的叫游牧毛皮帽，口沿镶一圈兽毛；越往南越少见，阿塞莱与帝国腹地几乎没有。

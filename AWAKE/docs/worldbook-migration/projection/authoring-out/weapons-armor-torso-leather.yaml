assertions:
- id: assertion.weapon-armor-torso-leather-1
  revision: 1
  kind: fact
  text:
    zh-CN: 皮甲用硝过的硬皮裁成，护值八到三十四，材质一律为皮。它介于填充衣与铁甲之间：比布衣挡得住刀，比锁甲轻得多，价钱也在两者中间。缝制硬皮外套护值二十，镶钉硬皮甲在皮面上再缀铜钉，护值十八——钉子是防刀口打滑的。

- id: assertion.modern-legion-3
  revision: 1
  kind: interpretation
  text:
    zh-CN: 在帝国境内，这场改革各有各的算法：市井的说法是「让有钱的老爷们自己养打手」——皇帝不用再征那么高的税去养常备军，坏处是这些老爷们手里的刀越来越快；幕僚的说法是「把军事力量从中央集权转向地方分权」，短期缓解了财政危机，长远为内战埋下伏笔，皇权成了一个空壳；而被遣散的老兵恨之入骨——以前当兵是为了帝国，现在当兵是为了某个大老爷的钱袋子，改革省下来的钱，最后都变成了内战的军费。雇佣兵那边倒是另一番光景：执政官们互相打仗，谁都需要人手，只要你有兵，不愁没雇主。
  sources:

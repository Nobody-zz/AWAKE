    text:
      zh-CN: 我们的军队不属于某一个人，它属于每一个部落。至高王发出召唤，伯爵们带着自己的战士前来，这是从蒙王时代就传下来的规矩。战争动员令一下，森林里所有能拉弓的男人都会扛着自己的猎弓从村子里走出来，跟着年长的猎人组成战团。他们的装备比不上帝国的军团步兵，但他们从小在林子里追鹿，知道每一棵树的位置，知道哪片灌木丛后面能藏人。

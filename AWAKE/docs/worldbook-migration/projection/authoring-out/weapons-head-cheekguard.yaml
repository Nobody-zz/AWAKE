- id: assertion.weapon-head-cheekguard-2
  revision: 1
  kind: fact
  text:
    zh-CN: 护颊盔的档次靠加厚与装饰区分：最朴素的一副护头三十一，最厚的一副四十一，中间以钢、铜与穗饰、脊状排开。铜版比钢版轻而软，多给年轻武士；脊状装饰款在帽脊上起棱，兼作加固。

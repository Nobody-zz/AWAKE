  - id: expr.military-khuzait-system-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 库赛特的战争机器：怯薛精锐骑射手是大陆最好的弓骑兵，偃月刀是混战利器；枪骑兵便宜量大，是撕开缺口的刀；达尔罕是少数扛得住硬仗的重步兵。弱点也有两样——缺强力步弓手，马多但没有规范的繁育，质量参差。开阔地形上，这些短板被速度和兵力盖住了。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1
      source_version: animusforge-20260913
      source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d

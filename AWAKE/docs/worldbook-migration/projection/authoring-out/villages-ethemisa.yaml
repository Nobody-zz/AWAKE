  zh-CN: 厄忒弥萨坐落于阿塞莱人口中的「奈赫尔·凯勒斯」（苦河）、帝国人称之为卡勒萨的河流上游；河水刚从海边山上流下，尚未到达东南方的盐碱平原，附近土地小麦收成很好。

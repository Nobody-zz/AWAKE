summary:
  zh-CN: 马穆鲁克：本义「被拥有者」——阿塞莱自幼购入、严格训练的外族少年兵，脱离血缘纽带、忠诚只系于主人；成年获自由身份领俸禄，出身标记终身伴随；已上升为阿塞莱举足轻重的军事政治集团。

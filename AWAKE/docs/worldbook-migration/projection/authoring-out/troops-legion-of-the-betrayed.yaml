- id: assertion.betrayed-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 帝国领主对它的态度是「用得起，靠不住」：北边算的是交易——战力可靠，远胜大多数执政官私兵，纪律和阵战经验是旧军团留下的底子，但他们也接外国人的合同，不能完全当作自己人看待；西边算的是信任——敬三分是因为他们能打，不信任五分是因为他们心里装的是记忆里那个早就没了的老帝国，只关心合同写没写清楚、饷银能不能按时发，「今天你给钱他们替你打，明天别人给更多钱他们就替别人打你」。
  sources:

- id: assertion.river-miron-3
  revision: 1
  kind: fact
  text:
    zh-CN: 此河是巴旦尼亚、北帝国、斯特吉亚三方界河：汛期不可徒涉，结冰期约两个半月，向为北帝国西北防线的天堑；边村往来有之——阿加尔蒙村民与斯特吉亚人世代通婚，伊斯米尔科格的牧民与东西两边的帝国村、巴旦尼亚村互有劫掠，厄庇克洛忒亚的塔楼俯瞰弥戎河，常是北方人望见南方大军的第一眼。
  sources:
  - source_id: source.calradia.chronicle.animusforge.geography2
    source_version: animusforge-20260913
    source_content_hash: 386587a2fdf8b9bfdde96ae07f269482c98a11a87fcc816f86a39d07800c9560

  profile_registry_version: 1.0.0
  profile_registry_hash: 309D10583E7B4AF05F28DE2C2E67A2528CB3D6C45752369C0F7D160FABC3F3A5
  referral_registry_version: 1.0.0
  referral_registry_hash: 6E17075F1F967BE28C0437121DB50E5C30809C4EFC3D2A5F22AD9BB0B3B926CD
sources:
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.0dnD9cR4
  quote_hash: 19AB610122FDAC9084A5748B4FB8E8F4260C8408A8E02009A5D7A1DA6792D8FA
  quote: 帝国军团步兵的主导地位早已不复存在。如今，当人们想起帝国的精英部队时，就会联想到那些声名远扬的具装骑兵，他们全身上下都包覆着帝国锻造厂所能锻造出的最精良的钢铁。作为领取皇家军饷的全职士兵，这些职业骑兵别无他业，终日操练剑、斧、骑枪与复合弓。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/1/Content
  quote_hash: 659890BCA726878A79F6353195DBDDEBBE5B6E6F1458A98417A29ABAA79F09BF
  quote: 那不是一支军队，是一座移动的城市
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/0/Content
  quote_hash: A52D12BEE77965B81051EC215F38B16C51B7D24EAC631F4A688B0F244253B55C
  quote: 旧式军团消失了，但他们留下的标准——纪律、战术、荣誉——至今仍然是帝国每一个士兵的标尺
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.vhgPg46a
  quote_hash: 01C1EF834DDF34DAD9D6E6569BED55CADE1A90854B424F41CDBE62E1BE5B5182
  quote: 这些职业士兵由国家支付军饷，他们是优秀的近战战士。帝国的指挥官们曾因其手持的巨大盾牌，而称他们为重盾步兵。但是这个名字并没有被这些骄傲的士兵们采用，他们更喜欢被称为军团步兵，以向旧时的军团致敬。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/2/Content
  quote_hash: 9B92AF37D91EBAF114DC067103B6844096F11ED0F30D7BE020293DD24B8529D5
  quote: 前排的人倒下了，后排的人自动补位，不需要长官喊，这是练到肌肉里的本能
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/6/Content
  quote_hash: F37F0759FC9C074B70A34704A24E04F6CFF83AE251DB75D4A72EE7475A7667A9
  quote: 从正面冲过去就像撞在一面铁墙上
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/6/Content
  quote_hash: 61FF49DC3442988D73BCDA31CF2C2A152264C0AAEC122CD02CA5F230E585B042
  quote: 单个战士的勇武和一支军团的压迫感是两回事
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/7/Content
  quote_hash: 6C4457161EC0AE2EC6327B6F2C06CC475B5A934B6DF07C3D34CDD46110E383B5
  quote: 但帝国军团的盾墙不只是硬，它还灵活
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/7/Content
  quote_hash: 87EEB41054E751C7471FBD0DC8DEF9E41522BE5DA6EEC1E3FD6BC1A0DDA00499
  quote: 如果那天帝国皇帝不是把军团放在了最不利的地形上，我们赢不了
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/9/Content
  quote_hash: 6B5E25A94FA3D9518C0A26E9950F662914DDAD4C7EFFA9F20F4C1D499C2D8738
  quote: 我们对付旧式军团的战术很简单：不理他们，烧他们的补给线，等他们饿得走不动了再回来
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/8/Content
  quote_hash: A4CAE07C47BD34EB7963F72CC73B8B660D33888ACB66BDC53AEF6CC908C8056B
  quote: 但旧式军团真正的核心不是战术，是后勤
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/8/Content
  quote_hash: B6314F9786ED0CAA5DB54A08A0E6582190CCEEBD93EF4F55E00504205425C84B
  quote: 没有帝国的财政，就养不起帝国的军团
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.mk0l1BfB
  quote_hash: 6748218848E9F5EF19D0A0D84F3B3DCAD8ADA4A7CD250E8BFC43F68199CA629C
  quote: 可以这么说。我在帝国军团里服役了二十年。曾几何时，他们确实配得上“军团”的称号。我和老战友们都在一套准则下服役，我们宁愿战死，也不愿看到这套标准动摇或削弱。但是，德洛修斯·涅雷采斯率领著最后一个真正的军团，在巴旦尼亚的树林中遭到了伏击。你可能听说过这段往事。
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.DzyAgYIX
  quote_hash: C8D8C7FB3E2C3FE3E3265394903D4729A90498EBD16731A69AE35F846B497660
  quote: 德洛修斯·涅雷采斯率领着军团的精锐进入巴旦尼亚森林，却遭遇了一场埋伏，你可能听说过这件事。那时我正卧病在床，结果我的许多战友都没能回来，从那之后一切都变了。
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.pNVKWAKo
  quote_hash: F3544E4F7EF074D60DD45611369614482563CDBD50990B57680329BB9FF6F87A
  quote: 在你造访{VILLAGE}期间，一名年长的{TROOP_TYPE}显得心事重重，沉默寡言。当队伍启程离开时，他突然停下脚步，目光死死盯着路边的一个摊位，随即脱离队伍，怒吼着冲向摊主。事情很快明朗——他曾是帝国旧军团的一员，曾在此地与{NEAREST_OTHER_CULTURE}交战，而眼前这名小贩在兜售的金属残片，显然是从战死将士的坟墓中盗掘而来。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_旧式军团__旧式军团.json#/Variants/1/Content
  quote_hash: 8307566C9E0AB143AE0F3DD6C49B40D6755841085622950343744869629CADCC
  quote: 那种一整个军团踩着同一种步伐往前推进时地面都在颤抖的感觉

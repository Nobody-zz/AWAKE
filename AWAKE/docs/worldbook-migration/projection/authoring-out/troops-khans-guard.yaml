    layer: rumor
    text:
      zh-CN: 我们在东线和库赛特人打了这么多年，最头疼的不是他们的骑射手，而是可汗卫士。普通的库赛特骑射手你还能用盾墙和弩手逼退，可汗卫士根本不给你这个机会——他们的箭太准了，能在我们弩手装填的间隙里射出两轮。而且他们敢贴近到让人胆寒的距离。更可怕的是他们近战也不弱：我们用骑兵追过他们一次，他们跑着跑着忽然回头拔刀，把我们的骑兵削了个干净。
    sources:

  - id: expr.village-gorcorys-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 戈耳科律斯是河套粮村——黑土连片、水灌充足，粮产集中；大宗粮走河运，收货看麦粒饱满与干湿，三河下游粮价以本村为准。

assertions:
  - id: assertion.kach-tales-1
    revision: 1
    kind: interpretation
    text: {zh-CN: "巴旦尼亚叙述将易主归因于借斯特吉亚人清除诺德人后反失其地。"}
    sources:
      - {source_id: source.calradia.chronicle.kachar-peninsula, source_version: download-20260903, source_content_hash: a306e8aec67d3665c1f10846236b414d1e1a0c16c76aec106f00cf62e69aaceb, locator: chronicle-kachar-peninsula.txt#/Variants/5/Content, quote_hash: B457938D9627615E98F058D0C1CF66D188D8299865D9551D780DCF5B491627CE, quote: "戴恩玛雇了斯特吉亚人来清理门户，结果斯特吉亚人打完仗不走了，把整片半岛都吞了"}
    expressions:
      - id: expr.kach-tales-1
        revision: 1
        layer: detail
        text: {zh-CN: "巴旦尼亚人的讲法：他们借斯特吉亚人的斧头赶走诺德人，末了引狼入室，地也没保住。"}
        sources:
          - {source_id: source.calradia.chronicle.kachar-peninsula, source_version: download-20260903, source_content_hash: a306e8aec67d3665c1f10846236b414d1e1a0c16c76aec106f00cf62e69aaceb, locator: chronicle-kachar-peninsula.txt#/Variants/5/Content, quote_hash: B457938D9627615E98F058D0C1CF66D188D8299865D9551D780DCF5B491627CE, quote: "戴恩玛雇了斯特吉亚人来清理门户，结果斯特吉亚人打完仗不走了，把整片半岛都吞了"}
        grants: [{profile_id: profile.townsfolk, scope: regional, min_detail: detail}]
        denies: []

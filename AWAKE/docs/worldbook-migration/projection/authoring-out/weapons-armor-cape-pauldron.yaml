- id: assertion.weapon-armor-cape-pauldron-2
  revision: 1
  kind: fact
  text:
    zh-CN: 肩甲最常和别的东西配成一套：配披风的、配围巾的、配护颈的。其中护颈肩甲在肩甲上加一圈立起的铁片，把脖子后侧也护住，是帝国军团的做法。

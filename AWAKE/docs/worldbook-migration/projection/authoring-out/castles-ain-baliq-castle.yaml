  - id: expr.castle-ain-baliq-castle-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 艾因·巴力克堡扼山谷水口，下辖牧马村与银矿村各一；春草喂出的马匹由堡中验膘定价，粗银在山下初炼后经堡中转，矿脉采掘与冶炼用工俱受埃米尔派下的管事督察。

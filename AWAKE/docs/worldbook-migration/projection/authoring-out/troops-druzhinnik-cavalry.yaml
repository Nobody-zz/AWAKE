- id: assertion.druzhinnik-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 「下了马照样能打」是亲卫骑兵最被外人称道的一点，也让各族算出不同的账：帝国人警惕——他们的重骑兵落了马基本就完了，斯特吉亚的亲卫骑兵落了马捡起斧头还是战士，在北方地形里这种素质很要命；瓦兰迪亚人先笑后收——平原上一个冲锋就能把他们撞飞，可北方的雪地和林地里，自家竞技马跑不动；库赛特人算得更细——马太慢，骑射手能绕他们放到天黑，但靠太近了冷不防挨一记飞斧。

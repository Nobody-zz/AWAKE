    text:
      zh-CN: 雷姆托伊尔堡扼乌卡利翁高原东崖畔弥戎河源，下辖粮村与陶土村各一；麦子入堡仓囤，河泥按段分给陶户，两项出产往各城镇走货时由堡里开契。

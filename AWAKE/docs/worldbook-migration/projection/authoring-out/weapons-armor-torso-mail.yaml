    layer: detail
    text:
      zh-CN: 锁甲的价钱全在环上：环越小、扣得越密、越费工。普通链甲衫护值二十几，军团链甲三十四，名门链甲到四十八，一副壳子顶得上一匹战马。保养也麻烦，一场雨不擦就生锈，锈了得用沙袋滚。

  zh-CN: 费赫位于伊卡拉荒原——拉科尼斯湖西北方森林——的北部边缘处；它是冒险深入森林的商贩落脚之处，那些人要面对严寒与狼群，还要应付寻毛皮的、脾性难料的林中居民，以及北地的赏金猎人。

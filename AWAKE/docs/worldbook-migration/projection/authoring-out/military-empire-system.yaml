  - id: expr.empire-system-aserai-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 帝国人废掉常备军这件事，我们阿塞莱商人是最早感觉到的。以前帝国军团驻扎在边境的时候，商路是安全的，帝国的巡逻队会剿灭沿途的匪帮。改革之后，每个省自己管自己的防区，防区之间全是漏洞，从吕卡隆到撒纳拉的商路比以前危险了好几倍。不过从另一个角度说，帝国人的军事改革也让他们的执政官们成了独立的军事力量，其中有些人愿意跟我们单独谈生意——以前跟帝国谈贸易要经过三层官僚，现在直接找当地手握重兵的执政官就行。
    sources:

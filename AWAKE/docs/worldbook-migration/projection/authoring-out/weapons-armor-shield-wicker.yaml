assertions:
- id: assertion.weapon-armor-shield-wicker-1
  revision: 1
  kind: fact
  text:
    zh-CN: 柳条盾用藤条或木条编成、外面蒙一层皮，长九十到九十五，耐久一百六十到五百一十，护值一到五。它是卡拉迪亚最轻的两路盾之一：挡不住刀砍——藤条一劈就断——可它吃得住箭，箭镞扎进编层里，抽不出来，也不容易穿透。草原与南方的弓手、沙漠里的轻骑都爱拿它，因为轻，跑起来不累手。
  sources:

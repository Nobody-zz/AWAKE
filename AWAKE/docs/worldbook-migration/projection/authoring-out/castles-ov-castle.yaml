    text:
      zh-CN: 奥夫堡据伊卡拉荒原森林西北，下辖亚麻村与商栈村各一；亚麻在堡中沤浸打包，进林商队的货由费赫集中、过堡里验契，森林深处的猎界与伐界由波耶间议定。

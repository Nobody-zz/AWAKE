  - id: expr.weapon-head-oddity-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 尖刺款的做法是把三到五根铁锥焊在壳顶，面门上再挂一片铁面具，护头因此比同厚度的素壳高出一截——面具尖刺盔到五十一。粗鳞盔走的是粗工一路，铁鳞一片片叠上去，护头二十六，胜在好修：掉一片补一片，不必整顶重打。
    sources:
    - source_id: source.calradia.game.items-head
      source_version: bannerlord-1.3.15.110062

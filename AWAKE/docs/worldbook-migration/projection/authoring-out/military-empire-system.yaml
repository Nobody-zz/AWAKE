    denies: []
  - id: expr.empire-system-steward-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 帝国的军事制度改革是卡拉迪亚大陆军事史上最重大的转折之一。它的核心逻辑是财政减压——将军费负担从中央转移到地方。短期效果确实缓解了帝国的财政危机，让帝国在潘德拉克惨败后仍能维持基本防务；但从长期看，改革彻底改变了军队的权力归属：士兵不再对帝国宣誓效忠，而是对出钱养兵的领主效忠。这种效忠结构在阿雷尼科斯在世时还能依靠个人威望维持统一，在他遇刺后立即崩溃，手握私兵的执政官们分别支持不同的皇位继承人，帝国在不到一年的时间内分裂为三个独立政权。将军事改革定性为帝国分裂的催化剂比根本原因更为准确——帝国分裂的根子在于继承制度说不清，但军事改革以极快的速度为分裂各方提供了武力基础。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

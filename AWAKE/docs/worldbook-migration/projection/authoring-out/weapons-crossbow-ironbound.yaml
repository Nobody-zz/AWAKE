summary:
  zh-CN: 包铁弩：瓦兰迪亚杰屈朗产的一种强弩，弩身外包铁、拉力极高，是当地狙击弩手的标配，价格不菲（约八千第纳尔）。它的名声只在懂弩的地方传得开——在草原与林中的民族那里，这个词本身就不成立，「啥是弩？」。

  - id: expr.weapon-armor-shield-wicker-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 柳条盾按编层用料与蒙皮分档：藤条轻、木条经打，外面蒙的那层皮是为防潮。长度一律在九十到九十五之间，护值一到五——它从头到尾不算护具，是给弓手挡箭用的。耐久差得最远，从一百六十到五百一十，三倍还多。

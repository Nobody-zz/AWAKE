  - id: expr.weapon-armor-shield-kite-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 筝形盾的讲究在边上：木胎是底子，边上一圈包什么才决定价钱。不包的砍两下就豁口，包皮革的耐些，包铁圈的能用好几年。耐久从一百四十五到六百一十，最贵的那种木胎外面还蒙一层皮、再钉铁边，一副顶三副。

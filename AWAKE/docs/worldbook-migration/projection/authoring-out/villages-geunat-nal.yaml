  text:
    zh-CN: 格纳特·纳尔在卡·班塞斯要塞附近；当地村民以护林之能闻名，助要塞抵御斯特吉亚人与掠夺者，护着巴旦尼亚的腹地。
  sources:
  - source_id: source.calradia.game.villages-desc-battania
    source_version: bannerlord-1.3.15.110062

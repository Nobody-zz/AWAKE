  - id: expr.vaegir-guard-town-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 维基亚卫队？那些北方蛮子！先皇在的时候，他们在吕卡隆城里横着走，谁都不敢惹。先皇一死，他们就在城里烧杀抢掠，我姑母家的店铺就是被他们烧掉的。他们说先皇不是他们杀的？也许吧。但他们在城里干的那些事，比弑君也好不到哪去。

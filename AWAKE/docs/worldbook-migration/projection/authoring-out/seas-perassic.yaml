      locator: bannerlord.db#localization.TI3fS2xN
      quote_hash: 24BC4D4A208FCB23CDAD13243A1E5F8ADC97812599CA339E5C0635CE4E24463C
      quote: 每个王国都有一座当地居民会因迂腐守旧与不谙世故而被嘲笑的城市，对帝国来说，这样的城市就是贾尔马律斯。该城是珀拉斯海内陆建立起的最早的帝国殖民地之一，早先作为控制西帕拉诸部落的基地。巴拉维诺斯乐意接受从这里掠夺的财物和奴隶，还在背后偷偷窃笑。这种情况在贾尔马律斯将军卡尔索斯发起军事政变后改变了。当时一位元老因听不懂他的浓重口音，紧张地请求他重复一项法令，他拔出了宝剑并说道：“那你听得懂这个吗？”
    grants:
    - profile_id: profile.noble
      scope: elite
      min_detail: detail
    denies: []
  - id: expr.sea-perassic-lighthouse-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 老水手讲，从沙拉斯湾那片海盗窝出来的船，远远望见俄耳堤西亚的灯塔就念神——那光一亮，就知道进了帝国海巡队巡逻的水面。
    sources:
    - source_id: source.calradia.game.settlements.geography2
      source_version: bannerlord-1.3.15.110062
      source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
      locator: bannerlord.db#localization.JhBSnWAe
      quote_hash: 0D892FDEB8C761CF2D64FB79C02653A81570BFDB6B255723B64BDB7885E1D5AE
      quote: 俄耳堤西亚，其名字来源于居住在周边海岸泽地里的鹌鹑，此地也是卡拉德人在珀拉斯海的第一块殖民地。在最初的几个世纪里，当地人被坎尼人的城邦古亚兹统治，但不久之后帝国的扩张将这块殖民地纳入了共和国的一部分。许多水手都来自于海盗蔓生的沙拉斯湾诸岛，几个世纪以来，这些水手都对此地高耸入云的灯塔心怀感激，其光束穿透了笼罩西珀拉斯海的迷雾，也预示着船只已经进入有帝国海巡队巡逻的安全水域。
    grants:
    - profile_id: profile.villager
      scope: local
      min_detail: rumor
    denies: []
- id: assertion.sea-perassic-3
  revision: 1
  kind: fact
  text:
    zh-CN: 沿岸风物：北岸俄尼卡的梯田葡萄园产干型葡萄酒；俄耳堤西亚湾山坡产橄榄；南岸与北岸多处辟盐田（加卜拉卜、阿利西翁、波利西亚、吕西亚）；夏季「泽翁娜之风」自南携纳哈撒的炎热越海北上。
  sources:
  - source_id: source.calradia.game.settlements.geography2
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
    locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_EW3_1
    quote_hash: 624E67C627E53400814505FA607035178C567698050B60F77959ABD9A8C44EF1
    quote: 俄尼卡坐落于珀拉斯海北岸。该地区的山丘上遍布梯田葡萄园，出产的干型葡萄酒在帝国各地广受欢迎。
  - source_id: source.calradia.game.settlements.geography2
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
    locator: bannerlord.db#localization.kghCLS9q
    quote_hash: A89432B9C37D286A3250A4A1E4F34EFF0D5E21A102AB8F97CD1064F032EE5867
    quote: 泽翁尼卡位于滨海的伊勒塔尔丘陵之上，这是一片盛产美酒、谷物与骏马的土地。它的名字来源于泽翁娜女士，少数几位统治过帝国的女性之一——名义上依旧作为她儿子的摄政，而非帝国的女皇。此地也因泽翁娜之风而闻名，这是一股夏季朝北吹的季风，将纳哈撒沙漠的炎热带过珀拉斯海，来到帝国的南方。该地其他季节的天气都十分温和，这样的气候也孕育了无数隐喻激情稍纵即逝的诗歌。
  - source_id: source.calradia.chronicle.animusforge.geography2
    source_version: animusforge-20260913
    source_content_hash: 386587a2fdf8b9bfdde96ae07f269482c98a11a87fcc816f86a39d07800c9560
    locator: rules/rule_珀拉斯海__珀拉斯海.json#/Variants/3/Content
    quote_hash: 06B4D86446F833C2E9609B998723894C5EF45B85FED77C36FAF92172D3C9B4B8
    quote: 你知道阿塞莱人管珀拉斯海叫什么吗？他们叫它“南方的怀抱”。
  expressions:
  - id: expr.sea-perassic-wine-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 北岸的梯田葡萄园出的干酒全帝国都认；湾里山坡的橄榄就着南边的日头长。做南岸生意的还得多懂一样——夏天那阵「泽翁娜之风」一起来，纳哈撒的热气就过海了。
    sources:
    - source_id: source.calradia.game.settlements.geography2
      source_version: bannerlord-1.3.15.110062
      source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
      locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_EW3_1
      quote_hash: 624E67C627E53400814505FA607035178C567698050B60F77959ABD9A8C44EF1
      quote: 俄尼卡坐落于珀拉斯海北岸。该地区的山丘上遍布梯田葡萄园，出产的干型葡萄酒在帝国各地广受欢迎。
    - source_id: source.calradia.game.settlements.geography2
      source_version: bannerlord-1.3.15.110062
      source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
      locator: bannerlord.db#localization.kghCLS9q
      quote_hash: A89432B9C37D286A3250A4A1E4F34EFF0D5E21A102AB8F97CD1064F032EE5867
      quote: 泽翁尼卡位于滨海的伊勒塔尔丘陵之上，这是一片盛产美酒、谷物与骏马的土地。它的名字来源于泽翁娜女士，少数几位统治过帝国的女性之一——名义上依旧作为她儿子的摄政，而非帝国的女皇。此地也因泽翁娜之风而闻名，这是一股夏季朝北吹的季风，将纳哈撒沙漠的炎热带过珀拉斯海，来到帝国的南方。该地其他季节的天气都十分温和，这样的气候也孕育了无数隐喻激情稍纵即逝的诗歌。
    grants:
    - profile_id: profile.merchant
      scope: faction
      min_detail: detail
    denies: []
  - id: expr.sea-perassic-south-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 阿塞莱人管这海叫「南方的怀抱」——如今南岸确实都归了他们。咱帝国老人还是叫它内湖，叫顺口了，改不了。

  - id: expr.mangonel-engineer-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 投石车是基于扭力蓄能原理的重型抛射装置。核心部件为扭力束与抛射臂，扭力束采用畜力筋腱或发绳绞合，蓄能密度稳定，释放时爆发力强。实心球弹的毁伤逻辑是动能集中释放，穿透建筑结构后造成内部断裂，对攻城塔的轴接点和弩炮的轻型木架有一次性摧毁能力。葡萄弹的毁伤逻辑则是锥形散布，弹片数量多、覆盖面积大。它的主要技术瓶颈在于蓄能周期过长：绞盘需多人协同操作，射速极限无法突破；整机太重，运输太难，这本身就是硬限制，不适合快速机动作战。综合评估，投石车是目前围城战中拆墙清障的最优解，没有之一。
    sources:

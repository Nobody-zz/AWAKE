    revision: 1
    layer: rumor
    text:
      zh-CN: 投石车？就是攻城的时候用的那种大甩臂，木头架子比房子还高，甩臂抡起来的时候整个架子都在嘎嘎响，听着像老树要断。我们村有个逃难过来的，说他在围城那会儿蹲在城墙根子底下，听见对面投石车甩臂啪的一声响，然后一块比人头还大的石球就砸在垛口上，碎石崩了他一脸。他说那东西吓人，尤其是晚上看不见石头飞哪儿，只听见轰隆一声，墙在抖，心也在抖。

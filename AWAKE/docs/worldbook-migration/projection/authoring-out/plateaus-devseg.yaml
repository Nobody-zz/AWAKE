  kind: fact
  text:
    zh-CN: 高原边缘犹存旧日风习：喀拉卡拉特等地「不久前」尚在游牧民族支配之下，村民精于养马；奥多赫所倚的黎明山脉（柯希·罗希尼）有黑魔法与秘术之地的传言，外来者不得擅入——此说为当地秘守习俗的一部分。

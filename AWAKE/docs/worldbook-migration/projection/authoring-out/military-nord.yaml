  - id: expr.nord-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我们的军队？那得看你怎么算。要是把每个雅尔手下的战士加在一起，诺德维格能拉出来的步兵不比谁少。铩戟兵站第二排，专治对面冲过来的骑兵和重步兵，长柄家伙往人腿马腿上招呼，一钩一个准。双手斧战士是我最喜欢看的——大块头抡圆了斧子劈进去，碎盾断骨。我们的仗是在滩头和峡湾里打的，不是在大平原上列队冲锋的。我们真正的本钱是船：长船能把整支军队送到敌人屁股后面，等他们反应过来，滩头已经站满了拿斧子的人。
    sources:

    text:
      zh-CN: 韦雷克桑堡据奥克斯湖畔，下辖粮村与酒村各一；湖岸麦子入堡仓，坡上葡萄在堡中酿造、窖藏外销，湖岸与坡地的地界由堡里勘定、报封臣为凭。

assertions:
- id: assertion.weapon-armor-torso-ring-1
  revision: 1
  kind: fact
  text:
    zh-CN: 环甲是把一个个铁环缝在皮或厚布底子上，环与环之间靠底衬连着，不像锁甲那样环环相扣。护值十三到二十，同重之下比锁甲低，胜在做起来快、破一个补一个。这条路几乎只见于阿塞莱：环甲护值十三，底衬加厚的重型环甲护值二十。

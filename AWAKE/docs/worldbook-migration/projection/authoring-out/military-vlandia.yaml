  - id: expr.military-vlandia-far-soldier-summary
    revision: 1
    layer: summary
    text:
      zh-CN: 大陆西端有个瓦兰迪亚，兵强，骑兵厉害，还使一种叫弩的东西——离得远，跟咱们没多大相干。

- id: assertion.weapon-armor-shield-heater-2
  revision: 1
  kind: fact
  text:
    zh-CN: 这一路里最大的一面叫巨盾：高过人肩、下缘带支脚，立在地上就是一面活动墙，耐久七百五十，是全场最经打的一件，用来给攻城的弓手遮身。
  sources:

summary:
  zh-CN: 巴旦尼亚军事制度：没有常备中央军队——战时至高王向各部落发出召唤，各部落依古老盟约派出战士。联军制度根植于氏族自治，也导致行动常因部落宿怨而迟缓。核心是森林弓箭手，重装步兵称长镰兵，以战镰在箭雨打乱敌阵后突击；最令人畏惧的是全体涂战纹、齐声战吼的「狂啸冲锋」。

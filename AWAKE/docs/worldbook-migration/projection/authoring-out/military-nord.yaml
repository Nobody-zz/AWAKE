  - id: expr.nord-coast-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 诺德军队？跑商的人一提到就当笑话说：「他们连马都没有。」但这笑话别人讲，我们不笑。我住在海岸边上的村里，爷爷那辈经历过诺德人登陆——半夜船靠岸，天亮前把半个村都烧了。没马怎么了？人家根本不用在岸上跟你追，抢完就上船走了。后来官府在沿海修了瞭望塔，诺德人抢的次数少了。但我还是怕。不是怕他们赢，是怕他们突然来。

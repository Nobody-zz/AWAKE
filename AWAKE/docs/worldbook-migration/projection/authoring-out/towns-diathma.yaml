  text:
    zh-CN: 狄亚特马称圣裁之城，由一位帝国将军建于俯瞰拉科尼斯湖的德律亚神殿废墟之上；德律亚人——最北的帕拉人——在此打了最后一战，叛乱起而复被剿灭。

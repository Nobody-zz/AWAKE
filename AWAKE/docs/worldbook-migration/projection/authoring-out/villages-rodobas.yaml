  zh-CN: 罗多巴斯——“奥巴斯之屋”——得名自山上一位亡故已久的斯特吉亚酋长；村子坐落在俯瞰伊卡拉荒原的山脊上，去山下黑暗森林里猎取毛皮的猎人把这里当作落脚处。

  zh-CN: 乔诺巴斯——“黑树林”——坐落在一片由森林开辟出来的土地上，俯瞰着弥戎河倾入拉科尼斯湖的大瀑布；村民在瀑布旁水雾弥漫的田里种黑麦和大麦。

  - id: expr.ballista-fire-engineer-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 火焰弩炮在技术上几乎没有额外门槛。标准弩箭箭杆前端加装浸油麻布套环，油料配比火油与松脂三七开，燃烧温度足够引燃干燥木材但不足以熔断铁质加固件。弹道特性与普通弩炮完全一致——弩箭质量增加微乎其微，初速和衰减曲线不变，依旧是一百五十米后动能断崖式下跌。火油布在飞行途中有自行熄灭的风险，弩箭离弦瞬间的风压会扑灭一部分火苗，所以在点火后必须即刻发射，不能瞄准太久。综合看，火焰弩炮是在不增加生产成本的前提下，给弩炮增加不稳定附伤效果的改装方案——战术补充意义大于技术革新价值。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_火焰弩砲__火焰弩砲.json#/Variants/2/Content
      quote_hash: B406D7B1FACF72524F22EF186AB06B09AA8DDEB8377CE234D6DC7833B6B09613
      quote: 战术补充意义大于技术革新价值

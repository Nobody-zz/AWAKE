summary:
  zh-CN: 托·莱阿德——满月之丘——坐落于巴旦尼亚北部一座树木繁茂的小丘下；村民们采伐橡树、紫杉和山毛榉林，几百年来巴旦尼亚人细心照料这些树木，好让木材一直够砍够卖。

    revision: 1
    layer: detail
    text:
      zh-CN: 这河是三家的界：巴旦尼亚的林子、帝国的田、斯特吉亚人的北边。汛期马都蹚不过去，封冻两个月倒是能走——所以河边村子要么通婚，要么结仇，没中间道。

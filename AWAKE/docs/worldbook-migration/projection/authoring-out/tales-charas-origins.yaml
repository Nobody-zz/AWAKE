    quote_hash: 10831E62B382FEB5DEF2A43CB8D882C7AC4E92DAF46CB7D79A0D5ADDD990FDE0
    quote: 关于卡拉德人经由这些岛屿渡海登陆的传说，在考古学和移民史领域尚未得到确证
  expressions:
  - id: expr.tale-charas-origins-2
    revision: 1
    layer: rumor
    text:
      zh-CN: 登陆的故事本身无从查考：没有掘出的旧物作证，也没有可靠的迁徙记闻，帝国学士自己也只当传说记着。
    sources:

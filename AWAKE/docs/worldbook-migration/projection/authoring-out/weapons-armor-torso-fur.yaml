  - id: expr.weapon-armor-torso-fur-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 毛皮甲按兽皮种类与毛长分档：羊皮最贱、狼皮次之、熊皮最贵。护值从二到二十不等，多数只是御寒的东西，谈不上装备。穿久了毛会打结，得拿梳子理。

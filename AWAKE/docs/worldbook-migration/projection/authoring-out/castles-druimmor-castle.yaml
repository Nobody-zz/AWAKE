    layer: detail
    text:
      zh-CN: 德鲁伊莫尔堡据摩康谷要道，下辖矿村与窑村各一；银料粗炼后由堡中中转，陶土走山路外运，堡中抽成按货计价，矿上用工与转运都受堡里管束。

  - id: expr.west-steward-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 西帝国真正的优势在于将领的统兵能力，以及将领之间各有所长的分工配合。加里俄斯本人从潘德拉克的溃败中收拢残兵、一步步打出西帝国基业，靠的不是个人剑术，而是让一支溃散的军队重新愿意跟着他走的本事。他麾下的将领各司其职：萨拉提斯是帝国公认的守城专家，凡他坐镇的城池，敌军极少能从正面攻克；得斯里波翁擅长指挥小规模军团，执行策应大军与机动防御任务；阿喀俄斯是骑兵专家，对骑兵的战场调度和冲击时机把握精准；维彭则是不可多得的指挥与后勤双重人才。帝国将领的通病在这里同样存在——他们大多数是优秀的大脑，却不是锋利的刀刃。

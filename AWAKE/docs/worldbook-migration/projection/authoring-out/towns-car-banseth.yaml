- id: assertion.town-car-banseth-3
  revision: 1
  kind: fact
  text:
    zh-CN: 如今崖下多见诺德的冒险者与雇佣兵，他们替外邦蚕食巴旦尼亚的土地。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_B3
    quote_hash: C1D1177903DD7EB7DAB7DC665ACA60C932075EEA0C1EB2523B3F700BB185E7A3
    quote: 但如今，在这更可能看到的是诺德的冒险者和雇佣兵，他们来这的目的是帮助外国人不断蚕食巴旦尼亚的土地。
  expressions:
  - id: expr.town-car-banseth-3-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 如今望下去，湾里来的多半是诺德的冒险者和雇佣兵，替外邦人一寸寸吃掉巴旦尼亚的地。等船队的人还在崖上，看的是别家的帆。

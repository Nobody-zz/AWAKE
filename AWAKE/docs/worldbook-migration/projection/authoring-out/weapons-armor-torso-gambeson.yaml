- id: assertion.weapon-armor-torso-gambeson-2
  revision: 1
  kind: fact
  text:
    zh-CN: 这一路的上限是护值三十六：在填充袍外面再箍一圈竖排皮条的款式。它挡刀靠皮条、吃震靠填充，两样都不贵，做出来却顶得上一副旧札甲。

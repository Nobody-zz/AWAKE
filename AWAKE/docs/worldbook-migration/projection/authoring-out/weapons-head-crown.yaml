- id: assertion.weapon-head-crown-2
  revision: 1
  kind: fact
  text:
    zh-CN: 少数几顶王冠是能上阵的：帝国缨饰盔护头四十八、战场王冠护头四十七、华丽沙漠战场王冠护头四十四、毛边珠宝盔护头四十一。它们的做法是在真盔的外壳上装点金饰与缨饰，兼得体面与防护——缨饰多插在冠后，是给身后的人看的。

- id: assertion.empire-system-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 三个帝国沿用同一套贵族私兵制度，却各有各的活法：南帝国靠银矿财政和世袭认同维持私兵凝聚力——军费来自奥尼石山的银矿和吕卡里亚平原的粮食，只要银矿还在、坎特里翁军马还在平原上奔跑，南帝国的军队就不会散；北帝国靠元老院家族之间的默契和制衡协调多方兵力，人都会到，但动员速度不如另外两家，好处是很少打没有准备的仗；西帝国靠加里俄斯个人威望和退伍老兵为核心——老兵会老、会死，而他们儿子的忠诚未必像父辈，这是这套办法的隐忧。
  sources:

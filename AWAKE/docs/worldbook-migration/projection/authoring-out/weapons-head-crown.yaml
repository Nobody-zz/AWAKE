    text:
      zh-CN: 帝国的珠宝带与前朝的桂冠是两套东西：桂冠以金叶盘成环，护头五，走的是旧礼；珠宝带在额前嵌一排宝石，护头六七，用于接见与签约。两样都不能上阵——上阵时另有战盔，礼器留在城里。

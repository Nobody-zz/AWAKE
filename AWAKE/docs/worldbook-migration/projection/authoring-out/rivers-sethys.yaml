    quote: 我们在北方的冰天雪地里练出来的围城本事，到了南方全用不上——因为那条该死的河从来不给帝国人断水。
  expressions:
  - id: expr.river-sethys-trade-merchant
    revision: 1
    layer: detail
    text:
      zh-CN: 这条河一年到头行得了船。上游平原收的麦子装上平底驳船，顺水几日便到海口；河口晒盐、河谷烧陶，都是稳当的营生——做南方的买卖，绕不开这条河。
    sources:

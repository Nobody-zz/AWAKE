summary:
  zh-CN: 旧式军团：帝国常备军时代的职业军队，由国家财政统一供养，在鹰旗下列阵。以重步兵为核心、弩手供远程、具装骑兵负责两翼；配备工兵、工程队与随军医生铁匠，能远离本土长期作战。士兵以「军团步兵」自称，向旧时的军团致敬。潘德拉克战役中流干了最后一滴血，阿雷尼科斯上位后废除；其标准——纪律、战术、荣誉——至今仍是帝国每个士兵的标尺。

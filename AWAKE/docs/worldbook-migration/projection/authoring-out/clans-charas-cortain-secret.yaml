  quote: 沙拉斯是我的。这句话没人敢反驳。戴·科尔坦家从奥斯里克时代就攥着这座港口，攥了一百五十年，攥得比梅罗克家攥那顶金冠还紧。帝国的旧贵族们现在还管沙拉斯叫“龙兴之地”——龙兴个屁，龙早死了，骨头都烂了，现在这座城姓戴。港口的关税、渔市的抽成、海湾边上那些破别墅的地租，全归我。这些钱养着我的骑士，喂着我的野心，让我能在御前会议上拍桌子骂德泰尔是懦夫而不怕他削我的封地。他不敢。没有沙拉斯的黄金，瓦兰迪亚的舰队连出海巡航的补给都凑不齐。但我也不得不承认，这座城市太老了，老到每一块砖都浸着帝国的鬼魂。有时候我站在城墙上往下看，码头上的老石阶还是帝国时代凿的，上面磨出的凹痕是几百万双帝国人的脚踩出来的。我偶尔会想，再过一百五十年，瓦兰迪亚人踩上去的凹痕能不能盖过帝国人踩的。但这个念头只在我脑子里停一瞬，下一瞬我就开始算下一季的关税能涨几个点。

  - id: expr.village-okhutan-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 奥胡坦是高原粮村——狭长平原水土相宜、麦田连片；粮货走湖岸与丘陵商路外销，收粮看饱满与干湿，秋后集中出仓。

- id: assertion.weapon-armor-torso-plate-1
  revision: 1
  kind: fact
  text:
    zh-CN: 这一档讲的是以整片铁板护住躯干的做法，护值十九到四十二。卡拉迪亚没有全身板甲，所谓板甲多是护胸板、覆板衣这类局部整片：把一块敲出弧度的板护在心口或前襟，其余部分仍靠链甲或布衬。南方的黄铜板链甲衫在链甲衫外面再缀黄铜板，护值四十二。

- id: assertion.peninsula-kachar-1
  revision: 1
  kind: relation
  text:
    zh-CN: 卡恰尔半岛从伊卡拉荒原探进海里，是一条狭长的石地，恰好横在南北两片海域中间。地面多是石头和陡崖，种不出庄稼，能泊大船的港位没有几处。
  sources:

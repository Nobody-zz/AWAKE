    text:
      zh-CN: 维戎堡据乌卡利翁丘陵近伽律斯河源处，下辖酒村与牧羊村各一；沙壤园圃的葡萄在堡中压榨、窖藏外销，羊毛与羊只按季清点，边地失窃由堡里派骑追查。

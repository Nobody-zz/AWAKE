  - id: expr.military-sturgia-boyar-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 波耶的亲卫队是脱产的职业战士，从小在领地上养大练出来的。战时大公发征召令，波耶带亲卫打头阵，自由民跟在后面；打完仗各回各处。这套制度养不出帝国那样的十几万军团，但胜在省钱，而且每个战士都是为熟人而战——士气不是军饷换来的。
    sources:

    layer: detail
    text:
      zh-CN: 萨涅俄帕是内陆商网的中枢节点——隘口即关卡，过路税与仓储两头收；俄佛堤斯湖是“彼世门户”的圣地，商贸区与圣区界线分明，做买卖莫越界。

summary:
  zh-CN: 库由格：库赛特阿契特部的大那颜，突剌格的父亲。阿契特部自称是「诞下库赛特诸部的伟大母狼」的长子后代，本应由他们领导征服战争。库由格西迁瓦尔诺瓦波尔另立小汗国未守，转而趁库吉特部落在潘德拉克为帝国当雇佣兵、男丁几乎打光之机夺了奥通加德；他选定的接班人温都勒死在那场联姻里，本人活到 1083 年，终年七十一岁。

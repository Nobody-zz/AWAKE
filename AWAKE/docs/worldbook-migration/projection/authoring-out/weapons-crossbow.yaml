      scope: local
      min_detail: rumor
      culture_ids:
      - entity.culture.vlandia
    denies: []
- id: assertion.weapon-crossbow-2
  revision: 1
  kind: fact
  text:
    zh-CN: 各方对弩的态度迥异：帝国经阿雷尼科斯皇帝推荐引进但元老院决议不全面换装——忌惮「奴隶拿弩能射死贵族」的先例，只给辅助部队配；巴旦尼亚视弩为无灵魂的不祥之物，缴获必砸碎；库赛特承认弩射固定目标很准但马背上使不上劲，仅辎重营配备；达西人则根本不知道弩为何物。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war1
    source_version: animusforge-20260913
    source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d

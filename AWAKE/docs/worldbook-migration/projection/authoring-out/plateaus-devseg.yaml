sources:
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Dxnj5JQE
  quote_hash: F4D5B530DA6476CBF4ACEEF5BF6E1A8A324AF1229C2ABE8376848B9307854E90
  quote: 奥通加德坐落于干燥的德夫赛格高原中央，当地常年干旱，但在春天十分适合放牧。此城由讲达西语的商人建立，商人们从周边的牧民村庄购置马匹、绵羊、牛，并在防备草原掠袭队的护卫陪同下，将其成群结队地赶到西边的帝国市场贩卖，以此获取大量财富。然而，无论是城墙还是雇佣军都没能抵挡住兀儿浑汗的大军，后者将此城授予库吉特部族，以表彰他们的英勇作战。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_K1_2
  quote_hash: 1C0F8186EE661B2C88E0BB8B7DF4D495B0E70ECDBA8473763041316C8B336461
  quote: 埃斯梅村及其周围的村落位于阿克坎丘陵向陆侧的德夫赛格高原。这里是库赛特及其盟友的主要放牧地。
- source_id: source.calradia.chronicle.animusforge.geography2
  source_version: animusforge-20260913
  source_content_hash: 386587a2fdf8b9bfdde96ae07f269482c98a11a87fcc816f86a39d07800c9560
  locator: rules/rule_德夫赛格高原__德夫赛格高原.json#/Variants/0/Content
  quote_hash: F4240164A49A776610EBC8104E59E618A1DFB53CA913B7AF1961A589B40E8E64
  quote: 德夫赛格高原是卡拉迪亚与达西的分界处，目前被库赛特以及达西沙阿共同统治着，这里有着很好的草原，算是个养马的好地方，但是绝对不是种地的好地方
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_K1_4
  quote_hash: 47A0CD31FB4B7BADFE21DB3E7B91FA8E34858AB3C518C0A2D0EA5791F96A0E27
  quote: 阿萨利格坐落于德夫赛格高原之巅的巴尔思山脚下。村民们在相对低矮的山坡上养马，并时刻提防着雪豹——此山正是因此而得名。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_K2_1
  quote_hash: 28E3DC1068043E6AA6F1500EAF8125892A3E94CDB9782C3A5935CE19626482C3
  quote: 喀拉卡拉特位于德夫赛格高原东部平缓边缘的一处盆地内。不久前，这片土地还被游牧民族支配着，当地如今仍以繁育良马而闻名 。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.ygJkPxyc
  quote_hash: 54378F61C3F997877270E7D821E9A5189CBA16C6B36C6631CAB52874786632B5
  quote: 奥多赫镇位于柯希·罗希尼——黎明山脉的山麓。作为德夫赛格高原最边远的城镇之一，它以阿赫哈克王——一位神话中的暴君的御所为世间闻名，那位王的双肩缠绕着蝮蛇。即便如今，依然有传言说黎明山脉是黑魔法和秘术之地，外来者不得进入。这座城市在库赛特征服后被划给了合儿必特部，后者和山民通婚，尊重当地习俗，参与他们的宗教仪式——当然，也守护着他们的秘密。

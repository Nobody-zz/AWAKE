    text:
      zh-CN: 被弃者军团战力可靠，远胜大多数执政官私兵。他们的纪律和阵战经验是旧军团留下的底子。但他们也接外国人的合同，不能完全当作自己人看待。用他们是一笔交易：我们出钱，他们出力，仅此而已。

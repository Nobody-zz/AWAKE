  - id: expr.betrayed-street-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 听说他们是以前军团的人。现在帝国没有常备军了，他们就自己凑在一起当雇佣兵。谁给钱替谁打。看着还是军团的样子，但已经不是帝国的兵了。

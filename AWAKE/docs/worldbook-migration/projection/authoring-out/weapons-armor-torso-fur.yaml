assertions:
- id: assertion.weapon-armor-torso-fur-1
  revision: 1
  kind: fact
  text:
    zh-CN: 毛皮甲的原身是御寒衣：整张兽皮去毛与否都可能，缝成背心或长外套，护值二到三十六。它挡刀靠的是毛与皮的厚度，比布衣强不了多少，胜在天冷时离不了。巴旦尼亚与北地最多，劫掠者身上也常见——毛皮好弄，不用钱买。

assertions:
- id: assertion.lake-llyn-modris-1
  revision: 1
  kind: fact
  text:
    zh-CN: 山谷深处有一座火山口湖，巴旦尼亚人叫它林·莫德里斯，相传是巨人在大地上留下的印迹；这片谷地曾是巴旦尼亚人的一块飞地。
  sources:
  - source_id: source.calradia.game.settlements.geo2
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 8fcc88868e40b0d90b9e6fada6e9ad7029dd90df4e2905f1718e00673932e0c4
    locator: bannerlord.db#localization.nhmBQIC4
    quote_hash: 6470E09F3B44EE45D0554123A75CD80D56AC4B3306BCABB9CF07218008E89B24
    quote: 这片山谷曾一度是一块巴旦尼亚人的飞地，以莫德里斯湖为中心——这座湖泊位于火山口，传说是一道巨人的足印。
  expressions:
  - id: expr.lake-llyn-modris-lake-battanian
    revision: 1
    layer: rumor
    text:
      zh-CN: 老辈人说，那湖是巨人踩出来的脚印。巴旦尼亚人的地界原来到过那儿——后来，后来就没了。

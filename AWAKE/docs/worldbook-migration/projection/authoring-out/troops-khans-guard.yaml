- id: assertion.khans-guard-3
  revision: 1
  kind: interpretation
  text:
    zh-CN: 各族都在找可汗卫士的破绽，找出来的各有各的局限。瓦兰迪亚人只找到一条：雨天和潮湿天气里弓弦会松，准头就差一些。诺德人认自己的盾墙能顶，但顶得辛苦——箭穿不穿盾墙另说，盾墙上被打出窟窿，补位的瞬间就是破绽。巴旦尼亚人则认另一件事：只要踏出森林一步，这些草原上的鹰就会从地平线上扑过来。
  sources:

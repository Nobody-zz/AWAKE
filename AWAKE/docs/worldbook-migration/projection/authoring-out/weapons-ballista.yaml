- id: assertion.ballista-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 在守城的人嘴里，弩炮是那种「吓人但指望不上」的东西：一箭能穿透三个人，可射完了也就射完了，箭飞不远，打到后面就没劲了；射进木头上拔都拔不出来，车还是照样往前推。
  sources:

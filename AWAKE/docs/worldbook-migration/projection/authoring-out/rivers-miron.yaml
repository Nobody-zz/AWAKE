- id: assertion.river-miron-2
  revision: 1
  kind: fact
  text:
    zh-CN: 河谷物产：上游雷姆托伊尔一带是巴旦尼亚最肥沃的小麦地；弥戎河谷出白银（革耳塞戈斯山嘴矿井）与铁矿（马拉忒亚）；瀑布飞流冲出矿石（墨卡罗维亚）；瀑布水雾田种黑麦与大麦（乔诺巴斯）。

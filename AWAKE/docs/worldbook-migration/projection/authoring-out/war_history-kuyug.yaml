  text:
    zh-CN: 库由格是库赛特阿契特部的大那颜，突剌格的父亲。阿契特部自称是「诞下库赛特诸部的伟大母狼」的长子后代，认为本该由他们领导伟大的征服战争，却在此后的岁月里被兀儿浑乃特部超越。库由格一生大起大落：他带着部众西迁，在瓦尔诺瓦波尔另立小汗国，没能守住；转而趁库吉特部落在潘德拉克战役中为帝国当雇佣兵、男丁几乎全部交代在战场上之机，夺了他们的奥通加德。他选定的接班人温都勒死在那场失败的联姻里，库由格本人活到 1083 年，终年七十一岁。

- id: assertion.north-1
  revision: 1
  kind: fact
  text:
    zh-CN: 北帝国的军力建立在贵族私兵体系与多年双线作战的锻炼之上：我们世代得面对斯特吉亚与库赛特的双线作战，如今又得防御西帝国和南帝国，锻炼出来的能力是很强的。但它同时承受着极长战线的压力——纸面数据不弱，实际却常常顾首不顾尾。
  sources:

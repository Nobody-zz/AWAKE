  - id: expr.betrayed-west-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 被弃者军团？那群抱着旧军团规矩不放的老顽固。我敬他们三分，但不信任他们五分。敬他们是因为他们能打——队列推进和阵型转换，现在新招的那些兵练十年都赶不上，战场上有一支被弃者军团顶在正面，你心里踏实。不信任他们是因为他们心里装的是帝国，不是我们的帝国，是他们记忆里那个早就没了的老帝国。这样的人，你用得起，但你靠不住。

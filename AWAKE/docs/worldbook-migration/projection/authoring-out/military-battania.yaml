  - id: expr.battania-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 炉卫是我亲手组建的。每一个炉卫都跪在我的火炉前发过誓，我把剑放在他们肩上，他们把命放在我手里。平时他们护卫我的厅堂，战时他们站在我身边，组成盾墙最核心的那几排。部落里的男人都是兵：平时他们种地打猎，战时他们扛着弓就来了。他们不领军饷，不当职业兵，但他们保卫的是自己的林子和自己的族人。至高王有权召唤我们，但各部落出兵的速度和规模，全看我们自己的意愿——这是我们的权利，也是联军最大的软肋。
    sources:

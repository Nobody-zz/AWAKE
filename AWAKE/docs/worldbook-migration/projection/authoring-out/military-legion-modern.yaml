  - id: expr.modern-legion-vet-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 我认识几个老军团兵，他们对阿雷尼科斯的所谓改革恨之入骨。他们说，以前当兵是为了帝国，现在当兵是为了某个大老爷的钱袋子。那些被遣散的老兵，有的沦落成了强盗，有的组成了被弃者军团，靠给别人卖命过活。改革省下来的钱，最后都变成了内战的军费。
    sources:

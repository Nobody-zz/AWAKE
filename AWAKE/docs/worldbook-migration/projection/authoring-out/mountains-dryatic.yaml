  text:
    zh-CN: 德律亚山脉（Dryatic Mountains）是帝国北方的高大山系，构成天然屏障；最高峰为阿拉卡托斯山，山脉西侧以弥戎河谷与库耳西翁峭壁相隔，东麓缓坡渐入帝国东境。

  - id: expr.ghulam-ghilman-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 我们来自达西。在草原的狼群还没壮大之前，达西是这片土地上最强的王国之一。然后库赛特人来了，他们像蝗虫一样涌过来，一茬一茬地收割我们的草场和城镇。有些人投降了，成了库赛特的臣属。我们没有——我们把自己卖给了古拉姆，成了自己的主人，也是自己的奴隶。我们依然用达西人的方式打扮，不是为了好看，是为了记住我们是谁。我们为黄金打仗，但黄金不是目的，只是手段。只要我们还在马背上，达西就没有亡。

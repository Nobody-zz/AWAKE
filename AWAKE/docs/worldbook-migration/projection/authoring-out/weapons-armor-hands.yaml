assertions:
- id: assertion.weapon-armor-hands-1
  revision: 1
  kind: fact
  text:
    zh-CN: 护手与臂铠护的是手腕到肘这一段，护值三到二十五，跨了整条手臂的档次。最常见的是缠布或缠皮的绑臂，护值三到七，本意是防磨；往上是皮护臂，护值八到二十；再往上是夹板护臂与扎板臂铠，把铁片夹进皮里，护值二十二到二十四；最重的一档是链甲连指手套，链子包住整只手连指头，护值二十四。

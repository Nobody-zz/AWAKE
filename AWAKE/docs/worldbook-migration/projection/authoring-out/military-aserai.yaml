  zh-CN: 阿塞莱军事力量：由贵族兵、平民兵与奴隶兵三大支柱构成，骑兵是作战体系的核心。法里斯是贵族骑兵，重型铜甲配阿斯凯尔马，标志性武器是全卡拉迪亚最长最重的阿塞莱标枪，弱点是杏仁形小盾防不住远程箭矢；马穆鲁克是自幼购入的奴隶骑兵，纪律严明、不溃不退；平民兵则是持大盾长矛的重装步兵与沙漠硬木弓弓箭手。

  - id: expr.small-factions-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 有的兄弟会一边替当局办事，一边做自己的生意：在城里是体面的商人，出了城就是打家劫舍的土匪。谁在城里、谁在乡间，他们自己分得很清，外人不问，他们也不说。

summary:
  zh-CN: 塔奈西斯湖：帝国东部大湖，库赛特人称达那孜海；伊勒坦运输线东端，帝国与草原贸易的分界水域。马凯布、柴坎、席隆尼亚三城环抱。
registry_bindings:
  profile_registry_version: 1.0.0
  profile_registry_hash: 309D10583E7B4AF05F28DE2C2E67A2528CB3D6C45752369C0F7D160FABC3F3A5
  referral_registry_version: 1.0.0
  referral_registry_hash: 6E17075F1F967BE28C0437121DB50E5C30809C4EFC3D2A5F22AD9BB0B3B926CD
sources:
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_EN7_2
  quote_hash: 4CF28ACC8CDF9571CF8E492AC7C55FF3026F051AA326B501FBBD174713CB0D28
  quote: 庞斯是帝国最北端的定居点之一。该地因位于伊勒坦运输线的“交叉口”而得名，一系列冰川湖构成的网络令船只得以通行于拉科尼斯湖与塔奈西斯湖之间。当地人在附近的山丘上开采盐矿。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_EN7_1
  quote_hash: B49E29BE55938C037E6377D6630B612A0DF42ABA2568E0C84A364AF1C3B73B69
  quote: 厄毗诺萨位于帝国的极北之地，刚好在伊勒坦运输线的冰川湖南岸，拉科尼斯湖与塔奈西斯湖之间的船只川流不息。该地区人口相对稀少，但葱郁的草甸上放养着大群的牛。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.bPDqyqkb
  quote_hash: AB7E52B1D06E6401BEF710C91D34859E2675E3E5BB2DD655EC1DB18C004C0C4A
  quote: 马凯布位于草原民族称之为达那孜的塔奈西斯湖的北端。这座城市拱卫着喀拉卡孜河汇入湖泊时形成的大瀑布。该城长期被小汗和小沙阿们统治，他们派遣纤夫拖着商船渡过湍流，并收取过路费。然而，因为拒绝纳贡，该城的末代统治者被兀儿浑汗亲手枭首。自那以后，这座城市就被库赛特的统治者家族亲自掌控。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.SUnaVliN
  quote_hash: D4423ED49E04871A4B0300FA5566FA4ADD77B110C3E9F6E7ABEB3ECF951429F0
  quote: 柴坎坐落于塔奈西斯湖边的芦苇甸旁。在东方尚为帝国保护领的年代，游舟满载着兽皮、羊毛和盐，驶过平静的湖水，带着帝国的丝绸和白银归来。库赛特人来了，战争也来了，水路贸易停止了，但柴坎仍作为重要的贸易中转站和军事基地保留了下来，成为了兀儿浑乃特部的封地。库赛特的可汗站在宫殿的阁楼上，他的目光越过湖泊，看向了远方起伏不止的山峦，或许有一天，他将能在那里放牧马匹。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.UHvEEEBb
  quote_hash: 40B78451986324BFB9F5FE7C3FF53C9E261716B55AA4F186DB8DD91D92181042
  quote: 席隆尼亚坐落于塔奈西斯湖的东岸。这座城市曾一度是奢侈和堕落的代名词。此地原先是帝国的丝绸生产中心，同时也是“外塔奈西亚”——帝国在大湖对岸的产业和保护领——运来的商品的集散地。然而，库赛特人到来了，从帝国的手中夺走了外塔奈西亚。席隆尼亚的元老贵族们也被迫重新学起兵法，掸去镀金盔甲上厚厚的尘灰，重新将镶着宝石的长剑打磨锋利，率领追随者们对抗兀儿浑的勇士。
- source_id: source.calradia.chronicle.animusforge.geography2
  source_version: animusforge-20260913
  source_content_hash: 386587a2fdf8b9bfdde96ae07f269482c98a11a87fcc816f86a39d07800c9560
  locator: rules/rule_塔奈西斯湖__塔奈西斯湖.json#/Variants/0/Content
  quote_hash: A5A17D79149290E1AEA0C260B1AEDD0190FD9745EA848641D06C57D6AA05C3FC
  quote: 塔奈西斯湖，草原民族称之为达那孜海，帝国人则叫它塔奈西斯湖。
- source_id: source.calradia.chronicle.animusforge.geography2
  source_version: animusforge-20260913
  source_content_hash: 386587a2fdf8b9bfdde96ae07f269482c98a11a87fcc816f86a39d07800c9560
  locator: rules/rule_塔奈西斯湖__塔奈西斯湖.json#/Variants/2/Content
  quote_hash: 15FD8397489F5F34E6AA779E29208B31AACBDB3B5C12B1AB5B618134A0337054
  quote: 达那孜海是我们祖辈放牧的地方。草原上的游牧民族世世代代生活在湖的东岸，喝着湖里的水，在湖边的草场上牧马。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_K1_1
  quote_hash: B6FF34B9425A83C0FB232348E850C12F25BBDDCBF36C0B513C37193E053104FB
  quote: 乌赛克村坐落于库赛特人称作达那孜海的塔奈西斯湖东岸的阿克坎丘陵之下。这里的村民不久前还过着游牧生活，他们养的绵羊身上的羊毛又长又好。
- source_id: source.calradia.chronicle.animusforge.geography2
  source_version: animusforge-20260913
  source_content_hash: 386587a2fdf8b9bfdde96ae07f269482c98a11a87fcc816f86a39d07800c9560
  locator: rules/rule_塔奈西斯湖__塔奈西斯湖.json#/Variants/7/Content
  quote_hash: 539336B286B1E014E6026FCF58E83EC993BC12E451602336A3CBBC8BDFBA08CD
  quote: 塔奈西斯湖——草原民族称达那孜海——是卡拉迪亚东部最大的淡水湖，也是帝国与库赛特汗国之间的天然分界线。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_ES5_2
  quote_hash: 2BBC394A3E2A7E37D79E7862AC83DC6004022CAF80C5F011BB9EBA298D257A2D
  quote: 拉耳图绪斯位于塔奈西斯湖的南端。村庄附近有座盐矿，盐泉偶尔会探出水面，让人们相信这就是传说中通往鬼怪聚集的地下海的门户。

      min_detail: summary
    denies: []
  - id: expr.old-legion-soldier-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 这些职业士兵由国家支付军饷，是优秀的近战战士。帝国的指挥官们曾因其手持的巨大盾牌，而称他们为重盾步兵。但是这个名字并没有被这些骄傲的士兵们采用，他们更喜欢被称为军团步兵，以向旧时的军团致敬。我们那个年头的训练是这么来的：天不亮起来列队，百夫长拿着藤条在队列里走，谁的盔甲没擦亮、谁的盾牌没举到位，劈头盖脸就是一下。前排的人倒下了，后排的人自动补位，不需要长官喊——这是练到肌肉里的本能。
    sources:

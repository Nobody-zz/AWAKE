- id: assertion.town-razih-2
  revision: 1
  kind: fact
  text:
    zh-CN: 如今坎族口音已被纳哈撒语取代，宗教也被遗忘，唯有他们的标志留存下来——仍讲着那些甘冒一切风险以求荣耀的冒险家。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_A4
    quote_hash: 9BE8E6B2FC3F330D4341668228B3218FC289B6A352DD2EC0F02A8D0FEA056E89
    quote: 如今，坎族口音已经彻底被纳哈撒语替代，他们的宗教也被彻底遗忘，但他们的标志却保留了下来，依旧诉说着那些甘愿冒一切风险以获得荣耀的勇敢冒险家的故事。
  expressions:
  - id: expr.town-razih-2-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 如今的拉齐赫说的是纳哈撒话，坎族当年的神早没人拜了，只剩下船头那个记号还在用。
    sources:

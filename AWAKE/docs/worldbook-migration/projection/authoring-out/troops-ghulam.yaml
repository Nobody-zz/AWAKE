  text:
    zh-CN: 古拉姆是卡拉迪亚南部的一支雇佣骑兵，出身是亡国的达西武士。达西曾是与帝国南部接壤的古老王国，其君主称「帕提沙」；库赛特西征夺走其与帝国接壤的领土、又从帝国手中取走远东行省，达西被向东驱赶，从此与帝国不再接壤。不愿臣服库赛特的武士流散四方，组成了古拉姆——契约形式是「自我卖身、共同拥有」：每个人都把自己卖给组织，并逐渐成为组织的共同所有者。他们以鲜衣怒马闻名，头发打理得整齐，身上飘着香水味，帽上插孔雀羽毛。

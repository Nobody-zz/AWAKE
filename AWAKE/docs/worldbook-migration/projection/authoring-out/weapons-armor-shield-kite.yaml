assertions:
- id: assertion.weapon-armor-shield-kite-1
  revision: 1
  kind: fact
  text:
    zh-CN: 筝形盾上端圆、下端收成尖，竖着拿能从小臂一直护到小腿。它是一块木胎，外头包皮或包铁圈；长短分两路——步卒的做到一百二十八到一百七十，骑兵的只有七十八，短到不碍驾马。这一路三十件，差别全在包边上：粗制的、破旧的耐久只有一百几，包铁圈、上橡木的能做到六百。护值一到九，多数只有一——靠的不是它硬，是它把刀挡在外面。

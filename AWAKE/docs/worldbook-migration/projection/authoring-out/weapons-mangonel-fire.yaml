- id: assertion.mangonel-fire-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 在见过它的人嘴里，火焰投石车是「地狱里拉出来的东西」：天快黑时对面营地亮几下火点子，一颗大火球拖着黑尾巴从天上砸下来，落在城门旁的兵棚上，第二下直接炸开，火星溅了半条街；一个火球就烧死了几十个人。事后去看那片地，砖都烧裂了。从此听见对面投石车响，千万别抬头。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913

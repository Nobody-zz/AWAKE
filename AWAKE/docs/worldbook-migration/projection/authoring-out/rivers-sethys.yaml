  quote: 密泽亚德高原上的塞堤斯河源头
- source_id: source.calradia.chronicle.animusforge.geo2
  source_version: animusforge-20260912
  source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93
  locator: rules/rule_塞堤斯河__塞堤斯河.json#/Variants/0/Content
  quote_hash: 8EF6A7FAAB1074A256B69B0625A2501B48C3CFDA8822522E297E4E17581CACFB
  quote: 塞堤斯河是吕卡隆的东墙。它从北边的丘陵里流出来，一路往南，经过吕卡里亚平原，最后灌进珀拉斯海。
- source_id: source.calradia.game.settlements.geo2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 8fcc88868e40b0d90b9e6fada6e9ad7029dd90df4e2905f1718e00673932e0c4
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_ES2_1
  quote_hash: F420925AB3E23148D2D51753652FDB759063EB5BFEBE6D3683AD7F0C773FE192
  quote: 再向下游河流随即分为三支，形成三河河谷
- source_id: source.calradia.game.settlements.geo2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 8fcc88868e40b0d90b9e6fada6e9ad7029dd90df4e2905f1718e00673932e0c4
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_ES2_2
  quote_hash: 04644FB1058EAB49A456ED8A7A32220CA72965B2F75798478D77B128EDB6A168
  quote: 塞堤斯河流经三河河谷最南端的支流
- source_id: source.calradia.game.settlements.geo2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 8fcc88868e40b0d90b9e6fada6e9ad7029dd90df4e2905f1718e00673932e0c4
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_ES2_1
  quote_hash: 3CF1901DD7352F6E1C5019D17528E6008405CAF898D0F722ABC8C6E7148CA6A6
  quote: 在塞堤斯河流入珀拉斯海的河口附近，村民们开出了盐田。
- source_id: source.calradia.game.settlements.geo2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 8fcc88868e40b0d90b9e6fada6e9ad7029dd90df4e2905f1718e00673932e0c4
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_ES6_1
  quote_hash: 0677D7BCEC411966089405BE341B1AAA9FAEFA345B7D6EAD16CC9C439C4F7F46
  quote: 山上的细土被水流冲刷下来形成黏土，这是能让帝国南方的陶工们两眼放光的东西。
- source_id: source.calradia.chronicle.animusforge.geo2
  source_version: animusforge-20260912
  source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93
  locator: rules/rule_塞堤斯河__塞堤斯河.json#/Variants/2/Content
  quote_hash: 5DED5DE69D365561BF55B3C6CAC9758D47B4F59C103A19DCC7CF6A06A71A8F03
  quote: 吕卡隆被围过那么多次，从来没被饿垮过，就是因为这条河。
- source_id: source.calradia.chronicle.animusforge.geo2
  source_version: animusforge-20260912
  source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93
  locator: rules/rule_塞堤斯河__塞堤斯河.json#/Variants/5/Content
  quote_hash: 168BB0C91B0748F9EBAA9DCDB34A4C1804FAC665788D29EF4AC452CABC89F127
  quote: 我们阿塞莱的商船从撒纳拉出发，穿过珀拉斯海，进了塞堤斯河口就能一路漂到吕卡隆城下。
- source_id: source.calradia.chronicle.animusforge.geo2
  source_version: animusforge-20260912
  source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93
  locator: rules/rule_塞堤斯河__塞堤斯河.json#/Variants/3/Content
  quote_hash: 270F233F445327A8AFAC625B484D8687EA50BEE90398F2CA5B43C55258BFFD0D
  quote: 我们在北方的冰天雪地里练出来的围城本事，到了南方全用不上——因为那条该死的河从来不给帝国人断水。

- id: assertion.weapon-armor-shield-kite-2
  revision: 1
  kind: fact
  text:
    zh-CN: 瓦兰迪亚与斯特吉亚的步兵筝形盾另有一路做法：盾面更窄更长、下缘做成棱角，排成盾墙时两盾能叠住；其中斯特吉亚的叶尖款最长，一百三十三，耐久到六百。

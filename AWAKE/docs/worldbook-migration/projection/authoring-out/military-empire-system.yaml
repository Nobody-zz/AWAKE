  - id: expr.empire-system-khuzait-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 帝国人把常备军废了，这在我们草原上看来就是自己砍了自己的腿。一个帝国没有自己的军队，要靠贵族们各自出钱养兵，这算什么帝国？这就是部落联盟。草原上的部落联盟是什么样子我们最清楚——有共同敌人的时候能站在一起，没有共同敌人的时候互相咬。阿雷尼科斯活着的时候帝国人还有共同敌人，他一死，共同敌人就变成了彼此。现在三个皇帝各管各的军队，谁也不服谁。这对我们来说是好事。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913

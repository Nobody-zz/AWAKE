    text:
      zh-CN: 说起他们，城里人各有各的口吻。有人叹一句「瓦兰迪亚人真惨，他们的老百姓离不开土地，生生世世都是贵族的奴隶」；也有人把手一摆，说这有什么稀奇——毕竟君君臣臣，都是有契约的。

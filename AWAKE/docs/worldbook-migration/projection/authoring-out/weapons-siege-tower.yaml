  - id: expr.siege-tower-engineer-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 攻城塔最怕的不是箭矢，是地形障碍。城前有壕沟、鹿砦或铁蒺藜，就推不上去，得工兵率先清理出一条平整通道。塔顶平台是唯一输出窗口，但也是守方集中打击的目标；塔身越高，弓弩压制效果越好，但高度每增加一层，重心上移，推进稳定性就降一大截。吊桥是攻城塔最脆弱的部分：落桥时暴露在垛口正前方，守方长柄武器可在桥面未完全放平前戳刺，阻止桥面扣合。一旦塔身被点燃，内部斜梯即变为烟囱，底层出口被推塔人群堵塞，塔内士兵几乎无从逃生。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_攻城塔__攻城塔.json#/Variants/2/Content

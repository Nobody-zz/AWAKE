    layer: detail
    text:
      zh-CN: 维基亚卫队里有很多我们斯特吉亚的勇士。在南方的帝国人看来，他们是拿钱卖命的雇佣兵；但在我们北方，能在皇帝身边持斧而立，是一种荣耀。许多年轻人南下去吕卡隆服役，攒够第纳尔再回来买地娶妻。但先皇死后，一切都变了。有些人在暴乱中死了，有些人回来了，还有一些人至今不知道下落。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/6/Content
      quote_hash: BB05113283EBB1097CAF67A935629938F9C6BCA48646A4B464087BB2850C9CD1
      quote: 许多年轻人南下去吕卡隆服役，攒够第纳尔再回来买地娶妻
    grants:
    - profile_id: profile.noble
      scope: national
      min_detail: detail
      culture_ids:
      - entity.culture.sturgia
    denies: []
  - id: expr.vaegir-guard-nord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我们的先王——「饿人」沃尔比约恩——就是从维基亚卫队起家的。他在南方的帝国皇帝身边持斧十年，见识了真正的权力是什么样子，也攒下了数不清的第纳尔。当他回到诺德维格，他已经不再是当年那个穷小子了。他用从帝国学来的手段和从皇帝手里赚来的黄金，把四分五裂的北方部落统一在了自己的旗下。维基亚卫队对我们诺德人来说，是一段值得骄傲的历史。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/8/Content
      quote_hash: CC006A6C28191B106BCE45A5310E7ADBC1CF5D7FD73594FA0E3DB8EC9FDF4EFF
      quote: 他在南方的帝国皇帝身边持斧十年，见识了真正的权力是什么样子，也攒下了数不清的第纳尔
    grants:
    - profile_id: profile.noble
      scope: national
      min_detail: detail
      culture_ids:
      - entity.culture.nord
    denies: []
  - id: expr.vaegir-guard-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 维基亚卫队？帝国人用北方蛮子当亲卫，最后被反噬的故事。说实话，我们瓦兰迪亚人不太理解这种做法。国王的护卫当然应该从最忠诚的封臣家族中选拔，怎么能交给一群拿钱办事的外族人？先皇的死，某种程度上也是自食其果。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/10/Content
      quote_hash: BA5AD78ACE7BE4C0B834C7038039068B13FD0777CB83DF4C4CE8B639EA86A3D2
      quote: 国王的护卫当然应该从最忠诚的封臣家族中选拔，怎么能交给一群拿钱办事的外族人
    grants:
    - profile_id: profile.noble
      scope: national
      min_detail: detail
      culture_ids:
      - entity.culture.vlandia
    denies: []
  - id: expr.vaegir-guard-khuzait-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 用外族雇佣兵当亲卫，我们库赛特人不会这么干。可汗的护卫是他从小一起长大的兄弟，战场上生死与共的伙伴——那不是金钱能买到的东西。维基亚卫队的问题不在于他们能不能打，在于他们除了皇帝谁也不认，皇帝一死就什么都不剩了。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/13/Content
      quote_hash: 9140E505F2670E388FC5437BF04CCB4D923782CF3367CA37DA33B3DDE8180408
      quote: 可汗的护卫是他的那可儿——从小一起长大的兄弟，战场上生死与共的伙伴。那不是金钱能买到的东西
    grants:
    - profile_id: profile.noble
      scope: national
      min_detail: detail
      culture_ids:
      - entity.culture.khuzait
    denies: []
- id: assertion.vaegir-guard-3
  revision: 1
  kind: interpretation
  text:
    zh-CN: 在帝国人自己这里，维基亚卫队是一笔算不平的账：吕卡隆的市民记得的是先皇死后城里那场烧杀——「弑君蛮族」的骂名就此坐实；而站在政治账上的人说，他们本可以列阵突围，凭战力没人拦得住，覆灭更像制度的悲剧而非战士的失败。

    text:
      zh-CN: 配甲熊皮是折中的做法：毛面照旧，里头衬铁肩，护值十二。披着不比别的兽皮重多少，可挨刀的时候，铁把那一下接住了。做的人说，这是给不想穿甲又要上阵的人预备的。

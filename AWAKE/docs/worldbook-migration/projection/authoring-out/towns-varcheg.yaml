  quote: 瓦尔切格位于风雨交加的海崖上，此地正是昔日巴旦尼亚领土的卡恰尔半岛深处
- source_id: source.calradia.chronicle.animusforge
  source_version: animusforge-20260912
  source_content_hash: 407C6E6DCA55C8EC47104C4F29489DDE7BCB991298B50BD99DA57503ABA171B2
  locator: rules/rule_卡恰尔半岛__卡恰尔半岛.json#/Variants/1/Content
  quote_hash: 31CC07E184932EB74EBB29642B25F88E795B6567FD3A0D3E03797D38B6E57D80
  quote: 卡恰尔半岛是我们斯特吉亚东边的大门。从伊卡拉荒原往西走，地势越走越窄，最后就变成了那条怪石嶙峋的长条，硬生生插进海里。北边是诺德人的地盘，南边是巴旦尼亚人的老窝，我们卡在中间，守着两条海路。当年瓦尔切格那件事，我们的祖先就是被诺德人和巴旦尼亚人之间的烂账给卷进去的——他们互相咬，最后把肉送到了我们嘴里。现在半岛上的城镇是我们的，但石头底下埋着的历史不是。走在那些海崖上，风里还能闻到诺德人的长船和巴旦尼亚人的篝火的味道。

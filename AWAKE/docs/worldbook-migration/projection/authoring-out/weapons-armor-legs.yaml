  - id: expr.weapon-armor-legs-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 靴子看底与筒：底要厚、要能换，筒要贴小腿，不然走三里就要掉。护值差得远——软皮鞋一，链甲护腿二十三，夹板靴二十六。真正包铁的那几款都很重，走一天下来脚腕会酸，所以只有骑马的人常穿。

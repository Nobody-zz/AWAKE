    layer: rumor
    text:
      zh-CN: 方旗骑士？那跟我们没关系。我们村要是出个方旗骑士，全村祖坟冒青烟了。我在集市上见过一次，骑在那高头大马上，浑身铁片子，脸都看不见，只能看见盔沿底下一条缝。他们那马也吓人，马铠比我的房子还值钱。不过话说回来，打仗还得靠他们——真要把对面阵线冲垮，还得这帮铁人压上去。

- id: assertion.town-husn-fulq-2
  revision: 1
  kind: fact
  text:
    zh-CN: 富勒格又名法耳科斯，是极南之地来的雇佣兵酋长；他在此筑堡，靠堡的位置两头收贿、随时选边。近二十年之后他带着满船黄金还乡，而许多阿塞莱氏族至今仍骄傲地自称是他的后裔。
  sources:
  - source_id: source.calradia.game.settlements
    source_version: bannerlord-1.3.15.110062
    source_content_hash: E8F7E5F0AB96CE249D4108ED663FAFF81706A2647066FF30E9816631F0AC0AD3
    locator: bannerlord.db#settlements.town_A2.descriptionText
    quote_hash: B653A98031BF79A58C14DAA031CAC0967801A83BF2716868F549B71A4EFBA618
    quote: 富勒格，又名法耳科斯，是一位来自于极南之地的黑面孔雇佣兵酋长。
  - source_id: source.calradia.game.settlements
    source_version: bannerlord-1.3.15.110062
    source_content_hash: E8F7E5F0AB96CE249D4108ED663FAFF81706A2647066FF30E9816631F0AC0AD3
    locator: bannerlord.db#settlements.town_A2.descriptionText
    quote_hash: E4D04E619DC1313FB95766CA5193D3E13D4700E4BBF8F0FCF0ED45E1CF44B71E
    quote: 在玩了将近二十年的换队游戏之后，他驾着一艘满载黄金的船驶回了家，但许多阿塞莱的氏族仍然骄傲地自称是他的后裔。
  expressions:
  - id: expr.town-husn-fulq-2-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 这城的底子是外乡人打的——南边来的雇佣兵头子，两头讨钱，哪边给得多就帮哪边。攒够了金子坐船回家，这边还有好些氏族自称是他的种。

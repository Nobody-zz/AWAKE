summary:
  zh-CN: 火焰投石车：投掷装满帝国火的罐子，把投石车本身的致命威力与火焰结合——投射物具有爆燃性，能有效摧毁敌方围城器械以及破坏城墙。开花弹昂贵且制作繁复（陶罐要薄到摔得碎、又不能薄到在弹兜里加速时裂），没存货，现烧现装现打；但一颗火球砸下来，对面士气就垮一道——攻城攻的是墙，也是意志。

  locator: rules/rule_沙拉斯__沙拉斯.json#/Variants/1/Content
  quote_hash: F94D61D3E7EF391C04A6279A00DDB44E49CC5177B9EF02800A22B3B44E1B649E
  quote: 沙拉斯是戴·科尔坦家的钱袋子，也是我们瓦兰迪亚的摇钱树。那座港口的岁入能顶内陆好几个男爵领地的总和，因加泰尔敢在御前会议上横着走，靠的就是沙拉斯港的商船和关税。不过我们这些人看沙拉斯，看到的不是因加泰尔的底气，而是商机。沙拉斯的集市上帝国商人、阿塞莱驼队、库赛特皮货商挤在一起，货比别处便宜两成。但我们也得承认，因加泰尔把那座城榨得太狠了。他光顾着抽税，码头的老石阶坏了没人修，海湾边上帝国时代留下来的防波堤还是奥斯里克时代加固的。财富来得太容易，人就不珍惜。

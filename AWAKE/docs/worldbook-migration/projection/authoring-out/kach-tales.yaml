    revision: 1
    kind: interpretation
    text: {zh-CN: "诺德叙述将易主归因于巴旦尼亚人设局、雇军反噬。"}
    sources:
      - {source_id: source.calradia.chronicle.kachar-peninsula, source_version: download-20260903, source_content_hash: a306e8aec67d3665c1f10846236b414d1e1a0c16c76aec106f00cf62e69aaceb, locator: chronicle-kachar-peninsula.txt#/Variants/4/Content, quote_hash: 9BDB7D7AA9866AD7E11B033CE0806C8B5AE4AE11FA0B6E48F481EBC5D43E26E7, quote: "巴旦尼亚人耍了花招，雇了斯特吉亚的斧头来赶我们"}
    expressions:
      - id: expr.kach-tales-2
        revision: 1
        layer: detail
        text: {zh-CN: "诺德人的讲法：巴旦尼亚人设了局，雇来的人打完仗反客为主。"}
        sources:
          - {source_id: source.calradia.chronicle.kachar-peninsula, source_version: download-20260903, source_content_hash: a306e8aec67d3665c1f10846236b414d1e1a0c16c76aec106f00cf62e69aaceb, locator: chronicle-kachar-peninsula.txt#/Variants/4/Content, quote_hash: 9BDB7D7AA9866AD7E11B033CE0806C8B5AE4AE11FA0B6E48F481EBC5D43E26E7, quote: "巴旦尼亚人耍了花招，雇了斯特吉亚的斧头来赶我们"}

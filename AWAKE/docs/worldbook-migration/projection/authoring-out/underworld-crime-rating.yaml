  quote_hash: 0051F1EC2CEADA908D7197C8B9C0F0DAB526705A322982EA2437735399EF4FF2
  quote: 玩家如果抢劫或以其他方式侵犯一个王国的居民，除非他们处于战争状态，否则将得到一个犯罪等级。像胁迫村民给你提供新兵和物资，或在任务中的非法行为，将增加少量的犯罪等级。对中立方的直接攻击将增加相当大的数额，通常会引发战争。{newline}{newline}犯罪等级最高为100。在一个中立王国中，等级达到30或更高的玩家将被禁止进入该王国的定居点，如果他们试图潜入并被抓住，他们可能会被短暂监禁或遭受肉刑。卡拉迪亚的城镇通常缺乏长期关押囚犯的资源，所以对轻微犯罪的惩罚往往是粗暴而直接的，但并不像可能的那样严厉。不过，正义是不可预测的——如果玩家的生命值很低，而殴打会导致死亡，那么就有可能考虑处决。{newline}{newline}另一方面，一个独立的玩家如果犯罪等级达到60或更高，将被王国宣布为逃犯，并被当场攻击。如果玩家在成为一个王国的附庸时积累了犯罪等级，他或她仍然能够进入其定居点，但一旦进入，可能会面临监禁、罚款或失去影响力。此外，玩家每天都会失去相当于其犯罪等级一半的影响力。犯罪等级会随着时间的推移而衰减，所以在一段时间后，一个角色的错误行为会被遗忘。然而，如果一个玩家被宣布为逃犯，他或她将需要通过一个谈判的和平协议来结束这场战争。

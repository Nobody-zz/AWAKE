    text:
      zh-CN: 拉文尼亚堡据珀拉斯海东北岸与卡勒萨水网要口，下辖渔村与粮村各一；鱼货在堡中集散，麦子入仓，通往阿塞莱的关道设卡验货，湖泊咸水湖的渔界由堡里划清。

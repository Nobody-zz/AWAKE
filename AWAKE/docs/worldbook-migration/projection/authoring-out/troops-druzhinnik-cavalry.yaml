summary:
  zh-CN: 斯特吉亚亲卫骑兵：波耶的私人扈从军，也是「瓦良格之路」的顶点——从步兵一路打上来才有资格骑上战马，装备由波耶置办。特色是下马照样能打：落了马捡起斧头还是战士，这一点让南方的重骑兵颇为忌惮。各族对其评价集中在马矮而耐力强、雪地泥泞里稳，平原冲锋则远不如瓦兰迪亚竞技马。
registry_bindings:
  profile_registry_version: 1.0.0
  profile_registry_hash: 309D10583E7B4AF05F28DE2C2E67A2528CB3D6C45752369C0F7D160FABC3F3A5
  referral_registry_version: 1.0.0
  referral_registry_hash: 6E17075F1F967BE28C0437121DB50E5C30809C4EFC3D2A5F22AD9BB0B3B926CD
sources:
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.3r3MPbhV
  quote_hash: 2D8CC8786BC8040928019D4BEBC446C9DB7C757D24CE317CD78E3CA461A93D10
  quote: 斯特吉亚的波耶们总在寻找实力不凡的战士来加入他们的亲卫骑兵，即私人扈从军。这些人因丰厚的赏金而保持忠诚，他们装备着最好的武器和马匹，在任何北方军队中都担任精锐。
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.bdrb4ur3
  quote_hash: 1D462736F24517DB5A4A20D43D449CA2C8BB4ED6A41977AB104A470A0EE2E335
  quote: 斯特吉亚土地上的每一座村庄和城镇都为波耶和王公们提供一支民兵部队。他们在战斗中支援亲卫骑兵，如果他们能脱颖而出，就有希望晋升到亲卫骑兵的行列之中。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_斯特吉亚亲卫骑兵__斯特吉亚亲卫骑兵.json#/Variants/0/Content
  quote_hash: 7A6CC9613A4F86F74DA3ED6E7485895D7A0AF5780C607A170AB3FB314CCA1AB5
  quote: 斯特吉亚亲卫骑兵是波耶麾下最精锐的战士，也是瓦良格之路的顶点
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.hob3WVkU
  quote_hash: 25857981DF657A745BACA58F15A8A3013ABAD57A8BA504A20383E3E7A727D6DE
  quote: 你的父亲是某位波耶的亲卫队成员，这些“伴友”们一起组成了波耶的私人扈从军。他能和主君同桌共餐，监管波耶的庄园，甚至在战斗时还能和波耶并肩站在盾墙中心。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_斯特吉亚亲卫骑兵__斯特吉亚亲卫骑兵.json#/Variants/2/Content
  quote_hash: 81513C7D97B7FA4AB99553EFC7A9B33F5DC75B7A9EC13158CCD1DCFF139E3ADD
  quote: 我亲手把缰绳交给他们，因为他们在战场上证明了自己
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.NjXTLWSr
  quote_hash: BE92FF28207BA5887B9722D9C7EA03CF646F0DAE9A6D4AECDAB88C0923E9FA46
  quote: 作为一名精英亲卫骑兵，你多年以来精修自己的骑乘技艺{newline}{newline}配备更长的骑枪{newline}{newline}骑术技能+15
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_斯特吉亚亲卫骑兵__斯特吉亚亲卫骑兵.json#/Variants/3/Content
  quote_hash: 6A181ABD34EAB54FB992655AFA4035B2AF0AA05CB688C036A48721BD252A0A9D
  quote: 但骨子里我们还是步兵——下了马，架起盾，照样能打
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_斯特吉亚亲卫骑兵__斯特吉亚亲卫骑兵.json#/Variants/5/Content
  quote_hash: AC45B83EE3DC4A9E926CAD40818483F097E468E26E3046991FD0B3FE785DA71C
  quote: 但有一点值得警惕：这些骑兵是从瓦良格升上来的，下马之后照样能打
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_斯特吉亚亲卫骑兵__斯特吉亚亲卫骑兵.json#/Variants/5/Content
  quote_hash: B430AC44022BD5D4F78B8ECA8C54DDB8BDD826A10E3E1FF0086F3BE4CB7FE87A
  quote: 在北方那种地形里，这种素质很要命
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_斯特吉亚亲卫骑兵__斯特吉亚亲卫骑兵.json#/Variants/6/Content
  quote_hash: A7A0015566EDAA57BF09BBBCC76A26B4B94435FCB713F2AE335C1C72318EC410
  quote: 在平原上，一个冲锋就能把他们撞飞。但在北方的雪地和林地里，我们的竞技马跑不动，他们的矮脚马却灵活得很
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_斯特吉亚亲卫骑兵__斯特吉亚亲卫骑兵.json#/Variants/7/Content
  quote_hash: 002DEEAAA1BCCAF956678E010FCAAB462480843FE8BC206DA3B9D400332C1315
  quote: 我们的骑射手能绕他们放箭放到天黑。但他们从步兵打上来的底子厚，不像帝国骑兵一落马就废了
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_斯特吉亚亲卫骑兵__斯特吉亚亲卫骑兵.json#/Variants/4/Content
  quote_hash: 6D3F8C32EB2DFFE8370B0C7776AF49DCEFACF8574530B1ADBD50BB7513C990BB
  quote: 他们是从瓦良格一路打上来的，不是靠出身，是靠战功

  zh-CN: 玻瑞阿戈拉位于帝国寒冷的北方，被伊勒坦运输线的冰湖网络所环绕；附近帝国堡垒在水路上若隐若现，监视着斯特吉亚与库赛特的劫掠者。这里的低地很适合种植亚麻。

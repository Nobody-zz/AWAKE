  - id: expr.town-askar-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 阿斯凯尔的地是河给的也是河收的——决堤周期是置产的死规矩，临河仓铺贵但险；城是军团旧营地底子，粮产稳定，走河运的货在此换骡马。

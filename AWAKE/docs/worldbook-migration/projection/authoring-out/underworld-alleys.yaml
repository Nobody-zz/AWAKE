  - id: expr.town-alleys-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 巷子跟工坊是一个路数——都是城里的一份产业，差别只在工坊挂牌、巷子不挂牌。谁拿下它，谁就按这座城的兴旺程度分钱；城越富，那条巷子越肥。

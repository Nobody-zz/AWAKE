  - id: expr.ballista-engineer-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 弩炮是最经济的扭力投射武器。结构上就三部分：扭力束、箭槽、扳机。扭力束用畜力筋腱或发绳绞紧，蓄能效率稳定，扳机释放结构简单可靠。优点是制造门槛低，损耗部件可现场替换。缺点是弹道衰减快，弩箭虽然初速高但质量太大，一百五十米后动能断崖式下跌，打到第四个人基本就停在地上了，效率不如排弩齐射。对建筑结构的破坏也有限——箭矢动能主要转化为贯穿而非冲击，打中木梁就是插进去，不会造成结构断裂。

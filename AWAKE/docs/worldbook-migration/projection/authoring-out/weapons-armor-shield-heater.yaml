    layer: detail
    text:
      zh-CN: 巨盾不是拿着打的，是立着的：底下两支脚钉进土里，人蹲在后头装弩。正面蒙一层厚皮、或者干脆两面包铁，一般的箭射不穿。缺点是重——一个人扛不动，得用小车推。

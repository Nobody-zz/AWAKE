      zh-CN: 维基亚卫队是阿雷尼科斯皇帝的亲卫部队，但他们不是帝国人——主要是诺德人和斯特吉亚人，还有北方冰原上来的猛士。他们拿皇帝的钱，用命守皇宫。皇帝信任他们，是因为这些人在帝国没有根基，除了忠诚别无依靠。

- id: assertion.weapon-head-layered-2
  revision: 1
  kind: fact
  text:
    zh-CN: 叠穿的代价是分量。单戴一件轻型锅盔不到两公斤，垫上链甲围帽接近三公斤，垫到全覆链甲则近四公斤——压得脖子发酸，戴久了人也迟钝。因此这一做法分人用：征召兵垫布，常备兵垫皮，只有亲卫与头领才肯整日顶着最厚的那一套。

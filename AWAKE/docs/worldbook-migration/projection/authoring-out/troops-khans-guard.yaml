summary:
  zh-CN: 可汗卫士：库赛特汗国最顶尖的骑射手，可汗本人的护卫，从各部落万里挑一，入选后不再属于部落、只属于可汗。是卡拉迪亚唯一以骑射为核心的精锐骑兵，也是每个草原年轻战士的梦想。帝国在东线最头疼的对手；各族对它的破解法各说一套（瓦兰迪亚说雨天弓弦会松、诺德说盾墙顶得住但补位瞬间是破绽）。

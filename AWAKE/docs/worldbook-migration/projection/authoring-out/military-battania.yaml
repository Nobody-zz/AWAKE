assertions:
- id: assertion.battania-1
  revision: 1
  kind: fact
  text:
    zh-CN: 巴旦尼亚没有常备的中央军队：战争来临时，至高王向各部落发出召唤，各部落依照古老盟约派出战士。这种联军制度根植于氏族自治的传统，但也导致各部落常因宿怨或利益分歧而行动迟缓——这是每一位至高王都试图解决的核心问题。军队的核心是弓箭手，他们自幼在森林中狩猎，箭术精准，擅长利用地形进行伏击；重装步兵被称为长镰兵，手持战镰，在敌军阵型被箭雨打乱后从侧翼或后方杀出。巴旦尼亚人最令人畏惧的战术是「狂啸冲锋」——在所有战士同时发出的骇人战吼中，全体冲向敌阵，冲锋前会用战纹涂抹身体以威慑敌人。

  - id: expr.modern-legion-steward-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 阿雷尼科斯的军制改革，本质上是将帝国的军事力量从中央集权转向地方分权。他废除了最后一支常备军团，改由执政官以个人财力组建私兵。这在短期内缓解了帝国的财政危机，但从长远来看，却为后来的内战埋下了伏笔——当每个执政官都拥有只听命于自己的军队时，皇权就成了一个空壳。

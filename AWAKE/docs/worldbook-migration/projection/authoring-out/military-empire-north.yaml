- id: assertion.north-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 对邻国而言，北帝国是块值得下手的肉：有人说它补给线漫长、后备兵力不足，三线压力都很大，防守兵力将将够用，进攻就别想了，所以应该积极谋求与北帝国开战以获最大利益；也有人说它说强不强、说弱不弱，纸面数据还是很强，但极长的战线让军队疲于奔命，而且他们都是些文官，武将出身的元老只有一两个，打仗时十分吃亏。

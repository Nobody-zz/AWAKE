    quote_hash: 9467F6804D841A053C0D1FE5276C87DAA61A41E26E510EC288EC594A16D41926
    quote: Faction.clan_empire_north_3
  - source_id: source.calradia.chronicle.animusforge.capitals
    source_version: animusforge-20260912
    source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
    locator: rules/rule_涅雷采斯__涅雷采斯.json#/Variants/0/Content
    quote_hash: AB336980AECAE6B4F85B1E62CBC0A68B4FC0549043E0839CA779EFD195F5F098
    quote: 因为萨涅俄帕在他手里。那座城的城墙厚得连斯特吉亚人的攻城锤都砸不穿，商路从萨涅俄帕辐射出去，半个北帝国的粮食都要经过他们的地盘。
  - source_id: source.calradia.game.settlements.capitals
    source_version: bannerlord-1.3.15.110062
    source_content_hash: f166dd33c2ea6ef049d9cb5595f105d36ea55defff8ccb3a1025091f32988fa3
    locator: bannerlord.db#localization.04xAg0yN
    quote_hash: 8EA08BDFE8A6B2A53D5033576D2ADF6EC7C0A105181AD2640B607605CA9837E0
    quote: 彭同·涅雷采斯是已故皇帝德洛修斯·涅雷采斯的儿子，后者在潘德拉克战役中战死。虽然通常情况下皇位是父死子继，但那只是约定俗成的习惯，而非律法，因此元老院选择由阿雷尼科斯将军继位。绝大多数皇帝都会致力于肃清对皇位有潜在威胁的隐患，然而阿雷尼科斯在权衡了个人利益和帝国团结之后，选择留彭同一条活命。由于涅雷采斯家族一直以来就属于寡头阵营，因此彭同在内战中选择支持卢孔。
  - source_id: source.calradia.chronicle.animusforge.capitals
    source_version: animusforge-20260912
    source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
    locator: rules/rule_涅雷采斯__涅雷采斯.json#/Variants/4/Content
    quote_hash: 1C237E5AC9F25D2CD8D9A6D4926CA43E7EC034D75662540ECC1C9234D25E0C0C
    quote: 转而以萨涅俄帕为根基深耕元老院政治。
  expressions:
  - id: expr.throne-saneopa-neretzes-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 涅雷采斯老爷家就住在这座城，城墙比咱们村的地界还长。听说他家老王爷在潘德拉克把军队折光了，如今是小王爷当家居多。
    sources:
    - source_id: source.calradia.chronicle.animusforge.capitals
      source_version: animusforge-20260912
      source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3

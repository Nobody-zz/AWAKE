assertions:
- id: assertion.town-rhotae-1
  revision: 1
  kind: fact
  text:
    zh-CN: 洛泰坐落于厄里特律斯山玄武巨岩的荫蔽之下，早先是一座帕拉人的山堡，又名洛塔什；继拉革塔之后，洛塔什也很快落入帝国之手。当地帕拉酋长在得知邻国之事后，屠戮了他所庇护的数十名帝国公民；性情古怪的长发将军萨拉庇俄斯率惩戒部队攻下洛塔什，将其夷为平地。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B

      scope: elite
      min_detail: detail
    denies: []
- id: assertion.ballista-fire-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 守城的人对火焰弩炮的印象全在那一箭上：带火的箭跟人胳膊那么粗，飞过来拖着黑烟，跟火龙似的；打中人跟普通弩炮一样，多了个火烧的焦臭味。对攻城的大车没大用——箭头是插进去了，火烧了一会儿，对面一桶水浇上来就灭了。老话说得好，火弩炮是阎王点名的家伙，点到谁谁认命，点不着的照样往前冲。

  quote: 见到可汗亲卫的旗帜，要么下马行礼，要么赶紧逃命
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_可汗亲卫__可汗亲卫.json#/Variants/4/Content
  quote_hash: EA7F31D4B5A99D3E73649493664D13B8DEE870456F8CC8435F4437EBCC4FAF23
  quote: 可汗亲卫根本不给你这个机会
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_可汗亲卫__可汗亲卫.json#/Variants/4/Content
  quote_hash: 8CD454B171165FE77764C97B38FA5F8A0145D9E64C0174B05FDBC68D2E94D5E8
  quote: 他们跑着跑着忽然回头拔刀，把我们的骑兵削了个干净
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_可汗亲卫__可汗亲卫.json#/Variants/5/Content
  quote_hash: BD8144D1F076494100BC71D49C663C61584E98648FECC726FA687C78A11930C7
  quote: 他们的弓在雨天和潮湿天气里会受影响，弓弦松了之后准头就差一些
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_可汗亲卫__可汗亲卫.json#/Variants/8/Content
  quote_hash: 39B602DD6A923A590F8D31A4F20D612E2874E2352E37D07601A5781A74C2B694
  quote: 可汗亲卫的箭射不穿我们的盾墙，但能在盾墙上打出窟窿

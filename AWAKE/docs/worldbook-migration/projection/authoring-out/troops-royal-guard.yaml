- id: assertion.troop-royal-guard-2
  revision: 1
  kind: fact
  text:
    zh-CN: 各方观感：帝国士兵称其盾墙极难突破、飞斧混乱难防、海战跳帮是噩梦；瓦兰迪亚人敬其为对手——盾墙挡弩矢，但平原上缺乏机动性，终是方旗骑士的猎物；斯特吉亚人认作打法相近的北方亲戚，唯海战自愧不如。
  sources:

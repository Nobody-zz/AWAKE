    zh-CN: 札甲最常和链甲叠着穿：札甲底下垫一件链甲衫，护值加到五十一；铜的扎甲衬链甲同理，护值四十六；底下垫软甲的那款做到三十七。北地铁匠的看家本事，就在这两层之间调配重。

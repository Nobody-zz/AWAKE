assertions:
- id: assertion.town-poros-1
  revision: 1
  kind: fact
  text:
    zh-CN: 波罗斯位于珀拉斯海的北面海岸；温暖绵延的山峦宜于驯养绵羊与马匹；嘶鸣的牲畜与流血的斗殴在此地常见。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_ES3
    quote_hash: 3AC20E62D638ACBAF8068BA79412D400654A1F20B83DEC51659866E3E469CAF9
    quote: 波罗斯城位于珀拉斯海的北面海岸。
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_ES3
    quote_hash: 17921F5A8C688B18053AD4B01B8FBA4C43A87D71CBD322676EFAEF2018DEF8B7
    quote: 此地温暖而绵延的山峦非常适合驯养绵羊和马匹。
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_ES3
    quote_hash: 4A203FF8B7A6C68F6BC7411196DE8A5E73CBFDDE5E6FEDA009CDB7230AB40198
    quote: 嘶鸣的牲畜和流血的斗殴在此地成了一道靓丽的风景线。

summary:
  zh-CN: 波利西亚坐落于阿塞莱边境被称为卡勒萨的河湖交通网旁；村民从西边的一片潟湖采盐，那里在被沙嘴分割前，曾是珀拉斯海的一片海湾。当地空气又浑又臭，外人多绕道，村民却以监视阿塞莱人自傲。

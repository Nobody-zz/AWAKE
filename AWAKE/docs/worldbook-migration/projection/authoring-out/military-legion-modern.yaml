  quote: 上面是哪个大老爷，你就得看哪个大老爷的脸色
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_现代军团__现代军团.json#/Variants/7/Content
  quote_hash: 52AA131BC818F66603D05524AE90B4506310290E0759AF278C6C1FB811E2BD14
  quote: 但人家至少是男爵养兵，国王号令。帝国倒好，执政官们各自养兵，三个皇帝互相打，连个统一号令都没有
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_现代军团__现代军团.json#/Variants/9/Content
  quote_hash: 46D788868BAE91462427FEE4B3B740AFFCD5103FD269E28A1215D46252E140A4
  quote: 皇帝亲手把兵权分给了自己任命的人，然后又管不住他们，这才是最可笑的地方
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_现代军团__现代军团.json#/Variants/11/Content
  quote_hash: 50777B62185108D4BFF68AE39CD077FB40CDB44388EAE4840D44391F92089B12
  quote: 帝国人的皇帝把兵权分了，却没能让那些执政官继续听他的话，这算什么改革
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_现代军团__现代军团.json#/Variants/4/Content
  quote_hash: D22E55473942E87A34092D90788387BD907ED7175448D9F58FD38A342ACC14E3
  quote: 说白了就是让有钱的老爷们自己养打手
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_现代军团__现代军团.json#/Variants/4/Content
  quote_hash: C5DA7428A8E426F789A2B39850EC6819CB4BCD73B8EA04FAF7A1087EB84F9414
  quote: 坏处是这些老爷们手里的刀越来越快
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_现代军团__现代军团.json#/Variants/5/Content
  quote_hash: D05651F827F245433834491576446E5B9ADE50D964C08CC79752D703DED0B063
  quote: 当每个执政官都拥有只听命于自己的军队时，皇权就成了一个空壳
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_现代军团__现代军团.json#/Variants/6/Content
  quote_hash: D8EAAA717585EFE8F785C9F311A74820D6DCF1917BE9A4AE5CF0C2C7A750211D
  quote: 改革省下来的钱，最后都变成了内战的军费
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_现代军团__现代军团.json#/Variants/12/Content
  quote_hash: F28975CEA7CBB8761E7B6CED3D69E8CA78A978C7984A929099D9813DFBB71696
  quote: 现在执政官们互相打仗，谁都需要人手，只要你有兵，不愁没雇主

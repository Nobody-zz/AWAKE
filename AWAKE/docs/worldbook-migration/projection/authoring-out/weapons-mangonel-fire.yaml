      locator: rules/rule_火焰投石车__火焰投石车.json#/Variants/1/Content
      quote_hash: CBC51B4880767EEA06C6251C6EABA903A25DB4E4526820C20BAE6203CD2074EA
      quote: 一颗火球打下来，对面士气就垮一道。攻城攻的是墙，也是意志。火焰投石车两样都能砸碎

    text:
      zh-CN: 火焰投石车是投石车的火攻型号：发的是装满帝国火的罐子，砸下去会爆燃，能有效摧毁对方的围城器械，也能破坏城墙。它跟普通投石车长得一样，区别全在弹药上——开花弹太贵，也没有存货，现烧现装现打。

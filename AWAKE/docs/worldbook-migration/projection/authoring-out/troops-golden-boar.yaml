  expressions:
  - id: expr.golden-boar-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 黄金野猪？那不就是瓦兰迪亚自家的后生嘛。当兵的回来种地种不住，出去卖命换钱，有什么好说的。他们闹是闹了点，可哪回打完仗不是他们先回镇子上喝酒花钱？酒馆老板、铁匠铺，谁不赚他们的银子？再说了，他们在外头打的是咱们的旗号，名声越凶，别国的人就越怕咱们瓦兰迪亚人。
    sources:

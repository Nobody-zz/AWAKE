- id: assertion.weapon-armor-hands-2
  revision: 1
  kind: fact
  text:
    zh-CN: 填充护手是另一路：拿纳缝的厚布做成连指手套或护臂，护值七到十八，比皮轻、比布厚，是弓手与辅兵最常配的一档。

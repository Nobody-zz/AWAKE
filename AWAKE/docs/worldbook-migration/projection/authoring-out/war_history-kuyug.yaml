- id: assertion.kuyug-3
  revision: 1
  kind: interpretation
  text:
    zh-CN: 在库赛特之外，库由格是两种典型评价：斯特吉亚人说他是个投机了一辈子、最后死于非命的人——抢库吉特人的奥通加德是趁人之危，建小汗国又守不住是志大才疏，联姻本已给足面子，偏偏他运气差到极点；帝国人说他的一生就是一连串的赌博，有赢有输，最后他赌了最大的一把——用接班人的婚事换和平，结果把这把赌输了。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war3

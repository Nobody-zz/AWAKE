  - id: expr.banner-knight-foe-soldier-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 跟方旗骑士打过一场，他们没正眼看我们，集中冲中路。我们的人从侧面射箭过去，箭打在他们甲上弹开了，他们理都不理，只顾往前碾。马撞进步兵阵里的时候，我感觉地面往下沉了一下，然后就是断枪杆子和惨叫。帝国人说方旗骑士纪律差，我看是屁话——冲锋纪律差能把我中路砸穿？他们差的是冲完以后的纪律。

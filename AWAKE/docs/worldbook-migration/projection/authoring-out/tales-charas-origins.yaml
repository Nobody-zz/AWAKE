assertions:
- id: assertion.tale-charas-origins-1
  revision: 1
  kind: interpretation
  text:
    zh-CN: 帝国历史传统把沙拉斯湾解释为卡拉德先祖登陆的摇篮。
  sources:
  - source_id: source.calradia.chronicle.shalas-bay
    source_version: download-20260903
    source_content_hash: 94cfdb418327b295dbd00bd4a97b937e329265c3c1c67ef25c75500a7e80b99b
    locator: chronicle-shalas-bay.txt#/Variants/1/Content
    quote_hash: 74F16884C38BA32EC0EA9F57A6459B6ED5ADF2E82C0ADC9FED6156DF747DF82F
    quote: 这句话在帝国的史书里写着，在元老院的颂词里念着
  expressions:
  - id: expr.tale-charas-origins-1
    revision: 1
    layer: detail
    text:
      zh-CN: 帝国的史书里，这片湾被唤作帝国的摇篮：按史书的说法，卡拉德人的先祖正是从南部群岛渡水而来，头一回在北岸的沙拉斯踏上这片大陆。史书、颂词、老贵族的家训都这么讲。
    sources:
    - source_id: source.calradia.chronicle.shalas-bay
      source_version: download-20260903
      source_content_hash: 94cfdb418327b295dbd00bd4a97b937e329265c3c1c67ef25c75500a7e80b99b
      locator: chronicle-shalas-bay.txt#/Variants/1/Content
      quote_hash: 74F16884C38BA32EC0EA9F57A6459B6ED5ADF2E82C0ADC9FED6156DF747DF82F
      quote: 这句话在帝国的史书里写着，在元老院的颂词里念着
    grants:
    - profile_id: profile.notable
      scope: regional
      min_detail: detail
    denies: []
- id: assertion.tale-charas-origins-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 先祖从群岛渡海登陆的故事，只在传闻里流传，无从查考。
  sources:
  - source_id: source.calradia.chronicle.shalas-bay
    source_version: download-20260903
    source_content_hash: 94cfdb418327b295dbd00bd4a97b937e329265c3c1c67ef25c75500a7e80b99b

  - id: expr.druzhinnik-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我手下的亲卫骑兵，每一个都是从我的瓦良格里一步步升上来的。从步兵到骑兵的跨越不只是身份上的，也是本事上的。我亲手把缰绳交给他们，因为他们在战场上证明了自己。他们的装备是我出钱置办的，战马是我马场里最好的。在战场上，他们就是我最硬的拳头。
    sources:
    - source_id: source.calradia.game.lore.war3
      source_version: bannerlord-1.3.15.110062
      source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07

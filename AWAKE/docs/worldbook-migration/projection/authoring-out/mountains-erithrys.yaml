      zh-CN: 洛泰挨着山根，打帕拉人的山堡过来的，旧名洛塔什——帝国当年为了它动过刀兵，萨拉庇俄斯一把火把旧城烧了个干净。如今谷里的麦子打这儿上船，往南一船一船地走。

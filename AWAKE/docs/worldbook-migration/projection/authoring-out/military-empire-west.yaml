- id: assertion.west-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 外族对西帝国的判断集中在两点：一是人多、粮多、马多，打仗靠人多堆上去——不像巴旦尼亚人那样一个能打好几个，也不像瓦兰迪亚人那样冲起来不要命，但将领多、分工细，「你打不进去就是打不进去」；二是它地势平坦利于大军团展开，却防线过长——西面与瓦兰迪亚接壤，北面直面巴旦尼亚的山地侵袭，东面则是南北帝国的角逐场，应对多线压力全靠中原的粮食与人口撑起一支庞大的常备野战军。
  sources:

  - id: expr.weapon-armor-cape-fur-battania-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我们这边看披什么认人：狼皮是猎手，熊皮是敢跟熊对着干的，豹皮是南方来的东西，多半是换的。披兽皮不单为暖，是给别人看的——部里议事的场合，谁披着什么，话就重几分。

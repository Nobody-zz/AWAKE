summary:
  zh-CN: 勒芒塔尔位于埃伯半岛的群山之中，陡坡上长满直耸的云杉与冷杉；村民用陷阱捕猎貂、兔、狐狸等毛皮兽。这片荒僻之地近来吸引了许多新定居者，他们为林中的自在而来，瓦兰迪亚贵族在此地的管束也比南方宽松不少。

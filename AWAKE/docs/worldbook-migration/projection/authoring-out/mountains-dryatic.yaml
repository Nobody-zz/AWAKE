  - id: expr.mountain-dryatic-breadbasket-summary
    revision: 1
    layer: summary
    text:
      zh-CN: 山溪把沃土冲下山坡，谷里的麦子养活半个北帝国——人家管这叫帝国北方的粮仓。坡上还放牛放马，军马场的马种就出在这儿。

- id: assertion.town-poros-3
  revision: 1
  kind: rumor
  text:
    zh-CN: 据人们说，列奥尼帕得斯从不干涉纷争，除非争斗双方都请他们裁决；而一旦裁决下达，人人服从。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_ES3
    quote_hash: AA99EC3B6C96D948560482B56A5A3BEF491A97BE04FD0B7A27ED1FFF494C01D3
    quote: 据人们说，列奥尼帕得斯从不会干涉这样的纷争，除非争斗的双方都邀请他们进行裁决。
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_ES3
    quote_hash: C01F61A75C1DFB4E99F3B7A00CC32D927D1170B30FA6A66E4B8E142320CFAF9A
    quote: 然而一旦他们下达了裁决，所有人都会对其表示服从。
  expressions:
  - id: expr.town-poros-3-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 都说波罗斯的贵族不管打架，除非两边都请他们断。可断下来的话，没人不认。

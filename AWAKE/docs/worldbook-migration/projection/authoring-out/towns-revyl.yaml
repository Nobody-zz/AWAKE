- id: assertion.town-revyl-3
  revision: 1
  kind: fact
  text:
    zh-CN: 这场争端后经条约与联姻了结，结局算是和乐；但雷维尔人至今仍憎恨巴尔加德扶摇直上的贡达罗夫王朝。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_S7
    quote_hash: 6972A341043BD34556A9040C786FC6D81410A53C0BB60FD8D4F12EF24AF98649
    quote: 这场争端后来通过一系列的条约和联姻解决了，也迎来了其乐融融的结局，但雷维尔人依旧对巴尔加德扶摇直上的贡达罗夫王朝心怀憎恨。
  expressions:
  - id: expr.town-revyl-3-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 雷维尔与巴尔加德后来是和了——条约、联姻，账面上都清了。可逢着贡达罗夫家又往上走一步，这边的脸色就不好看。
    sources:

  - id: expr.vaegir-guard-empire-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 维基亚卫队是帝国最特殊的一支部队。说来讽刺——皇帝最信任的护卫，竟然全是从北方招募来的外族蛮子。但这也正是他们的价值所在：帝国的将军们各有派系，元老们各怀鬼胎，只有这些拿钱卖命的外族人，除了皇帝本人之外谁也不认。他们沿袭了古帝国的一项传统：从边疆以外的蛮族中招募最精锐的战士充任皇帝亲卫。缺陷也显而易见——当皇帝本人消失，这些外族护卫既失去了效忠的对象，也失去了存在的合法性。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

    revision: 1
    layer: rumor
    text:
      zh-CN: 咱山里的盔，两边是两片垂下来的铁护着耳朵。别处的盔不这么做，他们嫌重、嫌挡耳朵听令。我们在林子里打，四面八方都可能有斧子过来，耳朵不能豁着。

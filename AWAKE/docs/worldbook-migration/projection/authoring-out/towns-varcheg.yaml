  - id: expr.town-varcheg-1-b-sturgia
    revision: 1
    layer: rumor
    text:
      zh-CN: 卡恰尔半岛是我们斯特吉亚东边的大门。从伊卡拉荒原往西走，地势越走越窄，最后就变成了那条怪石嶙峋的长条，硬生生插进海里。北边是诺德人的地盘，南边是巴旦尼亚人的老窝，我们卡在中间，守着两条海路。当年瓦尔切格那件事，我们的祖先就是被诺德人和巴旦尼亚人之间的烂账给卷进去的——他们互相咬，最后把肉送到了我们嘴里。现在半岛上的城镇是我们的，但石头底下埋着的历史不是。走在那些海崖上，风里还能闻到诺德人的长船和巴旦尼亚人的篝火的味道。
    sources:
    - source_id: source.calradia.chronicle.animusforge
      source_version: animusforge-20260912
      source_content_hash: 407C6E6DCA55C8EC47104C4F29489DDE7BCB991298B50BD99DA57503ABA171B2

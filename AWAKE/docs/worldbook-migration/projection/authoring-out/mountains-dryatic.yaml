id: doc.geography.mountains-dryatic
title:
  zh-CN: 德律亚山
  en: Dryatic Mountains
status: needs_review
domain: geography
subdomain: terrain
universe: awake_current
era:
  key: current
  certainty: bounded
content_tier: base
aliases:
  zh-CN:
  - 德律亚山
  - 德律亚山脉
  en:

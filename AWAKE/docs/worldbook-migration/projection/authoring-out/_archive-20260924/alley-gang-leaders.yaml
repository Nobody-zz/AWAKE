summary:
  zh-CN: 一条巷子得有人管着。官面上叫他帮派头目，巷子里的居民却常叫他「守护者」。
registry_bindings:
  profile_registry_version: 1.0.0
  profile_registry_hash: 309D10583E7B4AF05F28DE2C2E67A2528CB3D6C45752369C0F7D160FABC3F3A5
  referral_registry_version: 1.0.0
  referral_registry_hash: 6E17075F1F967BE28C0437121DB50E5C30809C4EFC3D2A5F22AD9BB0B3B926CD
sources:
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.ClyaDhGU
  quote_hash: 035C3993A0A92713564CEB583C53C5DC597C530EBF78B3111339852AC9CA729F
  quote: 更改巷子头目
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.LjkQ4fYp
  quote_hash: 9E9F07F1716513671AC422F33A90BB213B52B4162585E695C6EF30418B2C8ACA
  quote: 我来自一座城镇，那里每条巷子都有自己的“守护者”。这些守护者都有点能量，而且很受人尊敬，他们为当地人的公道挺身而出。我父亲就是我们那条巷子的守护者，于是在他年龄大了，不能亲力亲为之后，我就继承了他的衣钵。
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.PWpTT0NM
  quote_hash: 4D9A75D71F5CEF3974614A50671CA1B0E96CB9EF18A995B8011BF437FFB53050
  quote: 我告诉队长我做不了这种事。这巷子里的居民，我得让他们信任我才行。可队长不接受任何异议，他逼我就范，还威胁我的父亲。我能怎么办？我不能背叛我的族人，但也不能背叛自己的父亲。于是我只好举家逃难。
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.hnhKJYbx
  quote_hash: 7CAD2D291264358EF7A2713F06C78D46CCBD36D47CB1F7950DC1183556CF0D1A
  quote: 你没有合适的家族成员安排到这条巷子。（{ROGUERY_SKILL}技能{NEEDED_SKILL_LEVEL}及以上，{TRAIT_NAME}特质{MAX_TRAIT_AMOUNT}及以下）
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.KjuxDQfn
  quote_hash: 1863E2D4885916AB0D9C0C8EF2F5E424DD960CAD04B966BD0EFF3CC6C79262E6
  quote: 巷子头目死了。
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.FzbeSkBb
  quote_hash: 5C22D475FB9755D2B8D40D1E75C6EC43B28710C1F3C26A5C56DBD1FB1B9BCE64
  quote: 你的一条巷子失去了它的头目或缺乏士兵，它将在{DAYS}天过后被放弃。如果你想保留它，你可以在家族界面中指派一名新的家族成员，或者前往该巷子增加士兵。任何留在巷子里的士兵都会在它被放弃时丢失。
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.P5UbgK4c
  quote_hash: 58CE47D6B30A612A5D3D396FBBEB5E54009A1FF35B19DE8FAF68771391E317F9
  quote: '{CLAN_MEMBER.NAME}曾掌管着这条巷子，现在{?CLAN_MEMBER.GENDER}她{?}他{\?}已经死了。巷子将在{REMAINING_DAYS}天之后被遗弃，除非能指派新的监督人过去。'

  expressions:
  - id: expr.battania-empire-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 巴旦尼亚的军事制度在我们看来就是原始的部落动员。他们没有常备军团，没有统一的后勤补给，打起仗来全靠至高王的面子去请各个部落出兵。但就是这种原始制度，在潘德拉克让我们吃了大亏。他们的弓箭手在林子里神出鬼没，我们的重步兵一进森林就被射成刺猬。他们还有一种叫长镰兵的突击步兵，等我们阵型被箭雨打乱后从侧翼冲上来，杀伤力极强。潘德拉克那天，长镰兵进入战斗后我们的阵线就崩溃了。

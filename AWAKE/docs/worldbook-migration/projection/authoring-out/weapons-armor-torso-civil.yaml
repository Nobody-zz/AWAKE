  - id: expr.weapon-armor-torso-civil-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 便服按布料与染工论价。素色麻布最贱，一件换几斗粮；染过两遍的格纹布贵一倍；阿塞莱的丝绸长衫是有钱人的东西，一匹料够一户人家吃一冬。护值都在十四以下——穿它是为了体面，不是为了挨刀。

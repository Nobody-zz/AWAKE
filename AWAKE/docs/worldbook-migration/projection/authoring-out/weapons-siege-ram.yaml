  expressions:
  - id: expr.siege-ram-villager-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 攻城槌？就是攻城的时候十几条汉子躲在那木棚子里，推着一根大木桩撞城门的东西。远远看着像条大蜈蚣——顶上有棚，下面全是腿。撞起来哐哐响，几里地外都听得见。城上的人往下浇火油扔石头，可那棚子顶着湿牛皮，不太容易点着。不过撞槌那东西也邪门——有一回我看见一架槌推到半路，城上一桶火油浇透了，一个火把下去，没多会槌和棚子带里面的人全着了，连城门都没摸着。老人说，推槌的是拿命换门。门倒了他们不一定知道，因为门倒之前他们多半已经没了。

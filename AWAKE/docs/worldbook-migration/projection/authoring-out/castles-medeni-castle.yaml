    text:
      zh-CN: 迈代尼堡据峭壁与海之间的低地要口，下辖两处灌溉村；椰枣在堡中晒制囤积，达玛尔河泛期由堡里派人数水、分堤，沿河田亩的租税按淤泥覆盖的厚薄议定。

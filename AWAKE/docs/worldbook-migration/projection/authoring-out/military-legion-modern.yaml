  - id: expr.modern-legion-merc-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 现代军团让雇佣兵的日子好过了不少。以前帝国常备军在的时候，我们只能打打边角料。现在执政官们互相打仗，谁都需要人手，只要你有兵，不愁没雇主。那些被遣散的老军团兵，有的混得比我们还好，毕竟人家是正规军出身，雇主更信任。

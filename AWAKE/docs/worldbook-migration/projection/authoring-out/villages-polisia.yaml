  - id: expr.village-polisia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 波利西亚以潟湖盐为主产——盐田靠沙嘴内涝、晒取成盐；地处边卡，盐货兼作军情耳目，收盐认水色与盐粒粗细，边境紧张时盐价先动。

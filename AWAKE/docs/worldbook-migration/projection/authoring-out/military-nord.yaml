  quote: 至于骑兵？没有。我们没有马，也不稀罕。马在船上站不稳
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/0/Content
  quote_hash: 48CA8F97206AF6F73111BAE5F66005A4C485C84211A8582633E924E2463BA1B2
  quote: 诺德林子不长好制弓的木料，弓软，射不远
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/0/Content
  quote_hash: 2B75C3F18F912516DFDA9579170C1B78ACEAD83A309D0BF61E1FC83D3338A48C
  quote: 长船能把整支军队送到敌人屁股后面，等他们反应过来，滩头已经站满了拿斧子的人。这才是诺德人的打法
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/0/Content
  quote_hash: 3935B57864D1B3DA113D37A387F8AA7E1900A8F78EEF89C45473A9BE109926E4
  quote: 我们的仗是在滩头和峡湾里打的，不是在大平原上列队冲锋的
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

- id: assertion.town-poros-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 牧民们以骄傲而暴力闻名；统治此地的列奥尼帕得斯家族，贵族们小心地尊重他们的自治。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_ES3
    quote_hash: ED64CAAA3D3BDE1CD38688AE634EC311650665DF905D2FEF0481D268FBCBECD4
    quote: 牧民们有着骄傲而暴力的名声，而统治当地的列奥尼帕得斯家族的贵族们也小心地尊重他们的自治。
  expressions:
  - id: expr.town-poros-2-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 列奥尼帕得斯家在波罗斯不硬来——牧民的名声摆在那儿，硬来的代价他们算得清。
    sources:
    - source_id: source.calradia.game.settlements-desc
      source_version: bannerlord-1.3.15.110062
      source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
      locator: bannerlord.settlements#town_ES3
      quote_hash: ED64CAAA3D3BDE1CD38688AE634EC311650665DF905D2FEF0481D268FBCBECD4

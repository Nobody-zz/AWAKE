- id: assertion.desert-nahasa-2
  revision: 1
  kind: fact
  text:
    zh-CN: 阿塞莱人是纳哈撒的居民：游牧的贝都因人与绿洲农民的混合，各家族自溯血统于传奇族长，统称巴努·阿塞拉；绿洲种椰枣，家支皆有详尽族谱，以骑术与博识（尤以医学）闻名；贾瓦勒（「漫游者」）是沙漠中主要的贝都因联盟，划地为界向过路商队收保护费，以阿塞莱旧俗的守护者自居。

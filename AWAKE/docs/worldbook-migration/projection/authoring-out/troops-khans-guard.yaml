    text:
      zh-CN: 可汗卫士的箭射不穿我们的盾墙，但能在盾墙上打出窟窿——一个兄弟倒下，旁边的兄弟就得补位，补位的瞬间就是破绽。他们就是靠这种办法慢慢咬，一层一层地剥。我们诺德人更喜欢冲上去用斧头说话，但他们不给你冲的机会。

  zh-CN: 厄诺伊萨坐落在德律亚山脉南部深湖俄佛堤斯——人称大地之眼——的岸边；北方来的充足降水润泽着这里的小麦。传说此处是古帕拉人的圣地，他们视这片湖为通往另一个世界的门户。

  text:
    zh-CN: 投石车是基于扭力蓄能原理的重型抛射装置：核心部件为扭力束与抛射臂，扭力束采用畜力筋腱或发绳绞合，蓄能密度稳定。它通过扭转绳索将石头抛掷出一定距离，对城墙、敌方围城器械及其操作员均有效；实心球弹的毁伤逻辑是动能集中释放，对攻城塔的轴接点和弩炮的轻型木架有一次性摧毁能力；葡萄弹则是锥形散布，适合清扫敌方工事表层和密集步兵。主要技术瓶颈在于蓄能周期过长——绞盘需多人协同操作，射速极限无法突破；整机太重、运输太难，这本身就是硬限制。

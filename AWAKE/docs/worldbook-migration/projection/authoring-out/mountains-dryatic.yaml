- id: assertion.mountain-dryatic-3
  revision: 1
  kind: fact
  text:
    zh-CN: 山中犹存帕拉遗风：东北部山嘴下的林农仍说帕拉语——帝国到来之前此地诸部落通行的语言；德律亚山南部的深湖「大地之眼」俄佛堤斯被传为古帕拉人的圣地，他们相信湖水是通往另一个世界的门户。
  sources:
  - source_id: source.calradia.game.settlements.geography2
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
    locator: bannerlord.db#localization.Settlements.Settlement.text.village_EN4_4
    quote_hash: 58B3193F50FE3EDA52766620EE0C3BB655EB87073415DEAADED6969472E47179
    quote: 赫塔尼亚坐落于德律亚山脉东北部的一个山嘴下。同这附近的许多村庄一样，当地的林农依然说着帕拉语。在帝国入侵之前，帕拉语是这里各部落所说的语言。
  - source_id: source.calradia.game.settlements.geography2
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
    locator: bannerlord.db#localization.Settlements.Settlement.text.village_EN3_1
    quote_hash: 87139DB7B9BF01C9D51E90B55A106DA8FCFD5EEA96AD9D99CD750D68708850A3
    quote: “大地之眼”俄佛堤斯，德律亚山脉南部山区的一片深湖，岸边就是厄诺伊萨。从北方来的充足降水润泽着这里的小麦。传说此处是古帕拉人的圣地，他们认为这片湖是通往另一个世界的门户。
  expressions:
  - id: expr.mountain-dryatic-palaic-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 山里有些村子，林农开口还是帕拉话——帝国来了这么多年，山里人舌头没换。「大地之眼」那片深湖，老话说是通另一个世界的门，是老辈帕拉人的圣地。
    sources:

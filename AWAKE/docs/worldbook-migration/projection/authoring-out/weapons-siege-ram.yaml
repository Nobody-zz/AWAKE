  - id: expr.siege-ram-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 攻城槌是围城战里最踏实的东西。实在，不花哨，一根硬木包铁，几根柱子撑个棚，推到城门下一门心思撞。弩炮打人不打墙，投石车砸墙但得看准头，攻城塔太高太招风——攻城槌不需要准头，也不需要运气，撞就完了。城门是死东西，铁闩再粗，木头再厚，撞够次数迟早开。但我心里有本账：城门后头是什么？有时候是第二道门，有时候堆满了碎石头。这时候槌手全暴露在他们城墙上弩手的射界里，退都退不了。攻城槌赌的是城门后头没有准备——赌赢了，城门一倒，骑兵冲进去，围城结束；赌输了，槌手全搭进去。
    sources:

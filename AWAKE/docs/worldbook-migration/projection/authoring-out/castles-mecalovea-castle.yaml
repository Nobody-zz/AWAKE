  - id: expr.castle-mecalovea-castle-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 墨卡罗维亚堡据伽尔喀斯瀑布峭壁，下辖矿村与林边村各一；瀑布冲出的矿石在堡中初选、外运，弥戎河与伽尔喀斯河汇流处的渡口由堡里设卡，边民往来的契据须经堡中盖印。

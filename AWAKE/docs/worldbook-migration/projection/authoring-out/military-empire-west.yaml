  - id: expr.west-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 西帝国占据中原腹地，地势平坦，利于大军团展开，但也有防线过长的隐忧：西面与瓦兰迪亚接壤，北面直面巴旦尼亚的山地侵袭，东面则是南北帝国的角逐场。他们应对多线压力靠的是中原的粮食与人口，维持一支数量庞大的常备野战军，随时能在任一方向集结优势兵力。只要中原的麦子还在收，西帝国的战争机器就不会停转。

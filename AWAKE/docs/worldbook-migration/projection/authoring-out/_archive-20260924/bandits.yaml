  - id: expr.bandits-summary
    revision: 1
    layer: summary
    text:
      zh-CN: 沙漠里那些不一样。他们原先是正经的扈从，骑好马、穿铜甲，在部落里有人叫得出名字；不肯低头去给人当奴隶兵，就骑着马进了沙丘。有人恨他们，也有人暗地里羡慕他们。

assertions:
- id: assertion.weapon-armor-shield-round-1
  revision: 1
  kind: fact
  text:
    zh-CN: 圆盾是一整块木头旋成形、再在中心加一块铁凸。它比筝形盾好做、也比筝形盾便宜：一整块料旋出来，中间加铁凸就是全部工序。直径多在六十到一百三十之间；另有一路椭圆盾，比圆盾抻长得多，归在大盾那一档。这一路二十八件，耐久二百一十五到五百四十，护值零到九——多数是零或一，重型圆盾与大圆盾那几只到九。

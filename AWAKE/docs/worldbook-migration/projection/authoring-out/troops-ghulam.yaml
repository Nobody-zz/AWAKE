    text:
      zh-CN: 古拉姆的故乡达西，曾经是我们的邻居。在库赛特人还没崛起的时候，达西的帕提沙统治着一个与帝国南部接壤的强大王国，他们的骑兵让帝国的边防军吃过不少苦头。但库赛特人来了，把达西的土地一块一块抢走，那些地方如今变成了库赛特汗国的南部行省，夹在我们和阿塞莱之间。那些不愿臣服的达西武士流落四方，组建了古拉姆，靠当雇佣兵维生。说来讽刺，曾经的敌人，如今成了战场上最可靠的佣兵。

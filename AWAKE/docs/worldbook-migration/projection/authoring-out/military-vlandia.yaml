  - id: expr.military-vlandia-empire-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 瓦兰迪亚人厉害，厉害在哪说不清。杰屈朗那档子事倒是听说过。可要说帝国比不过他们——那不能。
    sources:

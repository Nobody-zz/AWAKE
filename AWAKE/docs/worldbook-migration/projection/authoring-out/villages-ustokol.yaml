  - id: expr.village-ustokol-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 乌斯托科以耐寒牛群为业——风大草短、牛只耐役；牛按膘情与耐力分等，海藻当荒年添料，肉奶自用、余牛与皮张走湾内船运。

  quote: 最优秀的骑士将被授予“方旗骑士”的称号
- source_id: source.calradia.game.lore.war1
  source_version: bannerlord-1.3.15.110062
  source_content_hash: f6ee4a2afa309b794f12fddbb3c185c94500071365f74cd7655aede539ed3b56
  locator: bannerlord.db#localization.1Ww5lg6I
  quote_hash: C7369787337D4CACAFFBAF9F425C5662671187225A93E53E736FE5D7DD1E5504
  quote: 第一批瓦兰迪亚人来自海外，他们是雇佣兵和冒险家，语言混杂。帝国雇佣他们保卫边疆，抵御内陆尚未被征服的部落。他们的名字取自于最早的一位军阀，“无畏的”维伦德——卡拉德语里叫瓦兰狄翁——后来他们就被称为瓦兰迪亚人。从阿塞莱荒漠到遥远的大草原，他们的重骑兵所向披靡，一路扫清帝国的敌人。不久，资金短缺的帝国官员们开始用土地补贴和头衔来代替银币，这可不算什么富有远见的政策。瓦兰迪亚人定居、婚配、耕作，并将附近的帝国要塞据为己有。如今他们是一个独立的王国，其传统吸取自卡拉迪亚和他们遥远的故乡。
- source_id: source.calradia.game.lore.war1
  source_version: bannerlord-1.3.15.110062
  source_content_hash: f6ee4a2afa309b794f12fddbb3c185c94500071365f74cd7655aede539ed3b56
  locator: bannerlord.db#localization.3In09YKu
  quote_hash: 419EB1A073638949ED251D09D2A18FD489F78DFCA16E90AB9A57D8181F6312AE
  quote: 每座瓦兰迪亚村庄都有义务为其领主提供征召兵，如果招募人数未达到定额，领主就会来到村里，用武力胁迫带走一些年轻小伙子。贵族们很少会浪费时间和金钱给这些人提供装备或训练，但狡猾的农民还是可以靠掠夺敌人（和友军）的装备，或与更有经验的友军待在一起的方式活下来。
- source_id: source.calradia.chronicle.animusforge.war1
  source_version: animusforge-20260913
  source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
  locator: rules/rule_瓦兰迪亚军事力量__瓦兰迪亚军事力量.json#/Variants/1/Content
  quote_hash: 7FAB26EF5B4F830852A6C284BE61190B021CDAEC55E170F8966D4DB610A2C55B
  quote: 你作为一个瓦兰迪亚人，还是能感觉出来自己国家的军事力量强大
- source_id: source.calradia.chronicle.animusforge.war1
  source_version: animusforge-20260913
  source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
  locator: rules/rule_瓦兰迪亚军事力量__瓦兰迪亚军事力量.json#/Variants/3/Content
  quote_hash: D87FAFBEFF5D97E16679089E3D9E19DB7D382695EB2FBC081DB55F47C58C85BC
  quote: 恐怖的瓦兰迪亚像达摩克里斯之剑一样悬在西方，你清楚的知道他们的所向披靡，所以你害怕他们
- source_id: source.calradia.chronicle.animusforge.war1
  source_version: animusforge-20260913
  source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
  locator: rules/rule_瓦兰迪亚军事力量__瓦兰迪亚军事力量.json#/Variants/4/Content
  quote_hash: 41439EA2DDCCED748DF9E0903AA38AF5018EF22534CB3264AA9D0F1A0ED58995
  quote: 也对瓦兰迪亚在杰屈朗的屠杀有所耳闻。不过，你完全不知道他们为何这么强大
- source_id: source.calradia.chronicle.animusforge.war1
  source_version: animusforge-20260913
  source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
  locator: rules/rule_瓦兰迪亚军事力量__瓦兰迪亚军事力量.json#/Variants/10/Content
  quote_hash: AC45E23B64458CF5FF794E63B18E510369AB4A7F28A9EED786AEE8779F8CC312
  quote: 你知道大陆西端有个瓦兰迪亚，军队很强，似乎骑兵强？还装备了一种叫弩的东西
authority:
  owner: awake_canon
  conflict_policy: canon_wins
assertions:
- id: assertion.military-vlandia-1
  revision: 1
  kind: fact
  text:
    zh-CN: 瓦兰迪亚人源出海外的雇佣兵与冒险家，最初受帝国雇佣保卫边疆；今其军力以骑兵与弩手立国：贵族子弟自备武器战马组成骑士部队，最优秀者授「方旗骑士」，骑竞技马冲阵，唯一克星是帝国具装骑兵；平民骑兵配罗瓦尔出产的瓦朗比骏马，与贵族骑兵相互配合。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war1
    source_version: animusforge-20260913
    source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
    locator: rules/rule_瓦兰迪亚军事力量__瓦兰迪亚军事力量.json#/Variants/0/Content
    quote_hash: F4F3FBB2CAA9654864656AF2544760C57AFB91C0C93DF60F65B2074E13F0D2D9
    quote: 最优秀的骑士将被授予“方旗骑士”的称号
  - source_id: source.calradia.game.lore.war1
    source_version: bannerlord-1.3.15.110062
    source_content_hash: f6ee4a2afa309b794f12fddbb3c185c94500071365f74cd7655aede539ed3b56
    locator: bannerlord.db#localization.1Ww5lg6I
    quote_hash: C7369787337D4CACAFFBAF9F425C5662671187225A93E53E736FE5D7DD1E5504
    quote: 第一批瓦兰迪亚人来自海外，他们是雇佣兵和冒险家，语言混杂。帝国雇佣他们保卫边疆，抵御内陆尚未被征服的部落。他们的名字取自于最早的一位军阀，“无畏的”维伦德——卡拉德语里叫瓦兰狄翁——后来他们就被称为瓦兰迪亚人。从阿塞莱荒漠到遥远的大草原，他们的重骑兵所向披靡，一路扫清帝国的敌人。不久，资金短缺的帝国官员们开始用土地补贴和头衔来代替银币，这可不算什么富有远见的政策。瓦兰迪亚人定居、婚配、耕作，并将附近的帝国要塞据为己有。如今他们是一个独立的王国，其传统吸取自卡拉迪亚和他们遥远的故乡。
  - source_id: source.calradia.game.lore.war1
    source_version: bannerlord-1.3.15.110062
    source_content_hash: f6ee4a2afa309b794f12fddbb3c185c94500071365f74cd7655aede539ed3b56
    locator: bannerlord.db#localization.3In09YKu
    quote_hash: 419EB1A073638949ED251D09D2A18FD489F78DFCA16E90AB9A57D8181F6312AE
    quote: 每座瓦兰迪亚村庄都有义务为其领主提供征召兵，如果招募人数未达到定额，领主就会来到村里，用武力胁迫带走一些年轻小伙子。贵族们很少会浪费时间和金钱给这些人提供装备或训练，但狡猾的农民还是可以靠掠夺敌人（和友军）的装备，或与更有经验的友军待在一起的方式活下来。
  expressions:
  - id: expr.military-vlandia-knight-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 瓦兰迪亚的老爷们打仗靠的是自家的马和甲：贵族子弟自备武器战马从军，最出色的授「方旗骑士」名号——骑竞技马，速度慢些但下盘稳，冲起阵来无坚不摧，全大陆只有帝国的具装骑兵是他们的对手。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1
      source_version: animusforge-20260913
      source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
      locator: rules/rule_瓦兰迪亚军事力量__瓦兰迪亚军事力量.json#/Variants/0/Content
      quote_hash: F4F3FBB2CAA9654864656AF2544760C57AFB91C0C93DF60F65B2074E13F0D2D9
      quote: 最优秀的骑士将被授予“方旗骑士”的称号
    - source_id: source.calradia.game.lore.war1
      source_version: bannerlord-1.3.15.110062
      source_content_hash: f6ee4a2afa309b794f12fddbb3c185c94500071365f74cd7655aede539ed3b56
      locator: bannerlord.db#localization.1Ww5lg6I
      quote_hash: C7369787337D4CACAFFBAF9F425C5662671187225A93E53E736FE5D7DD1E5504
      quote: 第一批瓦兰迪亚人来自海外，他们是雇佣兵和冒险家，语言混杂。帝国雇佣他们保卫边疆，抵御内陆尚未被征服的部落。他们的名字取自于最早的一位军阀，“无畏的”维伦德——卡拉德语里叫瓦兰狄翁——后来他们就被称为瓦兰迪亚人。从阿塞莱荒漠到遥远的大草原，他们的重骑兵所向披靡，一路扫清帝国的敌人。不久，资金短缺的帝国官员们开始用土地补贴和头衔来代替银币，这可不算什么富有远见的政策。瓦兰迪亚人定居、婚配、耕作，并将附近的帝国要塞据为己有。如今他们是一个独立的王国，其传统吸取自卡拉迪亚和他们遥远的故乡。
    grants:
    - profile_id: profile.noble
      scope: elite
      min_detail: detail
    - profile_id: profile.merchant
      scope: faction
      min_detail: detail
    denies: []
  - id: expr.military-vlandia-levy-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 每座瓦兰迪亚村庄都有为领主提供征召兵的义务，定额不满，领主会亲自进村强行带人。贵族老爷很少花钱给这些庄稼汉置办装备——所以后来才有了弩：训练几天就能上阵的武器。
    sources:
    - source_id: source.calradia.game.lore.war1
      source_version: bannerlord-1.3.15.110062
      source_content_hash: f6ee4a2afa309b794f12fddbb3c185c94500071365f74cd7655aede539ed3b56
      locator: bannerlord.db#localization.3In09YKu
      quote_hash: 419EB1A073638949ED251D09D2A18FD489F78DFCA16E90AB9A57D8181F6312AE
      quote: 每座瓦兰迪亚村庄都有义务为其领主提供征召兵，如果招募人数未达到定额，领主就会来到村里，用武力胁迫带走一些年轻小伙子。贵族们很少会浪费时间和金钱给这些人提供装备或训练，但狡猾的农民还是可以靠掠夺敌人（和友军）的装备，或与更有经验的友军待在一起的方式活下来。
    grants:
    - profile_id: profile.noble
      scope: elite
      min_detail: detail
    denies: []
- id: assertion.military-vlandia-2
  revision: 1
  kind: fact
  text:
    zh-CN: 外族对瓦兰迪亚军力的观感分野鲜明：瓦兰迪亚平民只觉本国强大；巴旦尼亚人视之为悬在西方的达摩克里斯之剑；帝国人闻杰屈朗之屠而不知其强在哪、仍自信帝国更强；远东士兵只模糊知道西端有个骑兵强、装备弩的国度。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war1
    source_version: animusforge-20260913
    source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
    locator: rules/rule_瓦兰迪亚军事力量__瓦兰迪亚军事力量.json#/Variants/1/Content

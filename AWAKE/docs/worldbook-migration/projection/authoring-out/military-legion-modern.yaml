  - id: expr.modern-legion-soldier-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 阿雷尼科斯改革之后，我们这些当兵的就看运气了。跟对了执政官，军饷照发，待遇还不错；要是你的雇主穷了或者倒了霉，你就得另寻门路。不像以前，大家都是帝国兵，上面是皇帝和元老院。现在嘛，上面是哪个大老爷，你就得看哪个大老爷的脸色。

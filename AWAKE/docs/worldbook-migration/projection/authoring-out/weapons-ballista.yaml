summary:
  zh-CN: 弩砲：围城战中最务实、最经济的扭力投射器械——结构就三部分（扭力束、箭槽、扳机），制造门槛低，损耗部件可现场替换。能压制城头弓箭手，也可从远处狙杀单兵；但火力密度不够，箭矢质量太大、一百五十米后动能断崖式下跌，对攻城器械的结构破坏更是可以忽略。

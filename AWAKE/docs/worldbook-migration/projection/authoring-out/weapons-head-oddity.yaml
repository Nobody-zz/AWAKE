assertions:
- id: assertion.weapon-head-oddity-1
  revision: 1
  kind: fact
  text:
    zh-CN: 卡拉迪亚有几件说不上是「盔」的护头物。北方有整只兽头做成的头帽——狼首与熊首，套在头上只从兽口处露出脸，护头十六到二十四；它挡刀有限，真正的用处是那副模样本身：对面的人在交手之前就得先看清这是不是个人。
  sources:
  - source_id: source.calradia.game.items-head
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 45887F4A4963E921A9C498B871009749C5B0BD65E1FE8D7B3885E660FDDE0A7F

- id: assertion.weapon-head-oddity-2
  revision: 1
  kind: fact
  text:
    zh-CN: 另一路是在盔顶钉尖刺、在面门上挂面具：尖刺盔护头四十八、面具尖刺盔护头五十一、尖刺锅盔衬链甲护头二十七。冲阵时先惊马，近身时刺棱能挡开斜劈。粗鳞盔则属另一类怪工——以铁鳞拼成壳，护头二十六，是巴旦尼亚山地的粗作。

    revision: 1
    layer: detail
    text:
      zh-CN: 帝国人的现代军团？哼，就是他们皇帝把军队卖给了贵族。听起来和我们瓦兰迪亚的男爵私兵差不多，但人家至少是男爵养兵，国王号令。帝国倒好，执政官们各自养兵，三个皇帝互相打，连个统一号令都没有。

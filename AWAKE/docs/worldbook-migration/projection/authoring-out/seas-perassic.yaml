  text:
    zh-CN: 珀拉斯海（Perassic Sea）是卡拉迪亚南方广阔海域，连接阿塞莱、帝国与瓦兰迪亚的海岸；其水经吕西亚海峡与西海相通，俄耳堤西亚湾与俄里斯托科律斯一线是西大洋方向来的航路要冲。

  - id: expr.village-kargrev-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 卡格雷夫以湾内渔获为业——临静湾、鱼汛密；鱼按大小与鲜度分等，鲜鱼走湾内市集、余货腌藏，旧日堡垒的墙石成了渔家的地基。

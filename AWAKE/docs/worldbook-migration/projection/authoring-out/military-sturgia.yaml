assertions:
- id: assertion.military-sturgia-1
  revision: 1
  kind: fact
  text:
    zh-CN: 斯特吉亚军制建立在波耶私兵与平民动员相结合的基础上：每位波耶维持脱产的职业亲卫队，装备精良、训练有素；战时大公向各波耶发征召令，波耶率亲卫并武装自由民应召；军队核心是重步兵盾墙，辅以轻骑兵袭扰和飞斧投射——既无帝国式军团编制，也不以重骑兵为主，而是以坚固步兵阵线为根本。

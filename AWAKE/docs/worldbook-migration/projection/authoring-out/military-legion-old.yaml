  - id: expr.old-legion-grandfather-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 旧式军团是我们的祖父辈。他们说那支军队打仗的方式和现在完全不一样。以前一个军团从吕卡隆出发，后勤是帝国统一调配的，军饷是国库按时发的，士兵只需要操心一件事：怎么打赢下一仗。现在帝国的军队也不差，但跟旧式军团比起来，总少了那种令人窒息的压迫感——那种一整个军团踩着同一种步伐往前推进时地面都在颤抖的感觉。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913

  zh-CN: 乌里克斯卡拉位于伊勒坦运输线上——那是一张由冰川湖连成的网络，往来的长船可以在拉科尼斯湖与塔奈西斯湖之间拖过去、划过去；村民在浅水里捕带刺的鲈鱼和螯虾，风干后卖给过路的人。

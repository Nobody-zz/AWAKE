  - id: expr.town-balgard-2-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 巴尔加德的开国故事里，贡达尔的功劳不在打，在分——他把死者遗下的武器甲胄均分给当地人，以此换得认可。这故事的底子是：谁分得公平，谁就坐得稳。

- id: assertion.weapon-armor-legs-2
  revision: 1
  kind: fact
  text:
    zh-CN: 绑腿是另一路：拿布条或皮带把小腿缠紧，护值八，看着寒酸，可在山里比靴子管用——缠紧了血不上头，走长路腿不肿。巴旦尼亚的林地绑腿就是这么用的。

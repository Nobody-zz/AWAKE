    layer: detail
    text:
      zh-CN: 阿布·科梅尔堡扼特朗河上游陡岸，下辖酒村与粮村各一；白葡萄酒由堡中窖藏、按坛过货，河湾小麦经水路下运，酿酒与运粮的用工由氏族长老派定。

      quote_hash: 67B493707BE6247FF6B1B01B4809323CA69C4F4A1A751EC0AAC9DE2C72EA2865
      quote: 现在他们家还在北边当大官，听说住在萨涅俄帕，那城可大了，城墙比我们村子的地界还长。

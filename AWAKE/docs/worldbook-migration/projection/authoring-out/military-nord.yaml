- id: assertion.nord-3
  revision: 1
  kind: rumor
  text:
    zh-CN: 对诺德平民来说，军队就是每年被雅尔挑走的最壮的那些人：儿子跟船走了，夏天走的，现在还没回来。他们不懂什么盾墙什么铩戟，只知道北境的男人不死在床上——死在盾墙的缝里，死在滩涂上，死在铩戟柄断了的泥地里。而沿海的村庄记得的是另一种账：半夜船靠岸，天亮前把半个村都烧了，抢完就上船走了；后来官府在沿海修了瞭望塔，抢的次数少了，但怕还在——不是怕他们赢，是怕他们突然来。
  sources:

- id: assertion.banner-knight-3
  revision: 1
  kind: interpretation
  text:
    zh-CN: 「方旗骑士单挑不弱，弱在纪律」——这是帝国具装骑兵与瓦兰迪亚自家领主都说出口的评语。帝国的说法是：个人素质不比自己人差，但方旗骑士冲起来是各人看情况自己加的速度，冲到后半段队形就散，散的缝隙就是突破口。自家领主的说法是「刀太快了容易割自己手」，并拿潘德拉克做注脚——带着一帮方旗骑士追轻步兵，追到最后被帝国具装骑兵反冲。敌方步兵则只认一件事：甲比盾厚，骑枪快如闪电，中路被砸穿过。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
    locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/7/Content
    quote_hash: 82A115BAD6ADBF3A721EECDEAE0CDCA6FAA072FBD763B7EE23C76408A1E56065
    quote: 但他们有个致命的毛病：纪律
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
    locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/7/Content
    quote_hash: 608BE674B37F6F368FB1314A39DD120DD8DBB3713B02C0F223DEF281AD330571

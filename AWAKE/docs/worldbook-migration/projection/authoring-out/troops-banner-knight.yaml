- id: assertion.banner-knight-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 「铁人」是平民对方旗骑士的印象：村户若出一个方旗骑士，是祖坟冒青烟的事；他们过街时没人敢正眼看——不是怕挨鞭子，是那铁蹄子万一磕着，一下就没了。远方商队则给它排过名次：骑兵里第二，第一是帝国骑兵。

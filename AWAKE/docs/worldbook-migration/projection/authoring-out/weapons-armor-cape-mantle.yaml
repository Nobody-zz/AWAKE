- id: assertion.weapon-armor-cape-mantle-2
  revision: 1
  kind: fact
  text:
    zh-CN: 有一路披风是当护具做的：皮护肩与编织垫肩把布换成薄皮或厚毡，护值三四，垫在肩甲底下不硌肉；军团填充扎带一类更是把披挂和填充衣缝在一起。

  - id: expr.weapon-crossbow-khuzait-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 弩不是草原的东西——装填得站地上踩住拉弦，马背上使不上劲。守营门、盯哨位倒能用，可库赛特战士不拿它。

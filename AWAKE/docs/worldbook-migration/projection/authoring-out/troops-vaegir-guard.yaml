  - id: expr.vaegir-guard-veteran-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 我年轻时在吕卡隆见过维基亚卫队换岗。那些北方大汉，一个个高得像铁塔，胡子编成辫子，手里攥着长斧。说实话，站在他们旁边，我们这些帝国兵就像没长大的孩子。但你不能不服——他们步伐整齐，盔甲锃亮，比任何一支帝国军团都精神。先皇信任他们是有道理的。只可惜……后来的事你也听说了。
    sources:

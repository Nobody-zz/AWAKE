    layer: detail
    text:
      zh-CN: 披风按布幅与染工分档，护值都在九以下——它是外披，不是护具。格纹是巴旦尼亚的织法，一格一格对得上才叫好；帝国的重磅斗篷讲究垂，一披下去到脚踝。市上一条素色围巾换两斗粮，染过的要翻倍。

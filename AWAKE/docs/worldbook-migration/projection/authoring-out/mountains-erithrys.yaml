  - id: expr.mount-erithrys-rhotae-battanian
    revision: 1
    layer: rumor
    text:
      zh-CN: 天好的时候，站在高原西南边上，能瞅见远处雪顶闪白光。老辈人有的管它叫黑壁，有的叫白冠——帝国人的粮城在山根下，与我们无干。
    sources:

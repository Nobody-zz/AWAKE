  - id: expr.west-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 西帝国是帝国三分后军事力量最为雄厚的一支，其战争潜力植根于中原。中原是全大陆首屈一指的粮食产区，三片平原连成帝国最大的粮仓。粮食意味着人口，人口意味着兵源——西帝国征兵几乎不存在配额压力，中原农家有多子的传统，参军是土地之外的第二条出路。马匹产量同样可观，乌卡利昂高原南麓与平原牧场提供的坐骑以耐力见长，适合重装骑兵的反复冲击。冶铁业稍显不足，但产地分散不易被切断，加上西海岸商路畅通，铁料补给总体够用。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

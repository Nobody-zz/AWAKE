summary:
  zh-CN: 格纳特·纳尔是巴旦尼亚传说中决斗之地附近的一座村庄，据传纳尔在此留下自己的头颅；村民以出众的护林本领闻名，帮着附近悬崖上的卡·班塞斯要塞抵挡斯特吉亚人和其他掠夺者，守着巴旦尼亚的腹地。

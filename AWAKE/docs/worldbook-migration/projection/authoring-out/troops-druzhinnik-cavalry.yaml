- id: assertion.druzhinnik-3
  revision: 1
  kind: rumor
  text:
    zh-CN: 在斯特吉亚平民眼里，亲卫骑兵是值得让到路边的人：他们不是靠出身，是靠战功从瓦良格一路打上来的，下了马还能列盾墙，跟步兵一样硬；骑的马虽不高大，在北方的雪地里却稳得很。
  sources:
  - source_id: source.calradia.game.lore.war3
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
    locator: bannerlord.db#localization.bdrb4ur3
    quote_hash: 1D462736F24517DB5A4A20D43D449CA2C8BB4ED6A41977AB104A470A0EE2E335
    quote: 斯特吉亚土地上的每一座村庄和城镇都为波耶和王公们提供一支民兵部队。他们在战斗中支援亲卫骑兵，如果他们能脱颖而出，就有希望晋升到亲卫骑兵的行列之中。
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
    locator: rules/rule_斯特吉亚亲卫骑兵__斯特吉亚亲卫骑兵.json#/Variants/4/Content
    quote_hash: 6D3F8C32EB2DFFE8370B0C7776AF49DCEFACF8574530B1ADBD50BB7513C990BB
    quote: 他们是从瓦良格一路打上来的，不是靠出身，是靠战功
  expressions:
  - id: expr.druzhinnik-villager-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 亲卫骑兵大人从街上走过，我们都会让到路边。他们是从瓦良格一路打上来的，不是靠出身，是靠战功。听说他们下了马还能列盾墙，跟步兵一样硬。他们骑的马虽然不高大，但在北方的雪地里稳得很。
    sources:

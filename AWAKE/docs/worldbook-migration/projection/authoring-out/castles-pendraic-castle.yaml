    layer: detail
    text:
      zh-CN: 潘德拉克堡据乌卡利翁北坡临湾高处，下辖养猪村与粮村各一；号角为警、藏畜于山是堡里定的老例，麦田收成除自留外经堡中转，守坡的族人由族长按户轮派。

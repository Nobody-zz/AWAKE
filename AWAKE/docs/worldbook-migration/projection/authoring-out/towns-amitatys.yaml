assertions:
- id: assertion.town-amitatys-1
  revision: 1
  kind: fact
  text:
    zh-CN: 阿弥塔堤斯原为帕拉酋长所据；他与帝国军队起冲突，围城时地震震塌城墙，城破后遭烧杀抢掠，死者多于该酋长亲手所杀。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_EW5
    quote_hash: B88DEFF3A7724492E73CCC5D3E277A0D9528DEEC9992D980B6C79C2961AC00E4
    quote: 他不可避免地和帝国的军队发生了冲突，在围城期间，一场地震震塌了城墙，帝国士兵得以进入城内。
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_EW5
    quote_hash: 5581D94047E3AD788A25729BF34363752258C8CF8D22BD720609988D56C6DF04
    quote: 在接下来的烧杀抢掠中，死去的民众比这位暴君亲手杀的还要多，但这就是战争。
  expressions:
  - id: expr.town-amitatys-1-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 阿弥塔堤斯的城墙是叫地震震塌的，兵从缺口进去。这一场下来，死的人比那酋长生前杀的还多。
    sources:

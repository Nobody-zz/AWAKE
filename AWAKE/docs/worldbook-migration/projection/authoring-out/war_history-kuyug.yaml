  - id: expr.kuyug-empire-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 库由格是草原上典型的投机者。他带着部族从东方来，建了个小汗国没守住。后来潘德拉克会战的时候，我们帝国雇佣了库吉特人当打手，结果他们几乎全灭，库由格就趁着这个机会抢了库吉特人的奥通加德。他的发家史就是一连串的赌博——有赢有输。最后他赌了最大的一把：用接班人的婚事跟斯特吉亚人换和平。结果这把赌输了，把温都勒搭了进去。

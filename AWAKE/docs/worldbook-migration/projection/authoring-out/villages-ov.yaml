  zh-CN: 奥夫是伊卡拉荒原——拉科尼斯湖西北方的森林——里一处较新的斯特吉亚垦殖地；村民起初靠打猎取皮为生，但猎物大多被赶到了森林深处，如今他们改在沼泽林地里种亚麻。

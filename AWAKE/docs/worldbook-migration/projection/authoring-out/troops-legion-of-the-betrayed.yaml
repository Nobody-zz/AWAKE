sources:
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.bhxVA9w7
  quote_hash: C844C912B02C36044764F52975B6861CB5EF007E92DAB1EDEC7E31BCACC0F326
  quote: 皇帝阿雷尼科斯在潘德拉克战役的惨败之后废除了最后一支帝国常备军，转而依赖开销更少、更适合控制领土的执政官私兵，被弃者军团在这样的局势下成立。而这支军团则是由厌恶这种变化的人所组成：他们偏爱昔日的军团，及其规矩、历史与军营生活，他们指责新制度正在摧毁帝国。但无饷不成军，所以他们会同时与帝国领主和外国领主签订契约。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_被弃者军团__被弃者军团.json#/Variants/0/Content
  quote_hash: 6C5C5EB4E0242817CD534F9F573A202EFA3D2E1277CB7BDF71DB55FD512E710A
  quote: 除了打仗我什么都不会。军团解散那年我还年轻，没家，没地，没手艺
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_被弃者军团__被弃者军团.json#/Variants/0/Content
  quote_hash: 84C0A0E022AECB069ACD0EB69FB74F27B2C885CF7C10478801AD4ED63C2BF2A4
  quote: 我们给钱就打仗，雇主的旗号换来换去，我们只认军团的规矩
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_被弃者军团__被弃者军团.json#/Variants/2/Content
  quote_hash: 2D497C1EF91EF17D8A1494CFE2400B81272C0B3F25351004ABF86D6143B69B26
  quote: 用他们是一笔交易：我们出钱，他们出力，仅此而已
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_被弃者军团__被弃者军团.json#/Variants/4/Content
  quote_hash: A0D2B6499082D4AAD9428C86D9E23E273ED007E550A494738C42D9DD2DBB1599
  quote: 我敬他们三分，但不信任他们五分
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_被弃者军团__被弃者军团.json#/Variants/4/Content
  quote_hash: 84DE8C102B1148441660A80876582AAB3A38D407875FCD4DEE308E5DF7DC80AC
  quote: 这样的人，你用得起，但你靠不住
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_被弃者军团__被弃者军团.json#/Variants/3/Content
  quote_hash: 8F5BC875CCF7DBCC27ECEFC8449AA325112EBB62D35B002261BF7C3557CD0F63
  quote: 看着还是军团的样子，但已经不是帝国的兵了
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_被弃者军团__被弃者军团.json#/Variants/1/Content
  quote_hash: 9DEBE11159D326612F3ED067A696FB9D0FF43AF77822845B7A9107C6754E4CAD
  quote: 他们为佣金而战，但他们的魂魄属于那个已经消失的旧日军团
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_被弃者军团__被弃者军团.json#/Variants/1/Content
  quote_hash: 18FA76E7FD70C61F7F92A85A3A7281627A19A8B8C1AC7F4508BB9F7FE2DCA4DB
  quote: 他们的长处是纪律和战阵，短处是只认自己的规矩，不认雇主的
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_被弃者军团__被弃者军团.json#/Variants/5/Content
  quote_hash: C16C6A9ED12C68881CA04FBB23AC86C434677AFFD9F226D6F93EB9AA333CA814
  quote: 规矩比别的雇佣兵严，不太祸害百姓，但也跟谁都不亲近

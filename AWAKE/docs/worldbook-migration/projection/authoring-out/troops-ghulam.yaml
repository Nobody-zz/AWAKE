sources:
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.4TiYXBqK
  quote_hash: 0DD94166CDB2557FB4C4E0FF7586743C0F594D8E6AAC3C2D6F1AB5F76FF487F9
  quote: 古拉姆是一群雇佣兵，他们来自卡拉迪亚南部的部落和远东地区。从法理上来说，他们既是自己的奴隶也是自己的主人：每个人都把自己“卖”给组织，并逐渐成为组织的共同所有者。他们以鲜衣怒马而闻名。但不能因为他们精心打理的头发、身上的香水味和孔雀羽毛饰品，而误以为他们更专注于打扮而非训练。他们的骑射技术无人能及，而使用骑枪的本领仅次于瓦兰迪亚人和帝国具装骑兵。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_古拉姆__古拉姆.json#/Variants/0/Content
  quote_hash: 39945769B9BFC4ADBC47D418547A9A950E840675D570490DD44A2637A49E3984
  quote: 既是自己卖给组织的奴隶，又是组织共同的主人
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.Dxnj5JQE
  quote_hash: F4D5B530DA6476CBF4ACEEF5BF6E1A8A324AF1229C2ABE8376848B9307854E90
  quote: 奥通加德坐落于干燥的德夫赛格高原中央，当地常年干旱，但在春天十分适合放牧。此城由讲达西语的商人建立，商人们从周边的牧民村庄购置马匹、绵羊、牛，并在防备草原掠袭队的护卫陪同下，将其成群结队地赶到西边的帝国市场贩卖，以此获取大量财富。然而，无论是城墙还是雇佣军都没能抵挡住兀儿浑汗的大军，后者将此城授予库吉特部族，以表彰他们的英勇作战。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_古拉姆__古拉姆.json#/Variants/2/Content
  quote_hash: 8B1A5F6661F9962CB1FB01A94B5ED501B48CBE9A17A351C24B09F8AA0D6F1C5E
  quote: 说来讽刺，曾经的敌人，如今成了战场上最可靠的佣兵
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_古拉姆__古拉姆.json#/Variants/4/Content
  quote_hash: 51B42F2FA974FB42F08EDD6F05EC538E9CA9B2F187C21D54F33D17CCF0457994
  quote: 但他们的骑枪冲锋——说来奇怪——颇有我们方旗骑士的风范
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_古拉姆__古拉姆.json#/Variants/7/Content
  quote_hash: 7F55F3E0028CD49D744DB5DDF58BBB61D58C82053DE6A140289905CD4A6D3C44
  quote: 古拉姆的骑射是我们调教出来的——或者说，是我们打出来的
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_古拉姆__古拉姆.json#/Variants/5/Content
  quote_hash: 22FE6231F9FFEBFD38B44DFE66636B21B20708E8470621D24B46036FC15D56DF
  quote: 到了北方的雪地里，他们的马受不了，他们自己也冻得缩成一团
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_古拉姆__古拉姆.json#/Variants/1/Content
  quote_hash: B00B22CDD155734B64F715A52EBB58E331F913095CEF9D9D617EEB8F25E1E9CD
  quote: 身上的香水味老远就能闻到，帽子上还插着孔雀毛，在林子里藏不住
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_古拉姆__古拉姆.json#/Variants/9/Content
  quote_hash: BAAF7D47786F80C5B973361D67FA017C72071FA679D809791092ADA41F68E665
  quote: 我们为黄金打仗，但黄金不是目的，只是手段。只要我们还在马背上，达西就没有亡

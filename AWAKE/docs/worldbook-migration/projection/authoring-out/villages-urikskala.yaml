    layer: detail
    text:
      zh-CN: 乌里克斯卡拉以湖道渔获兼供应为业——临拖船线、客旅不断；鲈鱼与螯虾风干成货，按干湿与成色分等，湖面封冻时转卖存粮与腌货。

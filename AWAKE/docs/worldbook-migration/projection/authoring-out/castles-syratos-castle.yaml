    text:
      zh-CN: 叙拉托斯堡据塔奈西斯湖北岸峭壁，下辖亚麻村与林农村各一；亚麻在堡中沤晒、打成捆外销，橡榉松由湖道运往沿岸城镇，伐木与装船之工由堡里分派。

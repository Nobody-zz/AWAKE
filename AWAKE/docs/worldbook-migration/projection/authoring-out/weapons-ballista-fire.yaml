  - id: expr.ballista-fire-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 火焰弩炮是弩炮的低成本火攻改装。我从军需册上看过它的装备清单：标准弩箭、几卷浸油麻布、火镰火绒，成本增加微不足道。攻城时在弩炮阵地上分一半器械改装火焰弩箭，可以同时压制城头守军和制造火灾恐慌——守城方看到带火的巨箭落下，士气打击比实际杀伤更难量化。但它的战场局限也清楚：火弩箭对人员的杀伤效率提升极其有限，附带灼烧更多是威慑价值；对器械结构的破坏聊胜于无，火烧得再旺也是在木头表面。想摧毁冲车或攻城塔，还是得指望投石车抛掷火罐。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_火焰弩砲__火焰弩砲.json#/Variants/1/Content
      quote_hash: 02CF1065A25CBF5D2AA164AFB89B7938D5BED6293FD700C1C2052F7D985E71AF
      quote: 守城方看到带火的巨箭落下，士气打击比实际杀伤更难量化

    quote_hash: 709ABF118B4C969094F68546BE8F6D337A5A412EB798C4DA27CE6D7ACF1F9DC5
    quote: 什么是弩？不知道
  expressions:
  - id: expr.weapon-crossbow-empire-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 帝国引进了弩，但没全学。元老院当年议过全面换装，阿雷尼科斯皇帝拍板：不要。毛病不在弩，在军制——军团靠重步兵立国，更麻烦的是弩太容易让普通人变强：奴隶拿弩能射死贵族，有先例。所以只用不敢扬，配给辅助部队。前线指挥官私下都认好用，就是数量不够。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1
      source_version: animusforge-20260913
      source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
      locator: rules/rule_弩__弩.json#/Variants/4/Content
      quote_hash: 969F93CB36F2C5E1720523A293AFE01EAD4F5CF4323E759006C9DF86E2EBEEFA
      quote: 一个奴隶拿弩能射死一个贵族，这种事在帝国有先例，元老院的老爷爷们不喜欢
    grants:
    - profile_id: profile.noble
      scope: elite
      min_detail: detail
      culture_ids:
      - entity.culture.empire
    denies: []
  - id: expr.weapon-crossbow-battania-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 弩是瓦兰迪亚人的东西，咱不碰。长老说那玩意儿没有灵魂——射箭不费力就是不诚心，山神不收。缴来的弩当场砸碎，铁件埋寨子外头，埋的人还得洗三遍手。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1

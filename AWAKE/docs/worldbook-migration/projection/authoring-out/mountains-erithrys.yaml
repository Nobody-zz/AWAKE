  owner: awake_canon
  conflict_policy: canon_wins
sources:
- source_id: source.calradia.game.settlements.geo2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 8fcc88868e40b0d90b9e6fada6e9ad7029dd90df4e2905f1718e00673932e0c4
  locator: bannerlord.db#localization.5SpYVtie
  quote_hash: 30D026293DCE251447851D0B7C63331599C6FB2B2C7815CD1D16906D3E42BA6D
  quote: 洛泰坐落于厄里特律斯山玄武巨岩的荫蔽之下，早先是一座帕拉人的山堡，又叫“洛塔什”。在拉革塔之后，洛塔什也很快落入帝国手中。
- source_id: source.calradia.chronicle.animusforge.geo2
  source_version: animusforge-20260912
  source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93
  locator: rules/rule_厄吕特律斯山__厄吕特律斯山.json#/Variants/0/Content
  quote_hash: 91D894D460D3E6270F579A43BADA1E5F472F364D01E0E13590900CB7A4C7170A
  quote: 厄吕特律斯山是卡拉迪亚大陆最雄伟的山峰，坐落于阿米尼斯河谷的怀抱之中。整座山由深色的玄武巨岩构成，陡峭的岩壁从河谷中拔地而起，山顶终年积雪不化。
- source_id: source.calradia.game.settlements.geo2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 8fcc88868e40b0d90b9e6fada6e9ad7029dd90df4e2905f1718e00673932e0c4
  locator: bannerlord.db#localization.5SpYVtie
  quote_hash: 8181731F3F9C6764E7419B179CF843AFFEFA2CCE8C8C1E29D7D8A0B15317E289
  quote: 洛泰坐落于厄里特律斯山玄武巨岩的荫蔽之下，早先是一座帕拉人的山堡，又叫“洛塔什”。在拉革塔之后，洛塔什也很快落入帝国手中。当地的帕拉酋长在听说邻国发生的事情后，屠戮了受他保护的几十名帝国公民。性格古怪的长发将军萨拉庇俄斯率领着惩戒部队攻下了洛塔什，并将其夷为平地。
- source_id: source.calradia.chronicle.animusforge.geo2
  source_version: animusforge-20260912
  source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93
  locator: rules/rule_厄吕特律斯山__厄吕特律斯山.json#/Variants/2/Content
  quote_hash: 4A78F7A9CB5EA0080B1B42BFC3895F45D067AF0AAB2DF02448801C1D20FF47FF
  quote: 谁控制了洛泰，谁就握住了整个阿米尼斯河谷的粮食命脉。
- source_id: source.calradia.chronicle.animusforge.geo2
  source_version: animusforge-20260912
  source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93
  locator: rules/rule_厄吕特律斯山__厄吕特律斯山.json#/Variants/4/Content
  quote_hash: 5DFE97B5C0CF3D71FB37D0A8B6B62BA2B7EA4272F284ABA4439EE361ECBEA1A6
  quote: 它离我们不算近，但天气特别好的时候，站在高原的西南边缘，能看到它的雪顶在极远处闪着微光
- source_id: source.calradia.chronicle.animusforge.geo2
  source_version: animusforge-20260912
  source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93
  locator: rules/rule_厄吕特律斯山__厄吕特律斯山.json#/Variants/10/Content
  quote_hash: 805ACE64EE86B5A5A48E3907C04D8080F1E55808ABB20E5341F3AF4918867A17
  quote: 这座山给了我们水，也给了他们藏身的地方，各取所需。

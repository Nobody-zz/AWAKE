assertions:
- id: assertion.weapon-head-crown-1
  revision: 1
  kind: fact
  text:
    zh-CN: 王冠不是护具。最华贵的几顶护头值只有四到八——一顶厚布围帽都比它强；它的用处是让人一眼认出戴它的是谁。各国的式样各不相同：帝国的珠宝带与黄金桂冠承自旧制，用金与宝石缀成；阿塞莱把王冠做成缀满宝石的战场式；斯特吉亚用毛边镶珠宝，巴旦尼亚的高地仪式王冠只用于典礼。
  sources:

summary:
  zh-CN: 方旗骑士：瓦兰迪亚骑士部队的顶点——扈从熬资历、挣战功，被男爵看中后册封，骑枪上挂一面方旗。装备昂贵（全覆盔、布面铁甲、链铠衬里、战马马铠），冲锋威慑极强；「单挑不弱、弱在纪律」是帝国具装骑兵与自家领主都说出口的评语，潘德拉克正是追轻步兵被反冲的旧账。平民视之为过街都不敢正眼看的人物。

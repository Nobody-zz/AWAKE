    revision: 1
    layer: detail
    text:
      zh-CN: 奥通加德的买卖是达西语商人起的头：收周边的马、羊、牛，编成大队由护卫押着往西赶去帝国市场卖。城破之后换了东家——兀儿浑汗把它赏给了库吉特部。

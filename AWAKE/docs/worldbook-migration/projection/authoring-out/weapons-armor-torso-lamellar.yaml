  - id: expr.weapon-armor-torso-lamellar-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 札甲按铁片的大小与层数分档。片小、层多、穿得密，护值就高：铜扎甲衬链甲四十六，重型扎甲衬链甲五十一。它还特别适合往上加东西——底下垫链甲、腰上挂鳞甲裙、肩上再加护肩，都能续。

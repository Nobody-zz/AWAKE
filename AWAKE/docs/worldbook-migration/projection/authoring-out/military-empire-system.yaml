      zh-CN: 帝国军队分前后两截：潘德拉克战役之前是常备军团——国家发饷、统一训练、统一指挥，曾经征服了卡拉迪亚大半土地；潘德拉克把国库和精锐都打光了，阿雷尼科斯皇帝只能废掉常备军，改让执政官和贵族自己出钱养兵。财政压力是下来了，但军队从此不再是皇帝的军队。

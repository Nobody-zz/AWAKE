  - id: expr.battania-sturgia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 巴旦尼亚人的军队和我们有点像，都是部落出兵，都是步兵为主。但他们不像我们那么依赖盾墙，他们更信他们的弓箭和森林。他们的长镰兵拿着那种弯曲的长镰，在近战中确实厉害。不过他们最大的软肋是部落之间的协调——巴旦尼亚的伯爵们要是互相之间有仇，至高王喊破嗓子他们也不来。这一点我们斯特吉亚人倒是比他们强：我们的波耶们虽然也互相看不顺眼，但大公一声令下，至少人都会到。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/5/Content
      quote_hash: 87B8186B9C612D524F4253572FD328D563E109E3C9B01FF3FCC3CFE13197AC75
      quote: 他们最大的软肋是部落之间的协调——巴旦尼亚的伯爵们要是互相之间有仇，至高王喊破嗓子他们也不来
    grants:
    - profile_id: profile.noble
      scope: national
      min_detail: detail
      culture_ids:
      - entity.culture.sturgia
    denies: []
  - id: expr.battania-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 巴旦尼亚人没有骑兵，这是他们最大的弱点。他们的弓箭手在森林里确实厉害，长镰兵在近战中也够狠，那个什么「狂啸冲锋」虽然听着唬人，但在平原上我们的方旗骑士一个冲锋就能让他们闭嘴。问题是他们很聪明，从来不在平原上跟我们正面打，躲在林子里，等你进去了才动手。所以瓦兰迪亚和巴旦尼亚打了这么多年，谁也占不了谁的大便宜。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/6/Content
      quote_hash: ECE57CBD96E8E5A5939E4B601E15F825C9A1A2253C0EF8EE5A9B8AB709E9F185
      quote: 巴旦尼亚人没有骑兵，这是他们最大的弱点
    grants:
    - profile_id: profile.noble
      scope: national
      min_detail: detail
      culture_ids:
      - entity.culture.vlandia
    denies: []
- id: assertion.battania-3
  revision: 1
  kind: rumor
  text:
    zh-CN: 对巴旦尼亚人自己来说，战争动员令一下，森林里所有能拉弓的男人都会扛着自己的猎弓从村子里走出来，跟着年长的猎人组成战团。他们的装备比不上帝国的军团步兵，但他们从小在林子里追鹿，知道每一棵树的位置，知道哪片灌木丛后面能藏人——这不是吹嘘。

    layer: detail
    text:
      zh-CN: 贾迈耶堡临耶什姆海南岸，下辖橄榄村与牧马村各一；橄榄油压榨后装坛，由堡中过秤外销，春草季的马匹交易须经堡里登记，埃米尔按头抽成。

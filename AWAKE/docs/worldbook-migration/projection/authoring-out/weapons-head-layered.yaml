  - id: expr.weapon-head-layered-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 瓦兰迪亚的军械里叠穿是现成的成套配：锅盔衬填充帽、锅盔衬系带围帽、锅盔衬链甲围帽，按征召、常备、亲卫三层分发。铁帽是同一个模具打的，区别全在底下的那一层——这也让军需官好管：壳子坏了补壳子，垫层破了补垫层。

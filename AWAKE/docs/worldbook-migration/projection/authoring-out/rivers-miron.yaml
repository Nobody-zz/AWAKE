  - id: expr.river-miron-ore-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 这条河养两头：上游麦子最肥，中下游石头里出银子出铁——革耳塞戈斯的银井、马拉忒亚的铁崖都在河谷里。瀑布底下冲出来的矿石也有人捡着吃饭。

    quote_hash: DEAFBD7AB31699BE84FB9A108DEFE63F80E0BBAC010EE0EE0065E9AEFABCA65C
    quote: 我跟自己说，以后战场上听见对面投石车响，千万别抬头
  expressions:
  - id: expr.mangonel-fire-villager-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 火焰投石车？那是地狱里拉出来的东西。我见过一次，围城的时候。天快黑了，对面营地亮了几下火点子，然后一颗大火球拖着黑尾巴从天上砸下来，正落在城门旁边的兵棚子上。第一下砸中房顶，第二下直接炸开，火星子溅了半条街，第三下整个棚子全着了。棚子里的人往外跑，跑出来的是火人，跑几步就扑倒了。我哥说那一个火球就烧死了几十个人。打完仗我去看那片地，砖都烧裂了。我跟自己说，以后战场上听见对面投石车响，千万别抬头。
    sources:

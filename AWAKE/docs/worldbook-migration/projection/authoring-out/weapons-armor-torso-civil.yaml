- id: assertion.weapon-armor-torso-civil-2
  revision: 1
  kind: fact
  text:
    zh-CN: 有几款便服是能带着走的：镶钉皮马甲以皮革拼缝、缀上铜钉，护值八；林地服用整块软皮裁成，护值十四，是林地猎人上山的常服。它们仍算常服，只是比别的款更经得住荆棘与石棱。
  sources:

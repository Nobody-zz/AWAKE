  - id: expr.kuyug-warrior-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 库由格老族长带着我们从北边的瓦尔诺瓦波尔一路南下，打下奥通加德的时候我就在他身后。他骑在马上喊话的样子我现在还记得。他对我们说，阿契特人哪怕没了汗国的名号，骨头也不会弯。库吉特人给帝国当佣兵，男人都死在了潘德拉克，这是他们自己的选择；我们趁机拿下奥通加德，是天赐的机会。他这辈子不服任何人。
    sources:

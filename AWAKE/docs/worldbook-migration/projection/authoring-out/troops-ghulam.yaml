- id: assertion.ghulam-3
  revision: 1
  kind: interpretation
  text:
    zh-CN: 在异乡人眼里，古拉姆身上最显眼的不是本事，是那身打扮：香水味老远就能闻到，帽子上插着孔雀毛，在林子里藏不住。而他们自己说，打扮不是为了好看，是为了记住自己是谁——「我们为黄金打仗，但黄金不是目的，只是手段。只要我们还在马背上，达西就没有亡」。

      zh-CN: 攻城塔就是把部队送到城墙那么高的木塔——好几层楼高，底下装轮子，几十个人躲在塔后往前推，塔顶有块能放倒的板子，一搭上城垛，兵就顺着往里冲。它能抵消守城方的高度优势，也能挡住城头射下来的箭。

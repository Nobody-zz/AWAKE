summary:
  zh-CN: 攻城塔：移动的木结构攻城设施——通常四至六层框架，底层装滚轴或铁箍轮对，由数十人隐蔽在塔后推行，塔身外挂湿牛皮或泥浆混合层防火，顶层有可放倒的吊桥。它能把攻城方送至与城墙等高处，抵消守城方的高度优势，并让部队在不受投射物伤害的情况下靠近城墙；但太重、推得慢，最怕的不是箭矢，是地形障碍。

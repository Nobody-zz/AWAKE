- id: assertion.weapon-head-nasal-2
  revision: 1
  kind: fact
  text:
    zh-CN: 护鼻盔与叠穿的关系最紧：同一款帽壳，单戴是护头十八到三十几，垫上皮革或填充帽升到四十八，垫链甲到五十一。链甲护鼻盔一类更是把两者缝成一件，护头做到四十九。

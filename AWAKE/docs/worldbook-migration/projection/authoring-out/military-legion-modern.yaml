      zh-CN: 现代军团这套东西，说白了就是让有钱的老爷们自己养打手。好处是帝国不用再征那么高的税去养常备军了，坏处是这些老爷们手里的刀越来越快。以前帝国只有一支军队，现在每个执政官都有自己的军队，打起内战时比以前还凶。

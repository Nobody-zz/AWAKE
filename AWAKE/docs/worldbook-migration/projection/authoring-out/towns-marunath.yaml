- id: assertion.town-marunath-3
  revision: 1
  kind: rumor
  text:
    zh-CN: 传说里的英雄奥奇莱甘，预言他将在此处的七场决斗中击败格拉尼斯的七个儿子，并在七处浅滩遭遇最后的敌人；他割开爱马的喉咙、趟过血水奔流的小溪，击败最终之敌，履行了预言。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_B1
    quote_hash: F19D29C1EB6E9E340D309854156AD20C65C7D8DEFC2520E0E0A506F43FA5DF6D
    quote: 这一回，登上舞台的英雄是奥奇莱甘，预言中他将在七处浅滩的七场决斗里击败格拉尼斯的七个儿子，并在此地遭遇最后的敌人。
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_B1
    quote_hash: 330DDA982B3A77E6717E6ACB12EADF5B72C820B9B30DEEE509E8B4D557FFC196
    quote: 他割开自己爱马的喉咙，趟过血水奔腾的小溪，击败了自己的最终之敌，履行了预言。
  expressions:
  - id: expr.town-marunath-3-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 说是从前有个奥奇莱甘，要在七处浅滩跟格拉尼斯的七个儿子一人打一场，末了在这儿了结。他杀了自己的马，血水淌成溪，他把最后那个也放倒了。
    sources:

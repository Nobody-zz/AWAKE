- id: assertion.town-pen-cannoc-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 据传说，山岩下的暗池里住着水之女神，她把旅人与闯入者诱入死地；极少数时候她与某个英雄相恋，赐他胜利与福分。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_B5
    quote_hash: 1AA2F0455A3336E9735E9AA394C33388123CDF212BA317712DAA8870F33AF777
    quote: 据传说，水之女神生活在山岩之下的暗池里面，诱惑着旅行者和闯入者踏入死地，只有很少的情况下女神会和一位英雄坠入爱河，赠予他胜利和赐福。
  expressions:
  - id: expr.town-pen-cannoc-2-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 山底下暗池里住着水娘娘，贪心的旅人会被拖下去。渔夫们说那不是神怪，是那条河真吃人。
    sources:
    - source_id: source.calradia.game.settlements-desc
      source_version: bannerlord-1.3.15.110062

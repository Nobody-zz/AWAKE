      quote: 许多并未正式归属库赛特部落联盟的城镇和村庄都被要求为可汗的军队提供兵员。这些被称为“杂牌军”的人们通常装备简陋、缺乏训练，唯有寄希望于汗国的精锐骑兵赶来解救他们，在这之前要尽量保住性命。
    grants:
    - profile_id: profile.soldier
      scope: national
      min_detail: detail
    denies: []
  - id: expr.military-khuzait-duty-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 打仗不是什么荣耀，是义务。那颜一征召，备上马带上弓就得去。咱这样的人战场上最多，围在外圈射——可汗靠的不是怯薛，是成千上万个咱们这样的牧民。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1
      source_version: animusforge-20260913
      source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
      locator: rules/rule_库赛特军事力量__库赛特军事力量.json#/Variants/5/Content
      quote_hash: BD8B06C60B1194796D4B8D465BEDBC8A866271DDDC22999895D5F22B097E7ED1
      quote: 打仗不是什么荣耀，是义务。那颜征召，我就带上我的马和弓去，不去不行。
    grants:
    - profile_id: profile.villager
      scope: local
      min_detail: rumor
      culture_ids:
      - entity.culture.khuzait
    denies: []
- id: assertion.military-khuzait-3
  revision: 1
  kind: fact
  text:
    zh-CN: 帝国视角：库赛特人自兀儿浑时代起就是最危险的敌人——骑射手从不近战，绕阵射一整天，追则散、停则回；军团步兵重甲厚盾耗箭也耗士气，阵线松动时枪骑兵从侧翼杀入；草原远征每次都赔上半支军团。远方族群对库赛特仅有模糊传闻。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war1
    source_version: animusforge-20260913
    source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
    locator: rules/rule_库赛特军事力量__库赛特军事力量.json#/Variants/2/Content
    quote_hash: 3E7677AA058F4BFC826E6F11218D02D249F15AA45874D0AC7BD8163BC2708DF9
    quote: 他们的骑兵从不靠近，绕着你的方阵射一整天，你追击他们就散，你停下他们就回来
  - source_id: source.calradia.chronicle.animusforge.war1
    source_version: animusforge-20260913
    source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
    locator: rules/rule_库赛特军事力量__库赛特军事力量.json#/Variants/10/Content
    quote_hash: DAC696CB6D914FC0993029C4FF52591690873C3413289C59195C2AC97EDC792A
    quote: 听说他们打仗跟苍蝇一样，光射箭不接战，耗到你没力气了他们再冲
  expressions:
  - id: expr.military-khuzait-empire-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 库赛特人是最危险的敌人，从兀儿浑时代起就不必讨论。方阵和具装骑兵的优势全被距离吞掉：追，他们散；停，他们回来围着放箭。等阵线一松，枪骑兵就从侧翼进来了。每次远征草原，都得赔上半支军团。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1
      source_version: animusforge-20260913
      source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
      locator: rules/rule_库赛特军事力量__库赛特军事力量.json#/Variants/2/Content
      quote_hash: 3E7677AA058F4BFC826E6F11218D02D249F15AA45874D0AC7BD8163BC2708DF9
      quote: 他们的骑兵从不靠近，绕着你的方阵射一整天，你追击他们就散，你停下他们就回来
    grants:
    - profile_id: profile.noble
      scope: elite
      min_detail: detail
      culture_ids:
      - entity.culture.empire
    denies: []
  - id: expr.military-khuzait-far-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 东边那些骑马的？听说打仗跟苍蝇似的，光射箭不接战，耗到你没力气再冲。马多，小孩都会骑射——离得远，搭不上。
    sources:

- id: assertion.weapon-armor-torso-leather-2
  revision: 1
  kind: fact
  text:
    zh-CN: 草原一路把皮和铁合着做：护心镜皮甲在皮面正心缀一块铁镜，护值十五；厚布面铁甲背心则在皮背心上再罩一层布面铁，护值三十四，是这条路做得最重的一件。

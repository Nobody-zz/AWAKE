assertions:
- id: assertion.troop-mamluk-1
  revision: 1
  kind: fact
  text:
    zh-CN: 马穆鲁克一词本义为「被拥有者」或「奴隶」，特指阿塞莱自幼购入、经严格军事训练后编入精锐部队的军事奴隶阶层；来源多为突厥草原、高加索或黑海北岸的非阿塞莱少年，经奴隶商人转卖入宫廷军营，受严整的骑术、弓箭、刀术与战术训练；因自幼脱离血缘纽带、完全依附体制而被视为忠诚可靠的核心武力；成年后通常获自由身份并领取俸禄，但出身标记终身伴随；在阿塞莱苏丹国中已从侍卫部队上升为举足轻重的军事政治集团。

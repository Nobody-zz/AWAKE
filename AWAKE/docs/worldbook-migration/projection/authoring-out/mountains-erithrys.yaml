- id: assertion.mount-erithrys-3
  revision: 1
  kind: interpretation
  text:
    zh-CN: 山腰洞窟隐者之说流传于洛泰与各条商路：一群从不下山的人，来历无人说得清；有人敬他们，有人只当山里多了几个影子。
  sources:
  - source_id: source.calradia.chronicle.animusforge.geo2
    source_version: animusforge-20260912
    source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93
    locator: rules/rule_厄吕特律斯山__厄吕特律斯山.json#/Variants/10/Content
    quote_hash: 805ACE64EE86B5A5A48E3907C04D8080F1E55808ABB20E5341F3AF4918867A17
    quote: 这座山给了我们水，也给了他们藏身的地方，各取所需。
  expressions:
  - id: expr.mount-erithrys-hermit-townsfolk
    revision: 1
    layer: rumor
    text:
      zh-CN: 上山采药的远远见过洞口有人影。他们不下山，我们不上山——这山给了我们水，也给了他们落脚的地方，各过各的。
    sources:
    - source_id: source.calradia.chronicle.animusforge.geo2
      source_version: animusforge-20260912
      source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93
      locator: rules/rule_厄吕特律斯山__厄吕特律斯山.json#/Variants/10/Content
      quote_hash: 805ACE64EE86B5A5A48E3907C04D8080F1E55808ABB20E5341F3AF4918867A17
      quote: 这座山给了我们水，也给了他们藏身的地方，各取所需。
    grants:
    - profile_id: profile.townsfolk
      scope: regional
      min_detail: rumor
    denies: []
  - id: expr.mount-erithrys-hermit-soldier
    revision: 1
    layer: summary
    text:
      zh-CN: 驻在洛泰那阵子，伙食是各处驻地里最好的。新兵问山上那些人闷不闷——山下打成那样，山上闷一点有什么不好。
    sources:
    - source_id: source.calradia.chronicle.animusforge.geo2
      source_version: animusforge-20260912
      source_content_hash: 84fd65e5b2426ab069a4e93456f42e0dc5ad3f68be065bf890cd7a43110b9d93

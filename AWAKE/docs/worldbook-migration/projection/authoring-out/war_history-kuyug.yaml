    revision: 1
    layer: detail
    text:
      zh-CN: 阿契特家的老族长库由格，是个投机了一辈子最后死于非命的人。他趁库吉特人在潘德拉克给帝国当佣兵被打残了，夺了人家的地；转头又想跟我们斯特吉亚人联姻换和平。结果呢？联姻把温都勒搭了进去。他儿子突剌格现在还在找西加，但这仇说到底，是库由格自己赌输了。

  - id: expr.weapon-armor-shield-round-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 圆盾的价钱在木料和中心铁凸上：软木旋得快但不经砸，硬木沉、要慢慢掏。中心铁凸是护住握把的那一块——没有它，一矛捅进来先断的就是手。耐久从二百一十五到五百四十：钢制圆盾最经打，靶标盾最不济。

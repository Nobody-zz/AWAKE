    layer: rumor
    text:
      zh-CN: 西帝国？就是中原那边。他们粮食多，兵多，马也多。打仗靠人多堆上去，不像巴旦尼亚人那样一个能打好几个，也不像瓦兰迪亚人那样冲起来不要命。但他们将领多，分工细，你打不进去就是打不进去。听说他们当兵管饭还给地，中原那边的人抢着参军。

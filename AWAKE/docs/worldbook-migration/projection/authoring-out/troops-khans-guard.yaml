  - id: expr.khans-guard-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 可汗卫士不是一般的兵，他们是被选中的人。我手下最顶尖的骑射手，练了十几年才有资格去参加选拔；选拔的时候要在马背上射完一整壶箭，箭箭都要中靶，还要在马刀对决中胜过不止一个对手。选上之后，他们就不再属于部落了，只属于可汗。
    sources:

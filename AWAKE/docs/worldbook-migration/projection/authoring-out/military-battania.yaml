sources:
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.Ax9OkgL5
  quote_hash: 5A023FD1760A7C963B6A6F6538F47AEED155B6F9C36F938B382BC2ABC1F3BF85
  quote: 卡拉迪亚西北部云雾缭绕的山区由巴旦尼亚的诸部族统治着，他们是这块大陆大部分地区的原始居民。他们位于山顶的堡垒见证了无数次抵抗外来侵略者的战争：起初是帝国的军团，最近还加上新崛起的斯特吉亚和瓦兰迪亚王国。他们精通长弓、夜袭、林中闪击。他们崇尚勇武精神，但更喜欢糅合一点狡黠——将一群牛赶入雾中的偷牛人；往敌方部落赴宴的冠军勇士，能讲讲战斗趣事取悦东道主，并从包里拎出自己的纪念品：同族的头盖骨。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/0/Content
  quote_hash: 1F7FCCCA577EEB344F2FA90878D64ABCEE1C774CCFA6FCCEAEE2CEA3EB265EE8
  quote: 巴旦尼亚没有常备的中央军队。战争来临时，至高王向各部落发出召唤，各部落依照古老盟约派出战士
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/0/Content
  quote_hash: AEF60B1461281348861314CABF3DD79F07F70759827C05D7CDA80DAE9AC36BAB
  quote: 重装步兵被称为长镰兵，手持战镰，在敌军阵型被箭雨打乱后从侧翼或后方杀出
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/2/Content
  quote_hash: 419CAC91F4D3B7788B2F465BD9CA9092073718265ACF4AF79F4FDA27E42482AF
  quote: 部落里的男人都是兵。平时他们种地打猎，战时他们扛着弓就来了
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/2/Content
  quote_hash: 39ED7B0E40A77B209E079570B9AECADD1B8313D2ACF93F8B71351E3A74CA562A
  quote: 这是我们的权利，也是联军最大的软肋
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/3/Content
  quote_hash: 70C2F50F206866D10E5E784D48F33ED411239A588895D4CA57F012A27D85F772
  quote: 长镰兵是我们中间最猛的——他们用的战镰比帝国的重剑还沉，挥起来能把人从肩膀劈到腰
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/4/Content
  quote_hash: A2DBD6BA6C23A36E3EDCCE8FA90B8C5C1D31F5903602926249C47886F0DA2777
  quote: 他们的弓箭手在林子里神出鬼没，我们的重步兵一进森林就被射成刺猬
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/4/Content
  quote_hash: 61A5484D654A826679AD3A05B483496F4086EC0B44CEAC22009A40A1BA27158D
  quote: 潘德拉克那天，长镰兵进入战斗后我们的阵线就崩溃了
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/5/Content
  quote_hash: 87B8186B9C612D524F4253572FD328D563E109E3C9B01FF3FCC3CFE13197AC75
  quote: 他们最大的软肋是部落之间的协调——巴旦尼亚的伯爵们要是互相之间有仇，至高王喊破嗓子他们也不来
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/6/Content
  quote_hash: ECE57CBD96E8E5A5939E4B601E15F825C9A1A2253C0EF8EE5A9B8AB709E9F185
  quote: 巴旦尼亚人没有骑兵，这是他们最大的弱点
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/1/Content
  quote_hash: 4EAAD289EF42050B0C4B8B6D80185042D6A75C3E2D98939CAA5629B8E8086DFC
  quote: 战争动员令一下，森林里所有能拉弓的男人都会扛着自己的猎弓从村子里走出来，跟着年长的猎人组成战团
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_巴旦尼亚军事制度__巴旦尼亚军事制度.json#/Variants/1/Content
  quote_hash: 2407121FE6752A22DA22D5635539879F7EBE5AD38B739A464DCE63E62C5792C2
  quote: 他们从小在林子里追鹿，知道每一棵树的位置，知道哪片灌木丛后面能藏人

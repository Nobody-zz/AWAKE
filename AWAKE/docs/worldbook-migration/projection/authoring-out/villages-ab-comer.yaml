    layer: detail
    text:
      zh-CN: 阿布·科梅尔以河坡葡萄为业——坡向朝阳、排水好；白葡萄按粒与甜分等，酒顺特朗河外运，贵族订单是常年大宗，霜期一近就得抢收。

  - id: expr.troop-cataphract-elite-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 帝国的家底是从公民步兵换成具装骑兵的：早先卡拉德人靠自耕农拿枪站阵，后来站在阵前的成了大户人家的扈从，人马具甲。这一步换下来，帝国也就从一个推举执政官的共和，变成了大地主说了算的朝廷。名头归名头——退役下来的具装骑兵，付不起自己那副甲和那匹马的大有人在，最后只能去给商人牵马押货。

  text:
    zh-CN: 火焰弩炮是弩炮的低成本火攻改装：标准弩箭箭杆前端加装浸油麻布套环，油料配比火油与松脂三七开，燃烧温度足够引燃干燥木材但不足以熔断铁质加固件。它发射尖端浸透焦油的弩矢，可对敌方围城器械和木制建筑造成火焰伤害，对士兵也相当致命。技术上几乎没有额外门槛——弹道特性与普通弩炮完全一致，弩箭质量增加微乎其微。但火油布在飞行途中有自行熄灭的风险，引燃效果取决于命中目标的干燥程度和后续处置：对方如果准备了湿沙和水桶，火势很难持续。

  expressions:
  - id: expr.tale-charas-origins-3
    revision: 1
    layer: rumor
    text:
      zh-CN: 跑船人另有闲谈：起雾的天，群岛的轮廓会变样；罗盘挨着某些礁石转个不停；石头上刻着没人认得的符号，说不清是帝国人凿的还是更早年间的手笔。港里人只当怪谈讲讲，航道平安要紧。

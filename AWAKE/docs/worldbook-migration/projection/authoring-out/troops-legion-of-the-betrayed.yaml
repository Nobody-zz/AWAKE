summary:
  zh-CN: 被弃者军团：阿雷尼科斯废除最后一支帝国常备军之后成立的雇佣军团，由厌恶这场变化的人组成——他们偏爱昔日的军团及其规矩、历史与军营生活，指责新制度正在摧毁帝国。无饷不成军，因此同时与帝国领主和外国领主签约。战力来自纪律，归属感不在雇主身上，而在军团本身。

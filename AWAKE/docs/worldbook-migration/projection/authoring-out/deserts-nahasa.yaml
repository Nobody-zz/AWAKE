summary:
  zh-CN: 纳哈撒沙漠（青铜沙漠）：卡拉迪亚以南的浩瀚沙海，阿塞莱人的家园；砾石平原与火山岩间散布绿洲，商路与水源即财富，帝国历次南征皆铩羽而归。
registry_bindings:
  profile_registry_version: 1.0.0
  profile_registry_hash: 309D10583E7B4AF05F28DE2C2E67A2528CB3D6C45752369C0F7D160FABC3F3A5
  referral_registry_version: 1.0.0
  referral_registry_hash: 6E17075F1F967BE28C0437121DB50E5C30809C4EFC3D2A5F22AD9BB0B3B926CD
sources:
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.a2AjI8nc
  quote_hash: 06C2D9DA6A1CE3ED361E8E20815194072537442215C1D44DEFFD0E308A4D5F0D
  quote: 阿塞莱人是卡拉迪亚以南的纳哈撒沙漠——即青铜沙漠的主要居民。在外人看来，这是片荒凉之地，砾石平原和火山岩层将绵延的沙丘拦腰截断。但人们在地下发现了水源，这些地下水聚集在洼地中或偶尔会有暴洪奔流而过的干涸河道之下。于是人们便在这些绿洲定居。他们分为数量繁多的家族和分家族，每个家族都有详尽的族谱，但他们被统称为巴努·阿塞拉，也就是所谓阿塞拉的子嗣们。就这样，他们的民族意识来自于追溯自己的血统至这位传奇的族长。而他们可观的财富和力量，则来自于对孤立水源的控制，这些水源使得远方的商队得以穿越沙漠。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.yJMpjiP7
  quote_hash: 6A300D554A91C7470151E4A47D154387E6AD55E7A981454F81596AB5ADF0949A
  quote: 战斗结束，你再次踏上征程，感受到几滴零星的雨点。紧接着狂风骤起，一道沙墙将你完全吞没。飞扬的沙粒刺痛着你的脸颊，目光所及不过数步。你深知纳哈撒沙漠的沙尘暴素来恶名昭彰，迷路是常有的事，大多数人往往被渴死或者被埋葬在沙丘里。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.RWOYui01
  quote_hash: EE698FA2853F9713166612024270451BE3AF2EB2A6AC9AC803A228340A8DC588
  quote: 贾瓦勒，又名“漫游者”，是纳哈撒沙漠中主要的贝都因联盟。他们在高地和低地的牧场之间游荡，宣称大片的沙漠都是他们的“领地”，任何途径的商队都必须缴纳保护费。他们将自己的事迹编为诗歌，同时嘲笑巴努·阿塞拉的其他部族放弃了象征“自由”的黑羊毛帐篷，住进绿洲中的石头屋子。其他部族则认为他们是自吹自擂的讨厌鬼，但也不情愿地尊重着他们身为阿塞莱传统维护者的身份。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Khr5yETv
  quote_hash: D15D3C3EA439ACAC8640F37B2F66C8CDE98C0468051E87BE4EA0676D716A3F27
  quote: 阿塞莱人是纳哈撒沙漠的居民，混合了游牧的贝都因人和绿洲的农民。他们以骑术和博学多识（尤其是医学）而闻名，这些知识来自于大陆上一些利润极高的商路。每个家族都以自己的血统为傲，互相蔑视，然而他们一旦被有魄力的领袖团结起来，就会成为南方的一支强大力量。
- source_id: source.calradia.chronicle.animusforge.geography2
  source_version: animusforge-20260913
  source_content_hash: 386587a2fdf8b9bfdde96ae07f269482c98a11a87fcc816f86a39d07800c9560
  locator: rules/rule_纳哈撒沙漠__纳哈撒沙漠.json#/Variants/5/Content
  quote_hash: 310A549E80982229262028D414C637BDAB0F94AD0C4B82A45D928F299941D62C
  quote: 纳哈撒沙漠是帝国南方的天然屏障，也是我们永远的耻辱。几百年来，帝国的军团无数次试图征服那片沙海，但每次都铩羽而归。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.kghCLS9q
  quote_hash: C8136D71B763F1EE45E36CCF59C1DA31950055720DDCB94953D1FF1577B939D1
  quote: 此地也因泽翁娜之风而闻名，这是一股夏季朝北吹的季风，将纳哈撒沙漠的炎热带过珀拉斯海，来到帝国的南方。

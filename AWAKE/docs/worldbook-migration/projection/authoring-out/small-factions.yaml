  - id: expr.small-factions-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 在朝廷眼里，他们多半是癣疥之疾，不是心腹之患：元老院每隔几年议一次要不要彻底清剿，每次议而不决——不是剿不了，是剿完留下的灰色地带更麻烦。城镇里的高利贷、销赃、调解纠纷都捏在这么一批人手里，凑成一套法外的秩序，没了它，下城的治安撑不了三天；他们也接朝廷不方便出面的活。至于那套信仰，不过是脸上贴的一层金箔，撕了底下还是匪帮——但这层金箔到底让他们和纯黑帮分开了：他们有经可念、有主可等，用起来有底线。外来做生意的看得更实在：大陆上再没有第二个这样的组织，一边敲诈商户一边念经，劫掠和末世论搅在一块儿；阵地战里只能当消耗品，可巷战里的那股劲头不能小看。那句话概括得最准——那层千年教派的自我定位，是他们在这个灰产行当里唯一的信用担保。
    sources:
    - source_id: source.calradia.game.urban-dark
      source_version: bannerlord-1.3.15.110062
      source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
      locator: bannerlord.db#localization.nQOf27Rx
      quote_hash: 723F3FF0CAF9840E3BD151932F079D4EB8340617C3C4D09C42B3948384547BF4
      quote: 秘密之手是一伙黑帮，他们控制着帝国南部的乡村地区，甚至一些城镇。他们通过为当局效力而壮大：镇压动乱，压制讨人厌的传教士，抢掠他们主顾的竞争对手。他们中的许多人过着两面生活：在城里体面，在乡间犯罪。一位秘密之手的成员每年会花两三个月的时间在山野之中充当土匪，其余时间则会回到城镇，作为打手和售卖赃物的“商人”——他们自然深知没有人会问太多的问题。
    - source_id: source.calradia.game.urban-dark
      source_version: bannerlord-1.3.15.110062
      source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
      locator: bannerlord.db#localization.dRaYhQva
      quote_hash: BCA5B609211D5381225F96330FF2C777CE9A1ACD745536A7977DE1A82314C743
      quote: “巴努·奇拉勒”，即暗影之子的起源，掺杂着各种传说轶事。在许多故事里，一个救世主般的传教士在沙漠深处的某座要塞建立了自己的统治。在致幻草药的帮助下，他让信徒们对自己死心塌地，同时用暗杀的胁迫让阿塞莱贵族心生恐怖。不管这些故事真实性几何，这个兄弟会已是纳哈撒边陲地区相当有实力的一个组织。他们一边从穿过自己领土的商队手中收取保护费，同当地豪强达成协议；一边韬光养晦，静候能够公开自己大计划的时机。
    - source_id: source.calradia.game.urban-dark
      source_version: bannerlord-1.3.15.110062
      source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
      locator: bannerlord.db#localization.B8c2mNKj
      quote_hash: 363C69BEAFC8B83E0E8035C6E3C04B60269B5FA9D509F4230615E1A1163B2254
      quote: 火焰余烬是近一个世纪前兴起的反叛运动的后代，那次运动是在圣洁但无能的年轻皇帝达鲁索斯被他的一位将军推翻之后发生的。他们声称自己正在为天堂带回达鲁索斯，并为迎来黄金时代做准备。但和卡拉迪亚的其他许多反叛运动一样，他们被迫转向敲诈勒索行业以求生存。
    - source_id: source.calradia.chronicle.animusforge.dark
      source_version: animusforge-20260913
      source_content_hash: f2f393db5e381912ec5bda1e6955cad0f96f3462afdac54a523bf022b4aefca7
      locator: rules/rule_火焰余烬__火焰余烬.json#/Variants/1/Content
      quote_hash: BA90195DC299FE4D673180EF95D9779457E8A35EF90171BF5698005F29CE5B0D
      quote: 火焰余烬是帝国的癣疥之疾，不是心腹之患
    - source_id: source.calradia.chronicle.animusforge.dark

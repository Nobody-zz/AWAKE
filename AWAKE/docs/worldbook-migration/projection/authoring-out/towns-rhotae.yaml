- id: assertion.town-rhotae-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 将军事后自陈：卑劣地拿下拉革塔却未曾流血，光荣地攻下洛塔什却让此地流血漂橹；这两件事都将成为名誉的污点——胜者取走战利品，也总得背负污名。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_EW6
    quote_hash: B41FDFA8EA8442F44EAAAA22F246FCA5600C37D9EF3E12BB1C140F9817D7A984
    quote: “我们卑劣地拿下了拉革塔，却没有流什么血；我们光荣地攻下了洛塔什，却让这里流血漂橹。”他在事后这么说道，“这两件事将会成为我们名誉的污点，胜利者将拿走战利品，但也总要背负污名。”
  expressions:
  - id: expr.town-rhotae-2-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 萨拉庇俄斯自己把话说透了：拉革塔拿得不体面却没死人，洛塔什打得体面却血流成河。他是个怪人——胜仗打完，先记下的是自己那笔污名。
    sources:

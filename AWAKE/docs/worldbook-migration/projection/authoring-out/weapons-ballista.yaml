      zh-CN: 弩砲是围城里最务实的一种器械：扭力束、箭槽、扳机，就三部分。造起来门槛低，坏了现场换件就能接着用。它射出来的箭跟人胳膊那么粗，对士兵很有效，也能从远处狙杀单兵；但它火力不算密，箭飞不远，想靠它把对面的冲车打烂是不行的。

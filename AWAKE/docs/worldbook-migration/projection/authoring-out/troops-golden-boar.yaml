    layer: rumor
    text:
      zh-CN: 瓦兰迪亚那帮野猪？一群披着人皮的畜生。当兵当傻了，除了杀人放火什么都不会。听说他们连自己家乡都待不住，被赶出来才当的雇佣兵。到处跑，稍不顺心就掀摊子揍人。那些老爷还花钱请他们打仗，打完仗就撒在乡里不管了，遭殃的还不是咱们这些种地的。
    sources:

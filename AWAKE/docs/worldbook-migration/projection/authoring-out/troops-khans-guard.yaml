    text:
      zh-CN: 可汗卫士是我们库赛特的骄傲，是草原上最锋利的刀。他们每一个都是从各部族里挑出来的顶尖射手——能在全速奔驰的马背上射中三百步外的草靶，能在马镫上转身射箭，能在暴风雪里辨别方向。他们的刀是弯的，抽出来的时候像一道银月。草原上的人都知道，见到可汗卫士的旗帜，要么下马行礼，要么赶紧逃命。

      zh-CN: 皇家侍卫值得尊敬：盾墙能挡弩矢，剑术不差。可平原上他们腿慢——再硬的盾墙，也是方旗骑士的猎物。海上另算，那股从小跟风浪搏出来的悍勇，咱们也头疼。

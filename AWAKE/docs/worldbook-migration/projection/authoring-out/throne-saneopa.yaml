sources:
- source_id: source.calradia.game.settlements.capitals
  source_version: bannerlord-1.3.15.110062
  source_content_hash: f166dd33c2ea6ef049d9cb5595f105d36ea55defff8ccb3a1025091f32988fa3
  locator: bannerlord.db#localization.EJZLzhJk
  quote_hash: 7BC1E16B58454BE63277609C269F44F1686B5B5A72D64005DB7659D52BAC9DB3
  quote: 萨涅俄帕坐落在一道涅维斯谷通往北方俄佛堤斯湖的低矮隘口之上。该地区的帕拉人同巴旦尼亚人一样，视湖泊为神圣之地，而俄佛堤斯湖更是被视作通往彼世的门户。人声嘈杂、百业兴旺的萨涅俄帕是卡拉迪亚内陆重要的贸易中心，同幽暗寂静的湖水形成了鲜明对比。
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_萨涅俄帕__萨涅俄帕.json#/Variants/0/Content
  quote_hash: 287D11C54A71B3911B3170016180A2304A2AEC38BCD5812C3DD281B0DC7DC741
  quote: 萨涅俄帕是帝国首都，听说现在迁都到吕卡隆了
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_萨涅俄帕__萨涅俄帕.json#/Variants/1/Content
  quote_hash: BE3B105D189185D60A3169743124E4D6D9CDA44D001E51EACA89FAB2DC9BA987
  quote: 萨涅俄帕是我们光荣的帝都，虽然在涅雷采斯之后就迁到了吕卡隆，但这只是暂时的，等到帝国一统，我们就把迁回萨涅俄帕。应该吧？
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_萨涅俄帕__萨涅俄帕.json#/Variants/2/Content
  quote_hash: EE532DC62C796F310DFBF2E722A3DA79FF7C19754706D830D3588DF46D7F99A4
  quote: 萨涅俄帕是传统帝都，我们从巴拉维诺斯迁都到这里已经三百多年了
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_萨涅俄帕__萨涅俄帕.json#/Variants/2/Content
  quote_hash: C0FF279FABB1CBFB4F2EDBC88477D454ADD428C886BF5A11C06DD5F3A180720B
  quote: 如果帝国重归一统，我们依旧希望将帝都迁回萨涅俄帕
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_萨涅俄帕__萨涅俄帕.json#/Variants/3/Content
  quote_hash: 732CADB161FC8C3A65D613AF05EA4944E0711E6AF7CF2DF8CA5CDAA3C3A721D8
  quote: 我们从来不希望将都城迁回萨涅俄帕，因为迁回去，我们在新都培育的势力就全没了
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_涅雷采斯__涅雷采斯.json#/Variants/1/Content
  quote_hash: 67B493707BE6247FF6B1B01B4809323CA69C4F4A1A751EC0AAC9DE2C72EA2865
  quote: 现在他们家还在北边当大官，听说住在萨涅俄帕，那城可大了，城墙比我们村子的地界还长。
- source_id: source.calradia.game.settlements.capitals
  source_version: bannerlord-1.3.15.110062
  source_content_hash: f166dd33c2ea6ef049d9cb5595f105d36ea55defff8ccb3a1025091f32988fa3
  locator: bannerlord.db#settlements.town_EN3.owner
  quote_hash: 9467F6804D841A053C0D1FE5276C87DAA61A41E26E510EC288EC594A16D41926
  quote: Faction.clan_empire_north_3
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_涅雷采斯__涅雷采斯.json#/Variants/0/Content
  quote_hash: AB336980AECAE6B4F85B1E62CBC0A68B4FC0549043E0839CA779EFD195F5F098
  quote: 因为萨涅俄帕在他手里。那座城的城墙厚得连斯特吉亚人的攻城锤都砸不穿，商路从萨涅俄帕辐射出去，半个北帝国的粮食都要经过他们的地盘。
- source_id: source.calradia.game.settlements.capitals
  source_version: bannerlord-1.3.15.110062
  source_content_hash: f166dd33c2ea6ef049d9cb5595f105d36ea55defff8ccb3a1025091f32988fa3
  locator: bannerlord.db#localization.04xAg0yN
  quote_hash: 8EA08BDFE8A6B2A53D5033576D2ADF6EC7C0A105181AD2640B607605CA9837E0
  quote: 彭同·涅雷采斯是已故皇帝德洛修斯·涅雷采斯的儿子，后者在潘德拉克战役中战死。虽然通常情况下皇位是父死子继，但那只是约定俗成的习惯，而非律法，因此元老院选择由阿雷尼科斯将军继位。绝大多数皇帝都会致力于肃清对皇位有潜在威胁的隐患，然而阿雷尼科斯在权衡了个人利益和帝国团结之后，选择留彭同一条活命。由于涅雷采斯家族一直以来就属于寡头阵营，因此彭同在内战中选择支持卢孔。
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_涅雷采斯__涅雷采斯.json#/Variants/4/Content
  quote_hash: 1C237E5AC9F25D2CD8D9A6D4926CA43E7EC034D75662540ECC1C9234D25E0C0C
  quote: 转而以萨涅俄帕为根基深耕元老院政治。

assertions:
- id: assertion.weapon-head-mail-coif-1
  revision: 1
  kind: fact
  text:
    zh-CN: 链甲围帽是一顶铁环编成的软帽，包住头顶、耳根与后颈，能随头形贴合。单戴时护头只有十九与二十，重量在一点五到一点七公斤之间，比同防护的铁壳轻；但它真正的用处是当第二层——垫在锅盔、护鼻盔或头盖盔底下，把壳子护不到的颈侧与后脑补上，两层的护头加起来能翻一倍还不止。
  sources:
  - source_id: source.calradia.game.items-head

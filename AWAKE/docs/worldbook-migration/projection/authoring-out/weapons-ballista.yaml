- id: assertion.ballista-1
  revision: 1
  kind: fact
  text:
    zh-CN: 弩炮是围城战中的扭力投射武器，结构就三部分：扭力束、箭槽、扳机——扭力束用畜力筋腱或发绳绞紧，蓄能效率稳定，扳机释放结构简单可靠。优点是制造门槛低，损耗部件可现场替换：扭力束断了用备用的绞绳重上一遍就行，箭槽开裂找块硬木刨平了接着用。它能以致命的效率发射弩矢，对士兵很有效，在对抗敌方远程器械时很有效，亦可从远处狙杀敌军单兵；局限是火力密度不够，杀伤效率比不上弓箭手齐射，而且对攻城器械的结构破坏可以忽略不计。

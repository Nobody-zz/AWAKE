sources:
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.bhxVA9w7
  quote_hash: C844C912B02C36044764F52975B6861CB5EF007E92DAB1EDEC7E31BCACC0F326
  quote: 皇帝阿雷尼科斯在潘德拉克战役的惨败之后废除了最后一支帝国常备军，转而依赖开销更少、更适合控制领土的执政官私兵，被弃者军团在这样的局势下成立。而这支军团则是由厌恶这种变化的人所组成：他们偏爱昔日的军团，及其规矩、历史与军营生活，他们指责新制度正在摧毁帝国。但无饷不成军，所以他们会同时与帝国领主和外国领主签订契约。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/0/Content
  quote_hash: 2952894C27FCC50F03FF08621B3EE971DEE8361BD7723566D6778F622A224860
  quote: 阿雷尼科斯皇帝上位后做了一个冷酷而务实的决定：废除常备军，改由执政官和贵族自行组建私兵，谁的地盘谁养兵，谁的兵谁带去打仗
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/0/Content
  quote_hash: 65F559485125F3C2E0EE529352838730095BD22592BE6B18FFCDAA2DDD22104F
  quote: 帝国分裂成三块，军队改革不一定是根本原因，但它一定是那根点燃引线的火柴
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/1/Content
  quote_hash: BCC776EFBB2CCB2AA77636AE15042612DD8E9A91CC7562FD50D833BEC8760624
  quote: 以前士兵是为帝国打仗，现在是给他们的领主打仗
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/1/Content
  quote_hash: 7CF6086C2DF3A821827AABFD4D9047630699A62D19CF0945E3366FFA75ED7CBB
  quote: 领主出钱养的兵，凭什么对皇帝比对领主更忠诚
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/3/Content
  quote_hash: FA09D214CF303796AF613602A3CAD4E948EC6AB68689E9F50BD287DEA2BFB325
  quote: 我在乎的是发饷的那个人能不能赢。他赢了，我的饷就继续发；他输了，我得赶紧换个雇主
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/2/Content
  quote_hash: 0C9CC977E1700808BF3D72EB7F577CEE0D3C1183509F9686645629D541EF39A0
  quote: 南方的执政官们各自组建了自己的私兵，我们的军费来自奥尼石山的银矿和吕卡里亚平原的粮食
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/2/Content
  quote_hash: 3F0B698EB4EA288F0F34FCE454860236F852596ADF44353D5C0434C2227FEFB8
  quote: 只要银矿还在，只要坎特里翁军马还在吕卡里亚平原上奔跑，南帝国的军队就不会散
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/4/Content
  quote_hash: 20B51F3B20E586CEE7EA1FB996029F27DC6F3D86266F3E9E6F854C8E9E8C500B
  quote: 我们依赖的是元老院家族之间的默契和制衡
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/4/Content
  quote_hash: 52CD557291693387DE89EFBEDDD0084363B24CB7E26794694949EAE6D7355FF1
  quote: 但优点是一旦达成一致，北方各家族的兵力汇合起来，不输给任何人
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/6/Content
  quote_hash: F8D457F0D61F06C87B36F7E05DFB6CA986F4726575983C7E0008D91CC951BF46
  quote: 西帝国的军事制度骨子里就是老兵政治
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/6/Content
  quote_hash: 3B67C8799AD7641F0AF801BD1FB0AFA51631349B2B777CB0ED7153033B6F2AB1
  quote: 老兵们对加里俄斯的忠诚是基于个人威望，不是制度
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/7/Content
  quote_hash: 2D240515A307396D824410C27850D78AE115390C17759E2C6D33EEFA86B346A8
  quote: 等我们这批人打不动了，谁知道西帝国会怎样
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/8/Content
  quote_hash: B75E01F337F271A7D3905F270628E8570357E3883B2DA157DA92AD460D7AF5BB
  quote: 帝国人的军事改革在我们瓦兰迪亚人看来就是自废武功
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/9/Content
  quote_hash: 65899B26F358FE459F9DB3BE4D92ADD4C16E8968704F302AB1DB4534A740FA69
  quote: 但他们的持久力不行了。贵族养兵养不了太久，打仗时间一长，军饷就开始拖欠，士兵就开始开小差
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/10/Content
  quote_hash: 31D58C359C07270A9508E632501B43C13ECBE3B1A778751A7D6CDEC61F84F1DB
  quote: 改革之后，每个省自己管自己的防区，防区之间全是漏洞
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/11/Content
  quote_hash: 1E1ED8B88EDA7FEAD3DD7E1ECACCC0B2D38CD688258948C1AC7F508A65612E6F
  quote: 一个帝国没有自己的军队，要靠贵族们各自出钱养兵，这算什么帝国？这就是部落联盟
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/12/Content
  quote_hash: 2B4F99F4A99440C72AE869808D31A3899712E6B89D2F03B01944EA2E64B43F5E
  quote: 将军事改革定性为帝国分裂的'催化剂'比'根本原因'更为准确
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_帝国军事制度__帝国军事制度.json#/Variants/12/Content
  quote_hash: 71835B295ED3A8155948FACF3C65D605A0CCDE00A78E042BDA0FA5EFF132A679
  quote: 军事改革以极快的速度为分裂各方提供了武力基础
authority:
  owner: awake_canon
  conflict_policy: canon_wins
assertions:
- id: assertion.empire-system-1
  revision: 1
  kind: fact
  text:
    zh-CN: 帝国的军事制度经历过一场伤筋动骨的变革。潘德拉克战役之前，帝国依靠的是常备军团——由国家财政供养、统一训练、统一指挥的大兵团，那支军队曾征服卡拉迪亚大半土地。潘德拉克耗尽了一切：国库被掏空，精锐军团损失惨重，兵源与财政双双枯竭。阿雷尼科斯皇帝上位后做出一个冷酷而务实的决定：废除常备军，改由执政官和贵族自行组建私兵，谁的地盘谁养兵，谁的兵谁带去打仗。这一刀砍下去，帝国的财政压力确实缓解了；但从此以后，帝国军队不再是皇帝的军队——它是大大小小的执政官和贵族们各自的军队。
  sources:
  - source_id: source.calradia.game.lore.war3
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
    locator: bannerlord.db#localization.bhxVA9w7
    quote_hash: C844C912B02C36044764F52975B6861CB5EF007E92DAB1EDEC7E31BCACC0F326
    quote: 皇帝阿雷尼科斯在潘德拉克战役的惨败之后废除了最后一支帝国常备军，转而依赖开销更少、更适合控制领土的执政官私兵，被弃者军团在这样的局势下成立。而这支军团则是由厌恶这种变化的人所组成：他们偏爱昔日的军团，及其规矩、历史与军营生活，他们指责新制度正在摧毁帝国。但无饷不成军，所以他们会同时与帝国领主和外国领主签订契约。

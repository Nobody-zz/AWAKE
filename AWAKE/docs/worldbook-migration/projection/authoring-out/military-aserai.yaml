    quote: 不是他们多能打，是他们便宜，死了主人再买，跟买马似的
  expressions:
  - id: expr.aserai-outland-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 阿塞莱的兵？跑商的人说他们那边的骑兵分两种：一种是贵族老爷，骑好马，披铜甲，扔的标枪跟投矛似的，扎进肉里拔都拔不出来；另一种是买来的奴隶兵，从小养大就为打仗，骑射厉害，箭射完了拔刀就砍，不怕死。他们步兵不行，两条腿扛盾的挡挡箭还行，真打起来骑兵一冲就散。最让人发怵的是那些奴隶兵——不是他们多能打，是他们便宜，死了主人再买，跟买马似的。

  - id: expr.druzhinnik-soldier-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我从瓦良格做起，当了几年步兵，又在资深瓦良格的位置上磨了几年，才有资格骑上这匹马。上马那天，波耶亲手把缰绳交到我手里。我们骑马不是为了好看，是为了更快地冲到需要我们的地方。但骨子里我们还是步兵——下了马，架起盾，照样能打。
    sources:

  expressions:
  - id: expr.druzhinnik-empire-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 斯特吉亚的亲卫骑兵比他们的重步兵灵活，能在侧翼制造麻烦。不过他们的马矮小，冲锋没有那种碾碎一切的气势。但有一点值得警惕：这些骑兵是从瓦良格升上来的，下马之后照样能打——我们的重骑兵要是落了马，基本就完了。在北方那种地形里，这种素质很要命。

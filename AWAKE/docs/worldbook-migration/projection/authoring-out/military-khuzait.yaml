      quote: 这头是怯薛和可汗亲卫，那头是牧民征召兵，中间是达尔罕和枪骑兵在平衡
    grants:
    - profile_id: profile.noble
      scope: elite
      min_detail: detail
    - profile_id: profile.merchant
      scope: faction
      min_detail: detail
    denies: []
  - id: expr.military-khuzait-rabble-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 「杂牌军」是没正式归附的城镇村庄被摊派来的兵员——装备简陋没训练，唯一的指望是汗国精锐骑兵赶紧来解围，之前先保住自己的命。
    sources:

  - id: expr.empire-system-north-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 北帝国的军事力量建立在元老院控制下的贵族私兵体系之上。阿雷尼科斯废除常备军后，北方的执政官们是最快完成转型的——我们的家族几代人在元老院里斗来斗去，早就习惯了自掏腰包养亲兵。卢孔陛下本人就出身元老院，他对这套规则再熟悉不过。北帝国的军队不像南帝国那样依赖银矿，也不像西帝国那样依赖老兵，我们依赖的是元老院家族之间的默契和制衡。缺点是动员速度不如另外两家快——元老院的决策嘛。但优点是一旦达成一致，北方各家族的兵力汇合起来，不输给任何人。

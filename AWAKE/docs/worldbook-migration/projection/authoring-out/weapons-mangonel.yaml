  - id: expr.mangonel-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 投石车是围城战中最有价值的重型器械。我从军需册上看过它的造价，不算便宜，但物有所值。弩炮打人有余拆墙不足，火焰弩炮更是隔靴搔痒；投石车不一样，一石球砸在冲车顶盖上，轮轴能直接砸进地里。葡萄弹的战术价值更高——我方步兵推进前，一蓬碎石铺天盖地洒在敌人阵地上，对面挡箭板和散兵坑全不成样子，阵线不等接敌就碎了。但软肋也明显：运输笨重，几头牛才能拉动一台，调动起来伤筋动骨。围城战最后见分晓的是步兵登城，不是投石车——但登城之前谁把城头垛口砸稀烂了，谁的步兵就能少死一半人。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_投石车__投石车.json#/Variants/0/Content
      quote_hash: 2CAC3D04E3CA20F6283D947D196C84FB34AF47156BD1E85D7589DA29BA004973
      quote: 葡萄弹的战术价值更高
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_投石车__投石车.json#/Variants/0/Content
      quote_hash: 58FD346867DEF1FF1EB9AFBFBED4B4066CD027BC4309A8871C8E709D2544E769
      quote: 但登城之前谁把城头垛口砸稀烂了，谁的步兵就能少死一半人。这笔账我算得清
    grants:

    revision: 1
    layer: detail
    text:
      zh-CN: 斯特吉亚的做法是把这一路加厚再往下垫。护鼻钢帽护头三十五；重型鼻护盔外面再裹一层，垫皮革与垫填充帽都是四十八，垫链甲则到五十一。同一顶壳子靠垫层分出三档价钱，这是北地铁匠的看家本事。

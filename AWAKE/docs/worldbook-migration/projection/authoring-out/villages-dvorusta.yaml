    layer: detail
    text:
      zh-CN: 德沃鲁斯塔以激流捕鱼为业——临崖下钩、就水收网；鲑鱼最俏，鲱鳕多腌藏，鲜鱼走湾内快到集，汛期一过即修网补崖道。

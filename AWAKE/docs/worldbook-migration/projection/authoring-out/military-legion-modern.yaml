  - id: expr.modern-legion-battania-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 帝国人的现代军团，就是让有钱的贵族自己招兵买马。这和我们巴旦尼亚的氏族兵差不多，每个伯爵都有自己的战士。但我们的伯爵是氏族推选的，他们的执政官是皇帝任命的。皇帝亲手把兵权分给了自己任命的人，然后又管不住他们，这才是最可笑的地方。

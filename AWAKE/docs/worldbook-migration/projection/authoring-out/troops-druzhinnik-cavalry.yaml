  - id: expr.druzhinnik-khuzait-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 斯特吉亚的亲卫骑兵马太慢了，我们的骑射手能绕他们放箭放到天黑。但他们从步兵打上来的底子厚，不像帝国骑兵一落马就废了。而且他们手里还有飞斧，靠太近了冷不防挨一下可就不好玩了。

  revision: 1
  kind: rumor
  text:
    zh-CN: 群岛的雾、罗盘和石刻故事属于船员传闻。
  sources:
  - source_id: source.calradia.chronicle.shalas-bay
    source_version: download-20260903
    source_content_hash: 94cfdb418327b295dbd00bd4a97b937e329265c3c1c67ef25c75500a7e80b99b

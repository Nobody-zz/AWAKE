    quote_hash: A0E4B2D030A8D7800C3148FE32AF9A8CF187E8423597445AE1571B63F44BEA58
    quote: 根据传说，巴尔加德公主阿基娜的丈夫被雷维尔人杀死，但她接受了敌国国王的提议，与其结为连理以解决这一争端。
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_S7
    quote_hash: 97286500000EA65E6F79D1A2B538424CBFD030E0C166808AF724ED3AA944FCA2
    quote: 然而，在新婚之夜，她堵住了厅堂的大门，将国王和他的一百名族人与勇士活活烧死在里面。
  expressions:

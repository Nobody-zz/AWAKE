    revision: 1
    layer: detail
    text:
      zh-CN: 兽首头帽以整张兽皮连头骨做壳，狼首护头十六、熊首护头二十四，重量都不轻——壳厚在口鼻处最要功夫，得留出视孔又不能让它塌。会做这个的皮匠不多，多半是猎户自家传的。

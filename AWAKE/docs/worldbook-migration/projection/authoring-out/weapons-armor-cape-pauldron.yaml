  - id: expr.weapon-armor-cape-pauldron-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 肩甲分两路：一路是整块的铁片，一路是鳞片叠缀。整块的护值低但硬，鳞缀的软、跟着胳膊动。价钱差在錾花上——素面五枚银币，錾花的能到二十枚，一样的护值。
    sources:

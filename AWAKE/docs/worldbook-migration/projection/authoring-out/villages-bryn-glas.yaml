  - id: expr.village-bryn-glas-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 布林·格拉斯以崖坡酿酒为业——日照烈、排水快，酒色深；酒按年份与浓淡分等，外销瓦兰迪亚与帝国，买家常年预定大半。

summary:
  zh-CN: 帝国军事制度：以潘德拉克战役为分界——此前是国家财政供养、统一训练指挥的常备军团，此后是执政官与贵族自掏腰包组建的私兵。这一刀缓解了财政压力，却让军队不再是皇帝的军队，而是大大小小执政官和贵族各自的军队；三个帝国沿用同一套制度，但在维持私兵凝聚力上各有各的办法，共同弱点是缺乏可持续的中央财政与制度化兵源。

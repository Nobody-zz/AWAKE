- id: assertion.battania-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 外族对巴旦尼亚这套原始动员的评价并不轻视：帝国人吃过亏——他们的重步兵一进森林就被射成刺猬，潘德拉克那天长镰兵进入战斗后帝国阵线就崩溃了，很多帝国老兵至今还会做噩梦；斯特吉亚人认它跟自己有点像，都是部落出兵、步兵为主，但巴旦尼亚更信弓箭和森林，最大软肋是部落之间的协调——伯爵们要是互相有仇，至高王喊破嗓子他们也不来；瓦兰迪亚人点出它没有骑兵这一最大弱点，但也承认它聪明，从不在平原上正面打。
  sources:

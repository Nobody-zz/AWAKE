summary:
  zh-CN: 皇家侍卫（Huscarl）：北方最精锐的重装剑盾步兵——重甲、大圆盾、长剑侍卫矛、投掷飞斧；纪律严明，盾墙坚不可摧；自幼与海浪为伴，海战跳帮尤称无敌。各文化对其评价迥异。

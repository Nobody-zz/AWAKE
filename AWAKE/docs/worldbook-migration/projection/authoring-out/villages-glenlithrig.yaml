  - id: expr.village-glenlithrig-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 格伦利斯里格以溪谷林材为业——湿谷树密、材种杂；木料按材与龄分等，专供两座要塞城镇，山路难走，冬季伐木、雪化后外运。

  quote_hash: E6311DD7455583A54B94365FA93A5BD41931E536C262DC2559B02A5E5BF177C5
  quote: 雷维尔是怪石嶙峋的卡恰尔半岛上的一座重要城镇，同时也是巴尔加德的传统对手。根据传说，巴尔加德公主阿基娜的丈夫被雷维尔人杀死，但她接受了敌国国王的提议，与其结为连理以解决这一争端。然而，在新婚之夜，她堵住了厅堂的大门，将国王和他的一百名族人与勇士活活烧死在里面。这场争端后来通过一系列的条约和联姻解决了，也迎来了其乐融融的结局，但雷维尔人依旧对巴尔加德扶摇直上的贡达罗夫王朝心怀憎恨。

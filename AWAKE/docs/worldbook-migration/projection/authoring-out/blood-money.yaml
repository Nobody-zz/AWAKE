assertions:
- id: assertion.blood-money-1
  revision: 1
  kind: fact
  text:
    zh-CN: 卡拉迪亚的律法允许用一笔钱抵命，这笔钱叫赎罪金。判下的罚金也一样——交不出第纳尔，才轮到别的处置。
  sources:
  - source_id: source.calradia.game.urban-dark
    source_version: bannerlord-1.3.15.110062
    source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
    locator: bannerlord.db#localization.z4RgNBkq
    quote_hash: 04E09BC8D8812462A0B9E2BFBA9628CF104EC0826DC53FCA1C5D7E39C5556D4D
    quote: 当你离开村庄时，长老带着一伙人拦住了你。他们指着你队伍中的{TROOP_TYPE}——一名骁勇善战但性格孤僻的士兵。村民们声称他曾是这个村子的农夫，但在一次因界碑而引发的争端中杀害了邻居，随后便逃之夭夭。士兵突然激动地反驳道，那个骗子死有余辜。根据法律，杀人者需偿命，但在当地也可用赎罪金抵命。
  - source_id: source.calradia.game.urban-dark

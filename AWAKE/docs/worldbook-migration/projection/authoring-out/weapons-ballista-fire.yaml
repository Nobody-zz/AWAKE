      zh-CN: 火焰弩砲就是在普通弩砲的基础上做低成本火攻改装：弩箭前端加上浸油麻布，射出去带着火。技术上几乎没有额外门槛，弩箭飞起来也跟原来一样。它烧的是对面的围城器械和木制建筑，对人的杀伤还是那些，多出来的是那股吓人的声势。

  text:
    zh-CN: 火焰投石车是普通投石车的火攻型号：投掷装满帝国火的罐子，将投石车本身的致命威力与火焰结合，投射物具有爆燃性，能够有效摧毁敌方围城器械以及破坏城墙。它的代价在于弹药——开花弹太贵，配火油的料要从南方运，制弹的陶罐得像瓷器一样烧、还不能有砂眼；而且没有存货，现烧现装现打，打完一批要等下一批。

  expressions:
  - id: expr.empire-system-south-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我们的军队是在吕卡隆的废墟上重建的。阿雷尼科斯皇帝改革之后，南方的执政官们各自组建了自己的私兵，我们的军费来自奥尼石山的银矿和吕卡里亚平原的粮食。拉盖娅女皇沿用了这套制度，她没法恢复常备军，因为南帝国的财政养不起。但她比另外两个皇帝都更擅长一件事：让手下的执政官们相信，她的利益就是他们的利益。只要银矿还在，只要坎特里翁军马还在吕卡里亚平原上奔跑，南帝国的军队就不会散。
    sources:

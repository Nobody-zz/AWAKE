    text:
      zh-CN: 我们就是所谓的农奴。其实我们过得挺好的——一周也就去领主老人家的地里干一两天，其余时间都是自己的；老爷还给我们份地，交完公粮剩下的都归自己。每个月还能进城一次，多自由？

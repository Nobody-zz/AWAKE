  - id: expr.weapon-armor-shield-heater-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 扇形盾是骑士的体面：盾面正中漆家徽，边上一圈颜色分长幼。比武用的那种更厚，重型扇形盾到十七；实战的反倒轻，因为要一手持矛——比武用的那种到二点四公斤就已算重了。刻口的那一款是专门为长矛留的，举矛时盾不挡视线。

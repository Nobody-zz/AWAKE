assertions:
- id: assertion.weapon-armor-cape-shoulders-1
  revision: 1
  kind: fact
  text:
    zh-CN: 软甲护肩与背带是披挂位里真正干活的那些：皮护肩、链甲护肩、缀钉护肩，以及在胸前交叉的皮革背带，护值一到十五。它们不像金属肩甲那样显眼，却是重甲穿戴的基础——链甲贴肉会磨破，靠背带把分量匀到肩上；帝国瓦兰吉式的装饰背带更在皮带上缀鳞片或环甲，护值十四。

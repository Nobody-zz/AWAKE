    grants:
    - profile_id: profile.merchant
      scope: faction
      min_detail: detail
    denies: []
  - id: expr.lake-tanaesis-fish-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 湖里鱼多，渔村一根接一根的下网。老人讲湖心见过比船还长的梭鱼——信不信由你。

assertions:
- id: assertion.weapon-armor-torso-cloth-1
  revision: 1
  kind: fact
  text:
    zh-CN: 布袍与束腰衣占了卡拉迪亚衣物的大半：托加、连衣裙、长衫、束腰衣，护值二到二十五，材质几乎全是布。厚薄是唯一的差别——重磅束腰衣用粗线密织，护值七；帝国托加是整幅布裹出来的，护值八。它们与平民便服的区别不在形制，而在穿的人与场合：这套更常出现在城里、席上和队列里。

  - id: expr.druzhinnik-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 斯特吉亚的亲卫骑兵骑的那种矮脚马，我们的方旗骑士看了就想笑。在平原上，一个冲锋就能把他们撞飞。但在北方的雪地和林地里，我们的竞技马跑不动，他们的矮脚马却灵活得很。而且他们下了马还能打，我们落马的骑士可没那个本事。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913

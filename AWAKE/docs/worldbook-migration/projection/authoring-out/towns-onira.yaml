- id: assertion.town-onira-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 萨尔培娅是元老之女，被一位帕拉酋长掳回此地的要塞；数年后帝国军兵临城下，她因襁褓中的儿子而请求撤军——她那可怕的丈夫扬言宁可把孩子摔下城墙。故事说军团退了，而那男孩长大后加入帝国，弑杀了生父。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_ES5
    quote_hash: 97C5F44005A5F789850FA32AD048B5EA3CAE31CF048B33C11CEC3B18F1E0891B
    quote: 萨尔培娅是一位元老的女儿，她被一位帕拉酋长掳走，带回到他在此处的要塞。
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_ES5
    quote_hash: 7AB6D24493D934B50EDE417C61B6BD03C44FF9F2DD1B19D623A0AE595DCF7471
    quote: 故事中说军团撤退了，但那男孩成长为一名战士后加入了帝国，并弑杀了自己的生父。
  expressions:
  - id: expr.town-onira-2-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 都说萨尔培娅是元老的闺女，叫帕拉酋长抢到这座要塞里。后来帝国兵来救她，她反倒求他们退——她男人说了，宁可把孩子从城墙上扔下去。故事说兵真退了，那孩子长大后进了帝国，把他亲爹杀了。
    sources:

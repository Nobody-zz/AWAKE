assertions:
- id: assertion.modern-legion-1
  revision: 1
  kind: fact
  text:
    zh-CN: 现代军团指的是阿雷尼科斯皇帝改革军制之后的帝国军队：潘德拉克战役惨败后，皇帝废除了原有的帝国常备军，改用由执政官和贵族自行组建、开销更低、更适合控制领地的私兵。这一改革大幅削减了军费，但让军队从国家手中转移到了地方领主手中。此外，帝国边缘大草原上的自由民（厄琉忒耳）最初是逃亡奴隶和负债者的后代，因熟悉边境而受帝国指挥官重视，其年轻人也被招募为执政官和皇帝们的私兵。
  sources:
  - source_id: source.calradia.game.lore.war3
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
    locator: bannerlord.db#localization.9qAWNBvA
    quote_hash: F63E0CC5F2FAAC9B817DBA279B7722B7A7E87DBBEC417A13053CF58D6C977A9F
    quote: 自由民，又名厄琉忒耳，生活在帝国边缘的大草原上。他们最初是逃亡奴隶和负债者的后代，但很快因为对边境地区的了解而受到当地帝国指挥官的高度重视。他们的领袖被授予头衔，年轻人也被招募为执政官和皇帝们的私兵。但是，尽管他们现在非常忠诚于帝国的理念，对于帝国的实际权威却仍充满敌意。

assertions:
- id: assertion.weapon-head-cheekguard-1
  revision: 1
  kind: fact
  text:
    zh-CN: 护颊盔是一顶圆钢帽，两侧各垂下一片弧形护板，把耳朵与腮帮包住；护头值位于三十一到四十一之间，材质一律为板。这一形制在卡拉迪亚只有一个出处——全部九件都出自巴旦尼亚，出了山地就再看不到。同一形制分钢与铜两版，另有穗饰与脊状两类装饰变体。
  sources:
  - source_id: source.calradia.game.items-head
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 45887F4A4963E921A9C498B871009749C5B0BD65E1FE8D7B3885E660FDDE0A7F

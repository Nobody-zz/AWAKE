    layer: detail
    text:
      zh-CN: 以亚基斯的水利是命脉——暴雨积攒灌溉系着绿洲存续；卡拉兹家族（旧雅喀俄斯帝国哨站）五十年前押注联姻纳哈撒，如今在御前会议有一席，做当地买卖绕不开他们。

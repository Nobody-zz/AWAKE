assertions:
- id: assertion.weapon-head-nasal-1
  revision: 1
  kind: fact
  text:
    zh-CN: 护鼻盔的本体是一顶圆顶或微尖的帽壳，后沿向下包住颈项，正面垂一根铁条压到鼻梁——砍向面门的刀会先撞上这根铁条。护头值从十八一路做到五十一，取决于壳厚与垫层。帝国的军团盔是这一路的正统：壳薄、铁条细、重量轻，配给军团步卒；斯特吉亚的护鼻钢帽壳更厚，还惯于在底下垫皮革、填充帽或链甲。
  sources:

    text:
      zh-CN: 镶钉皮马甲是库赛特与巴旦尼亚的常见打扮：皮片拼缝、铜钉压边，护值八，比布衣强，比甲轻得多。林地服更厚，护值十四，用整块软皮裁成，上了山不必另加护具。林子里的旧货摊上，一件这样的皮马甲能换两把镰刀。

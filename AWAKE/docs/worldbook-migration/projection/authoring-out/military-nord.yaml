assertions:
- id: assertion.nord-1
  revision: 1
  kind: fact
  text:
    zh-CN: 诺德军队以盾墙战术为核心：重装步兵是盾墙的骨头，锁甲配圆盾站前排；铩戟兵站第二排，长柄兵器专治对面冲过来的骑兵和重步兵；投斧手在开打前往对面扔一轮，打散他们的阵型；双手斧战士近战爆发力惊人，但几乎没有防御，纯粹依赖盾墙掩护和一次性冲锋。弓箭手是他们的软肋——北方林子不长好制弓的木料，弓软、射不远。至于骑兵，他们没有：马在船上站不稳。他们真正的本钱是船——长船能把整支军队送到敌人背后，这种战略机动性大陆上没有第二家。护盾兄弟会是吃合同饭的雇佣兵，跟王国没绑在一起。

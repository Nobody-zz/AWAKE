  - id: expr.weapon-armor-torso-lamellar-khuzait-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 铜的扎甲衬链甲四十六，是这一路里最重的一件。铁片镀铜，不锈——草原上雨雪多，这一点最省事。底下垫一层链甲，冲阵时挨一下不至于见血。骑兵多是先穿轻的枪骑兵扎甲三十九，攒下钱再换重的。

summary:
  zh-CN: 南帝国的军事实力：控制着卡拉迪亚最富庶的区域，易守难攻；兵力较多，马场多、骑兵也多，具装骑兵相对另外两个帝国更多。压力同样不小——东边要防库赛特，西边和北边要防两个「僭越者」。对阿塞莱方向则谋求战争以获取新领土。

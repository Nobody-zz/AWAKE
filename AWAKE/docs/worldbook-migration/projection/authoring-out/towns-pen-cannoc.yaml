- id: assertion.town-pen-cannoc-3
  revision: 1
  kind: interpretation
  text:
    zh-CN: 渔人之间这套传言，出自对特朗河上游的敬畏——石面滑腻，一步踩错便落入急流。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_B5
    quote_hash: EF6E3AF971A84043C819E85D573944CF854A3CFD33F573EDD802A08858CF4FE3
    quote: 当然，这些渔人口里的传言只是出于对特朗河上游的敬畏，因为在滑腻的石子上着错一步脚，人就会掉落到湍急的水里。
  expressions:
  - id: expr.town-pen-cannoc-3-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 彭·坎诺克的女神传说，是行船人的规矩来源——雇船先敬河，纠纷少一半。这层说法的底子是：石面滑，人下去就上不来。
    sources:
    - source_id: source.calradia.game.settlements-desc
      source_version: bannerlord-1.3.15.110062

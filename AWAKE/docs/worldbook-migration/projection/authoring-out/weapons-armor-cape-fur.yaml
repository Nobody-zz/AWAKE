assertions:
- id: assertion.weapon-armor-cape-fur-1
  revision: 1
  kind: fact
  text:
    zh-CN: 兽皮披挂是整张兽皮不裁不剪、直接披在肩上，护值五到十四，材质一律为皮。它比布披风暖得多，也比布披风贵——一张熊皮要一个人拿命去换。巴旦尼亚人几乎人手一件：熊皮、狼皮、豹皮，各有各的场合；毛皮大斗篷配圆板则在斗篷背后缀一块圆铁板，护值十四，算是这一路里最像护具的。
  sources:

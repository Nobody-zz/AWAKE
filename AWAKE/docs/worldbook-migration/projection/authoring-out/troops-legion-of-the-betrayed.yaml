    text:
      zh-CN: 除了打仗我什么都不会。军团解散那年我还年轻，没家，没地，没手艺。被弃者军团收了我。我们给钱就打仗，雇主的旗号换来换去，我们只认军团的规矩。早晨吹号，按时操练，犯了错挨军棍。这些规矩还在，我们就还是一支军团。

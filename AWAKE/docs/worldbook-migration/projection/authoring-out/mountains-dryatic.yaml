  - Mount Aracathos
summary:
  zh-CN: 德律亚山脉：帝国北方高大山脉，最高峰阿拉卡托斯山；山间多盐、银、铁矿，山谷为帝国北方粮仓，东北部林农仍说帕拉语。
registry_bindings:
  profile_registry_version: 1.0.0
  profile_registry_hash: 309D10583E7B4AF05F28DE2C2E67A2528CB3D6C45752369C0F7D160FABC3F3A5
  referral_registry_version: 1.0.0
  referral_registry_hash: 6E17075F1F967BE28C0437121DB50E5C30809C4EFC3D2A5F22AD9BB0B3B926CD
sources:
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_EN1_1
  quote_hash: 213CCBBDA8D7758656E581A789086EA064FF88F5E5F0975DAD1D49F70218711C
  quote: 马拉忒亚坐落于弥戎河和德律亚山脉最高峰——阿拉卡托斯山之间的狭窄土地上。当地村民是熟练矿工，从附近的悬崖边开采铁矿石。
- source_id: source.calradia.chronicle.animusforge.geography2
  source_version: animusforge-20260913
  source_content_hash: 386587a2fdf8b9bfdde96ae07f269482c98a11a87fcc816f86a39d07800c9560
  locator: rules/rule_德律亚山__德律亚山.json#/Variants/0/Content
  quote_hash: 31BDA51EB097D61360F6B6D9AA56C3B97DD4147F660C3BD67FCBEE78C64CBD5D
  quote: 德律亚山是帝国北方的一组高大山脉，山体呈红色，因富含铁矿脉而得名，与曾居于此地的德律亚人共享同一个古老名称。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_EN6_1
  quote_hash: 419823E7DA37C821C945369E7C580757AD10EDCCF9B7767D561566CA2FD3429F
  quote: 阿塔科尼亚坐落于德律亚山脉前的一片高原上。从山上奔流而下的溪流冲刷出山坡上的盐矿沉积，当地居民便对这些盐矿进行开采。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_EN2_2
  quote_hash: 5796C3F6C87AED9F63E81BCBAD68214967D87FC84877370275BF5B41F361B773
  quote: 耶拉科斯坐落于德律亚山脉北部山麓的草场上。已被开采了几个世纪的矿井仍然蕴藏着丰富的矿石，人们可以通过各种巧妙的技术从中提取银。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_EN1_2
  quote_hash: BC8DFB49F97B23426315BFD2B371C0E212927A921E5DFF31279F275461C66113
  quote: 斯塔堤摩斯位于德律亚山脉高耸山脊下的一条狭长山谷中。高地的溪流灌溉着山坡上的沃土，使该地区成为了帝国北方的“粮仓”之一。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_EN5_1
  quote_hash: B6E222F65E261401CF47B700313FDB42A770B3CAC2838CF3E6DD9E3768134D03
  quote: 威亚罗斯坐落于帝国东边德律亚山脉东侧的缓坡上。尽管山坡基本覆盖着山毛榉和橡树林，这里还是能产出很好的马草，而且此处自古以来就是帝国军马的育种地。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_EN3_1
  quote_hash: E265E230DD4F8A96384B104312ABF50639175CE92F28D4E34EA7E32334288D25
  quote: 雷索斯位于德律亚山脉的一片高原上。高原牛靠着这里的高地牧草茁壮成长。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_EN4_4
  quote_hash: 58B3193F50FE3EDA52766620EE0C3BB655EB87073415DEAADED6969472E47179
  quote: 赫塔尼亚坐落于德律亚山脉东北部的一个山嘴下。同这附近的许多村庄一样，当地的林农依然说着帕拉语。在帝国入侵之前，帕拉语是这里各部落所说的语言。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_EN3_1
  quote_hash: 87139DB7B9BF01C9D51E90B55A106DA8FCFD5EEA96AD9D99CD750D68708850A3
  quote: “大地之眼”俄佛堤斯，德律亚山脉南部山区的一片深湖，岸边就是厄诺伊萨。从北方来的充足降水润泽着这里的小麦。传说此处是古帕拉人的圣地，他们认为这片湖是通往另一个世界的门户。
authority:
  owner: awake_canon
  conflict_policy: canon_wins

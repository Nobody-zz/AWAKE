assertions:
- id: assertion.weapon-armor-torso-mail-1
  revision: 1
  kind: fact
  text:
    zh-CN: 锁甲由上千个铁环手工扣成，护值二十到四十八，材质一律为链甲。它的好处是软——能随身体弯折，刀剑滑过去而不断；坏处是重，钝器砸下来力道照样透过去。重型链铠护值三十五，帝国军团链甲三十四，巴旦尼亚名门链甲四十八，是这一路做得最密的一件。

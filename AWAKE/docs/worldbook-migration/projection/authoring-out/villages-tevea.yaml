summary:
  zh-CN: 特维亚坐落于吕卡里亚谷中平地缓慢爬向奥尼石山基底的中间地带；奥尼石山得名自栖于峭壁、俯瞰雾蒙蒙平原的秃鹫。石山阴面下的洼地常年湿润，是种植亚麻的良田。

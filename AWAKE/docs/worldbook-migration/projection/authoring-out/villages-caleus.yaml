  - id: expr.village-caleus-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 卡琉斯以低地亚麻为主产——雾重地湿、纤维柔长；因通三方话语，本村麻商能直接对接北境与山地买家，麻价随边境松紧浮动。

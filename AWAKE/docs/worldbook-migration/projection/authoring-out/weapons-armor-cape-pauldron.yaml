  - id: expr.weapon-armor-cape-pauldron-empire-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 军团的做法是肩甲连护颈一起做：肩上一片板，脖子后头再立起一圈小铁片。后面来的刀先撞上那圈，滑到肩甲上，再落到链甲。三样凑起来，后背就没那么怕了。

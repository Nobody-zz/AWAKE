- id: assertion.military-sturgia-2
  revision: 1
  kind: fact
  text:
    zh-CN: 瓦连格（瓦良格）是斯特吉亚军中的精锐步兵阶层：贵族子弟组成，站在盾墙最前排，自备筝形盾、单手斧与飞斧；战术为先掷飞斧打乱敌阵、再拔斧冲撞；其中最优秀者升为资深瓦连格，获得骑马作战的资格——在北方，骑马作战是身份与实力的象征。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war1
    source_version: animusforge-20260913
    source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
    locator: rules/rule_斯特吉亚的军事制度__斯特吉亚的军事制度.json#/Variants/3/Content
    quote_hash: 00916A9A71C774355CF8D90988FF4C9B431DC9A5A2A060514E756A5B3C46CEFB
    quote: 筝形盾、单手斧、飞斧，每一样都是自己掏钱打的。我们在盾墙最前排，大公或波耶一声令下，先掷飞斧打乱敌阵，然后拔出斧头撞上去。
  - source_id: source.calradia.chronicle.animusforge.war1
    source_version: animusforge-20260913
    source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
    locator: rules/rule_斯特吉亚的军事制度__斯特吉亚的军事制度.json#/Variants/2/Content
    quote_hash: E6BB10D6B2D30EAEFBE3A4FA3F3DDAF5DDCB774877CF107323157ED1F109C18C
    quote: 他们之中最优秀的能升成资深瓦连格，到了那个级别就有资格骑马了——在北方能骑马作战是身份和实力的象征。
  expressions:
  - id: expr.military-sturgia-varyag-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 瓦良格的装备全是自家掏钱置办的：筝形盾、单手斧、飞斧。令下先掷飞斧搅乱敌阵，再拔斧撞上去。资深瓦良格能骑马，那就是亲卫骑兵——机动和冲击都更强。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1
      source_version: animusforge-20260913
      source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
      locator: rules/rule_斯特吉亚的军事制度__斯特吉亚的军事制度.json#/Variants/3/Content
      quote_hash: 00916A9A71C774355CF8D90988FF4C9B431DC9A5A2A060514E756A5B3C46CEFB
      quote: 筝形盾、单手斧、飞斧，每一样都是自己掏钱打的。我们在盾墙最前排，大公或波耶一声令下，先掷飞斧打乱敌阵，然后拔出斧头撞上去。
    grants:
    - profile_id: profile.soldier
      scope: national
      min_detail: detail
    denies: []
  - id: expr.military-sturgia-rank-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 北方的军阶看马：普通战士站着打，最优秀的升资深瓦连格，到了那个级别才有资格骑马——在斯特吉亚，马背是身份和实力的界碑。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1
      source_version: animusforge-20260913
      source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d

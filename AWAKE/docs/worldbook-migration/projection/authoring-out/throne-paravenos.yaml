    text:
      zh-CN: 帕拉汶德是咱瓦兰迪亚自己的城，铁臂奥斯里克当年拿下的——那可是把战利品变成本事的祖宗。城里的好营生，如今都归自家人。
    sources:
    - source_id: source.calradia.chronicle.animusforge.capitals
      source_version: animusforge-20260912
      source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
      locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/0/Content
      quote_hash: 21E39B1EEFF34CC294EA0C5943BE4BAFC11D278CD794CDF4407D5E43FBA15104
      quote: 平民知晓这座城市曾是帝国首都，但如今它的市场、法庭与竞技场都由瓦兰迪亚贵族掌管。
    grants:
    - profile_id: profile.villager
      scope: local
      min_detail: rumor
      culture_ids:
      - entity.culture.vlandia
    denies: []
  - id: expr.throne-paravenos-battania-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 那座城？帝国人在时下山征粮，瓦兰迪亚人来了圈猎场——换谁坐城里，林子都得遭殃。不去，也不稀罕去。
    sources:
    - source_id: source.calradia.chronicle.animusforge.capitals
      source_version: animusforge-20260912
      source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
      locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/4/Content
      quote_hash: 7EB8F4E2B8C57BFC4E09B50E70E1C378B4396D2C1091F520D45D98835CE965D0
      quote: 巴旦尼亚山民对帕拉汶德的记忆混合着敌意与疏离。
    grants:
    - profile_id: profile.villager
      scope: local
      min_detail: rumor
      culture_ids:
      - entity.culture.battania
    denies: []
  - id: expr.throne-paravenos-imperial-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 说书词里还唱着这城的旧名巴拉维诺斯——说是早年间大帝亲手筑起的荣耀之城，还做过都城。多少年前的事，种地人谁记得真切？只知如今市集、官司，掌事的都换成了瓦兰迪亚老爷。
    sources:
    - source_id: source.calradia.chronicle.animusforge.capitals
      source_version: animusforge-20260912
      source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
      locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/0/Content
      quote_hash: 21E39B1EEFF34CC294EA0C5943BE4BAFC11D278CD794CDF4407D5E43FBA15104
      quote: 平民知晓这座城市曾是帝国首都，但如今它的市场、法庭与竞技场都由瓦兰迪亚贵族掌管。
    - source_id: source.calradia.chronicle.animusforge.capitals
      source_version: animusforge-20260912
      source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
      locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/2/Content
      quote_hash: 95790BE460EAF1D168A64EE312B00162EBAC96CDDFBDB602B015EA7E9574DA99
      quote: 他们记得帕拉汶德的真名是巴拉维诺斯，是卡拉狄乌斯亲手建起的荣耀之城。
    grants:
    - profile_id: profile.villager
      scope: local
      min_detail: rumor
      culture_ids:
      - entity.culture.empire
    denies: []

    quote_hash: 8C35F16083DF81D2848C717F37E04B5D6273619D5975E94F6F99E5FEAF64B64D
    quote: 如果有人在明朗的晴天向北望去，目光越过那片曾经属于巴旦尼亚，现在却被瓦兰迪亚人和斯特吉亚人占领的土地，就能看到瓦尔切格湾的粼粼波光。

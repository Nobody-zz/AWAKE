    revision: 1
    layer: detail
    text:
      zh-CN: 诺德人的军事力量，说实话，缺陷和优势一样扎眼。步兵分五种，盾墙配铩戟的打法在步战里相当扎实，正面很难一口气打穿。他们的双手斧战士近战爆发力惊人，但几乎没有防御，纯粹依赖盾墙掩护和一次性冲锋。最关键的是没有骑兵——没有骑兵，就没有追击能力，也没有在开阔地迎击我方重骑兵的底气。不过说句实话，他们的长处不在陆地：诺德人的长船能把整支军队悄无声息地送到任何一个海岸，这种战略机动性大陆上没有第二家。跟诺德人打仗，最难的不是打赢他们，是找到他们。

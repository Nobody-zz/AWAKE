  quote: 要人即{TOWNS_LINK}和{VILLAGES_LINK}中的著名居民，他们并非贵族。他们可能是商人、地主、帮派头目或是其他人。他们会为玩家提供任务，与要人的良好关系能够让玩家招募到更多、更好的士兵。与要人的良好关系也能给{CLANS_LINK}带来好处，可以提高其{INFLUENCE_LINK}，同时更加方便地管理{SETTLEMENTS_LINK}。

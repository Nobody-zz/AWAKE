  expressions:
  - id: expr.weapon-crossbow-essence-summary
    revision: 1
    layer: summary
    text:
      zh-CN: 弩就是拿在手上的小弩砲。瓦兰迪亚人把它发给征召来的庄稼汉，练几天就能上阵——甲再厚也扛不住它抵近一箭。
    sources:
    - source_id: source.calradia.game.lore.war1
      source_version: bannerlord-1.3.15.110062
      source_content_hash: f6ee4a2afa309b794f12fddbb3c185c94500071365f74cd7655aede539ed3b56
      locator: bannerlord.db#localization.5WMHiC9P
      quote_hash: 51EC0B75103E9433E1D2A6A1E0393B7BF7828A1F156A38D1F55B24F22730621E
      quote: 瓦兰迪亚的军阀们发现，虽然征召农民是不得已而为之的恶行，但通过弩的列装和系统训练，还是能够让他们发挥作用。这种武器本质上是一种可怕的卡拉德弩砲的手持版本，凭借它，瓦兰迪亚劲弩手在如今最重型的盔甲上也能打出一个洞来。
    grants:
    - profile_id: profile.townsfolk
      scope: regional
      min_detail: summary
    - profile_id: profile.soldier
      scope: national
      min_detail: summary
    denies: []
  - id: expr.weapon-crossbow-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 弩最大的好处不是威力，是省心：上个月还在晒麦子的小伙，这个月就能在阵地上扣扳机。别国养弓手得从小练，我们养弩手几周就够——瓦兰迪亚弩手比谁家都多，不是靠武艺，是靠工艺。南边那几个谷地更出了名：全卡拉迪亚最好的劲弩手都从那儿出来，佣兵也好教官也好，抢着请。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1
      source_version: animusforge-20260913
      source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d
      locator: rules/rule_弩__弩.json#/Variants/1/Content
      quote_hash: C30954C885AA9B55C4366BB19CBFB3E926A639A4BFCFB1E5C88AE3159D4333B5
      quote: 别的国家养弓箭手得从小练，我们养弩手几周就够。这就是为什么瓦兰迪亚的弩手比谁家都多——我们不是靠武艺，是靠工艺
    - source_id: source.calradia.game.lore.war1
      source_version: bannerlord-1.3.15.110062
      source_content_hash: f6ee4a2afa309b794f12fddbb3c185c94500071365f74cd7655aede539ed3b56
      locator: bannerlord.db#localization.qzsjGcEz
      quote_hash: EFF9C068531647302AB170C1672B8E7E32B61EEF69920AE7AC38689CB94B0FFB
      quote: 南瓦兰迪亚是个风景如画的田园天堂，当地有一项传统，那就是培养全卡拉迪亚最优秀的劲弩手。无论是作为雇佣兵，还是作为训练全瓦兰迪亚弩手的教官，他们都炙手可热。这些人技艺精湛，无论是全速冲锋而来的骑士，还是躲在城垛后放箭的长弓手，他们都能冷静应对。
    grants:
    - profile_id: profile.noble
      scope: elite
      min_detail: detail
      culture_ids:
      - entity.culture.vlandia
    denies: []
  - id: expr.weapon-crossbow-levy-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 村里发的弩就挂在灶台边上，下雨天擦擦。农闲练两天，对着草靶子瞄——不讲天分，手指头扣得动就行。真打起来，咱庄稼汉拿弩也能顶个人头。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war1
      source_version: animusforge-20260913
      source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d

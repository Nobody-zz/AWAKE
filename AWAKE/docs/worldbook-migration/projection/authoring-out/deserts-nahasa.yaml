- id: assertion.desert-nahasa-3
  revision: 1
  kind: fact
  text:
    zh-CN: 沙漠即屏障亦为财源：阿塞莱凭控制孤立水源而坐收商队之利，东方与西方的香料、丝绸、黄金在此流转；帝国军团数百年来屡次南征皆铩羽而归——外界视纳哈撒为帝国南方的天然屏障，阿塞莱人则称沙漠是公正的母亲与试炼场。
  sources:
  - source_id: source.calradia.chronicle.animusforge.geography2
    source_version: animusforge-20260913
    source_content_hash: 386587a2fdf8b9bfdde96ae07f269482c98a11a87fcc816f86a39d07800c9560
    locator: rules/rule_纳哈撒沙漠__纳哈撒沙漠.json#/Variants/5/Content
    quote_hash: 310A549E80982229262028D414C637BDAB0F94AD0C4B82A45D928F299941D62C
    quote: 纳哈撒沙漠是帝国南方的天然屏障，也是我们永远的耻辱。几百年来，帝国的军团无数次试图征服那片沙海，但每次都铩羽而归。
  - source_id: source.calradia.game.settlements.geography2
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
    locator: bannerlord.db#localization.kghCLS9q
    quote_hash: C8136D71B763F1EE45E36CCF59C1DA31950055720DDCB94953D1FF1577B939D1
    quote: 此地也因泽翁娜之风而闻名，这是一股夏季朝北吹的季风，将纳哈撒沙漠的炎热带过珀拉斯海，来到帝国的南方。
  expressions:
  - id: expr.desert-nahasa-imperial-noble
    revision: 1
    layer: detail
    text:
      zh-CN: 帝国人管纳哈撒叫南方屏障，也当它是耻辱——军团进去多少回，回来的一回比一回少。太阳和风沙比阿塞莱人的刀更厉害。
    sources:

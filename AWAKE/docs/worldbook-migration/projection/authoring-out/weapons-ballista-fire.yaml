summary:
  zh-CN: 火焰弩砲：普通弩炮的低成本火攻改装——弩箭箭杆前端加装浸油麻布套环，发射尖端浸透焦油的弩矢，可对敌方围城器械和木制建筑造成火焰伤害。技术上几乎没有额外门槛，弹道特性与普通弩炮一致；但火攻效果不稳定，蹭的是威慑价值，围城战的火攻主力依旧是投石车的火罐与抛石机的燃烧弹。

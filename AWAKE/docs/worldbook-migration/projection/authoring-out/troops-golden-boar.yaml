- id: assertion.golden-boar-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 瓦兰迪亚人自己对这伙人的看法明显护短：当兵的回来种地种不住，出去卖命换钱，打完仗先回镇子上喝酒花钱，酒馆老板、铁匠铺谁不赚他们的银子；况且他们在外头打的是瓦兰迪亚的旗号，名声越凶，别国的人就越怕瓦兰迪亚人。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war3

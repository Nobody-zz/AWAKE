    text:
      zh-CN: 洛泰从前叫洛塔什，是帕拉人的山堡，后来跟拉革塔一样落到帝国手里。那地方的头人听说邻边出了事，把手下护着的几十个帝国人杀了；帝国派来个长发将军，把洛塔什平了。

- id: assertion.town-dunglanys-3
  revision: 1
  kind: fact
  text:
    zh-CN: 此地是巴旦尼亚的密仪圣地，象征王权；并非每位至高王都在此治政，但诸王都渴望掌控它。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_B2
    quote_hash: CB67EBB4833EC4CB2B89CC7FDD61811DDD085C0488D994DC249E647271D14C17
    quote: 此地是巴旦尼亚的一处密仪圣地，象征着巴旦尼亚的王权，因此尽管并非每一位巴旦尼亚至高王都在此地进行统治，但他们都渴望掌控这里。
  expressions:
  - id: expr.town-dunglanys-3-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 邓格拉尼斯是巴旦尼亚的密仪圣地，王权的象征——不必在此坐镇，但必须握在手里。

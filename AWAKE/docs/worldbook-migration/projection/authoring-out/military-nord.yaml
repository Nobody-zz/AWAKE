  - id: expr.nord-shieldwall-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我站在盾墙里，左手扣着圆盾的边缘，右手握剑，肩膀顶着前面兄弟的背，后面的人也在推着我。铩戟从我们头顶上探出去，长柄一晃一晃的，等着对面的人撞上来。然后他们撞上来。盾墙震了一下，我顶住，往前推。盾墙要是散了，我就是个拿短剑的孤鬼。盾墙不散，我就还在。
    sources:

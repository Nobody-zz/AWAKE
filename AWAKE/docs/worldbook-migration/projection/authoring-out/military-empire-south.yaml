    revision: 1
    layer: detail
    text:
      zh-CN: 南帝国算什么东西？他们那帮养尊处优的城主们根本不知道如何打仗。像他们的俄洛斯与图里亚多斯，简直就是完全不懂军事，却还掌握着兵权，真是可笑。拉盖娅本人也不懂军事，她管理能力尚可，但是用兵打仗太差了。

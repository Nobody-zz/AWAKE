  - id: expr.village-montos-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 蒙托斯以林产为主，兼守边河——峭壁林木好、水路便；木料外运常须结队，边境不靖时货迟价涨，通巴旦尼亚语的木商更易入门。

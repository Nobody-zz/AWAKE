    denies: []
  - id: expr.mountain-dryatic-barrier-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 山体泛红，老辈说山名里带着古时德律亚人的名字。军事上这道山脉是北方的天然屏障，两侧交通全靠有限的山口。
    sources:

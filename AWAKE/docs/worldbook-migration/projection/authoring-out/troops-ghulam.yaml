    text:
      zh-CN: 古拉姆是雇佣兵里的上等货，收费不低，但物有所值。他们的骑射功夫和库赛特人有一拼，骑枪也能耍得有模有样。身上的香水味老远就能闻到，帽子上还插着孔雀毛，在林子里藏不住——但他们不在乎，反正他们不是来打伏击的，是来正面冲阵的。

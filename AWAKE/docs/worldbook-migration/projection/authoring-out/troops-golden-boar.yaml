summary:
  zh-CN: 黄金野猪兵团：主要由瓦兰迪亚人构成的雇佣兵团，成员绝大多数是退伍士兵——适应不了和平生活，于是选择活在长久的战争里。在卡拉迪亚各雇佣兵团中以纪律涣散、行径卑劣著称，被允许自由活动时就是乡间的一大祸害；但因名声直接关系到雇佣价格，受雇期间会履行合同、勤习武艺，尤其注重弓弩射击。

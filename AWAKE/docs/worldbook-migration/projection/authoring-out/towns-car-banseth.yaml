    quote_hash: 3C34A13EDC94C4772D3069C7576084A618BC6349CB0EF617853BF96E7CF0E7D2
    quote: 据说，心怀信念之人会在某一天从这里看到已逝至高王蒙的船队，他将重返人间，拯救自己的子民于水火之中。
  expressions:
  - id: expr.town-car-banseth-2-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 老辈人讲，心诚的人能望见蒙王的船队从湾里开回来。等的人不少，见着的没听说。

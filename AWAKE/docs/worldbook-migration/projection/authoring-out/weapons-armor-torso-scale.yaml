  - id: expr.weapon-armor-torso-scale-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 鳞甲贵在缀工：一片一片打出来、再一片一片缀上，一件得几千片，所以多半只在贵人与重骑身上见。南方鳞甲衬锁子铠护值五十一，用的是师匠级的缀法，鳞片薄而匀，价钱按片数算。

  - id: expr.weapon-armor-legs-battania-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 山里人不爱穿高筒靴——上坡下坡，筒子磨小腿。我们缠绑腿：一条布从脚踝缠到膝下，缠得紧，走一天腿不沉。冻了再套一层毛皮的，也是缠的，不讲样式。

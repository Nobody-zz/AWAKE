summary:
  zh-CN: 帕拉汶德（旧名巴拉维诺斯，Paravenos）：卡拉狄乌斯大帝所建第二殖民地、旧帝都；铁臂奥斯里克献城后归戴·提尔家，今为瓦兰迪亚西部重镇。帝国遗民与巴旦尼亚人的观感分层。
registry_bindings:
  profile_registry_version: 1.0.0
  profile_registry_hash: 309D10583E7B4AF05F28DE2C2E67A2528CB3D6C45752369C0F7D160FABC3F3A5
  referral_registry_version: 1.0.0
  referral_registry_hash: 6E17075F1F967BE28C0437121DB50E5C30809C4EFC3D2A5F22AD9BB0B3B926CD
sources:
- source_id: source.calradia.game.settlements.capitals
  source_version: bannerlord-1.3.15.110062
  source_content_hash: f166dd33c2ea6ef049d9cb5595f105d36ea55defff8ccb3a1025091f32988fa3
  locator: bannerlord.db#localization.Nx0qK2g6
  quote_hash: F4B24C13E32285BC6BFC179F1B5D78DE13032118C2E270AFF7E9E9B253425B84
  quote: 巴拉维诺斯是由卡拉狄乌斯大帝建立的第二座重要的殖民地，并在随后迅速取代沙拉斯，成为了卡拉德人的首都。最终，帝国的统治重心东移，但巴拉维诺斯依旧是西部的经济重镇。当瓦兰迪亚人“铁壁”奥斯里克入侵时，他意识到巴拉维诺斯作为权力的宝座，比作为掠夺的财源更有价值，于是同当地的元老协商让该城投降。此地传承到了奥斯里克的旁支，戴·提尔家族手中，如今人们称其为帕拉汶德。
- source_id: source.calradia.game.settlements.capitals
  source_version: bannerlord-1.3.15.110062
  source_content_hash: f166dd33c2ea6ef049d9cb5595f105d36ea55defff8ccb3a1025091f32988fa3
  locator: bannerlord.db#localization.0cZmKO76
  quote_hash: EDBA92205F136FDF6A3DACEC7BAA25BFA933FB5C4DA50CD3874BC85828B2E2BF
  quote: 这座如今被称为沙拉斯的城市，其历史最早可以追溯到第一批卡拉德殖民者登上这片大陆的海岸之时。在帝国如日中天的时候，其首都迁到了北方的巴拉维诺斯，而沙拉斯则成为了一座海务和贸易的重要港口，帝国贵族们在周边海湾附近的和煦海滩上纷纷建起自己的纳凉别墅，时不时地划着小艇在小岛的周边游弋。瓦兰迪亚人到来后，沙拉斯落入了无情的戴·科尔坦家族手中，其无穷的财富助长了后者的野心。
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/1/Content
  quote_hash: 877BA0BEBE48E4CA3FFDEE692AAE3D80FDECCEDF0DC86F5EEB39109A8013B0C4
  quote: 戴·提哈家族虽非王座直系，却因持有此城而拥有不逊于公爵的威信。
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/1/Content
  quote_hash: 811F114770C9061777D9FB6AA6DC3F543EAA41140F81621C3CA67D56E8FC473C
  quote: 谁掌控帕拉汶德，谁就掌控西部商路
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/0/Content
  quote_hash: 21E39B1EEFF34CC294EA0C5943BE4BAFC11D278CD794CDF4407D5E43FBA15104
  quote: 平民知晓这座城市曾是帝国首都，但如今它的市场、法庭与竞技场都由瓦兰迪亚贵族掌管。
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/4/Content
  quote_hash: 7EB8F4E2B8C57BFC4E09B50E70E1C378B4396D2C1091F520D45D98835CE965D0
  quote: 巴旦尼亚山民对帕拉汶德的记忆混合着敌意与疏离。
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/0/Content
  quote_hash: 78DC33C5D5C1736CF4276EC18733961CE06A521C7D8A15AA4975240F70EB6FFC
  quote: 铁匠与商贩更在意关税与行会规矩，而非百年前的投降协定。
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/2/Content
  quote_hash: 95790BE460EAF1D168A64EE312B00162EBAC96CDDFBDB602B015EA7E9574DA99
  quote: 他们记得帕拉汶德的真名是巴拉维诺斯，是卡拉狄乌斯亲手建起的荣耀之城。
- source_id: source.calradia.chronicle.animusforge.capitals
  source_version: animusforge-20260912
  source_content_hash: 769eff42886538ef21ccaa7cbe55d0609ca4ad44af57cd9732e2d8a962fdfed3
  locator: rules/rule_帕拉汶德__帕拉汶德.json#/Variants/3/Content
  quote_hash: 21EFB588EB1895C9C8D32436E1A6F91B00C1BA3D0FF49502453064318CC8D981
  quote: 绝大多数贵族们把帕拉汶德的沦陷视为帝国正逐渐走向衰落的又一个重要的历史节点。

  - id: expr.weapon-armor-torso-cloth-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 袍服按布幅与织法分档。粗纺一件几枚银币，重磅密织的要三倍；帝国的托加讲究垂感，用整幅布裹、不打剪，一块布就是一件衣。护值多在二到九之间，最厚的一档不过二十五——布再密也是布。

  - id: expr.village-alebat-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 阿莱巴特以林中定居为业——地远人杂、多种生计；猎、采与薄田并作，货以毛皮山货换盐铁，因避役者多，官差与税吏少至，口音自成一格。

      zh-CN: 西帝国是帝国三分之后军力最强的一支。他们的根基在产粮区——粮食充沛，兵源充足，马匹供应也稳定，冶铁稍弱但商路畅通能补上。将才也多，分工很细：加里俄斯统全局，萨拉提斯守城，得斯里波翁打策应，阿喀俄斯管骑兵，维彭管指挥和后勒，克洛托耳年纪最大、经验最足。

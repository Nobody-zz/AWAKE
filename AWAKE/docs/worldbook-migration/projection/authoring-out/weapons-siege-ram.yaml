- id: assertion.siege-ram-1
  revision: 1
  kind: fact
  text:
    zh-CN: 攻城槌的结构逻辑极为直白：槌头包铁的实心硬木悬于框架顶梁之下，以铁链或麻绳悬挂，操作手在顶棚遮蔽下推槌撞击目标；槌体重心在摆动中形成单次冲击动能，穿透力取决于槌头质量与摆动幅度。它用于突破城门，强于仅使用攻城梯，可让部队进入内庭。顶棚是攻城槌生存性的关键：标准的湿牛皮-木板-泥浆复合顶可以抵御沸水与擂石的打击，对火焰也有一定的阻隔能力——前提是棚面无破损。操作手的体力消耗极大，持续高强度推槌，一组人最多坚持一炷香，必须在撞击间隙轮换，而轮换时槌身静止，是城头精准打击的窗口。

  expressions:
  - id: expr.banner-knight-empire-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 瓦兰迪亚方旗骑士？大陆上唯一配得上我们正眼看的骑兵。装备和我们差不太多，马术不在我们之下，枪法也不差，单拿出来看，个人素质不比我们任何一个人弱。但他们有个致命的毛病：纪律。冲起来比我们猛，也比我们乱——速度不是整体节奏，是各人看情况自己加的。冲到后半段队形就散了，散的缝隙就是我们的突破口。我们打他们，靠的不是更快的枪，是更整齐的纵队后劲。
    sources:

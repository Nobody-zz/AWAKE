assertions:
- id: assertion.weapon-head-layered-1
  revision: 1
  kind: fact
  text:
    zh-CN: 卡拉迪亚的护头有一件别的器物没有的做法：一层不够就套两层。外面扣一顶开面或半开的盔，底下垫上围帽、填充帽、皮革或链甲，两层一起戴。做法在名字里就写着——尖顶头盖盔衬软甲、檐盔衬链甲围帽、军阀盔衬全覆链甲。它把护头一路推上去：尖顶头盖盔单戴护头三十五，衬一圈链甲围帽到三十七，檐下的款式到四十二，一直垫到全覆链甲就是全库最高的五十四。

  text:
    zh-CN: 攻城塔是移动的木结构攻城设施：通常为四至六层框架，底层装滚轴或铁箍轮对，由数十人隐蔽在塔后推行；塔身外挂湿牛皮或泥浆混合层防火，内设斜梯，顶层有可放倒的吊桥，以铰链连接。它的作用是将攻城方送至与城墙等高处，抵消对抗守城方的劣势，并让部队在不受投射物伤害的情况下靠近城墙。结构上的核心矛盾永远是重量：一方面塔必须自稳，重心要低、底盘要宽，内部十字撑杆必须从底到顶连续分布；另一方面推塔的阻力完全取决于地面——冻土和硬平地可缓速推进，泥泞或碎石地则轮轴摩擦力激增。

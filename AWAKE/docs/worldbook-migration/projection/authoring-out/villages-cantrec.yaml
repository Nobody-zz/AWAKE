  - id: expr.village-cantrec-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 坎特雷克以峡谷养猪为业——坡林放牧、石多地少；猪按膘情分等，赶出峡谷卖给两边市镇，路窄则好价要走早集。

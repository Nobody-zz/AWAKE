  expressions:
  - id: expr.mount-iltan-route-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 北边那条水路全仗着一片冰川湖——船从拉科尼斯湖进来，拖过岸，再下水接着走，一路通到塔奈西斯湖。沿线村子不愁生计：山坡养羊，湖畔种麦，牛刨雪找草也能熬冬。
    sources:

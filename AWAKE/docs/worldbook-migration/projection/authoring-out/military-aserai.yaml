assertions:
- id: assertion.aserai-1
  revision: 1
  kind: fact
  text:
    zh-CN: 阿塞莱苏丹国的军队由贵族兵、平民兵与奴隶兵三大支柱构成，骑兵是作战体系的核心。法里斯是贵族骑兵，身披重型铜甲，骑乘阿斯凯尔马，使进口钢材锻造的马穆鲁克骑枪与部落长剑；他们的标志性武器是阿塞莱标枪——全卡拉迪亚最长、最重的投掷武器，带倒刺，破甲极强，投出后几乎拔不出来，弱点是杏仁形小盾又薄又小，防不住远程箭矢。马穆鲁克是自幼购入的奴隶骑兵，全身铜甲，弓马娴熟，箭射完后拔刀与圆盾投入近战，分为持双手锤斧的重输出兵和来回游射的骑射手，装备略逊于法里斯，但纪律严明，不溃不退。平民兵是步兵基础，包括持大盾长矛的重装步兵和沙漠硬木弓弓箭手，就地征召便利，但战斗力不及帝国重步或瓦兰迪亚弩手。整体战术以骑兵两翼包抄为核心：标枪先发，骑枪随后，步兵正面牵制；弱点是缺乏重骑兵正面冲击力，步兵线韧性不足。

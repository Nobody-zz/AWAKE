  quote: 你已经清理了一条一个帮派头目的巷子。现在，你可以出于自己的利益接管它，或者让它空着也算是给城镇做点好事。要想拥有一条巷子，你需要指派一名合适的帮派成员和一些士兵来看管它。这将为你的家族提供第纳尔，但也会增加你的犯罪等级。

  expressions:
  - id: expr.town-ocs-hall-1-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 奥克斯·霍尔是瓦兰迪亚人夺了这块地之后新起的那几座城之一。从前这里是巴旦尼亚人的地方，围着莫德里斯湖；后来叫一个瓦兰迪亚的军阀奥克占了，旁边的湖也随了他的名字。巴旦尼亚人搬进内陆去了，故事也带走了。
    sources:

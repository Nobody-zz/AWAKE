assertions:
- id: assertion.weapon-head-closed-1
  revision: 1
  kind: fact
  text:
    zh-CN: 全覆面盔把整张脸罩住，只在眼位留视缝、在口鼻处留孔——护头值因此做到全库顶格的五十三与五十四，远超任何开面款式。代价同样明确：视野收窄成两条缝，呼吸闷在里面，戴久了耳朵也听不清阵列外的动静。以斯特吉亚的头领与卫士用得最多，瓦兰迪亚的骑士款式则带可翻起的护面板，行军时掀开透气。

    locator: bannerlord.db#localization.BleybhsD
    quote_hash: 427C3117D2EEEA607A91E0F0EDF9F5038CAA02AA8EE0A7F1A4DD42AC7A7D9218
    quote: 帝国的具装骑兵出现了，人马具甲，铁铠从头包到脚。他们完全无视我们的射击，直接撕开了我军部队。我被撤退的败军给卷走，不知道战斗后续的发展。德泰尔国王的计划不错，可那些男爵们——因加泰尔、阿尔德里克，等等——一如既往地根本没有理会他。
  expressions:
  - id: expr.troop-cataphract-levy-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 帝国那些铁人又来了——人和马都包着铁，箭射上去叮当响，跟没事一样。老话讲他们是帝国的大杀器，战无不胜。真撞上他们的队，能躲就躲。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war2
      source_version: animusforge-20260913
      source_content_hash: cd49137efe05ba8744b54efcad204a80993373be4cdd7af95fca3c4e2b84ea8a
      locator: rules/rule_具装骑兵__具装骑兵.json#/Variants/0/Content
      quote_hash: CB84CEBC7FDD0848974BD6CC1A97C2F108A9B9D2E7A404242C2348DA10901A5A
      quote: 具装骑兵是帝国的大杀器，他们人马具装呀，战无不胜
    - source_id: source.calradia.game.lore.war2
      source_version: bannerlord-1.3.15.110062
      source_content_hash: d26cb9927f8ee92580ef35a0fb815b5681be35dcd02a5b6ea9c8384df99e07a0
      locator: bannerlord.db#localization.BleybhsD
      quote_hash: 427C3117D2EEEA607A91E0F0EDF9F5038CAA02AA8EE0A7F1A4DD42AC7A7D9218
      quote: 帝国的具装骑兵出现了，人马具甲，铁铠从头包到脚。他们完全无视我们的射击，直接撕开了我军部队。我被撤退的败军给卷走，不知道战斗后续的发展。德泰尔国王的计划不错，可那些男爵们——因加泰尔、阿尔德里克，等等——一如既往地根本没有理会他。

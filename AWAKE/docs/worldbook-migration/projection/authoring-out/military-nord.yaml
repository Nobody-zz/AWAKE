- id: assertion.nord-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 外族对诺德军力的评估很具体：步兵打法在步战里相当扎实，正面很难一口气打穿，双手斧战士近战爆发力惊人却几乎无防御、纯粹依赖盾墙掩护和一次性冲锋；投斧手在开阔地带作用有限，但在林地或登陆战中确实能制造混乱；弓箭是软肋，射程密度都比不上对手。最关键的是没有骑兵——没有骑兵就没有追击能力，也扛不住重骑兵的反复冲击。但他们的长处不在陆地：长船能把整支军队悄无声息地送到任何一个海岸，与诺德人打仗，最难的不是打赢他们，是找到他们。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

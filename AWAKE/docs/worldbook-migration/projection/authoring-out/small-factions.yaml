  expressions:
  - id: expr.small-factions-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 有的地方，过路是要交钱的——商家按月交，农户按季交，交了就没人来掀你的摊子，不交就隔三差五有醉汉上门闹事，报官也没用。他们到底是谁，说不清：白天在街上碰见，也就是隔壁那条巷子里的街坊，有人还拄着拐一瘸一拐的；可收了摊往巷子里一蹲，腿就不瘸了。有人讲他们拜一个死了好多年的皇帝，就等着他回来——死了皇帝不埋，这么些年还能说出个名堂来，怎么听怎么像喝多了编的。反正离得远，谁知道呢。
    sources:
    - source_id: source.calradia.game.urban-dark
      source_version: bannerlord-1.3.15.110062
      source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
      locator: bannerlord.db#localization.uce9Opgg
      quote_hash: 8D7D948748E9A4DCD1086636AB7C3DC524D6375B6DD7226BD73D269F16D6FE8E
      quote: 小阵营代表卡拉迪亚大陆上不属于任何王国的群体。他们可能是罪恶的兄弟会、雇佣兵组织、宗教运动组织或游牧民。他们通常依靠给某一个王国卖命，或是从路过他们领地的商队和旅行者那里收取保护费来维持生计。
    - source_id: source.calradia.game.urban-dark
      source_version: bannerlord-1.3.15.110062
      source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
      locator: bannerlord.db#localization.RWOYui01
      quote_hash: EE698FA2853F9713166612024270451BE3AF2EB2A6AC9AC803A228340A8DC588
      quote: 贾瓦勒，又名“漫游者”，是纳哈撒沙漠中主要的贝都因联盟。他们在高地和低地的牧场之间游荡，宣称大片的沙漠都是他们的“领地”，任何途径的商队都必须缴纳保护费。他们将自己的事迹编为诗歌，同时嘲笑巴努·阿塞拉的其他部族放弃了象征“自由”的黑羊毛帐篷，住进绿洲中的石头屋子。其他部族则认为他们是自吹自擂的讨厌鬼，但也不情愿地尊重着他们身为阿塞莱传统维护者的身份。
    - source_id: source.calradia.game.urban-dark
      source_version: bannerlord-1.3.15.110062
      source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
      locator: bannerlord.db#localization.7JMaPpkN
      quote_hash: 390D29AD88C9C08D7DA7D9182AC347ADB6ED87E6DD132638DA7E898E83B9E852
      quote: 我们在偏远地区的树林深处，修建了一座巨大的神殿，称为“真理之国”。我们收拾了两支前来追捕的帝国部队。然而拉狄摩斯死了，“蒙上天召唤”，他在临终之际这么说，那之后我们迷茫了一段时间。我们缺钱缺粮，于是我们的首领们开始向底下的村庄征“税”。有的人则从领主和商人那里收商队的保护费。至于那些交钱拖拖拉拉的——好吧，人们时不时会在河床上发现他们的尸体。
    - source_id: source.calradia.chronicle.animusforge.dark
      source_version: animusforge-20260913
      source_content_hash: f2f393db5e381912ec5bda1e6955cad0f96f3462afdac54a523bf022b4aefca7
      locator: rules/rule_火焰余烬__火焰余烬.json#/Variants/0/Content
      quote_hash: FAADB0302C2042BE46DD04EEB71F6BEE71BD4F298BC545AD43F791D29B6176B2
      quote: 北区卖陶罐的老瘸子就是他们的人
    - source_id: source.calradia.chronicle.animusforge.dark
      source_version: animusforge-20260913
      source_content_hash: f2f393db5e381912ec5bda1e6955cad0f96f3462afdac54a523bf022b4aefca7
      locator: rules/rule_火焰余烬__火焰余烬.json#/Variants/4/Content
      quote_hash: F1AA141E12E8DF90DD4AA890E1F69906DEEF11FD62FC6D25B6BE1231D1FBA6D3
      quote: 死了皇帝不埋，等着他回来

- id: assertion.town-husn-fulq-1
  revision: 1
  kind: fact
  text:
    zh-CN: 侯森·富勒格位于卡尔得亚的东南边缘——那片由河流与咸水潟湖织成的网络，把帝国与阿塞莱的土地连在一起。
  sources:
  - source_id: source.calradia.game.settlements
    source_version: bannerlord-1.3.15.110062

  - id: expr.nord-barracks-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 诺德人？北方佬，船上来的。我没跟他们打过，但营里有人打过，讲起来一套一套的。说他们不打旗号，不擂鼓，船头直接冲上滩，人跳下来就往你这边推。前排全是大盾，推不动，头顶上还飞斧子，不知道从哪儿甩过来的。最吓人的是那些光膀子抡双手斧的——你阵型被顶出缝，他们就冲进来，劈甲跟劈柴一样。不过他们有个怕的东西：没马。你只要不跟他们挤在滩头硬碰硬，拉开距离用骑射绕，他们就只能站在原地干瞪眼。

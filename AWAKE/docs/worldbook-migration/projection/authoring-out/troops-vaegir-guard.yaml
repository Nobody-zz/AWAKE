  - id: expr.vaegir-guard-fall-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 维基亚卫队的覆灭是帝国政治的必然结果。他们太依赖皇帝了——皇帝活着，他们是帝国最精锐的利刃；皇帝死了，他们就成了无主之剑。更糟糕的是，他们全是外族人。吕卡隆的市民本来就不信任这些北方来的蛮子，先皇一死，所有人立刻把矛头指向了他们。他们本可以列阵突围，凭他们的战力，没人拦得住。但他们中的一些人选择了发泄——在城里烧杀抢掠，彻底坐实了「弑君蛮族」的骂名。
    sources:

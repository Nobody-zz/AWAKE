assertions:
- id: assertion.weapon-armor-shield-heater-1
  revision: 1
  kind: fact
  text:
    zh-CN: 扇形盾上宽下收、边线平直，是瓦兰迪亚一路的形制。它比筝形盾短，护住躯干到腰就止；好处是轻、是平——凹面的盾挨打会扭手，平的看着薄，接刀反而稳。长六十五到一百一十八，耐久二百零五到七百五十，护值一到十七：多数只有一，重型扇形盾到十七、扇形长盾到十三、平面扇形盾到十。刻印的那一款把边角削去一块，用来搁长矛。

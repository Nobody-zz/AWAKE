    revision: 1
    layer: rumor
    text:
      zh-CN: 当兵的？我儿子今年跟雅尔的船走了，夏天走的，现在还没回来。他拿的是双手斧，那个最危险，站在第一排旁边冲进去砍，甲都不穿。我不懂什么盾墙什么铩戟，我只知道他爹当年也是这么走的，也是夏天，也没回来。诺德维格的军队厉害不厉害？我们打鱼的不懂，但我知道来村里征兵的人每次都挑最壮的。他们说北境的男人不死在床上。

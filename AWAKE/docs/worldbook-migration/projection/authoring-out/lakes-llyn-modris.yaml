- id: assertion.lake-llyn-modris-2
  revision: 1
  kind: fact
  text:
    zh-CN: 瓦兰迪亚军阀奥克夺下谷地，湖从此改随他的名字；巴旦尼亚部落被赶回内陆，把传说也一并带走了。
  sources:
  - source_id: source.calradia.game.settlements.geo2
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 8fcc88868e40b0d90b9e6fada6e9ad7029dd90df4e2905f1718e00673932e0c4
    locator: bannerlord.db#localization.nhmBQIC4
    quote_hash: 3C1413AA3C2210634C20250E89DFC4EA20C830ADA111F6BC17A358A319849B47
    quote: 这里后来被瓦兰迪亚的一位军阀奥克征服，附近的奥克斯湖也是以他的名字命名。该地的巴旦尼亚部落带着他们的传说一起被赶回到了内陆。
  - source_id: source.calradia.chronicle.animusforge.geo2
    source_version: animusforge-20260912

  - id: expr.siege-ram-engineer-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 顶棚是攻城槌生存性的关键。标准的湿牛皮-木板-泥浆复合顶可以抵御沸水与擂石的打击，对火焰也有一定的阻隔能力——前提是棚面无破损。一旦棚面板缝被擂石砸裂、将火油淋下，顶棚就会立刻变成一个木柴搭起的简易灶炉，底下的人毫无逃生通道。其次是城门结构：攻城槌对铁闩和木门的撞击效率最高，但若城门甬道被碎石沙袋填实，槌头砸穿门板后面对的是柔性缓冲层，单次冲击的能量被沙袋整体变形卸掉大半。我的结论是：攻城槌是突破城门最具性价比的攻城器械——前提是情报确认城门后无填实、顶棚维护完好、操作手轮换有序。三个前提缺一个，攻城槌就只是城门前的一口铁皮棺材。
    sources:

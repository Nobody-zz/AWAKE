assertions:
- id: assertion.weapon-head-cloth-coif-1
  revision: 1
  kind: fact
  text:
    zh-CN: 布制围帽与头巾是卡拉迪亚最普遍的护头物，却几乎谈不上防护：护头值位于一到九之间，挡不住劈砍，用处是遮阳、挡沙、束住头发，兼作身份与风俗的标记。形制分南北两路——北方诸国用一圈厚布裹住头顶与耳根（布制围帽、皮制围帽、系带布制围帽），南方阿塞莱一带用宽幅布绕过颅顶、只留面部在外（编织头巾、希贾布头巾、丝带库菲耶头巾）；妇人的款式更宽更长，山民的包头巾则缠得极紧。

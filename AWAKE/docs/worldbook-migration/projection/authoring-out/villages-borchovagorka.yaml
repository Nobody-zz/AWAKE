  - id: expr.village-borchovagorka-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 博乔瓦戈卡以湖渔为业——北岸水深、鱼种全；鲜鱼走湖岸市集，鲟鱼子腌成的货最贵，按鱼种与鲜度分等，浪大即歇船。

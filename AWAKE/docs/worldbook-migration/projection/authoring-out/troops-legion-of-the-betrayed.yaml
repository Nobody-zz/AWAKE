    text:
      zh-CN: 被弃者军团是常备军被废之后出现的一支雇佣兵。组成它的人偏偏是反对这场改革的那批人——他们认昔日的军团，认那套规矩、历史和军营生活，觉得新制度正在毁掉帝国。但没饷就没军，所以他们既接帝国领主的活，也接外国领主的活。

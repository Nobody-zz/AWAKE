summary:
  zh-CN: 萨夫纳坐落于俯瞰激流的高耸山脊上——那激流把拉科尼斯湖与狭窄的马佐波尔湾连在一处；村民在靠近海崖的内陆种小麦，就为那里的地能躲开带盐的风。

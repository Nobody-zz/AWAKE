    layer: detail
    text:
      zh-CN: 俄里斯托科律斯堡据俄耳堤西亚湾航路要口，下辖酒村与橄榄村各一；酒与油在堡中集货、随船外销，过湾商船由堡里验货、缴停泊之资，湾岸园界由堡里划清。

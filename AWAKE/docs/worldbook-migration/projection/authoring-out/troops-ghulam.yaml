- id: assertion.ghulam-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 「古拉姆的骑射无人能及、使骑枪的本领仅次于瓦兰迪亚人与帝国具装骑兵」——这是他们最通行的名声，也是他们自己认的身份。各族对这份名声的反应不一：瓦兰迪亚人在意的是他们的骑枪，说颇有自家方旗骑士的风范、马虽不高大但纪律好过某些愣头青骑士；斯特吉亚人说他们在北方接不到活，装备是给南方暖地做的；库赛特人说得更直白——古拉姆的骑射「是我们打出来的」。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
    locator: rules/rule_古拉姆__古拉姆.json#/Variants/4/Content
    quote_hash: 51B42F2FA974FB42F08EDD6F05EC538E9CA9B2F187C21D54F33D17CCF0457994
    quote: 但他们的骑枪冲锋——说来奇怪——颇有我们方旗骑士的风范
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
    locator: rules/rule_古拉姆__古拉姆.json#/Variants/7/Content
    quote_hash: 7F55F3E0028CD49D744DB5DDF58BBB61D58C82053DE6A140289905CD4A6D3C44
    quote: 古拉姆的骑射是我们调教出来的——或者说，是我们打出来的
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
    locator: rules/rule_古拉姆__古拉姆.json#/Variants/5/Content
    quote_hash: 22FE6231F9FFEBFD38B44DFE66636B21B20708E8470621D24B46036FC15D56DF
    quote: 到了北方的雪地里，他们的马受不了，他们自己也冻得缩成一团
  expressions:
  - id: expr.ghulam-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 古拉姆的骑枪比他们的弓更让我们在意。这些南方来的雇佣兵，骑射不如库赛特人，但他们的骑枪冲锋——说来奇怪——颇有我们方旗骑士的风范。听说他们的祖先曾经统治过一个叫达西的大国，和帝国打过好几代人的仗，从帝国骑兵身上偷师了骑枪冲锋。后来达西被库赛特人打残了，这些武士就流落出来当了雇佣兵。他们的马没有我们的竞技马高大，冲锋的时候没有那种摧枯拉朽的气势，但纪律很好，该冲的时候冲，该停的时候停。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_古拉姆__古拉姆.json#/Variants/4/Content
      quote_hash: 51B42F2FA974FB42F08EDD6F05EC538E9CA9B2F187C21D54F33D17CCF0457994
      quote: 但他们的骑枪冲锋——说来奇怪——颇有我们方旗骑士的风范
    grants:
    - profile_id: profile.noble
      scope: elite
      min_detail: detail
      culture_ids:
      - entity.culture.vlandia
    denies: []
  - id: expr.ghulam-khuzait-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 古拉姆的骑射是我们调教出来的——或者说，是我们打出来的。他们的老家达西当年就在我们库赛特南边，兀儿浑可汗西进的时候从达西手里抢了大片草场。达西人被赶到了东边，但他们的武士没走，有些人留下来当了古拉姆。他们会骑枪，这是向帝国和瓦兰迪亚人学的，我们库赛特人不用那玩意。现在他们拿着弓和枪，给钱就打仗，不挑雇主也不记仇。
    sources:

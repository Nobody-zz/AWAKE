  - id: expr.ghulam-sturgia-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 古拉姆在北方接不到多少活。他们的装备是为了南方暖地设计的——轻甲、快马、花哨的打扮。到了北方的雪地里，他们的马受不了，他们自己也冻得缩成一团。但他们能在卡拉迪亚当这么多年雇佣兵还没散伙，说明本事是有的。听说他们的国家被库赛特人抢了，他们不想给库赛特人当奴隶，就自己出来卖命。这一点我们斯特吉亚人倒是能理解。

  - id: expr.weapon-head-layered-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 叠穿的省法是缝成一件：分段碗盔衬链甲把壳子与链甲缝死，护头二十六；檐盔衬填充布把壳与垫层合成一件，护头三十六。合缝的省事，坏了整件换；分体的费工，但哪一层破了只换哪一层——同一顶壳子能配填充布、系带围帽或链甲围帽，长年算下来更划算。

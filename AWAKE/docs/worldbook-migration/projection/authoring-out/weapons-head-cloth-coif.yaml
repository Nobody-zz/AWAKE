- id: assertion.weapon-head-cloth-coif-2
  revision: 1
  kind: fact
  text:
    zh-CN: 南方的头巾另有讲究：彩色希贾布头巾与希贾布头巾以宽幅布绕过颅顶数次、只留面部，风沙大的日子可以一整幅拉下来蒙住口鼻；丝带库菲耶头巾束得更严实。北方的朝圣风帽与布制风帽则留出肩颈，是行路人与僧侣的常服。
  sources:
  - source_id: source.calradia.game.items-head
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 45887F4A4963E921A9C498B871009749C5B0BD65E1FE8D7B3885E660FDDE0A7F

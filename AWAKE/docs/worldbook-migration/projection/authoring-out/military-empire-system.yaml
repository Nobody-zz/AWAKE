  - id: expr.empire-system-soldier-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我给执政官老爷当兵，他给我发饷。以前我爹那一代是给帝国当兵，军饷是国库发的，上面是皇帝和鹰旗。现在上面是执政官，他出钱我就替他打仗。说实话，我不在乎谁是皇帝——拉盖娅在吕卡隆，卢孔在北边，加里俄斯在西边，他们谁当皇帝跟我有什么关系？我在乎的是发饷的那个人能不能赢。他赢了，我的饷就继续发；他输了，我得赶紧换个雇主。潘德拉克之后，帝国兵都学会了这一条。
    sources:

- id: assertion.weapon-armor-torso-brigandine-1
  revision: 1
  kind: fact
  text:
    zh-CN: 布面铁甲是把一片片铁板铆在厚布或皮革的里侧，外面只露出铆钉头，护值十五到五十三。它比整片板便宜、比纯链甲挺括，而且好改——胖了瘦了，拆下几片重铆就是。北地与草原都用它：布面铁甲衬链铠护值五十一，可汗布面铁甲四十六。

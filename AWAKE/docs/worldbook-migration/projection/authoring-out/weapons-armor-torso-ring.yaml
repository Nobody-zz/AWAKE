  - id: expr.weapon-armor-torso-ring-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 环甲按底衬与铁环的密度分档：布底轻，皮底耐，环缝得越密越顶事。护值落在十三到二十——同重之下比锁甲低一档，赢在做起来快、破一个补一个，不必像链甲那样一断就整片拆。养护上正好反过来：皮底怕晒，晒久了发硬要上油，比链甲费心；可修起来比链甲省事。
    sources:
    - source_id: source.calradia.game.items-armor

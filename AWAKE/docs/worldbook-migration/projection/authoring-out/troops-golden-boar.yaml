sources:
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.tae3lhXh
  quote_hash: CD09E2B31629868A620F41EA206B121D1B3030D1E583BE1066C7B4DF3EB6AFFC
  quote: 黄金野猪兵团的成员都是瓦兰迪亚人，主要是当地的退伍兵。这些人适应不好和平时期，因此选择活在长久的战争里。他们可能是全卡拉迪亚纪律最差、行径最为卑劣的一支雇佣兵。在被允许自由活动时，这些人就是乡间的一大祸害。但就像所有雇佣兵一样，他们知道要靠自己的名声来赚钱，所以他们会履行合同，勤习武艺，尤其是弓弩射击，以确保雇主的开销物有所值。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_黄金野猪兵团__黄金野猪兵团.json#/Variants/0/Content
  quote_hash: 71CFA15B61CBFB8EF1D302F711DAD708C737A301FC0B7D812718FE2E447A00A2
  quote: 这些人无法重新适应和平时期的平民生活，因而选择以雇佣兵身份继续留驻于战事之中
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.kBFbivPP
  quote_hash: E191E2256AFA440B7A5C3FF02416C1E925A85DD87607260B5411F2A20F0427F1
  quote: 我和野猪兵团的汉子一起战斗过。我是他们的铁匠，负责保持他们的刀剑锋利，修补他们从尸体上取下的破损锁子甲。他们中的一些人算是好小伙，不过其他人……这么说吧，那就是个吸引麻烦鬼的团体。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_黄金野猪兵团__黄金野猪兵团.json#/Variants/1/Content
  quote_hash: 697FBCA0853B07EF0E82FBF0CD7CA979F66D918A1D890B166624C76D3E509B0B
  quote: 当兵的回来种地种不住，出去卖命换钱，有什么好说的
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_黄金野猪兵团__黄金野猪兵团.json#/Variants/1/Content
  quote_hash: E31A93DCBDD8F8DD7BD5AB562E0021525E9928B78BA2809ECAB02F58A376B6C0
  quote: 名声越凶，别国的人就越怕咱们瓦兰迪亚人
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.8GDgJCB4
  quote_hash: 2F91B74A61EF6363A6B0DD264E544A8448DD27F6480512003D29ED92C67AD67C
  quote: 朋友啊，如果你在寻找坚韧健壮的战士，我们野猪兵团可是上佳之选。瓦兰迪亚最能打的小伙子们都在我们旗下。要知道，如果你不想雇佣我们，你的敌人也许就会啊。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_黄金野猪兵团__黄金野猪兵团.json#/Variants/2/Content
  quote_hash: 6EA16727B1551A268CA138A1A1D742C59C5924A803182C5C904CBFD325858437
  quote: 一群披着人皮的畜生。当兵当傻了，除了杀人放火什么都不会
- source_id: source.calradia.game.lore.war3
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
  locator: bannerlord.db#localization.7RyuT39x
  quote_hash: F895568208F1539DBE32785FFB21D514D6C3F4E54C5A67C8185126936C17596C
  quote: 我和野猪兵团的汉子一起战斗过，我曾是一个铁匠，负责制造武器。他们可真是帮硬骨头。我想你会发现很多像我们这样的人，离开了兵团，在讨其他的生计。
authority:
  owner: awake_canon
  conflict_policy: canon_wins
assertions:
- id: assertion.golden-boar-1
  revision: 1
  kind: fact
  text:
    zh-CN: 黄金野猪兵团是一支主要由瓦兰迪亚人构成的雇佣兵团，其成员绝大多数为退伍士兵：这些人无法重新适应和平时期的平民生活，因而选择以雇佣兵身份继续留驻于战事之中。该兵团在各雇佣兵团体中以纪律涣散和行为卑劣著称——战事间隙被允许自由活动时，成员往往成为驻地周边乡村的一大祸患。但如同所有雇佣兵，他们深知声誉直接关乎未来的雇佣价格与合同机会，因此在受雇期间通常会严格履行合同条款，并勤于操练作战技能，尤其注重弓弩射击方面的训练。
  sources:
  - source_id: source.calradia.game.lore.war3
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
    locator: bannerlord.db#localization.tae3lhXh
    quote_hash: CD09E2B31629868A620F41EA206B121D1B3030D1E583BE1066C7B4DF3EB6AFFC
    quote: 黄金野猪兵团的成员都是瓦兰迪亚人，主要是当地的退伍兵。这些人适应不好和平时期，因此选择活在长久的战争里。他们可能是全卡拉迪亚纪律最差、行径最为卑劣的一支雇佣兵。在被允许自由活动时，这些人就是乡间的一大祸害。但就像所有雇佣兵一样，他们知道要靠自己的名声来赚钱，所以他们会履行合同，勤习武艺，尤其是弓弩射击，以确保雇主的开销物有所值。

    layer: detail
    text:
      zh-CN: 我们的军队曾经是整个卡拉迪亚的噩梦。鹰旗下，常备军团像一台精密的机器，重步兵在前，具装骑兵在两翼，弩手在后排轮番射击。但潘德拉克把这一切都毁了。阿雷尼科斯皇帝没得选——继续维持常备军，帝国就要破产。他把养兵的责任推给了各地的执政官和贵族，战时由皇帝统一征调。听起来和以前差不多，但骨子里全变了：以前士兵是为帝国打仗，现在是给他们的领主打仗；以前军饷是国库发的，现在是领主自己掏腰包。领主出钱养的兵，凭什么对皇帝比对领主更忠诚？阿雷尼科斯在世的时候，没人敢问这个问题。
    sources:

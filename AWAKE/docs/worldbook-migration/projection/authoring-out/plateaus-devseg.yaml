    quote_hash: 54378F61C3F997877270E7D821E9A5189CBA16C6B36C6631CAB52874786632B5
    quote: 奥多赫镇位于柯希·罗希尼——黎明山脉的山麓。作为德夫赛格高原最边远的城镇之一，它以阿赫哈克王——一位神话中的暴君的御所为世间闻名，那位王的双肩缠绕着蝮蛇。即便如今，依然有传言说黎明山脉是黑魔法和秘术之地，外来者不得进入。这座城市在库赛特征服后被划给了合儿必特部，后者和山民通婚，尊重当地习俗，参与他们的宗教仪式——当然，也守护着他们的秘密。

  - id: expr.banner-knight-own-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 方旗骑士不好管。他们太傲。每个人都是打出来的，每个人腰间挂的不是剑是战绩——你让他列队他列了，但你让他别冲他未必听。因加泰尔在潘德拉克就是带着一帮方旗骑士追轻步兵，追到最后被帝国具装骑兵反冲，折了多少人。方旗骑士是瓦兰迪亚最锋利的刀，但刀太快了容易割自己手。

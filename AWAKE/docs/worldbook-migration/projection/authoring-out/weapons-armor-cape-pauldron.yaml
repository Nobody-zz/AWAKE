assertions:
- id: assertion.weapon-armor-cape-pauldron-1
  revision: 1
  kind: fact
  text:
    zh-CN: 金属肩甲是扣在两肩的独立护具，护值一到十六，材质几乎全是板或铜。数值不高，因为肩本来就难被正面砍到；它的用处是接住从斜上方来的一刀，以及让穿戴的人看着更宽、更沉。南方阿塞莱一路把肩甲做成鳞片叠缀的铜肩，护值十六；帝国与瓦兰迪亚的华丽肩甲则在铁面上再做錾花，配披风或围巾一起穿。
  sources:

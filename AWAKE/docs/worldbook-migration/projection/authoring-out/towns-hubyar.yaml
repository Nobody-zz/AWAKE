- id: assertion.town-hubyar-1
  revision: 1
  kind: fact
  text:
    zh-CN: 胡比亚是内陆城市，如今由巴努·吉勒德掌控；英雄尼姆尔在此落难，被捉后囚死在集市的吊笼里。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_A5
    quote_hash: 506C3EC360F33D9926100D6A0D9D883A14BC5BA0AB55ADF35908CC49AF766BD1
    quote: 如今他们掌控着该城，且厌恶一切轻浮的事物。
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_A5
    quote_hash: CB57C14C4C8971EA0E67C55A617F056DC73A6E985364B8BD4D7BF5AED604F7C0
    quote: 英雄尼姆尔就是在此地落难的，他在一名吉勒德少女的闺房中被捉住，关死在了集市上吊着的笼子里。
  expressions:
  - id: expr.town-hubyar-1-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 胡比亚如今是吉勒德家的城。从前那位英雄尼姆尔，就是在这一带栽的——在人家闺房里被堵住，最后吊在集市的笼子里。
    sources:

- id: assertion.weapon-head-mail-coif-2
  revision: 1
  kind: fact
  text:
    zh-CN: 链甲围帽的用法南北不同。南方把它缠进头巾：缠裹盔配链甲围帽把链甲、缠布与外盔合为一件，护头四十六；带链甲马穆鲁克盔同走此路，护头四十五——头巾在外挡沙挡日头，铁环在内接刀。北方则把它垫进盔壳，那单戴只有二十点的护头加在壳子底下，正好补上后颈与耳根那两处空当。
  sources:
  - source_id: source.calradia.game.items-head
    source_version: bannerlord-1.3.15.110062

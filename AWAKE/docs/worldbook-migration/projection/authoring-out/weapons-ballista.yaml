  - id: expr.ballista-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 弩炮是围城战中最务实的器械选择。我从军需官那里看过账目：一架弩炮的铁件用量不到投石机的三分之一，木料就地几小时就能装好一架。攻城时前锋刚扎下营寨，弩炮阵地已经可以开始压制城头了。但我也清楚它的局限：火力密度不够，杀伤效率比不上弓箭手齐射；对攻城器械的结构破坏更是可以忽略不计——弩箭钉进冲车的橡木板里拔不出来，但它不会让那辆车停下。弩炮最大的价值在于压制城头的弓箭手，给己方步兵登城争取窗口。它便宜，好用，但指望它单打独斗是不行的。
    sources:

  - id: expr.mangonel-fire-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 火焰投石车是围城战的终结者。我亲眼见过一架刚推到半路的攻城塔被三颗开花弹砸中——第一颗砸碎了塔顶的挡板，第二颗在塔身中部爆炸，火油从箭窗灌进去；第三颗砸在底座轮轴上，塔整座歪倒，烧成一堆炭。那架塔造了两个月，毁了三颗弹就没了。但开花弹不是谁想用就能用：料要从南方运，制弹的陶罐得像瓷器一样烧，还不能有砂眼。军需册上那一栏，我每次签字手都在抖——一发开花弹够养一排步兵一个月。可我还是每场围城都调一台去：不是用它砸城墙，是砸对面的人心。一颗火球打下来，对面士气就垮一道。攻城攻的是墙，也是意志。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_火焰投石车__火焰投石车.json#/Variants/1/Content
      quote_hash: 92A5717CB579EBD860432CDD6B37E6D192C7C676AF9269129E28394C5EE40848
      quote: 火焰投石车是围城战的终结者

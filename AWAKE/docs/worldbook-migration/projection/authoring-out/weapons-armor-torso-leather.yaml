  - id: expr.weapon-armor-torso-leather-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 皮甲看两样：皮的厚薄与硝的功夫。生皮硬而易裂，硝透了才软而不烂。护值从八到三十四，差的是层数与拼法；缝制硬皮外套用整块皮裁，拼缝少、价钱高，镶钉的便宜些，一枚钉一个铜板。
    sources:

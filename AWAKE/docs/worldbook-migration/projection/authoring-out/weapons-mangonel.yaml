summary:
  zh-CN: 投石车：基于扭力蓄能的重型抛射装置，核心是扭力束与抛射臂。通过扭转绳索将石头抛掷出一定距离，对城墙、敌方围城器械及其操作员均有效；葡萄弹用于清扫工事表层与密集步兵。软肋是运输笨重、蓄能周期过长、射速极慢，实战中要靠多台交替射击维持火力密度——围城战最后见分晓的是步兵登城，但登城前谁把城头砸烂了，谁的步兵就少死一半。

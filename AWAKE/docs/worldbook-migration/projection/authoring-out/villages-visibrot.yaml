summary:
  zh-CN: 维西布罗特是伊勒坦山缓坡上的一座养羊村，正好在人称伊勒坦运输线的冰湖网络下方；这一带虽然寒冷偏僻，但因它处在拉科尼斯湖与塔奈西斯湖之间、帝国与草原之间，是重要的买卖节点，人口反而比较稠密。

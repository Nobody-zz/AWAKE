- source_id: source.calradia.game.settlements
  source_version: bannerlord-1.3.15.110062
  source_content_hash: E8F7E5F0AB96CE249D4108ED663FAFF81706A2647066FF30E9816631F0AC0AD3
  locator: bannerlord.db#settlements.town_V7.descriptionText
  quote_hash: 07A17EB7885B63FA489220FCC1CAAEAAF2FBE8B95896144F352C34FE5E82242F
  quote: 其历史最早可以追溯到第一批卡拉德殖民者登上这片大陆的海岸之时
- source_id: source.calradia.chronicle.animusforge
  source_version: animusforge-20260912
  source_content_hash: 407C6E6DCA55C8EC47104C4F29489DDE7BCB991298B50BD99DA57503ABA171B2
  locator: rules/rule_沙拉斯__沙拉斯.json#/Variants/4/Content
  quote_hash: B4CD45EFFA03AF33047BAB2E12436672F54A85BDEF662BE58C68B08E0E287001
  quote: 沙拉斯？那是瓦兰迪亚人的地盘了。我爷爷说那地方原本是帝国最老最老的城，比巴拉维诺斯还老，帝国就是从那儿起家的。现在归了蛮子，真可惜。不过说实话，我们老百姓对这种事没什么感觉。帝国起家那都是几百年前的事了，跟我们现在有啥关系？沙拉斯归谁管我们也要交税。
- source_id: source.calradia.game.settlements
  source_version: bannerlord-1.3.15.110062
  source_content_hash: E8F7E5F0AB96CE249D4108ED663FAFF81706A2647066FF30E9816631F0AC0AD3
  locator: bannerlord.db#settlements.town_V7.descriptionText
  quote_hash: 9A213D7E6B374946E3085136E0DF448C910C69C5867CC0E56C50CBCD5EF74FFE
  quote: 沙拉斯则成为了一座海务和贸易的重要港口，帝国贵族们在周边海湾附近的和煦海滩上纷纷建起自己的纳凉别墅
- source_id: source.calradia.chronicle.animusforge
  source_version: animusforge-20260912
  source_content_hash: 407C6E6DCA55C8EC47104C4F29489DDE7BCB991298B50BD99DA57503ABA171B2
  locator: rules/rule_沙拉斯__沙拉斯.json#/Variants/2/Content
  quote_hash: D8FDDDE1B8668D5D6CFBE9A7FCDA6C209D771DBFE6D54ACE32F66E59005D984C
  quote: 沙拉斯的活计多，这点我认。有人在那儿码头扛货，一天能挣内陆三天的工钱。但那儿的东西也贵，买个面包比我们这儿贵一倍。挣得多花得也多，到头来跟在家种地差不多。听说那地方的老百姓没人记得帝国了，都认了瓦兰迪亚的统治。管他呢，反正我就在这儿待着，听听就行了。
- source_id: source.calradia.game.settlements
  source_version: bannerlord-1.3.15.110062
  source_content_hash: E8F7E5F0AB96CE249D4108ED663FAFF81706A2647066FF30E9816631F0AC0AD3
  locator: bannerlord.db#settlements.town_V7.descriptionText
  quote_hash: 17D51C34D1D377FADC008D7A6D86C1486916D98EBD903C89E7EE32F40CF30FB1
  quote: 时不时地划着小艇在小岛的周边游弋

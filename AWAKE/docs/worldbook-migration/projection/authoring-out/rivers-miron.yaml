summary:
  zh-CN: 弥戎河：北方大河，源出乌卡利翁高原，经伽尔喀斯大瀑布汇入拉科尼斯湖；巴旦尼亚人称「米尔」。巴旦尼亚、北帝国、斯特吉亚三族界河。
registry_bindings:
  profile_registry_version: 1.0.0
  profile_registry_hash: 309D10583E7B4AF05F28DE2C2E67A2528CB3D6C45752369C0F7D160FABC3F3A5
  referral_registry_version: 1.0.0
  referral_registry_hash: 6E17075F1F967BE28C0437121DB50E5C30809C4EFC3D2A5F22AD9BB0B3B926CD
sources:
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_B5_1
  quote_hash: 17FCEF06F0534C6EE02764E2A79E45AA6EC7B78731644E75B2FD081D428C6EF8
  quote: 雷姆托伊尔位于乌卡利翁高原东部悬崖的裂隙下，靠近巴旦尼亚人称为“米尔”的弥戎河的源头。这里是巴旦尼亚土壤最肥沃的地方，小麦收成很好。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_EN9_1
  quote_hash: A2D7040538A59E1B3917B41B8A7DB3B1C56CDCC6D18BEC7142C163E0043DAEE7
  quote: 墨卡罗维亚俯瞰着伽尔喀斯大瀑布，这座瀑布由一系列湍急的水流构成，并最终同弥戎河一起汇入拉科尼斯湖。村庄座落于一道峭壁之上，以期在这边疆之地免受强盗匪帮的侵扰。飞流直下的瀑布拍过峭壁，将许多矿石暴露出来，村民就以此为生。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.village_S3_1
  quote_hash: 1D7CFE16CD8D501E4239B1BA27F3BCB2448B07AF2A134809AE865A759D5F36EC
  quote: 乔诺巴斯，或“黑树林”，坐落于由森林开辟出的一片土地上，俯瞰着弥戎河倾入拉科尼斯湖的大瀑布。村民们在瀑布旁水雾弥漫的田里种植黑麦与大麦。
- source_id: source.calradia.chronicle.animusforge.geography2
  source_version: animusforge-20260913
  source_content_hash: 386587a2fdf8b9bfdde96ae07f269482c98a11a87fcc816f86a39d07800c9560
  locator: rules/rule_弥戎河__弥戎河.json#/Variants/0/Content
  quote_hash: CF1D88BD3E58EE583387547A3DCA0F4DA2491B510A88119545AFC3DAE522A02F
  quote: 弥戎河是巴旦尼亚，北帝国，斯特吉亚的界河，流量不大，但汛期无法徒涉，结冰期有两个半月的时间，是北帝国西北防线的重要天堑
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.Settlements.Settlement.text.castle_village_S4_2
  quote_hash: FB58373E3030243FA2E20ED84156F27927507B38ADFF776523F17B119C9FD729
  quote: 伊斯米尔科格坐落于弥戎河的两条小支流——加尔察河与瓦斯特拉河间长满草的低地上。当地人大多既养牛又偷牛，并长期劫掠东边的帝国边境村庄和西边的巴旦尼亚人。
- source_id: source.calradia.game.settlements.geography2
  source_version: bannerlord-1.3.15.110062
  source_content_hash: 9af64df767747545a9a75b8e22528317e291c51f0314f6842eb79a9f061734b5
  locator: bannerlord.db#localization.n9WMUuSp
  quote_hash: 9AC8176DDCA43AC71CE7BA0BFC5D3D7C61EAEEA0271E09EAE4A8CB40D4D93638
  quote: 厄庇克洛忒亚，意为“战无不胜”，得名自乖戾的长发将军萨拉庇俄斯，他击溃了一支巴旦尼亚大军，守护了帝国在拉科尼斯湖以西的领土。这里的塔眺望着弥戎河，经常成为北方人发现南方的可怕大军的第一站。

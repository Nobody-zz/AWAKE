  - id: expr.modern-legion-khuzait-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 帝国人的皇帝把军队裁了，让下面的领主自己养兵。在我们草原上，可汗的权威来自于所有部落的效忠，每个部落都有自己的战士，但打仗时都听可汗的。帝国人的皇帝把兵权分了，却没能让那些执政官继续听他的话，这算什么改革？

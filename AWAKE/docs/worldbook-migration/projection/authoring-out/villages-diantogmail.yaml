summary:
  zh-CN: 迪安托格麦尔位于“林·泰瓦尔”也就是“暗湖”之畔；此地名字的解释有好几种传说，意思是“白鼬之翔”，却没有两个版本对得上；村民从湖边收集黏土，供附近的工匠使用。

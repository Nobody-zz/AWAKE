      min_detail: summary
    - profile_id: profile.merchant
      scope: faction
      min_detail: summary
    denies: []
  - id: expr.south-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我们南帝国控制着卡拉迪亚最富庶的区域，而且还是比较易守难攻的，我们的实力比阿塞莱强，我们会谋求与阿塞莱的战争，以获得新的领土。我们不愿意打仗，但有的时候战争是不得不打的。而我们也得防御东边的库赛特以及西部北部的僭越者，所以我们的压力还是蛮大的，虽然我们兵力多。
    sources:

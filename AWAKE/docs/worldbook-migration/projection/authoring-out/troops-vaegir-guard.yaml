- id: assertion.vaegir-guard-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 对别国而言，维基亚卫队是各有各的解读：斯特吉亚人视之为荣耀——北方年轻人下吕卡隆服役，攒够第纳尔回来买地娶妻，能在皇帝身边持斧而立是一种荣耀；诺德人视之为立国的起点——先王「饿人」沃尔比约恩在这里待了十年，攒下巨额财富后用第纳尔和刀剑驯服了北方的酋长；瓦兰迪亚人表示不解——国王的护卫本该从最忠诚的封臣家族中选拔；库赛特人则不以为然——可汗的护卫是他的那可儿，那不是金钱能买到的东西。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

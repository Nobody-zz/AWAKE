- id: assertion.modern-legion-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 外族对这场改革的看法一致地不看好：瓦兰迪亚人说这跟自家男爵私兵差不多，但人家至少是男爵养兵、国王号令，帝国倒好，执政官们各自养兵，三个皇帝互相打，连个统一号令都没有；巴旦尼亚人说皇帝亲手把兵权分给自己任命的人，然后又管不住他们，这才是最可笑的地方；库赛特人说可汗的权威来自所有部落的效忠，帝国皇帝把兵权分了，却没能让执政官继续听他的话，这算什么改革。
  sources:

summary:
  zh-CN: 德沃鲁斯塔是一座渔村，俯瞰着连接瓦尔切格湾和拉科尼斯湖的激流；村民在天亮时沿悬崖一路下去，捕捉跃过岩石的鲑鱼，以及海里的鲱鱼和鳕鱼。

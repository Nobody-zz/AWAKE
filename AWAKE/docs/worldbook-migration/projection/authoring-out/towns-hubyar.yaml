- id: assertion.town-hubyar-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 据说，胡比亚建在堕落残暴的图兰王那座奢华狩猎小屋的遗址之上；他奴役了阿塞莱族长的家人，被后者复仇所杀。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B

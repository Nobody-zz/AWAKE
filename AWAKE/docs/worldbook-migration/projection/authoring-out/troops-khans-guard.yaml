  - id: expr.khans-guard-soldier-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 我这辈子最大的念想，就是有朝一日能被选进可汗卫士。他们的弓比我们的长，他们的箭比我们的轻，他们的马比我们的快——同样的距离，我放三箭，他们能放五箭，还箭箭咬肉。但我也知道，就算练一辈子，大多数人还是选不上：他们不光要射得准，还要能在马上用刀近战。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

      scope: national
      min_detail: detail
      culture_ids:
      - entity.culture.vlandia
    denies: []
  - id: expr.old-legion-sturgia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 旧式军团是我们北方人最头疼的敌人。我们的盾墙也很硬，但帝国军团的盾墙不只是硬，它还灵活——他们能在行军中变换阵型，能从行军队列迅速转成战斗队形，能在被我们冲锋的时候不退反进。这种纪律不是天生的，是练出来的。潘德拉克我们帮巴旦尼亚人打帝国，那次帝国军团的侧翼被巴旦尼亚的弓箭手撕开了，我们趁机冲进去，砍了他们的鹰旗。但说实话，如果那天帝国皇帝不是把军团放在了最不利的地形上，我们赢不了。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
      locator: rules/rule_旧式军团__旧式军团.json#/Variants/7/Content
      quote_hash: 6C4457161EC0AE2EC6327B6F2C06CC475B5A934B6DF07C3D34CDD46110E383B5
      quote: 但帝国军团的盾墙不只是硬，它还灵活

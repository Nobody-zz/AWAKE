  - id: expr.empire-system-west-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 加里俄斯皇帝是靠老兵起家的，西帝国的军事制度骨子里就是老兵政治。阿雷尼科斯废除常备军之后，那些被遣散的军团老兵无处可去，是加里俄斯收留了他们。西帝国的军队可能是三个帝国里最能打的——因为我们的核心是一群打了半辈子仗的职业军人，他们不需要训练，只需要一个值得追随的统帅。缺点也很明显：老兵会老，会死，而他们的儿子未必像父辈一样能打；而且老兵们对加里俄斯的忠诚是基于个人威望，不是制度。

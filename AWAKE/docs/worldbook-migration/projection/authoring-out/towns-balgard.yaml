- id: assertion.town-balgard-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 根据传说，第一批到此的诺德人傲慢地要瓦肯与斯特吉亚部落纳贡，被两家结盟赶回长船；后来胜者因分赃不均起争执，直到精明的诺德人贡达尔登陆，把死去族人的武器甲胄公平分给当地人，因此被认作该地之主，其后代与斯特吉亚人不断通婚，成了今日斯特吉亚的列位王公。
  sources:
  - source_id: source.calradia.game.settlements-desc
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 115D3154A7E91EF5897C8DB309AB994897441B9289AEBCD23D5E5DD25DA1858B
    locator: bannerlord.settlements#town_S2
    quote_hash: 5D6827A854B48A964555F15C9857C069134BFB8B9A9FCED8DFBA119A5B1D4867
    quote: 根据传说，第一批前来此地的诺德人傲慢地要求附近的瓦肯和斯特吉亚部落纳贡，而后者结成同盟将这群新来者赶回了自己的长船上。然而，胜利者们因为分赃不均爆发了争执，直到一位精明的诺德人贡达尔登陆此地，将自己死去族人的武器和盔甲公平地分给了当地人。当地人认可贡达尔对该地区的统治权，而他的后代和斯特吉亚人不断通婚，成为了如今斯特吉亚的列位王公。
  expressions:
  - id: expr.town-balgard-2-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 老一辈讲，最早来的诺德人太横，叫瓦肯人和斯特吉亚人一块儿赶回船上去了。后来他们自己为分东西打起来，是贡达尔把死人的刀甲分匀了，众人才服他。如今斯特吉亚那些王公，都说是他的后人。
    sources:

  - id: expr.weapon-armor-torso-plate-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 板甲的难点在弧度：平面板受力全落在一点，敲出弧来才能把力道分到边上。铜护胸板是巴旦尼亚的手艺，整块铜板箍住前襟，护值到四十二；在链甲外面再加板的两层做法便宜些，价钱比纯链甲贵三成。

summary:
  zh-CN: 诺德军事力量：以盾墙战术为核心——重装步兵锁甲圆盾站前排，铩戟兵站第二排专治冲上来的骑兵与重步兵，投斧手在接战前投掷打散阵型，双手斧战士近战爆发力惊人但几乎无防御。没有骑兵（马在船上站不稳），弓箭也是软肋。真正的本钱是长船：能把整支军队送到任何海岸，这种战略机动性大陆上没有第二家。

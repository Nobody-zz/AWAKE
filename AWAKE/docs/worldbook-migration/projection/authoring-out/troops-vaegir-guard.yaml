summary:
  zh-CN: 维基亚卫队：阿雷尼科斯皇帝的亲卫部队，兵员主要是外族——诺德人、斯特吉亚人与北方各路猛士，拿皇帝的第纳尔用性命守皇宫。制度沿自古帝国：从边疆以外招募最精锐的战士充任亲卫，以免护卫卷入元老院与军团的派系。它以「皇帝本人活着」为绝对前提，阿雷尼科斯遇刺后指挥核心消失，这支外族卫队既失去效忠对象，又遭帝国社会全面排斥。

assertions:
- id: assertion.south-1
  revision: 1
  kind: fact
  text:
    zh-CN: 南帝国控制着卡拉迪亚最富庶的区域，而且比较易守难攻；兵力较多，马场多，骑兵也多，具装骑兵相对另外两个帝国更多。但它的压力同样不小：得防御东边的库赛特，以及西部北部的僭越者（西帝国、北帝国）。在战略取向上，它更倾向于对阿塞莱方向用兵，以获得新的领土。

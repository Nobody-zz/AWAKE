  - id: expr.village-bog-beth-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 博格·贝斯以林间毛皮为业——沼林兽多、套猎成习；皮张按毛色与完整分等，河狸皮最贵，冬季毛厚时外运、皮贩登门。

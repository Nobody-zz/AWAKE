- id: assertion.aserai-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 外族对阿塞莱军队的印象集中在骑兵与奴隶兵两头：他们的骑兵分两种，一种是贵族老爷，骑好马、披铜甲，扔的标枪扎进肉里拔都拔不出来；另一种是买来的奴隶兵，骑射厉害，箭射完了拔刀就砍。步兵则不太被看重——两条腿扛盾的挡挡箭还行，真打起来骑兵一冲就散。最让人发怵的不是奴隶兵多能打，是他们便宜：死了主人再买，跟买马似的。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

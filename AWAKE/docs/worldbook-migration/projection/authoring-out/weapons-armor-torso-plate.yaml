- id: assertion.weapon-armor-torso-plate-2
  revision: 1
  kind: fact
  text:
    zh-CN: 这块地上更常见的是在里衣外面缀几块铁板：扣带皮胸甲十九、铁板皮甲二十二、华丽鳞甲三十九。它比整片板省铁，也比整片板好修，帝国的步卒与南方弓手都用。
  sources:

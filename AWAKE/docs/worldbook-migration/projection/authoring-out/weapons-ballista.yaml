  expressions:
  - id: expr.ballista-villager-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 弩砲？见过，城头上那种大弓架子。攻城的时候守城的一方从垛口后面往外射，箭跟人胳膊那么粗，嗖一下过来，木盾根本挡不住。我们村有个去守城的回来说，那东西一箭能穿透三个人，跟串鱼似的。不过他说那东西射完了也就射完了，箭飞不远，打到后面就没劲了，想靠它把对面的冲车打烂是不行的。真正把城守住还得靠人往上填。

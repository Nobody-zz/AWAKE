  - id: expr.empire-system-west-vet-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 我是跟着加里俄斯皇帝的老兵。以前在常备军团服役，潘德拉克之后军团解散了，我回老家种了两年地，后来听说加里俄斯在西边招人，又扛着剑去了。我这种人西帝国有很多——打过潘德拉克，见过鹰旗倒在泥里，不信任元老院，不信任吕卡隆，只信任带我们活下来的将军。加里俄斯说阿雷尼科斯改革是为了省钱，但省钱省掉了帝国兵的魂。等我们这批人打不动了，谁知道西帝国会怎样。
    sources:

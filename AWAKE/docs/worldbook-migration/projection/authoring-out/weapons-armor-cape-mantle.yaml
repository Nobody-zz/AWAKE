assertions:
- id: assertion.weapon-armor-cape-mantle-1
  revision: 1
  kind: fact
  text:
    zh-CN: 披风与围巾是披挂类里最轻的一档，护值二到九，材质以布为主，少数为薄皮。它们不护身，用处是遮风挡雨、遮脸挡沙，以及在队列里认人——染了什么色、绣了什么边，一眼就分得出是哪家的。格纹披风是最常见的巴旦尼亚款，重磅斗篷走的是帝国一路，绿风帽与羊毛风帽则什么人都有。

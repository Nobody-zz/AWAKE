- id: assertion.weapon-head-kettle-2
  revision: 1
  kind: fact
  text:
    zh-CN: 锅盔最见功夫的地方在'衬'：同一只帽壳，底下垫填充帽得护头三十三，垫链甲围帽就能到三十八。它因此成为本作叠穿做法最常用的外壳——铁帽负责滑开刀锋，底下的布或铁环负责接住剩下的力道。

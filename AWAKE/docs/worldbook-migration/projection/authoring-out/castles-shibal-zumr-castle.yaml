    layer: detail
    text:
      zh-CN: 希巴勒·祖姆尔堡扼石灰河渡口，下辖粮村与牧马村各一；谷物循河外运，滩上金合欢林间的马群由堡中圈定牧界，过境商旅的粮秣与草料先由堡里配给。

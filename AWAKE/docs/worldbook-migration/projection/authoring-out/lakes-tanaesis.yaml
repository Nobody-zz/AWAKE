  - id: expr.lake-tanaesis-frontier-noble
    revision: 1
    layer: detail
    text:
      zh-CN: 外塔奈西亚丢了以后，席隆尼亚的元老们被迫重新拾起兵法——镀金甲掸了灰，宝石剑磨了刃，带着家兵对抗兀儿浑的勇士。湖上这道分界线，是打出来的。

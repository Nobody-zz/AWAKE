assertions:
- id: assertion.weapon-head-kettle-1
  revision: 1
  kind: fact
  text:
    zh-CN: 锅盔是一只倒扣的圆锅，宽帽檐自带垂下的角度，把从上方劈落的刀顺势滑开——代价是帘檐撑得开，挡不住正面的直刺。护头值位于二十二到四十二之间，落差全在底下垫的东西上。它是卡拉迪亚门槛最低的铁盔：用铁少、锻打简单，镇上铁匠就能打，因而成了征召兵与守军的常见装备，主要产地是瓦兰迪亚与帝国。
  sources:
  - source_id: source.calradia.game.items-head
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 45887F4A4963E921A9C498B871009749C5B0BD65E1FE8D7B3885E660FDDE0A7F

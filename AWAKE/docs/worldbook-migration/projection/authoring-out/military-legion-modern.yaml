      zh-CN: 现代军团指的是阿雷尼科斯改革之后的帝国军队：皇帝把原来的常备军废了，改用执政官和贵族自己出钱组建的私兵——开销更低，也更适合控制边边角角的领地。军费是省下来了，但军队从国家手里转到了地方领主手里。

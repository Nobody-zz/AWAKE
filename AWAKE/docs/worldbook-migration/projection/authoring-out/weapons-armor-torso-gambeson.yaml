  - id: expr.weapon-armor-torso-gambeson-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 填充衣按纳缝的层数与行距分档。行距越密越硬挺，护值从七到十八不等；纳得稀的软塌塌，穿久了絮往一处跑，护值就散了。市上一件成品五到十枚银币，自己做的只算布钱。

summary:
  zh-CN: 现代军团：阿雷尼科斯军制改革之后的帝国军队——废除原有常备军，改用执政官与贵族自行组建、开销更低、更适合控制领地的私兵。军费大幅削减，军队却从国家手中转到地方领主手中。皇帝省了钱，执政官们多了实权；士兵则从此看雇主的脸色吃饭。改革为后来的三帝内战提供了武力基础。

- id: assertion.golden-boar-3
  revision: 1
  kind: rumor
  text:
    zh-CN: 在雇主与乡民这两头，野猪兵团收到的都是骂名：乡民说他们是披着人皮的畜生——当兵当傻了，除了杀人放火什么都不会，到处跑，稍不顺心就掀摊子揍人；请他们打仗的老爷打完仗就把人撒在乡里不管了，遭殃的还是种地的。

  - id: expr.village-mag-arba-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 马格·阿尔巴以谷地种麻为业——湿土宜麻、纤维韧长；麻按纤维与色泽分等，沤麻靠谷水，供织坊纺线与结网，多与草场牲畜搭卖。

    layer: detail
    text:
      zh-CN: 乌赛克堡据阿克坎丘陵临塔奈西斯湖处，下辖牧羊村与牧场村各一；羊毛与羊只在堡中清点、按季交易，德夫赛格高原的牧界由汗帐派人勘定，牧民过堡须报头数。

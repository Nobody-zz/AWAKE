  - id: expr.small-factions-summary
    revision: 1
    layer: summary
    text:
      zh-CN: 他们自己不叫自己匪帮，说自己是「被遗忘者的工会」：你摆摊没人管，他们管；你死了儿子没人收尸，他们替你收。他们讲自己拜的不是账本，是一个死了一百年的皇帝，等的是下一代人的好日子——说是这么说，会里的人也承认自己七岁跟着爹进会，如今鬓角白了，天还是没亮，念一次经，手里那把刀就沉一分。同行看他们又是另一套说法：同业，但不是同行——一个为了利，一个一半为了利、一半为了等谁回来；念着经把刀子捅了，捅完还跪地上求原谅。但同行也认一件事：他们接活讲规矩，交了钱的不抢、交了粮的不烧、灾年还给欠账的宽限，官府来围剿，他们不躲山头，就躲在隔壁老瘸子家后院的地窖里——官府想不到。他们的根基不是钱，是街坊。

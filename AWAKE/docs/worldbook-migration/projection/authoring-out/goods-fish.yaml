    layer: detail
    text:
      zh-CN: 鱼是货里最贱的一档，一件 12 第纳尔，赚头全在量上。塔奈西斯湖那片出产最盛，收鱼的走的是往内地城镇的路线——靠湖吃鱼不值钱，进了山就翻。

  - id: expr.siege-tower-lord-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 攻城塔是用木头堆起来的战场赌注。它太重，推得慢，路上坑一多轮轴就歪。但让它推到城下，仗就赢了大半——吊桥放倒，整团步兵直扑城头，等于给城墙凿了一个缺口。云梯爬城是零敲碎打，攻城塔是整建制压上，城头突破口一旦撕开就再也堵不住。缺点是好造不好守：投石车砸它，火油烧它，弩炮的箭插在塔身上跟刺猬似的。围城时，我调一台攻城塔上前线，心里都在默算——这座塔值不值一个连队的伤亡。划算的时候不多，但到了非登城不可的时候，也只剩攻城塔这一条路。
    sources:

    denies: []
  - id: expr.empire-system-sturgia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 帝国人把常备军废了，这对我们斯特吉亚来说是好事。以前他们的军团北上，后勤有保障，兵力有补充，一打就是好几年。现在改成贵族私兵，帝国人的战力还在——那些执政官养的具装骑兵还是很能打——但他们的持久力不行了。贵族养兵养不了太久，打仗时间一长，军饷就开始拖欠，士兵就开始开小差。我们斯特吉亚人早就习惯了波耶带私兵的模式，但我们是几百年来一直这么玩，有默契；帝国人是突然从常备军转向私兵，磨合还差得远。
    sources:
    - source_id: source.calradia.chronicle.animusforge.war3
      source_version: animusforge-20260913
      source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

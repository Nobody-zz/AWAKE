- id: assertion.weapon-head-closed-2
  revision: 1
  kind: fact
  text:
    zh-CN: 全覆面盔另有一条支流叫眼眶盔：不封整张脸，而是在眼位上做两个凸起的圆罩，形如一对眼眶——视缝比全闭款式宽，防护只在眼周加厚，护头四十九到五十一。它多与链甲同用，闭面链甲眼眶盔即把圆罩、链甲与护鼻合成一件。护面盔是这条路最轻的一档，只护住面门与下颌，护头二十五。
  sources:

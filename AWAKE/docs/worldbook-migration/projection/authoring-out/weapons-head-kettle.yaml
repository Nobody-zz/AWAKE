  - id: expr.weapon-head-kettle-vlandia-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 瓦兰迪亚的锅盔分两路：一路是带皮革锅盔，帽壳下缝一层皮革，护头三十三；一路是衬款，帽壳底下再垫填充帽、填充布或系带围帽，护头同样是三十三，靠的是垫层的厚薄。圆顶锅盔走的是另一条形制，顶更圆、檐更窄，护头三十六，多给守城的人用。
    sources:

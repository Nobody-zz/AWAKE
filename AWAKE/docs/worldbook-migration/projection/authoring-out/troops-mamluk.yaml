  - id: expr.troop-mamluk-aserai-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 埃米尔们的账算得清：马穆鲁克自幼购入、宫廷养大，成年便是纯粹的军事资产——「花金子养大的，就得拿命还」。养闲着是亏本买卖，所以手头有马穆鲁克就急着找仗打。但也清楚他们的短处：除了打仗什么都不会，掌印管钱的差事还得交给血亲。

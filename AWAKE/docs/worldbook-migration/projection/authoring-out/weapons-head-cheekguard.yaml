    layer: detail
    text:
      zh-CN: 护颊盔按壳厚与装差分档：铜版护头三十一到三十五，钢版三十二到四十一；穗饰款在护颊片下沿挂一排短穗，脊状装饰款在帽脊上起一道棱。买的人先看护颊片的活动轴——轴松了就贴不住腮，等于白垂两片铁。

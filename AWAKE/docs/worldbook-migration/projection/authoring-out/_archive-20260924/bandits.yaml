  expressions:
  - id: expr.bandits-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 劫匪三三五五聚起来，专挑良善下手，跟苍蝇一样到处都是，轰也轰不走、打也打不完，只能勤加剿灭。他们谁都打不过，也就欺负欺负村民——最可恶的一帮人。

assertions:
- id: assertion.weapon-armor-torso-gambeson-1
  revision: 1
  kind: fact
  text:
    zh-CN: 填充衣是把十几层粗布摞起来、用线纳成菱格缝死的厚衣，护值七到三十六，材质多为布，少数夹一层皮。它便宜、家里就能做，是卡拉迪亚数量最大的甲——征召兵拿到的第一件护具就是它。重磅武装衣护值十八，无袖填充外套也是十八，帝国的辅兵甲十七。

  - id: expr.bandits-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 林子里的那批常年藏在深处，以简陋木寨为据点：破烂布衣，少数人裹着偷来的破损皮甲，用的是猎弓、生锈斧头与草叉。他们既是被战乱赶离土地的农民，也是逃兵与罪犯的集合体。

    text:
      zh-CN: 投石车是围城里最值钱的重型器械：靠扭力束绞紧、甩臂一抡，把石球抛出去。它对城墙、对方的围城器械和操作的人都有效。它的毛病也明显——太沉，几头牛才拉得动一台，而且攒一次力要半天，射得极慢，实战里得靠多台轮着来。

  text:
    zh-CN: 护腿与靴是穿戴里最容易被忘掉的一段，护值从一到二十六，跨度极大。绝大多数是鞋：软皮鞋、缠裹鞋、翻折皮靴、马靴，护值三到九，管的是走路。往上是靴筒加高的骑兵靴，护值十到十几；再往上才有真正的护腿：链甲护腿用链子包住小腿，护值二十二三；夹板靴与扎板靴把铁片夹进靴面，护值十九到二十六。

  revision: 1
  kind: rumor
  text:
    zh-CN: 据传，远在帝国人来到这片大陆的几个世纪之前，拉齐赫就已是坎族探险家殖民珀拉斯海岸的基地；他们的船首饰着葡萄藤编成的神像，象征财富、葡萄酒、爱与战争。

  quote_hash: F63E0CC5F2FAAC9B817DBA279B7722B7A7E87DBBEC417A13053CF58D6C977A9F
  quote: 自由民，又名厄琉忒耳，生活在帝国边缘的大草原上。他们最初是逃亡奴隶和负债者的后代，但很快因为对边境地区的了解而受到当地帝国指挥官的高度重视。他们的领袖被授予头衔，年轻人也被招募为执政官和皇帝们的私兵。但是，尽管他们现在非常忠诚于帝国的理念，对于帝国的实际权威却仍充满敌意。
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_现代军团__现代军团.json#/Variants/0/Content
  quote_hash: 84073E47D638F2F03D5F2AAF4AA7F009B5A286F2DEB82FEB5F001C2BA1ECC2FB
  quote: 这一改革大幅削减了军费，但让军队从国家手中转移到了地方领主手中
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

    grants:
    - profile_id: profile.soldier
      scope: national
      min_detail: detail
    denies: []
- id: assertion.mountain-dryatic-2
  revision: 1
  kind: fact
  text:
    zh-CN: 山间矿藏丰厚：溪流冲出的盐矿（阿塔科尼亚）、数百年仍在出银的老矿井（耶拉科斯、弥戎河谷）、悬崖铁矿（马拉忒亚、瓦忒亚）；高地牧场养牛（雷索斯，自前卡拉德时代），东坡自古是帝国军马育种地（威亚罗斯）；山下水土肥沃，是帝国北方的「粮仓」（斯塔堤摩斯、底俄帕利斯）。
  sources:

- id: assertion.south-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 邻国对南帝国的评价集中在「兵多而将弱」：有人直接嘲笑那帮养尊处优的城主根本不知道如何打仗，像俄洛斯与图里亚多斯这样的将领完全不懂军事却还掌握着兵权，女皇本人管理能力尚可、用兵打仗太差；库赛特人说接壤归接壤，主要还是以防御为主，谁也不愿意陷入双线作战；阿塞莱人说南帝国比自己强大，但也没有强大多少，抗击它的侵略、保证防线不被击穿即可，进攻就别想了。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

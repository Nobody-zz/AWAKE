  - id: expr.mountain-dryatic-shrine-headman
    revision: 1
    layer: detail
    text:
      zh-CN: 俄佛堤斯湖被称作「大地之眼」，古帕拉人奉为圣地。如今湖畔的小麦照种，可山里人对那片水仍存敬畏——旧信仰的影子比帝国老。

    text:
      zh-CN: 马扎丹堡据伽尔喀斯河源、拉科尼斯湖西侧，下辖亚麻村与牧马村各一；亚麻在堡中沤浸、打包外销，林垦牧场按围栏分界，波耶之间议定的地界由堡里立碑为凭。

  revision: 1
  kind: fact
  text:
    zh-CN: 塞堤斯河发源于密泽亚德高原，向南穿过吕卡里亚谷与上游平原，至下游分作三支注入珀拉斯海，人称三河河谷；两岸谷地是帝国南方的粮仓。

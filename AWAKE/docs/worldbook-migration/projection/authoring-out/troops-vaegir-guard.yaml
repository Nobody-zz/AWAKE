  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/0/Content
  quote_hash: AD9A9FC5C9FE1D6F5DAD6F1011305E36C6ED94BEB5A81E58F105AC278F288E66
  quote: 维基亚卫队是阿雷尼科斯皇帝的亲卫部队，但和普通军团不同，这支部队主要由外族雇佣兵组成——诺德人、斯特吉亚人，还有来自北方冰原的各路猛士
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/0/Content
  quote_hash: 5F6C8CCB6430125C06C370CDD5AD91AE58668CFA9FED29805AB24674075689F0
  quote: 皇帝信任这些外族人，因为他们在帝国内部没有根基，除了忠诚别无依靠
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/1/Content
  quote_hash: 7057F89DA784B6D3DA6DF2A33E43305C8B914BCD40524EC790D489D0D5370907
  quote: 只有这些拿钱卖命的外族人，除了皇帝本人之外谁也不认
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/5/Content
  quote_hash: D2AEB516BFC6707112E08395ACC436326B248227B8E3ECC89E55DEB283A43D6E
  quote: 维基亚卫队沿袭了古帝国的一项传统——从边疆以外的蛮族中招募最精锐的战士充任皇帝亲卫
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/6/Content
  quote_hash: BB05113283EBB1097CAF67A935629938F9C6BCA48646A4B464087BB2850C9CD1
  quote: 许多年轻人南下去吕卡隆服役，攒够第纳尔再回来买地娶妻
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/8/Content
  quote_hash: CC006A6C28191B106BCE45A5310E7ADBC1CF5D7FD73594FA0E3DB8EC9FDF4EFF
  quote: 他在南方的帝国皇帝身边持斧十年，见识了真正的权力是什么样子，也攒下了数不清的第纳尔
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/10/Content
  quote_hash: BA5AD78ACE7BE4C0B834C7038039068B13FD0777CB83DF4C4CE8B639EA86A3D2
  quote: 国王的护卫当然应该从最忠诚的封臣家族中选拔，怎么能交给一群拿钱办事的外族人
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/13/Content
  quote_hash: 9140E505F2670E388FC5437BF04CCB4D923782CF3367CA37DA33B3DDE8180408
  quote: 可汗的护卫是他的那可儿——从小一起长大的兄弟，战场上生死与共的伙伴。那不是金钱能买到的东西
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/4/Content
  quote_hash: 54B40F51A0596F538AB3A0E2AECBBF5BEB05FBFB492A5563DBC710D4BEA870E4
  quote: 我姑母家的店铺就是被他们烧掉的
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/4/Content
  quote_hash: CF1E5E18E46737EAB2CADF7C369A4AC3923188657AA69C7480FD631BD1033815
  quote: 他们在城里干的那些事，比弑君也好不到哪去
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/2/Content
  quote_hash: FD59AA813C2BA4850ECB468649EF0FC8C97996804B2CE899BC74BF0A217EA6AD
  quote: 他们太依赖皇帝了——皇帝活着，他们是帝国最精锐的利刃；皇帝死了，他们就成了无主之剑
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/2/Content
  quote_hash: 7DBE2CD4704CD42E10945B30A1F7F6F4DF531F2623D423873394E1D258BD9AC3
  quote: 他们本可以列阵突围，凭他们的战力，没人拦得住。但他们中的一些人选择了发泄——在城里烧杀抢掠，彻底坐实了'弑君蛮族'的骂名
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/3/Content
  quote_hash: 97001EA1BA9D91DB303035A1E72E9C817F5AA0277935A1495ECD42E00FF593CF
  quote: 那些北方大汉，一个个高得像铁塔，胡子编成辫子，手里攥着长斧
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_维基亚卫队__维基亚卫队.json#/Variants/3/Content
  quote_hash: 5EF457F263D8A8D1395F30D723876B8F0FE70F82622CC7C72E91688DA6AB9FF5
  quote: 他们步伐整齐，盔甲锃亮，比任何一支帝国军团都精神
authority:
  owner: awake_canon
  conflict_policy: canon_wins
assertions:
- id: assertion.vaegir-guard-1
  revision: 1
  kind: fact
  text:
    zh-CN: 维基亚卫队是阿雷尼科斯皇帝的亲卫部队，兵员主要由外族雇佣兵组成——诺德人、斯特吉亚人，还有来自北方冰原的各路猛士。他们拿皇帝的第纳尔，用性命守卫皇宫。这套做法沿袭古帝国的一项传统：从边疆以外招募最精锐的战士充任皇帝亲卫，因为外族人在帝国没有家族根基和政治牵连，忠诚只属于皇帝一人，不会卷入元老院或军团的派系斗争。这个制度有一个绝对前提——皇帝本人必须活着。

- id: assertion.old-legion-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 对帝国的老兵与平民来说，旧式军团是「祖父辈那一支军队」：服役二十年的人说，那年头军团配得上「军团」的称号，一套准则管着所有人，宁愿战死也不愿看标准被削弱；他们记得德洛修斯·涅雷采斯率最后一个真正的军团在巴旦尼亚树林里遭了伏击。平民记得的是那种压迫感——一整个军团踩着同一种步伐往前推进时，地面都在颤抖；也有人在酒馆里喝醉了就骂现在的年轻人不懂什么叫真正的军团纪律。而旧军团的印记还留在具体的人和物上：曾在旧军团服役的老人，会在村庄里为一个兜售从战死将士坟墓中盗掘来的金属残片的小贩暴怒。
  sources:
  - source_id: source.calradia.game.lore.war3
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
    locator: bannerlord.db#localization.mk0l1BfB
    quote_hash: 6748218848E9F5EF19D0A0D84F3B3DCAD8ADA4A7CD250E8BFC43F68199CA629C
    quote: 可以这么说。我在帝国军团里服役了二十年。曾几何时，他们确实配得上“军团”的称号。我和老战友们都在一套准则下服役，我们宁愿战死，也不愿看到这套标准动摇或削弱。但是，德洛修斯·涅雷采斯率领著最后一个真正的军团，在巴旦尼亚的树林中遭到了伏击。你可能听说过这段往事。
  - source_id: source.calradia.game.lore.war3
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
    locator: bannerlord.db#localization.DzyAgYIX
    quote_hash: C8D8C7FB3E2C3FE3E3265394903D4729A90498EBD16731A69AE35F846B497660
    quote: 德洛修斯·涅雷采斯率领着军团的精锐进入巴旦尼亚森林，却遭遇了一场埋伏，你可能听说过这件事。那时我正卧病在床，结果我的许多战友都没能回来，从那之后一切都变了。
  - source_id: source.calradia.game.lore.war3
    source_version: bannerlord-1.3.15.110062
    source_content_hash: 4ff820e7299c3d9fc4f55d812ae9d6e5c175d3beb4a3646b88652f22303c0d07
    locator: bannerlord.db#localization.pNVKWAKo
    quote_hash: F3544E4F7EF074D60DD45611369614482563CDBD50990B57680329BB9FF6F87A
    quote: 在你造访{VILLAGE}期间，一名年长的{TROOP_TYPE}显得心事重重，沉默寡言。当队伍启程离开时，他突然停下脚步，目光死死盯着路边的一个摊位，随即脱离队伍，怒吼着冲向摊主。事情很快明朗——他曾是帝国旧军团的一员，曾在此地与{NEAREST_OTHER_CULTURE}交战，而眼前这名小贩在兜售的金属残片，显然是从战死将士的坟墓中盗掘而来。
  - source_id: source.calradia.chronicle.animusforge.war3
    source_version: animusforge-20260913
    source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
    locator: rules/rule_旧式军团__旧式军团.json#/Variants/1/Content
    quote_hash: 8307566C9E0AB143AE0F3DD6C49B40D6755841085622950343744869629CADCC
    quote: 那种一整个军团踩着同一种步伐往前推进时地面都在颤抖的感觉
  expressions:
  - id: expr.old-legion-vet-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 我在帝国军团里服役了二十年。曾几何时，他们确实配得上「军团」的称号。我和老战友们都在一套准则下服役，我们宁愿战死，也不愿看到这套标准动摇或削弱。但是，德洛修斯·涅雷采斯率领着最后一个真正的军团，在巴旦尼亚的树林中遭到了伏击。你可能听说过这段往事。那时我正卧病在床，结果我的许多战友都没能回来，从那之后一切都变了。

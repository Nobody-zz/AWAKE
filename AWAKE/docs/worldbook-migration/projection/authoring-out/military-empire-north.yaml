summary:
  zh-CN: 北帝国的军事实力：建立在元老院控制下的贵族私兵体系之上。北方的执政官是废除常备军后最快完成转型的一批——家族几代人在元老院斗来斗去，早习惯了自掏腰包养亲兵。世代面对斯特吉亚与库赛特的双线压力，如今又得防西帝国和南帝国。纸面实力不弱，但极长的战线让军队疲于奔命，武将出身的元老又少，因而长于防守、短于进攻。

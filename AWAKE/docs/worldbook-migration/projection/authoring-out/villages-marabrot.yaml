  - id: expr.village-marabrot-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 马拉布罗特以山脊铁矿为业——岩脊露矿、采掘不易；铁料就地粗炼、按成色分等，矿石靠人力背下山换粮，风季停工、矿价随兵事起落。

    denies: []
- id: assertion.khans-guard-2
  revision: 1
  kind: interpretation
  text:
    zh-CN: 草原上对可汗卫士的夸辞传得很开：说他们的刀抽出来像一道银月，说见到可汗卫士的旗帜要么下马行礼要么赶紧逃命。这些是部族的说法，未必对得上他们鞍边真正挂的东西；但「远射近砍都能打」这一点，吃过亏的人都认——帝国骑兵追过他们一次，他们跑着跑着忽然回头拔刀，把追兵削了个干净。
  sources:

  text:
    zh-CN: 方旗骑士是瓦兰迪亚骑士部队的顶点：贵族子弟自备战马从军，由扈从熬资历、挣战功，被男爵看中后册封，册封时骑枪上挂一面方旗。这套行头价值不菲——全覆盔、布面铁甲、链铠衬里，加上战马马铠，够养一队弩手好几年。

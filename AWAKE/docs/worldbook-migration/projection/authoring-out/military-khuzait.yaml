assertions:
- id: assertion.military-khuzait-1
  revision: 1
  kind: fact
  text:
    zh-CN: 弓骑兵是库赛特部落的攻击主力：可汗发动战争时部落联盟各部召集最好的士兵，以速度、耐心和狡猾作战——骑射手轮番袭扰削弱敌军，再由枪骑兵发起致命一击；怯薛为核心的精锐骑射手是大陆上最优秀的弓骑兵；但帝国评估其弱点在于缺乏强力步弓手、马匹繁育不成体系。
  sources:
  - source_id: source.calradia.chronicle.animusforge.war1
    source_version: animusforge-20260913
    source_content_hash: 5ef28e5ee78d4a461f944468d745f28c2e041ab9871f42806b816a29ef60045d

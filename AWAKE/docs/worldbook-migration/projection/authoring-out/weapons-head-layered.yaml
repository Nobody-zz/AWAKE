  - id: expr.weapon-head-layered-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 叠穿的壳子以锅盔、头盖盔、檐盔与碗盔为主，垫层则按价钱分四档：填充布最省钱，填充帽次之，皮革再上，链甲最贵。同一顶壳子换垫层，护头能从三十三一路做到五十四——行家买盔先量壳，再单独挑垫层，两件分开买比成套便宜。

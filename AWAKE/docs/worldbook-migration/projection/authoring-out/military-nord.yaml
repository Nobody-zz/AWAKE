    text:
      zh-CN: 诺德人的仗是在滩头和峡湾里打的，核心就是盾墙：前排锁甲圆盾，第二排铩戟专治冲上来的骑兵和重步兵，接战前先甩一轮飞斧，再有抡双手大斧的冲进去劈。他们没有骑兵——马在船上站不稳；弓箭也不行，北方林子不长好制弓的木料。他们的本钱是船。

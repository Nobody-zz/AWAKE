    text:
      zh-CN: 希木利堡据德夫赛格高原盆地，下辖黏土村与林农村各一；水坑黏土按片分采、由堡中过秤，速仑山木材限量采伐、循山道外运，采伐之数由堡里记账、报汗帐。

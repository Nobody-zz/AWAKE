    zh-CN: 在守城的人眼里，攻城塔就是推到城墙根子底下的那座木头山：好几层楼高，推进的时候地面都跟着震，塔楼顶上还站着弓手，一路走一路朝城头放箭，守城的头都不敢探。这东西怕火——城头烧火油往下浇，专浇塔身，里面的兵没处跑。可要是不拦，等吊桥一砸在垛口上，成队的兵就往城墙上涌。

  locator: bannerlord.db#localization.bTApMxWr
  quote_hash: 556FBF89B72B72E8CBFE8FC7D63680DE98136E011670A0325150B4D69C0DD24F
  quote: 瓦兰迪亚方旗骑士
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/0/Content
  quote_hash: 046BB6A11CA823AD10AD06AA64E18CB26AF5E5FAF3594BF2C9EA4A3FD446CC38
  quote: 扈从熬资历，挣战功，运气好被哪个男爵看中，册封的时候骑枪上挂一面方旗，这辈子就算站稳了
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/0/Content
  quote_hash: 274B86AE8A28595D1EBA35272F2C5D5A0B1C7C3192C904CA8416565C296D60D9
  quote: 一套下来够养一队弩手好几年
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/0/Content
  quote_hash: F463BF102BC9E84890EF898327531DD1171DB4B20403707F5AC92735F563DD65
  quote: 一个方旗骑士在阵前把骑枪放平，马蹄刨地，斗篷在背后绷成一面墙，对面步兵看着腿就软了
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/1/Content
  quote_hash: 6CC084634ABAB091C1FD359345B373D1BBF593888A978C46A0F296502F2010D6
  quote: 我们村要是出个方旗骑士，全村祖坟冒青烟了
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/1/Content
  quote_hash: 7E4755F1F6B95F46F9779DD47CB22C2074394886B43AEA37651C635FBBFF97BE
  quote: 我在集市上见过一次方旗骑士，骑在那高头大马上，浑身铁片子，脸都看不见，只能看见盔沿底下一条缝
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/1/Content
  quote_hash: 59287EF28AF4B47D16B56148291BF3F2B8C9E8BF0D39718D4B7A77CDDB43EBC3
  quote: 他们那马也吓人，马铠比我的房子还值钱
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/5/Content
  quote_hash: 8ADFB14C95D0D3714B7FD3E4406BD889A209EEF444E126C76DC15B53F2BC55D4
  quote: 骑枪末梢都挂着小方旗，花花绿绿的，风一吹啪嗒嗒响
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/5/Content
  quote_hash: DFCE3C462A919AD52EF1669888D8D227242DAD7EE1CD7FE0A52625073A006445
  quote: 他们冲的时候真跟山塌下来一样，我站在山坡上都腿软
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/5/Content
  quote_hash: 4985ECBF7D03F06B7469AE820B7425538A40820239B3E60EA4EB00ED5B081C05
  quote: 骑兵里排第二。第一是谁？帝国骑兵
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/7/Content
  quote_hash: 82A115BAD6ADBF3A721EECDEAE0CDCA6FAA072FBD763B7EE23C76408A1E56065
  quote: 但他们有个致命的毛病：纪律
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/7/Content
  quote_hash: 608BE674B37F6F368FB1314A39DD120DD8DBB3713B02C0F223DEF281AD330571
  quote: 我们打他们，靠的不是更快的枪，是更整齐的纵队后劲
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/0/Content
  quote_hash: B66050B95F077135309E6162A4141337AE267262891D37FC381386BD44D5389F
  quote: 因加泰尔在潘德拉克就是带着一帮方旗骑士追轻步兵，追到最后被帝国具装骑兵反冲，折了多少人
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/0/Content
  quote_hash: 6B94A90F59A0DB118FFFBC2A8F1AF8634A68425CC40DCCD0AE2FF580BFC35F62
  quote: 方旗骑士是瓦兰迪亚最锋利的刀，但刀太快了容易割自己手
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/6/Content
  quote_hash: A54A8400D2EC595240CA6E11410AB40D58319B90E2E7BDD4A9EEEBD1CA17851B
  quote: 那帮方旗骑士的甲比我们的盾都厚，冲起来骑枪快如闪电
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_方旗骑士__方旗骑士.json#/Variants/6/Content
  quote_hash: E3D2C8A066FB0DBA80CD852A167AF334A76F11FB3FC60B35B419DA175AE1050D
  quote: 他们差的是冲完以后的纪律
authority:
  owner: awake_canon
  conflict_policy: canon_wins

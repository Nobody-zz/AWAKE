summary:
  zh-CN: 珀拉斯海：卡拉迪亚南方大海，经吕西亚海峡通西海。北岸今属西帝国与南帝国，南岸归阿塞莱；帝国史称其为「帝国之湖」，阿塞莱称「南方的怀抱」。

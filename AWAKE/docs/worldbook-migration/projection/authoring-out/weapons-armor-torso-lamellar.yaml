assertions:
- id: assertion.weapon-armor-torso-lamellar-1
  revision: 1
  kind: fact
  text:
    zh-CN: 札甲把长方形铁片一片压一片，用皮绳穿在底衬上，护值二十四到五十二。它比锁甲省铁、比板甲好修——断一根绳只散几片，自己重穿就是。轻型扎甲护值四十八，具装骑兵扎甲同为四十八，骑兵扎甲四十六，帝国与南方的扎甲配鳞甲裙做到五十二。

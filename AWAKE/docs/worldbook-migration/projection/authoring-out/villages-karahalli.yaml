  zh-CN: 喀拉哈力位于库赛特部落联盟的极北之地，离冰冷的比亚里海不远，是与斯特吉亚人常年争夺的边境；这里几乎终年积雪，春草仍养活了相当多的绵羊，厚羊毛帮人挡下海上刮来的砭骨寒风。

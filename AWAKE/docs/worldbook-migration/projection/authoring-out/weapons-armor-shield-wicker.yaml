  - id: expr.weapon-armor-shield-wicker-khuzait-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 草原上用它配骑射：一手持弓不方便拿重盾，柳条的轻，挂在臂上不碍事。蒙皮那层是为了防潮——编层一泡水就软，软了就不挡箭了。强化过的那种耐久到五百一十，能用一整场仗。

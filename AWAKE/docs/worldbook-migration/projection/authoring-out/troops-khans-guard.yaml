  quote_hash: BE2430B645FC2C1623F6D39E219786D7AFF9029FE686EB9D23D88A73F30FB05D
  quote: 可汗走到哪里，他们就跟着到哪里，既是护卫，也是先锋，更是传令
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_可汗亲卫__可汗亲卫.json#/Variants/2/Content
  quote_hash: CA06508DA08D8D2E01798C290016DC9A3979B66E4902EA4FF809176DDCCC09C1
  quote: 我手下最顶尖的骑射手，练了十几年才有资格去参加可汗亲卫的选拔，选拔的时候要在马背上射完一整壶箭，箭箭都要中靶，还要在马刀对决中胜过不止一个对手
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4

- id: assertion.siege-ram-2
  revision: 1
  kind: rumor
  text:
    zh-CN: 在城下的人嘴里，推槌的是拿命换门：棚子顶着湿牛皮不容易点着，底下的人照撞不误，可城上往下浇滚水，从棚子缝里漏进去，里面的人烫得嗷嗷叫还得接着推；有一回一架槌推到半路，城上一桶火油浇透了，一个火把下去，槌和棚子带里面的人全着了，连城门都没摸着。门倒了他们不一定知道，因为门倒之前他们多半已经没了。

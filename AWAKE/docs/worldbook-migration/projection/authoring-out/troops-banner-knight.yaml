      zh-CN: 方旗骑士的装备钱不是小数目：全覆盔、布面铁甲、链铠衬里、战马马铠，一套下来够养一队弩手好几年。但值——阵前把骑枪放平，马蹄刨地，斗篷在背后绷成一面墙，对面步兵看着腿就软了。

  quote: 盾墙要是散了，我就是个拿短剑的孤鬼。盾墙不散，我就还在
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/2/Content
  quote_hash: C7B105478AC283BB9428198D9CE981223F3073D77B5A6B35C077CC77C89BB9AF
  quote: 诺德人的军事力量，说实话，缺陷和优势一样扎眼
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/2/Content
  quote_hash: 852B089D6DFC67B876E04BC9ED1F1DAE2FBD44CED69D7CCDF4AE9623E7C77A66
  quote: 跟诺德人打仗，最难的不是打赢他们，是找到他们
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/3/Content
  quote_hash: B1DD5A113668E73F3DA6887BD81BFBB31B8453EFAEC42AFA5B27FA5ACA355BE0
  quote: 说他们不打旗号，不擂鼓，船头直接冲上滩，人跳下来就往你这边推
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/3/Content
  quote_hash: 8F02D46F5616BE19B000C03F385E1BCD61F5FBC85E333779003CD8445B9E5854
  quote: 你只要不跟他们挤在滩头硬碰硬，拉开距离用骑射绕，他们就只能站在原地干瞪眼
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/4/Content
  quote_hash: A9E586DC7934A8632C206A6CDA236AFA1C4B04964DE3B1EC12D38819BA74ACE1
  quote: 我儿子今年跟雅尔的船走了，夏天走的，现在还没回来
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/4/Content
  quote_hash: 9BE405F0F88FEA38D4F117F08393DC61F8442EDA141BBCF010BC8A0852C7C5D4
  quote: 他们说北境的男人不死在床上
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/5/Content
  quote_hash: FBD9FCDDF7180BE0816F5364772211479F2E5617C22F0720D905E68D83C0EAB7
  quote: 半夜船靠岸，天亮前把半个村都烧了
- source_id: source.calradia.chronicle.animusforge.war3
  source_version: animusforge-20260913
  source_content_hash: c3f584d9f8f55a472c051c889dcf0a469e7be987d3e8e19f52d2b5b4f4acf6f4
  locator: rules/rule_诺德军事力量__诺德军事力量.json#/Variants/5/Content
  quote_hash: 33424776FB3A3882B214F0F13066816654BA096351CE78A8A7568C3D62D9687C
  quote: 不是怕他们赢，是怕他们突然来。你永远不知道他们从哪片雾里冒出来

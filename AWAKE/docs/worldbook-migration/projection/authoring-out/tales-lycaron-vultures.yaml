  quote_hash: 57F0EF49AF6F1D0F3195D1F4F1F495163939148FC203B3EECC26C5F239E4A393
  quote: 吕卡隆是帝国人的心脏，但那颗心脏已经被人捅穿了。我们北方人不太关心帝国人的皇位争来争去谁对谁错，我们只知道，阿雷尼科斯死了之后，帝国的军团就再也没能像以前那样北上找我们的麻烦。他们的银矿还在挖，但挖出来的银子全花在内战上了。石山上的秃鹫还在飞，等着下一批在吕卡隆城下送死的帝国人。

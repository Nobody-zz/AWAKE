  - id: expr.banner-knight-caravan-rumor
    revision: 1
    layer: rumor
    text:
      zh-CN: 方旗骑士？瓦兰迪亚的铁骑兵。我在商路上远远见过一回——他们正在操练，骑枪末梢都挂着小方旗，花花绿绿的，风一吹啪嗒嗒响。他们冲的时候真跟山塌下来一样，我站在山坡上都腿软。向导说在下面得叫声「方旗老爷」才行。我问他们打仗厉不厉害。他说，骑兵里排第二。第一是谁？帝国骑兵。

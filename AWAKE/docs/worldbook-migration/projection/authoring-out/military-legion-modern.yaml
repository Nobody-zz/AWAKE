  - id: expr.modern-legion-noble-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 现代军团说白了就是我们的私兵。皇帝把养兵的责任推给了我们，我们出钱出人，兵自然就听我们的。这对皇帝来说省了钱，对我们来说却多了实权。以前帝国的将军们靠国家拨饷，现在他们靠我们这些执政官养着。谁手里有兵，谁说话就硬气。
    sources:

- id: assertion.town-ocs-hall-1
  revision: 1
  kind: fact
  text:
    zh-CN: 奥克斯·霍尔是瓦兰迪亚从帝国手中夺得此地后所建的少数城镇之一；这片山谷曾是巴旦尼亚人的飞地，以莫德里斯湖为中心。后为瓦兰迪亚军阀奥克所征服，奥克斯湖也以其名命名；当地的巴旦尼亚部落带着他们的传说被赶回内陆。
  sources:

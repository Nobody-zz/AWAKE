summary:
  zh-CN: 一批不属于任何王国的群体：罪恶的兄弟会、雇佣兵、宗教运动、游牧民。靠卖命或收保护费过活。
registry_bindings:
  profile_registry_version: 1.0.0
  profile_registry_hash: 309D10583E7B4AF05F28DE2C2E67A2528CB3D6C45752369C0F7D160FABC3F3A5
  referral_registry_version: 1.0.0
  referral_registry_hash: 6E17075F1F967BE28C0437121DB50E5C30809C4EFC3D2A5F22AD9BB0B3B926CD
sources:
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.uce9Opgg
  quote_hash: 8D7D948748E9A4DCD1086636AB7C3DC524D6375B6DD7226BD73D269F16D6FE8E
  quote: 小阵营代表卡拉迪亚大陆上不属于任何王国的群体。他们可能是罪恶的兄弟会、雇佣兵组织、宗教运动组织或游牧民。他们通常依靠给某一个王国卖命，或是从路过他们领地的商队和旅行者那里收取保护费来维持生计。
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.RWOYui01
  quote_hash: EE698FA2853F9713166612024270451BE3AF2EB2A6AC9AC803A228340A8DC588
  quote: 贾瓦勒，又名“漫游者”，是纳哈撒沙漠中主要的贝都因联盟。他们在高地和低地的牧场之间游荡，宣称大片的沙漠都是他们的“领地”，任何途径的商队都必须缴纳保护费。他们将自己的事迹编为诗歌，同时嘲笑巴努·阿塞拉的其他部族放弃了象征“自由”的黑羊毛帐篷，住进绿洲中的石头屋子。其他部族则认为他们是自吹自擂的讨厌鬼，但也不情愿地尊重着他们身为阿塞莱传统维护者的身份。
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.7JMaPpkN
  quote_hash: 390D29AD88C9C08D7DA7D9182AC347ADB6ED87E6DD132638DA7E898E83B9E852
  quote: 我们在偏远地区的树林深处，修建了一座巨大的神殿，称为“真理之国”。我们收拾了两支前来追捕的帝国部队。然而拉狄摩斯死了，“蒙上天召唤”，他在临终之际这么说，那之后我们迷茫了一段时间。我们缺钱缺粮，于是我们的首领们开始向底下的村庄征“税”。有的人则从领主和商人那里收商队的保护费。至于那些交钱拖拖拉拉的——好吧，人们时不时会在河床上发现他们的尸体。
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.nQOf27Rx
  quote_hash: 723F3FF0CAF9840E3BD151932F079D4EB8340617C3C4D09C42B3948384547BF4
  quote: 秘密之手是一伙黑帮，他们控制着帝国南部的乡村地区，甚至一些城镇。他们通过为当局效力而壮大：镇压动乱，压制讨人厌的传教士，抢掠他们主顾的竞争对手。他们中的许多人过着两面生活：在城里体面，在乡间犯罪。一位秘密之手的成员每年会花两三个月的时间在山野之中充当土匪，其余时间则会回到城镇，作为打手和售卖赃物的“商人”——他们自然深知没有人会问太多的问题。
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.dRaYhQva
  quote_hash: BCA5B609211D5381225F96330FF2C777CE9A1ACD745536A7977DE1A82314C743
  quote: “巴努·奇拉勒”，即暗影之子的起源，掺杂着各种传说轶事。在许多故事里，一个救世主般的传教士在沙漠深处的某座要塞建立了自己的统治。在致幻草药的帮助下，他让信徒们对自己死心塌地，同时用暗杀的胁迫让阿塞莱贵族心生恐怖。不管这些故事真实性几何，这个兄弟会已是纳哈撒边陲地区相当有实力的一个组织。他们一边从穿过自己领土的商队手中收取保护费，同当地豪强达成协议；一边韬光养晦，静候能够公开自己大计划的时机。
- source_id: source.calradia.game.urban-dark
  source_version: bannerlord-1.3.15.110062
  source_content_hash: b4d5c8f431ccd2464129a318bab6b9243926a93f7df82b01799fd50fa3242f47
  locator: bannerlord.db#localization.B8c2mNKj
  quote_hash: 363C69BEAFC8B83E0E8035C6E3C04B60269B5FA9D509F4230615E1A1163B2254
  quote: 火焰余烬是近一个世纪前兴起的反叛运动的后代，那次运动是在圣洁但无能的年轻皇帝达鲁索斯被他的一位将军推翻之后发生的。他们声称自己正在为天堂带回达鲁索斯，并为迎来黄金时代做准备。但和卡拉迪亚的其他许多反叛运动一样，他们被迫转向敲诈勒索行业以求生存。

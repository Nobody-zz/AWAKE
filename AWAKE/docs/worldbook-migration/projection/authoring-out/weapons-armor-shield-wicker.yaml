  - id: expr.weapon-armor-shield-wicker-aserai-detail
    revision: 1
    layer: detail
    text:
      zh-CN: 杏形盾是沙漠里的手艺。整张硬皮蒙在骨架上，中间那道脊是关键——刀砍在脊上会滑到边上，箭扎上去也往两边偏。华丽的那几款在皮面上压花、镶铜钉，是给头面人用的，护值其实一样。
